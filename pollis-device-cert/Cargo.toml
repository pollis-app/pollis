[package]
name = "pollis-device-cert"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Pollis offline device-certificate primitive: the domain-separated, length-prefixed payload a device cert signs over, plus its ML-DSA-44 verification. Zero I/O, deps = ml-dsa + std only, so pollis-core (which mints certs), pollis-relay (which verifies them at the handshake) and pollis-delivery (which re-verifies at publish) share ONE source of truth for the wire format — no drift, no crate cycle."

[lib]
name = "pollis_device_cert"
path = "src/lib.rs"

[dependencies]
# The ONLY dependency by design: the cert is an ML-DSA-44 signature over a
# hand-rolled, length-prefixed payload. Nothing else is needed, and adding
# anything would widen the trust surface of a primitive that both the metadata
# plane (pollis-core) and the relay tier (pollis-relay) depend on. Default
# features are off: `from_seed`, `encode`/`decode` and `verify` need neither
# `getrandom` nor `pkcs8`, only `alloc` (so ML-DSA's large vectors are boxed
# rather than living on the stack).
ml-dsa = { version = "0.1", default-features = false, features = ["alloc"] }
