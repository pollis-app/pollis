[package]
name = "pollis-libsql-connector"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "The HTTP(S) connector every remote libsql handle in this workspace dials Turso through: rustls 0.23 over a plain tokio TcpStream, in place of libsql's built-in hyper-rustls 0.25 / rustls 0.22 stack."

# Why this crate exists (#1303): libsql 0.10's own `tls` feature still pins
# hyper-rustls 0.25 -> rustls 0.22 -> rustls-webpki 0.102, which carries
# RUSTSEC-2026-0049/0098/0099, with no newer hyper-0.14-compatible hyper-rustls
# to move to. Every libsql dependent in the workspace therefore builds libsql
# with `default-features = false` (no `tls`) and hands `Builder::connector` this
# one instead. It lives in its own crate because BOTH remote callers — the DS's
# `Db::connect_remote` and `verifiable-log-builder`'s commit-log reader — need
# it, and neither may depend on the other.
#
# Every dependency below is already in the workspace lockfile: hyper 0.14 / http
# 0.2 / tower-service 0.3 arrive with libsql itself (they are the types its
# `connector` bound is written in), tokio-rustls 0.26 + rustls 0.23 with
# reqwest/quinn, webpki-roots 1.x with reqwest's rustls-tls.
[dependencies]
# Only for the `Connection` trait libsql's `Socket` bound requires. `client` is
# the feature that defines it; nothing here builds a hyper client.
hyper = { version = "0.14", default-features = false, features = ["client"] }
http = "0.2"
tower-service = "0.3"
tokio = { version = "1", features = ["net"] }
# `tls12` on: Turso's edge speaks 1.3, but this replaces a connector that
# negotiated 1.2 too, and dropping it is not what #1303 is about.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
# Mozilla's root set compiled in — the same trust anchors reqwest's `rustls-tls`
# already gives the DS for every other outbound call, so the DS image no longer
# needs a system CA bundle for Turso either.
webpki-roots = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
# Mint a throwaway CA + leaf for the TLS tests. Already in the lockfile via
# pollis-relay.
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
# The DS-shaped end-to-end test: a real libsql remote handle, built the way
# `pollis-delivery` builds it, dialing through this connector.
libsql = { version = "0.10", default-features = false, features = ["core", "remote"] }

[lints]
workspace = true
