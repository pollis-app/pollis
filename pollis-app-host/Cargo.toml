[package]
name = "pollis-app-host"
version.workspace = true
edition.workspace = true
# wasmtime 49 needs 1.96, the repo's pinned toolchain. Higher than the
# workspace floor on purpose: this crate is not in the Kani harness set that
# keeps that floor low.
rust-version = "1.96"
publish = false
description = "The sandbox the bot runtime runs Apps in (#2004): a wasmtime component host for pollis:app@0.1.0 with no WASI, per-job CPU/memory/host-call limits, a fresh instance per job, compiled components cached by App hash, and every host function checked against the installation's effective grants."

[lib]
name = "pollis_app_host"
path = "src/lib.rs"

[dependencies]
pollis-app-manifest = { path = "../pollis-app-manifest" }
# The minimum for a synchronous component-model host compiled with Cranelift:
# no WASI, no async/fibers, no GC proposals, no profiling, no on-disk cache,
# no WAT parser, no parallel compilation.
wasmtime = { version = "49.0.6", default-features = false, features = ["runtime", "cranelift", "component-model", "std"] }
url = "2"
# The reference http-fetch client (src/http.rs): rustls + webpki roots, already
# in the tree through verifiable-log-serve.
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.11"
getrandom = "0.4"
thiserror = "2"

[lints]
workspace = true
