# Track-B cargo-fuzz targets over the load-bearing pure functions
# (machine-checked-correctness §5.1 Track B / §4; #481). Each target fuzzes the
# SAME production function its Kani harness proves and asserts the SAME property.
#
# DETACHED FROM THE ROOT WORKSPACE ON PURPOSE. The repo pins Rust 1.96.0 STABLE
# via rust-toolchain.toml for reproducible/verifiable release builds; cargo-fuzz
# needs NIGHTLY. This crate therefore carries its own `[workspace]` table (below)
# AND is listed in the root `Cargo.toml`'s `workspace.exclude`, so a plain
# `cargo build` / the pinned-stable release path never sees it. Fuzzing runs OUT
# OF BAND on nightly (OSS-Fuzz style), NEVER as part of the release build.
[package]
name = "pollis-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Own workspace root — keeps this crate out of the pinned-stable workspace.
[workspace]

# MUST mirror the root Cargo.toml's [patch.crates-io] openmls pin. Being a
# detached workspace, this crate does NOT inherit the root patch — without it,
# resolution falls back to registry openmls, which lacks the
# `draft-ietf-mls-pq-ciphersuites` feature pollis-core names, and the build
# fails. scripts/fuzz-check.sh asserts the revs match before fuzzing so the two
# pins cannot drift apart silently.
[patch.crates-io]
openmls = { git = "https://github.com/openmls/openmls", rev = "34222ef632c87df58baaa7614c8a72ac235c5f07" }
openmls_traits = { git = "https://github.com/openmls/openmls", rev = "34222ef632c87df58baaa7614c8a72ac235c5f07" }
openmls_rust_crypto = { git = "https://github.com/openmls/openmls", rev = "34222ef632c87df58baaa7614c8a72ac235c5f07" }
openmls_basic_credential = { git = "https://github.com/openmls/openmls", rev = "34222ef632c87df58baaa7614c8a72ac235c5f07" }
openmls_memory_storage = { git = "https://github.com/openmls/openmls", rev = "34222ef632c87df58baaa7614c8a72ac235c5f07" }

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde = "1"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Depend on pollis-core with default features OFF so the fuzz crate does not drag
# in the Tauri/native/media stack — pollis-core builds headless without them, and
# the pure fns we fuzz have no native dependencies.
[dependencies.pollis-core]
path = "../pollis-core"
default-features = false
# The narrow surface the stateful and parser targets drive (#1537): framing,
# the catch-up partition + sealing order, the outbox transitions and the MLS
# group configuration. openmls, rusqlite and friends are reached through it,
# so this crate cannot link a second, differently-featured copy.
features = ["fuzzing"]

# `ds_bodies` parses the DS request bodies through their wire types.
[dependencies.pollis-api]
path = "../pollis-api"

# The `prune_floor` target fuzzes the retention floor, which lives in the
# Delivery Service crate (the sole writer that owns the prune). Pure integer fn —
# the DS deps it drags in are only needed to build, never exercised by the fuzzer.
[dependencies.pollis-delivery]
path = "../pollis-delivery"

# Deliberate-mutant switch (teeth demonstration). OFF by default — the committed
# targets call the REAL production functions. Turn it on with
# `--cfg fuzz_mutant` (see scripts/fuzz-check.sh / the fuzz README) to make each
# target call a locally-reimplemented BUGGY variant; the fuzzer then trips the
# property fast, proving the harness has teeth.
[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(fuzz_mutant)'] }

[profile.release]
debug = 1

[[bin]]
name = "next_watermark"
path = "fuzz_targets/next_watermark.rs"
test = false
doc = false
bench = false

[[bin]]
name = "classify"
path = "fuzz_targets/classify.rs"
test = false
doc = false
bench = false

