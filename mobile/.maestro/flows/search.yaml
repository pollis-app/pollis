appId: com.pollis.mobile
tags:
  - parity
---
# SEARCH (#1202) — parity with desktop's on-device message search: a hit with
# its highlighted snippet and "About N results", the sort toggle, the corpus
# footer (what this device can search), quick-jump to a settings page, and
# the "why no results" explanation. Self-contained: creates a group and posts
# the message it then searches for.

- runFlow: ../subflows/sign-in.yaml
- tapOn:
    id: "tab-search"
- assertVisible:
    id: "screen-search"
- assertVisible:
    id: "search-filter-hint"
- takeScreenshot: search-01-empty

# Seed a message to find.
- tapOn:
    id: "tab-groups"
- tapOn:
    id: "btn-add-group"
    optional: true
- tapOn:
    id: "btn-create-group"
# #General is opt-in (off by default, like desktop); these steps open it.
- tapOn:
    id: "toggle-general-channel"
- tapOn:
    id: "input-group-name"
- inputText: "E2E Search Group"
- tapOn:
    id: "btn-submit-group"
# Creating lands on the Groups tab with the new group selected (pill strip +
# its channel panel, tab bar visible) — not a pushed group page. Wait for
# THIS group's panel header (the account may already have other groups).
- extendedWaitUntil:
    visible:
      id: "btn-group-menu"
      text: "E2E Search Group, .*"
    timeout: 15000
- assertVisible:
    id: "panel-group"
- tapOn:
    text: "General"
- assertVisible:
    id: "screen-chat"
- tapOn:
    id: "input-composer"
- inputText: "pelican migration notes"
- tapOn:
    id: "btn-send"
- extendedWaitUntil:
    visible: ".*pelican migration notes.*"
    timeout: 15000
# Back from the channel to the Groups tab (phones). On iPad the channel is the
# two-pane's right pane, with no back button — hence optional.
- tapOn:
    id: "btn-back"
    optional: true
# On iPad the composer keeps focus after send and the keyboard covers the tab
# bar, so the tab tap would land on a key.
- hideKeyboard

# Message hit, count, sort, corpus.
- tapOn:
    id: "tab-search"
- tapOn:
    id: "input-search"
- inputText: "pelican"
- extendedWaitUntil:
    visible:
      id: "search-sort-relevant"
    timeout: 15000
- assertVisible: ".*pelican migration notes.*"
- assertVisible:
    id: "search-corpus-footer"
- takeScreenshot: search-02-message-hit
- tapOn:
    id: "search-sort-recent"
- assertVisible: ".*pelican migration notes.*"
- takeScreenshot: search-03-sorted-recent

# A hit opens its conversation.
- tapOn: ".*pelican migration notes.*"
- assertVisible:
    id: "screen-chat"
# Phones: back to Search. iPad: the hit opened in the Groups tab's two-pane,
# which has no back button; the next step taps the Search tab anyway.
- tapOn:
    id: "btn-back"
    optional: true

# Quick-jump to a settings page.
- tapOn:
    id: "tab-search"
- tapOn:
    id: "input-search"
- eraseText: 20
- inputText: "security"
- assertVisible:
    id: "row-page-security"
- takeScreenshot: search-04-page-hit
- tapOn:
    id: "row-page-security"
- assertVisible:
    id: "screen-self-security"
- tapOn:
    id: "btn-back"

# Nothing matches: say why, honestly.
- tapOn:
    id: "tab-search"
- tapOn:
    id: "input-search"
- eraseText: 20
- inputText: "zzqxnomatch"
- extendedWaitUntil:
    visible:
      id: "search-no-results-why"
    timeout: 15000
- takeScreenshot: search-05-no-results
