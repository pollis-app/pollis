appId: ${MAESTRO_APP_ID}
tags:
  - parity
  - gate
# Back online whatever happened: a failure while offline must not leave the
# device in airplane mode for the flows after this one (#2029).
onFlowComplete:
  - runFlow:
      when:
        platform: Android
      commands:
        - setAirplaneMode: disabled
---
# OUTBOX (#1335) — a message the user saw accepted is either delivered or
# visibly unsent, never silently gone.
#
# Part 1 (both platforms) is the ticket's scenario: the app is killed while a
# send is still in flight — the first send in a fresh group can take a minute,
# so stopping the app right after Send lands inside that window. The core
# stored the message before any network work, so after the relaunch + unlock
# it is still in the conversation and the outbox delivers it: it must end up
# on screen, settled (no Retry), not vanish.
#
# Part 2a (Android) is #2055: a send made during a brief outage stays
# "sending" while the core retries it and lands, never showing "Not sent".
#
# Part 2 (Android only — Maestro can switch airplane mode only there) is the
# failed state: a send made offline is kept and labelled with Retry / Discard;
# back online, Retry delivers it.
#
# Part 3 (Android only) is the edit outbox (#1555): an edit made offline is
# kept and labelled "(edit not sent)", and the resume drain delivers it.
#
# Self-contained, like messaging.yaml: creates its own group.

- runFlow: ../subflows/home.yaml
- tapOn:
    id: "tab-groups"
- assertVisible:
    id: "screen-groups"
- runFlow: ../subflows/open-create-group.yaml
- tapOn:
    id: "toggle-general-channel"
- tapOn:
    id: "input-group-name"
- inputText: "E2E Outbox Group"
- tapOn:
    id: "btn-submit-group"
- runFlow:
    file: ../subflows/group-created.yaml
    env:
      GROUP: "E2E Outbox Group"
- tapOn:
    text: "General"
    optional: true
- assertVisible:
    id: "screen-chat"

# ── Part 1: killed mid-send ─────────────────────────────────────────────────
# Send with the keyboard up (see messaging.yaml, #1194), then kill the app
# before the first send in this fresh group can have finished.
- tapOn:
    id: "input-composer"
- inputText: "ob1335 killed"
- tapOn:
    id: "btn-send"
- extendedWaitUntil:
    visible: ".*ob1335 killed.*"
    timeout: 10000
- runFlow: ../subflows/home.yaml
- runFlow:
    file: ../subflows/open-group.yaml
    env:
      GROUP: "E2E Outbox Group"
- tapOn:
    text: "General"
    optional: true
- assertVisible:
    id: "screen-chat"
# Still there after the kill — the outbox kept it.
- extendedWaitUntil:
    visible: ".*ob1335 killed.*"
    timeout: 15000
# And delivered by the drain after unlock: no failure, no Retry. The first send
# in a fresh group may still be paying for MLS setup, hence the long wait.
- extendedWaitUntil:
    notVisible:
      id: "btn-retry-message-.*"
    timeout: 120000
- takeScreenshot: outbox-01-delivered-after-kill

# ── Part 2a: a brief blip → still sending → delivered, never "Not sent" ─────
# (#2055, Android) The core retries a transient failure in place (2 s / 5 s /
# 15 s) with the row still pending, so a send made during a short outage reads
# "sending" throughout and lands once the network is back, with no Retry ever
# shown. Rows are matched by their spoken label, which ends "sending" while the
# row is pending (see subflows/rapid-send-burst.yaml).
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: enabled
      - tapOn:
          id: "input-composer"
      - inputText: "ob2055 blip"
      - tapOn:
          id: "btn-send"
      - assertVisible: ".*: ob2055 blip, sending"
      - assertNotVisible:
          id: "btn-retry-message-.*"
      - takeScreenshot: outbox-02a-blip-sending
      - setAirplaneMode: disabled
      - assertNotVisible:
          id: "btn-retry-message-.*"
      - extendedWaitUntil:
          notVisible: ".*: ob2055 blip, sending"
          timeout: 60000
      - assertNotVisible:
          id: "btn-retry-message-.*"
      - assertVisible: ".*ob2055 blip.*"
      - takeScreenshot: outbox-02b-blip-delivered

# ── Part 2: offline send → failed → Retry (Android) ─────────────────────────
# The outage outlasts the in-place retries (#2055), so the row ends "Not sent".
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: enabled
      - tapOn:
          id: "input-composer"
      - inputText: "ob1335 offline"
      - tapOn:
          id: "btn-send"
      # Kept and labelled, with its way out.
      - extendedWaitUntil:
          visible:
            id: "btn-retry-message-.*"
          timeout: 60000
      - assertVisible:
          id: "btn-discard-message-.*"
      # Said on the row in plain words, never as a raw error under the list.
      - assertVisible:
          id: "text-unsent-reason-.*"
          text: "It'll send automatically when Pollis reconnects."
      - assertNotVisible: ".*error sending request.*"
      - assertVisible: ".*ob1335 offline.*"
      - takeScreenshot: outbox-02-failed-offline
      - setAirplaneMode: disabled
      # The reconnect may drain it before the tap; either way it must settle.
      # Retry only if it is still there (subflows/probe-absent.yaml returns at
      # once when the drain won, where an optional tap waited ~7 s, #2042).
      - runFlow:
          file: ../subflows/probe-absent.yaml
          env:
            ID: "btn-retry-message-.*"
      - runFlow:
          when:
            true: ${!output.absent}
          commands:
            - tapOn:
                id: "btn-retry-message-.*"
                optional: true
      - extendedWaitUntil:
          notVisible:
            id: "btn-retry-message-.*"
          timeout: 60000
      - assertVisible: ".*ob1335 offline.*"
      - takeScreenshot: outbox-03-retried

# ── Part 3: offline edit → kept, labelled → delivered on resume (Android) ───
# The edit outbox (#1555): an edit that cannot reach the DS stays stored, the
# author sees it marked "(edit not sent)", and the drain on returning to the
# foreground delivers it — no Retry needed.
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: enabled
      - runFlow: ../subflows/long-press-message.yaml
      - tapOn:
          id: "btn-edit"
      - assertVisible:
          id: "input-edit-composer"
      - inputText: " ob1555"
      - tapOn:
          id: "btn-edit-save"
      - extendedWaitUntil:
          visible: ".*ob1555.*\\(edit not sent\\).*"
          timeout: 60000
      - takeScreenshot: outbox-04-edit-not-sent
      - setAirplaneMode: disabled
      # Background and resume: the resume drain delivers the stored edit.
      - pressKey: Home
      - launchApp:
          stopApp: false
      - runFlow: ../subflows/unlock-if-locked.yaml
      - extendedWaitUntil:
          notVisible: ".*\\(edit not sent\\).*"
          timeout: 60000
      - assertVisible: ".*ob1555.*"
      - takeScreenshot: outbox-05-edit-delivered
