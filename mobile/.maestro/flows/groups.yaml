appId: com.pollis.mobile
tags:
  - parity
---
# GROUPS — create a group, open it, create/verify a channel, rename, leave.
# Self-contained (no peer). Every action is tapped by testID; the one text
# match is the "General" channel row, whose row-channel-<id> is not known ahead.

- runFlow: ../subflows/sign-in.yaml
# Navigate explicitly: sign-in guarantees the tab navigator, not which tab.
- tapOn:
    id: "tab-groups"
- assertVisible:
    id: "screen-groups"
- takeScreenshot: groups-01-inbox

# Create a group. A fresh account has no groups, so the Groups tab shows its
# empty state with btn-create-group directly; with groups, btn-create-group
# lives in the "+" sheet at the end of the group pill strip (btn-add-group).
# The optional tap covers both.
- tapOn:
    id: "btn-add-group"
    optional: true
- tapOn:
    id: "btn-create-group"
- assertVisible:
    id: "screen-group-new"
# #General is opt-in (off by default, like desktop); these steps open it.
- tapOn:
    id: "toggle-general-channel"
- tapOn:
    id: "input-group-name"
- inputText: "E2E Test Group"
- takeScreenshot: groups-02-create
- tapOn:
    id: "btn-submit-group"

# Creating navigates straight into the new group's detail screen (not
# back to the groups list) — better UX than assumed, matching Slack/Discord's
# drop-into-the-new-channel pattern. Its #General channel should be visible.
- extendedWaitUntil:
    visible:
      id: "screen-group"
    timeout: 15000
- assertVisible: "General"
- takeScreenshot: groups-03-created

# Without the toggle, a new group has no channel at all (desktop parity).
- tapOn:
    id: "btn-back"
- tapOn:
    id: "tab-groups"
# Now there IS a group: the tab shows the pill strip + panel, and create is in
# the "+" sheet.
- tapOn:
    id: "btn-add-group"
    optional: true
- tapOn:
    id: "btn-create-group"
- assertVisible:
    id: "screen-group-new"
- tapOn:
    id: "input-group-name"
- inputText: "E2E No Channel Group"
- tapOn:
    id: "btn-submit-group"
- extendedWaitUntil:
    visible:
      id: "screen-group"
    timeout: 15000
- assertNotVisible: "General"
- takeScreenshot: groups-04-created-without-channel
