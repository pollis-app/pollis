appId: com.pollis.mobile
tags:
  - parity
---
# GROUPS — create a group, open it, create/verify a channel, rename, leave.
# Self-contained (no peer). Uses testIDs where they exist; falls back to stable
# button TEXT where #620 left an action un-instrumented (noted in README gaps).

- runFlow: ../subflows/sign-in.yaml
# Navigate explicitly: sign-in guarantees the tab navigator, not which tab.
- tapOn:
    id: "tab-groups"
- assertVisible:
    id: "screen-groups"
- takeScreenshot: groups-01-inbox

# Create a group. NOTE: the "CREATE GROUP" submit has no testID yet (#620 gap),
# so we tap by text. input-group-name IS instrumented.
- tapOn:
    id: "btn-create-group"
- assertVisible:
    id: "screen-group-new"
- tapOn:
    id: "input-group-name"
- inputText: "E2E Test Group"
- takeScreenshot: groups-02-create
- tapOn: "CREATE GROUP"

# CREATE GROUP navigates straight into the new group's detail screen (not
# back to the groups list) — better UX than assumed, matching Slack/Discord's
# drop-into-the-new-channel pattern. Its #General channel should be visible.
- extendedWaitUntil:
    visible:
      id: "screen-group"
    timeout: 15000
- assertVisible: "General"
- takeScreenshot: groups-03-created
