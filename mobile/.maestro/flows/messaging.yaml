appId: com.pollis.mobile
tags:
  - parity
---
# MESSAGING — send / edit / delete / react in a self-owned channel.
# Self-contained: creates a group (→ #General channel) so there's a
# conversation to post into without a peer.

- runFlow: ../subflows/sign-in.yaml
# Navigate explicitly: sign-in guarantees the tab navigator, not which tab,
# and btn-create-group only exists on the groups screen.
- tapOn:
    id: "tab-groups"
- assertVisible:
    id: "screen-groups"

# Make a group so we have a channel to post in.
- tapOn:
    id: "btn-add-group"
    optional: true
- tapOn:
    id: "btn-create-group"
# #General is opt-in (off by default, like desktop); these steps open it.
- tapOn:
    id: "toggle-general-channel"
- tapOn:
    id: "input-group-name"
- inputText: "E2E Msg Group"
- tapOn:
    id: "btn-submit-group"
# Creating lands on the Groups tab with the new group selected (pill strip +
# its channel panel, tab bar visible) — not a pushed group page. Wait for
# THIS group's panel header (the account may already have other groups).
- extendedWaitUntil:
    visible:
      id: "btn-group-menu"
      text: "E2E Msg Group, .*"
    timeout: 15000
- assertVisible:
    id: "panel-group"

# Open the group's channel (the row-channel-<id> id is dynamic; tap the first
# channel row by its General label).
- tapOn:
    text: "General"
    optional: true
- assertVisible:
    id: "screen-chat"
- takeScreenshot: messaging-01-empty-channel

# Send a message. The whole message row collapses into ONE compound
# accessibility node (components/chat/MessageRow.tsx sets
# accessibilityLabel to "<name>: <text>, <status or time>"), so the
# "sending…"/timestamp text is not independently queryable, and a bare-text
# selector like "hello from maestro" never matches the compound label
# (Maestro requires a full match, not substring — use a `.*...*` regex, or
# better, the stable `row-message-<id>` testID).
# The send tap below happens with the keyboard UP, on purpose: if the keyboard
# covers the composer (Android edge-to-edge, #1194) the tap lands on the
# keyboard and the message never sends. Do not add a hideKeyboard before it.
- tapOn:
    id: "input-composer"
- inputText: "hello from maestro"
- tapOn:
    id: "btn-send"
- extendedWaitUntil:
    visible: ".*hello from maestro.*"
    timeout: 10000
- takeScreenshot: messaging-02-sent

# onLongPress is disabled while the message is still `pending` (see
# chat/[id].tsx) — the first message in a fresh group pays for MLS
# key-package/group-setup + DS round-trips before it clears. Observed
# anywhere from ~15s to 60s+ in practice (dev DS/Turso latency variance) —
# flag this as a perf characteristic worth the team's attention, not
# something to keep chasing with bigger timeouts. There's no queryable
# "no longer pending" signal, so this is a deliberate flat delay (Maestro
# has no plain sleep command): wait on a condition that will never resolve,
# `optional: true` so the timeout itself is the point.
- extendedWaitUntil:
    visible:
      id: "__never_matches__"
    timeout: 30000
    optional: true

# Long-press the message (by stable id, not text — see note above) to
# reveal edit/delete/react actions, then edit.
- runFlow: ../subflows/long-press-message.yaml
- takeScreenshot: messaging-03-actions
- tapOn:
    id: "btn-edit"
# No tap on the field: the edit bar autofocuses it with the caret after the
# text. A tap at the field's centre moves the caret there, and in the
# redesigned bar (round buttons either side of the field) the centre falls
# inside "hello from maestro" on Android, so the suffix landed mid-word.
- assertVisible:
    id: "input-edit-composer"
- inputText: " (edited)"
- tapOn:
    id: "btn-edit-save"
- extendedWaitUntil:
    visible: ".*hello from maestro \\(edited\\).*"
    timeout: 15000
- takeScreenshot: messaging-04-edited

# React to the message.
- runFlow: ../subflows/long-press-message.yaml
- tapOn:
    id: "btn-react-0"
    optional: true
- takeScreenshot: messaging-05-reacted

# Delete it.
- runFlow: ../subflows/long-press-message.yaml
- tapOn:
    id: "btn-delete"
- takeScreenshot: messaging-06-deleted

# Multi-line (#1247): Return in the composer inserts a newline instead of
# sending, so only btn-send sends. Typed as two inputText calls around a
# pressKey (adb cannot type a literal newline). The assertion needs BOTH lines
# inside ONE row's compound label, in order — had Return sent, "line one"
# would be its own message and nothing would match. `[\s\S]` spans the
# newline whatever Maestro's dot-matches-newline setting is.
- tapOn:
    id: "input-composer"
- inputText: "maestro line one"
- pressKey: Enter
- inputText: "maestro line two"
- tapOn:
    id: "btn-send"
- extendedWaitUntil:
    visible: ".*maestro line one\\nmaestro line two[\\s\\S]*"
    timeout: 15000
- takeScreenshot: messaging-07-multiline
