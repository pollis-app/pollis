appId: com.pollis.mobile
tags:
  - parity
---
# MESSAGING — send / edit / delete / react in a self-owned channel.
# Self-contained: creates a group (→ #General channel) so there's a
# conversation to post into without a peer.

- runFlow: ../subflows/sign-in.yaml
# Navigate explicitly: sign-in guarantees the tab navigator, not which tab,
# and btn-create-group only exists on the groups screen.
- tapOn:
    id: "tab-groups"
- assertVisible:
    id: "screen-groups"

# Make a group so we have a channel to post in.
- tapOn:
    id: "btn-create-group"
- tapOn:
    id: "input-group-name"
- inputText: "E2E Msg Group"
- tapOn: "CREATE GROUP"
# CREATE GROUP navigates straight into the new group's detail screen (not
# back to the groups list) — see groups.yaml.
- extendedWaitUntil:
    visible:
      id: "screen-group"
    timeout: 15000

# Open the group's channel (the row-channel-<id> id is dynamic; tap the first
# channel row by its General label).
- tapOn:
    text: "General"
    optional: true
- assertVisible:
    id: "screen-chat"
- takeScreenshot: messaging-01-empty-channel

# Send a message. The whole message row collapses into ONE compound
# accessibility node (Pressable sets accessibilityLabel={`${name}: ${text}`}
# in chat/[id].tsx), which does NOT include the "sending…"/timestamp text —
# so that status is not independently queryable, and a bare-text selector
# like "hello from maestro" never matches the compound "name: text" label
# (Maestro requires a full match, not substring — use a `.*...*` regex, or
# better, the stable `row-message-<id>` testID).
- tapOn:
    id: "input-composer"
- inputText: "hello from maestro"
- tapOn:
    id: "btn-send"
- extendedWaitUntil:
    visible: ".*hello from maestro.*"
    timeout: 10000
- takeScreenshot: messaging-02-sent

# onLongPress is disabled while the message is still `pending` (see
# chat/[id].tsx) — the first message in a fresh group pays for MLS
# key-package/group-setup + DS round-trips before it clears. Observed
# anywhere from ~15s to 60s+ in practice (dev DS/Turso latency variance) —
# flag this as a perf characteristic worth the team's attention, not
# something to keep chasing with bigger timeouts. There's no queryable
# "no longer pending" signal, so this is a deliberate flat delay (Maestro
# has no plain sleep command): wait on a condition that will never resolve,
# `optional: true` so the timeout itself is the point.
- extendedWaitUntil:
    visible:
      id: "__never_matches__"
    timeout: 30000
    optional: true

# Long-press the message (by stable id, not text — see note above) to
# reveal edit/delete/react actions, then edit.
- runFlow: ../subflows/long-press-message.yaml
- takeScreenshot: messaging-03-actions
- tapOn:
    id: "btn-edit"
- tapOn:
    id: "input-edit-composer"
- inputText: " (edited)"
- tapOn:
    id: "btn-edit-save"
- extendedWaitUntil:
    visible: ".*hello from maestro \\(edited\\).*"
    timeout: 15000
- takeScreenshot: messaging-04-edited

# React to the message.
- runFlow: ../subflows/long-press-message.yaml
- tapOn:
    id: "btn-react-0"
    optional: true
- takeScreenshot: messaging-05-reacted

# Delete it.
- runFlow: ../subflows/long-press-message.yaml
- tapOn:
    id: "btn-delete"
- takeScreenshot: messaging-06-deleted
