appId: com.pollis.mobile
tags:
  - parity
  - two-client
---
# REPORT (#1213) — report the seeded peer from their profile: a reason is
# required, Report and block both files the report and blocks, and the
# confirmation says so. Run via scripts/maestro-report.sh, which signs up a
# fresh peer on a second device and passes its handle as ${MAESTRO_PEER_HANDLE}. The
# message-level entry (long-press → Report) opens the same screen with the
# conversation and message ids; Playwright covers that the request carries no
# message text.

- runFlow: ../subflows/sign-in.yaml
- tapOn:
    id: "tab-search"
- tapOn:
    id: "input-search"
- inputText: "${MAESTRO_PEER_HANDLE}"
# Account lookup is exact-match and runs only on return, never per keystroke.
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "row-user-.*"
    timeout: 20000
- tapOn:
    id: "row-user-.*"
# SAFETY NUMBER (#1278) — the card shows the 60 digits in 5-digit blocks, and
# Mark verified flips to Verified (and back). Both were silently broken when
# the hook's field names drifted from pollis-core's SafetyNumberInfo.
- extendedWaitUntil:
    visible:
      id: "text-safety-number"
      text: "[0-9]{5}( [0-9]{5}){11}"
    timeout: 20000
- tapOn:
    id: "btn-verify"
    text: "Mark verified"
# Once verified the chip reads "Verified" and its spoken label becomes
# "Remove verification" (iOS matches the label, Android the text).
- extendedWaitUntil:
    visible:
      id: "btn-verify"
      text: "Verified|Remove verification"
    timeout: 15000
- takeScreenshot: report-00-verified
- tapOn:
    id: "btn-verify"
- extendedWaitUntil:
    visible:
      id: "btn-verify"
      text: "Mark verified"
    timeout: 15000
- scrollUntilVisible:
    element:
      id: "btn-report-user"
    direction: DOWN
- tapOn:
    id: "btn-report-user"
- extendedWaitUntil:
    visible:
      id: "screen-report"
    timeout: 10000
- takeScreenshot: report-01-reasons
# No reason yet: Report does nothing.
- tapOn:
    id: "btn-report-submit"
- assertVisible:
    id: "screen-report"
- assertNotVisible:
    id: "report-done"
- tapOn:
    id: "report-reason-spam"
- tapOn:
    id: "btn-report-and-block"
- extendedWaitUntil:
    visible:
      id: "report-done"
    timeout: 15000
- takeScreenshot: report-02-done
- tapOn:
    id: "btn-report-done"
# The block landed: the profile now offers Unblock.
- scrollUntilVisible:
    element:
      id: "btn-unblock"
    direction: DOWN
# Leave the peer unblocked for the other flows that DM them.
- tapOn:
    id: "btn-unblock"
- extendedWaitUntil:
    visible:
      id: "btn-block"
    timeout: 15000
