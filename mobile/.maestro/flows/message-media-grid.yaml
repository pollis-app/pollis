appId: ${MAESTRO_APP_ID}
tags:
  - parity
---
# MESSAGE ROW LAYOUT (#1970) — a channel with text, a quoted reply and a
# message of three pictures. The header is one line (name, then time) for a
# plain message and a reply alike; three pictures sit in a 2-up grid
# (`message-media-grid`: two squares, then one) under their caption, not
# stacked full-width. Shots 01 and 02 are the review gallery for the layout.
# Self-contained: a fresh disposable account, no peer.

- runFlow: ../subflows/sign-in.yaml
- tapOn:
    id: "tab-groups"
- assertVisible:
    id: "screen-groups"
- tapOn:
    id: "btn-add-group"
    optional: true
- tapOn:
    id: "btn-create-group"
- tapOn:
    id: "toggle-general-channel"
- tapOn:
    id: "input-group-name"
- inputText: "E2E Media Grid"
- tapOn:
    id: "btn-submit-group"
- runFlow:
    file: ../subflows/group-created.yaml
    env:
      GROUP: "E2E Media Grid"
- tapOn:
    text: "General"
    optional: true
- assertVisible:
    id: "screen-chat"

# Some text first. Keyboard stays up for each send tap (messaging.yaml, #1194).
- tapOn:
    id: "input-composer"
- inputText: "Morning! Notes from the site visit are below."
- tapOn:
    id: "btn-send"
- extendedWaitUntil:
    visible: ".*: Morning! Notes from the site visit are below\\., .*"
    timeout: 10000
- hideKeyboard
- runFlow: ../subflows/message-settled.yaml
- tapOn:
    id: "input-composer"
- inputText: "The north wall needs a second coat before Friday, and the delivery moved to Thursday afternoon."
- tapOn:
    id: "btn-send"
- extendedWaitUntil:
    visible: ".*: The north wall needs .*"
    timeout: 15000
- hideKeyboard
- runFlow: ../subflows/message-settled.yaml

# A quoted reply: its header is the same one line.
- swipe:
    from:
      text: ".*: Morning! Notes from the site visit are below\\., .*"
    direction: LEFT
    duration: 450
- extendedWaitUntil:
    visible:
      id: "bar-reply"
    timeout: 4000
- inputText: "Thanks, on it."
- tapOn:
    id: "btn-send"
- extendedWaitUntil:
    visible: "Reply to .*: Morning! .*: Thanks, on it\\., .*"
    timeout: 15000
- hideKeyboard
- runFlow: ../subflows/message-settled.yaml

# Three pictures with a caption.
- addMedia:
    - "../fixtures/vault-swipe-01.png"
    - "../fixtures/vault-swipe-02.png"
    - "../fixtures/vault-swipe-03.png"
# Android's media provider indexes new files late (sensitive-media.yaml).
- runFlow:
    when:
      platform: Android
    commands:
      - waitForAnimationToEnd:
          timeout: 8000
- tapOn:
    id: "btn-attach"
- waitForAnimationToEnd:
    timeout: 5000
# iPad: the picker takes only point taps (subflows/ipad-pick-photos.yaml).
- runFlow:
    when:
      true: ${IPAD == "1"}
    file: ../subflows/ipad-pick-photos.yaml
    env:
      CELLS: "3"
      CONFIRM: "1"
- runFlow:
    when:
      platform: iOS
      true: ${IPAD != "1"}
    commands:
      - tapOn: "Sort and Filter"
      - tapOn: "Added"
      - waitForAnimationToEnd:
          timeout: 3000
      - tapOn:
          text: "Photo, .*"
          index: 0
      - tapOn:
          text: "Photo, .*"
          index: 1
      - tapOn:
          text: "Photo, .*"
          index: 2
# Android: wait for the three seeds to be listed, then pick them one at a
# time, checking the count after each (pick-six-photos-android.yaml says why).
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            text: "Photo taken on.*"
            index: 2
          timeout: 20000
      - waitForAnimationToEnd:
          timeout: 5000
      - runFlow:
          file: ../subflows/pick-android-photo.yaml
          env:
            INDEX: "0"
            COUNT: "1"
      - runFlow:
          file: ../subflows/pick-android-photo.yaml
          env:
            INDEX: "1"
            COUNT: "2"
      - runFlow:
          file: ../subflows/pick-android-photo.yaml
          env:
            INDEX: "2"
            COUNT: "3"
- runFlow:
    when:
      true: ${IPAD != "1"}
    commands:
      - tapOn:
          text: "(?i)(add|done).*"
          optional: true
- extendedWaitUntil:
    visible:
      id: "composer-attachment-2"
    timeout: 10000
- tapOn:
    id: "input-composer"
- inputText: "Photos from this morning"
# Keep pressing Send until the strip clears (sensitive-media.yaml).
- repeat:
    while:
      visible:
        id: "strip-attachments"
    times: 30
    commands:
      - tapOn:
          id: "btn-send"
      - extendedWaitUntil:
          notVisible:
            id: "strip-attachments"
          timeout: 4000
          optional: true
- assertNotVisible:
    id: "strip-attachments"
- hideKeyboard

# The grid: three tiles in it, not stacked one per line.
- extendedWaitUntil:
    visible:
      id: "message-media-grid"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "btn-attachment-.*"
      index: 2
    timeout: 30000
- runFlow: ../subflows/message-settled.yaml
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: message-media-grid-01-channel
# The newest message, scrolled into the middle for a close look.
- scrollUntilVisible:
    element:
      text: ".*: Thanks, on it\\., .*"
    direction: UP
    timeout: 10000
    optional: true
- takeScreenshot: message-media-grid-02-busy-channel
