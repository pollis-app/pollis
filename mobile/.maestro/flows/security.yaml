- tapOn:
    id: "tab-self"
- tapOn:
    id: "row-self-security"
- assertVisible:
    id: "screen-self-security"
- takeScreenshot: security-01-devices
# Blocked-users list.
- tapOn:
    id: "row-blocked-users"
    optional: true
- takeScreenshot: security-02-blocked
