appId: ${MAESTRO_APP_ID}
tags:
  - parity
---
# VAULT SWIPE (#1492) — the Vault's media view opens a full-screen viewer that
# swipes left/right through every image in grid order, Google Photos style,
# with a "n / total" position under the filename, and a downward drag
# dismisses it. Desktop's MediaGalleryView walks the same roll with the arrow
# keys and its on-screen previous/next.
#
# Seeds the vault with twelve images (fixtures/vault-swipe-NN.png, numbered,
# each a different colour), one entry each, through the SYSTEM photo picker —
# cells picked by accessibility label, never by coordinate (see
# media-viewer.yaml's header for why). Every step is mandatory.
# Self-contained: a fresh disposable account, no peer.

- runFlow: ../subflows/sign-in.yaml
- tapOn:
    id: "tab-direct"
- tapOn:
    id: "row-vault"
- assertVisible:
    id: "screen-vault"
- extendedWaitUntil:
    visible:
      id: "vault-empty"
    timeout: 15000

# --- Seed: twelve image entries ---
# One image per entry, each its own encrypted upload + sealed DS write, so the
# roll also crosses entry boundaries (grid order = newest entry first). Each
# round must attach the photo it just seeded (pick-newest-photo.yaml): the
# swipe asserts below tell the images apart by filename, so attaching the same
# library photo every round makes them all read alike.
- addMedia:
    - "../fixtures/vault-swipe-01.png"
- runFlow: ../subflows/pick-newest-photo.yaml
- runFlow: ../subflows/send-vault-picks.yaml
- addMedia:
    - "../fixtures/vault-swipe-02.png"
- runFlow: ../subflows/pick-newest-photo.yaml
- runFlow: ../subflows/send-vault-picks.yaml
- addMedia:
    - "../fixtures/vault-swipe-03.png"
- runFlow: ../subflows/pick-newest-photo.yaml
- runFlow: ../subflows/send-vault-picks.yaml
- addMedia:
    - "../fixtures/vault-swipe-04.png"
- runFlow: ../subflows/pick-newest-photo.yaml
- runFlow: ../subflows/send-vault-picks.yaml
- addMedia:
    - "../fixtures/vault-swipe-05.png"
- runFlow: ../subflows/pick-newest-photo.yaml
- runFlow: ../subflows/send-vault-picks.yaml
- addMedia:
    - "../fixtures/vault-swipe-06.png"
- runFlow: ../subflows/pick-newest-photo.yaml
- runFlow: ../subflows/send-vault-picks.yaml
- addMedia:
    - "../fixtures/vault-swipe-07.png"
- runFlow: ../subflows/pick-newest-photo.yaml
- runFlow: ../subflows/send-vault-picks.yaml
- addMedia:
    - "../fixtures/vault-swipe-08.png"
- runFlow: ../subflows/pick-newest-photo.yaml
- runFlow: ../subflows/send-vault-picks.yaml
- addMedia:
    - "../fixtures/vault-swipe-09.png"
- runFlow: ../subflows/pick-newest-photo.yaml
- runFlow: ../subflows/send-vault-picks.yaml
- addMedia:
    - "../fixtures/vault-swipe-10.png"
- runFlow: ../subflows/pick-newest-photo.yaml
- runFlow: ../subflows/send-vault-picks.yaml
- addMedia:
    - "../fixtures/vault-swipe-11.png"
- runFlow: ../subflows/pick-newest-photo.yaml
- runFlow: ../subflows/send-vault-picks.yaml
- addMedia:
    - "../fixtures/vault-swipe-12.png"
- runFlow: ../subflows/pick-newest-photo.yaml
- runFlow: ../subflows/send-vault-picks.yaml
- extendedWaitUntil:
    visible:
      id: "btn-attachment-.*"
    timeout: 60000
- takeScreenshot: vault-swipe-01-entries

# --- The grid, then the viewer on its first tile ---
- tapOn:
    id: "chip-vault-view-media"
# All twelve saved (the last save may still be landing).
- extendedWaitUntil:
    visible:
      id: "tile-vault-media-.*"
      index: 11
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: vault-swipe-02-grid
- tapOn:
    id: "tile-vault-media-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "screen-media-viewer"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "text-media-position"
      text: "1 / 12.*"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "media-image-rendered"
    timeout: 30000
- copyTextFrom:
    id: "text-media-title"
- evalScript: ${output.first = maestro.copiedText}
- takeScreenshot: vault-swipe-03-first

# Swipes are explicit, quick, mid-screen strokes: an element-anchored swipe
# did not fling the pager on Android.
# --- Swipe left: the next image, and the position follows ---
- swipe:
    start: 90%, 50%
    end: 10%, 50%
    duration: 250
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "text-media-position"
      text: "2 / 12.*"
    timeout: 5000
- copyTextFrom:
    id: "text-media-title"
- assertTrue: ${maestro.copiedText != output.first}
- evalScript: ${output.second = maestro.copiedText}
- extendedWaitUntil:
    visible:
      id: "media-image-rendered"
    timeout: 30000
- takeScreenshot: vault-swipe-04-second

- swipe:
    start: 90%, 50%
    end: 10%, 50%
    duration: 250
- waitForAnimationToEnd:
    timeout: 3000
- swipe:
    start: 90%, 50%
    end: 10%, 50%
    duration: 250
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "text-media-position"
      text: "4 / 12.*"
    timeout: 5000
- copyTextFrom:
    id: "text-media-title"
- assertTrue: ${maestro.copiedText != output.second && maestro.copiedText != output.first}
- extendedWaitUntil:
    visible:
      id: "media-image-rendered"
    timeout: 30000
- takeScreenshot: vault-swipe-05-fourth

# --- Swipe right goes back one ---
- swipe:
    start: 10%, 50%
    end: 90%, 50%
    duration: 250
- waitForAnimationToEnd:
    timeout: 3000
- extendedWaitUntil:
    visible:
      id: "text-media-position"
      text: "3 / 12.*"
    timeout: 5000

# --- The on-screen buttons walk the same roll, wrapping like desktop's ---
- tapOn:
    id: "btn-media-prev"
- tapOn:
    id: "btn-media-prev"
- tapOn:
    id: "btn-media-prev"
- extendedWaitUntil:
    visible:
      id: "text-media-position"
      text: "12 / 12.*"
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "media-image-rendered"
    timeout: 30000
- takeScreenshot: vault-swipe-06-wrapped
- tapOn:
    id: "btn-media-next"
- extendedWaitUntil:
    visible:
      id: "text-media-position"
      text: "1 / 12.*"
    timeout: 5000
- copyTextFrom:
    id: "text-media-title"
- assertTrue: ${maestro.copiedText == output.first}

# --- A downward drag dismisses, back to the grid ---
- swipe:
    start: 50%, 40%
    end: 50%, 85%
    duration: 250
- extendedWaitUntil:
    visible:
      id: "screen-vault"
    timeout: 5000
- assertNotVisible:
    id: "screen-media-viewer"
- assertVisible:
    id: "vault-media"
- takeScreenshot: vault-swipe-07-dismissed
