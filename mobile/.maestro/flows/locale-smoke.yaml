appId: ${MAESTRO_APP_ID}
tags:
  - locale-smoke
  - fresh-account
  - gate
---
# LOCALE SMOKE (#1725) — the mobile counterpart of e2e/locale-smoke.spec.ts.
# Runs once per shipped locale: `mobile/scripts/maestro-run.sh locale-smoke
# <ios|ipad|android>` reads the catalogue directories, sets the DEVICE language
# to each (so the app's first-run auto-detect is what picks it), and passes
# LOCALE. A new locale is covered by adding its catalogue; nothing here changes.
#
# Screens: sign-in, chat list, a conversation, the composer, settings, the
# Language page, PIN.
# Every screen asserts no element's whole text is a raw catalogue key
# (`section.item` or `ns:section.item`), which is what i18next renders for a
# key with no entry in any language. Overflow and clipping are judged from the
# screenshots (locale-<code>-NN-<screen>), which Maestro cannot measure.

# --- Sign-in, in the device language, before any choice is stored ---
# iOS: the stored language lives in expo-secure-store, i.e. the keychain, which
# survives clearState; an earlier flow's choice would win over the device
# language (as it should for a user), so wipe it for a true first run.
# Android: the runner already ran `pm clear` and set the app's language
# (per-app locale, which clearState would wipe), so nothing is cleared here.
- runFlow:
    when:
      platform: iOS
    commands:
      - clearKeychain
      - clearState
- launchApp
- extendedWaitUntil:
    visible:
      id: "screen-auth-email"
    timeout: 30000
- assertNotVisible:
    text: "([a-z]+:)?[a-z][A-Za-z0-9]*(\\.[A-Za-z0-9_]+)+"
- takeScreenshot: locale-${LOCALE}-01-sign-in

- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      KEEP_STATE: "true"
      FRESH: "locale-${LOCALE}"

# --- Chat list ---
- tapOn:
    id: "tab-direct"
- assertVisible:
    id: "screen-direct"
- assertNotVisible:
    text: "([a-z]+:)?[a-z][A-Za-z0-9]*(\\.[A-Za-z0-9_]+)+"
- takeScreenshot: locale-${LOCALE}-02-chat-list

# --- A conversation (the Vault, which every account has) and its composer ---
- tapOn:
    id: "row-vault"
- assertVisible:
    id: "screen-vault"
- assertNotVisible:
    text: "([a-z]+:)?[a-z][A-Za-z0-9]*(\\.[A-Za-z0-9_]+)+"
- takeScreenshot: locale-${LOCALE}-03-conversation
- tapOn:
    id: "input-composer"
- inputText: "hello"
- takeScreenshot: locale-${LOCALE}-04-composer
# Back dismisses the keyboard with the screen (the composer exposes no dismiss action to hideKeyboard).
- tapOn:
    id: "btn-back"

# --- Settings: Preferences' Language row, then the Language page (#1944) ---
- tapOn:
    id: "tab-self"
- tapOn:
    id: "row-self-preferences"
- assertVisible:
    id: "screen-self-preferences"
- assertVisible:
    id: "row-preferences-language"
- assertNotVisible:
    text: "([a-z]+:)?[a-z][A-Za-z0-9]*(\\.[A-Za-z0-9_]+)+"
- takeScreenshot: locale-${LOCALE}-05-settings
# The auto-detected language is the selected row of the list.
- tapOn:
    id: "row-preferences-language"
- assertVisible:
    id: "screen-self-language"
- scrollUntilVisible:
    element:
      id: "radio-language-${LOCALE}"
    direction: DOWN
- assertVisible:
    id: "radio-language-${LOCALE}"
    selected: true
- assertNotVisible:
    text: "([a-z]+:)?[a-z][A-Za-z0-9]*(\\.[A-Za-z0-9_]+)+"
- takeScreenshot: locale-${LOCALE}-06-language

# --- PIN, after a relaunch ---
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "screen-auth-pin"
    timeout: 30000
- assertNotVisible:
    text: "([a-z]+:)?[a-z][A-Za-z0-9]*(\\.[A-Za-z0-9_]+)+"
- takeScreenshot: locale-${LOCALE}-07-pin
