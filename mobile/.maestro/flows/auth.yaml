appId: ${MAESTRO_APP_ID}
tags:
  - parity
  - smoke
  - fresh-account
  - gate
---
# AUTH — email -> OTP -> create PIN -> land on inbox. Screenshots at each state.
# This is also the smoke flow: if it passes, the bridge + dev DS + keystore are
# all live end-to-end. Self-contained (signs up a fresh disposable account of
# its own, never the run's shared one: tag `fresh-account`).

- runFlow:
    file: ../subflows/fresh-email.yaml
    env:
      FRESH: "auth"
- clearState
- launchApp

- assertVisible:
    id: "screen-auth-email"
- takeScreenshot: auth-01-email
- tapOn:
    id: "input-email"
- inputText: "${output.freshEmail}"
- tapOn:
    id: "btn-submit-email"

- assertVisible:
    id: "screen-auth-otp"
- takeScreenshot: auth-02-otp
# input-otp is an opacity:0 proxy over the 6 visual boxes, autoFocus'd on
# mount — Maestro can't tapOn a non-hittable element, but it's already
# focused, so inputText alone reaches it.
# Regression: dismissing the keyboard (Android back leaves the input focused)
# used to strand the user — a tap on the boxes must bring it back. Tapping the
# field's centre lands on the boxes, and the typed code proves the keyboard
# reached input-otp again. Android only: iOS's number pad has no return key,
# so hideKeyboard cannot close it there and the step always failed.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "otp-code-field"
- inputText: "${MAESTRO_OTP}"
- tapOn:
    id: "btn-submit-otp"

- extendedWaitUntil:
    visible:
      id: "screen-auth-pin"
    timeout: 15000
- takeScreenshot: auth-03-pin-create
- runFlow: ../subflows/enter-pin.yaml
- runFlow: ../subflows/enter-pin.yaml

# The emergency-kit screen mounts asynchronously after PIN confirm (key
# generation). This is a first signup, so it always comes: a definite step,
# not an optional one that costs ~7 s whenever it misses (#2042).
- extendedWaitUntil:
    visible:
      id: "screen-auth-emergency-kit"
    timeout: 40000
- takeScreenshot: auth-04-emergency-kit
- tapOn:
    id: "toggle-recovery-ack"
- tapOn:
    id: "btn-continue"

# The emergency kit's Continue pushes away with an animation, during which its
# own btn-continue is still on screen: wait for the kit to be gone, so only the
# initializing screen's Continue is ever tapped (on iPad, bottom centre is the
# sign-in-device shield). That screen usually advances on its own; one still up
# gets ~7 s to do so before the tap (subflows/probe-absent.yaml).
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    notVisible:
      id: "screen-auth-emergency-kit"
    timeout: 10000
- runFlow:
    file: ../subflows/probe-absent.yaml
    env:
      ID: "screen-auth-initializing"
- runFlow:
    when:
      true: ${!output.absent}
    commands:
      - tapOn:
          id: "btn-continue"
          childOf:
            id: "screen-auth-initializing"
          optional: true

- extendedWaitUntil:
    visible:
      id: "screen-groups"
    timeout: 20000
- takeScreenshot: auth-05-inbox

# UNLOCK — cold relaunch lands on the PIN pad; the fourth digit must switch it
# to its busy state at once (the launch loader in place of the pad) while
# Argon2id derives the key and the encrypted database opens, never a frozen
# pad. The last tap skips Maestro's settle wait: the busy state lasts only as
# long as the unlock, so the check has to look straight away.
#
# On a fast device or a Release build the unlock can finish before Maestro's
# first look, so a bare `assertVisible: pin-busy` raced it (#1530). The check
# is therefore "within a second of the fourth tap the pad is either busy or
# already gone" — the busy indicator, or a screen the unlock navigates to. A
# frozen pad (four dots, no spinner, still on the PIN screen) matches neither
# and fails it. An unlock that finishes inside that second can't be told
# apart from a sub-second freeze, but neither is a perceptibly frozen screen,
# which is the rule this guards.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "screen-auth-pin"
    timeout: 20000
# None of the "already gone" screens may be on screen yet, or the check after
# the fourth tap would pass without the pad doing anything.
- assertNotVisible:
    id: "screen-auth-initializing|screen-groups|tab-groups"
# A wrong PIN goes through the same loader and puts the pad back, with its error.
- tapOn:
    id: "btn-pin-9"
- tapOn:
    id: "btn-pin-9"
- tapOn:
    id: "btn-pin-9"
- tapOn:
    id: "btn-pin-9"
- extendedWaitUntil:
    visible:
      id: "pin-error"
    timeout: 20000
- assertVisible:
    id: "btn-pin-1"
- takeScreenshot: auth-06a-pin-wrong
- tapOn:
    id: "btn-pin-1"
- tapOn:
    id: "btn-pin-2"
- tapOn:
    id: "btn-pin-3"
- tapOn:
    id: "btn-pin-4"
    waitToSettleTimeoutMs: 0
- extendedWaitUntil:
    visible:
      id: "pin-busy|screen-auth-initializing|screen-groups|tab-groups"
    timeout: 1000
# While it works, the launch loader REPLACES the pad: no key is left on screen
# (a disabled keypad with a spinner squeezed in is what this guards against).
# Unconditional: busy or already past the pad, no key may show either way, and
# a `when: visible: pin-busy` cost ~7 s whenever the unlock had finished (#2042).
- takeScreenshot: auth-06-pin-unlocking
- assertNotVisible:
    id: "btn-pin-1|btn-pin-5|btn-pin-0|btn-pin-back"
- extendedWaitUntil:
    visible:
      id: "tab-groups"
    timeout: 30000
