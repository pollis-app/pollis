appId: ${MAESTRO_APP_ID}
tags:
  - parity
  - smoke
---
# AUTH — email -> OTP -> create PIN -> land on inbox. Screenshots at each state.
# This is also the smoke flow: if it passes, the bridge + dev DS + keystore are
# all live end-to-end. Self-contained (signs up a fresh disposable account).

- clearState
- launchApp

- assertVisible:
    id: "screen-auth-email"
- takeScreenshot: auth-01-email
- tapOn:
    id: "input-email"
- inputText: "${MAESTRO_EMAIL}"
- tapOn:
    id: "btn-submit-email"

- assertVisible:
    id: "screen-auth-otp"
- takeScreenshot: auth-02-otp
# input-otp is an opacity:0 proxy over the 6 visual boxes, autoFocus'd on
# mount — Maestro can't tapOn a non-hittable element, but it's already
# focused, so inputText alone reaches it.
# Regression: dismissing the keyboard (Android back leaves the input focused)
# used to strand the user — a tap on the boxes must bring it back. Tapping the
# field's centre lands on the boxes, and the typed code proves the keyboard
# reached input-otp again.
- hideKeyboard
- tapOn:
    id: "otp-code-field"
- inputText: "${MAESTRO_OTP}"
- tapOn:
    id: "btn-submit-otp"

- extendedWaitUntil:
    visible:
      id: "screen-auth-pin"
    timeout: 15000
- takeScreenshot: auth-03-pin-create
- runFlow: ../subflows/enter-pin.yaml
- runFlow: ../subflows/enter-pin.yaml

# The emergency-kit screen mounts asynchronously after PIN confirm (key
# generation); `runFlow: when:` checks visibility once, immediately, so it
# needs a real wait first or it skips a screen that's still one frame away.
- extendedWaitUntil:
    visible:
      id: "screen-auth-emergency-kit"
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible:
        id: "screen-auth-emergency-kit"
    commands:
      - takeScreenshot: auth-04-emergency-kit
      - tapOn:
          id: "toggle-recovery-ack"
      - tapOn:
          id: "btn-continue"

# The emergency kit's Continue pushes away with an animation, during which its
# own btn-continue is still on screen: without this wait the conditional below
# matches the OUTGOING button and its tap lands on the incoming tab bar (on
# iPad, bottom centre is the Search tab). Settle first.
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible:
        id: "btn-continue"
    commands:
      - tapOn:
          id: "btn-continue"

- extendedWaitUntil:
    visible:
      id: "screen-groups"
    timeout: 20000
- takeScreenshot: auth-05-inbox

# UNLOCK — cold relaunch lands on the PIN pad; the fourth digit must switch it
# to its busy state at once (spinner + "Unlocking…", keys disabled) while
# Argon2id derives the key and the encrypted database opens, never a frozen
# pad. The last tap skips Maestro's settle wait: the busy state lasts only as
# long as the unlock, so the assertion has to look straight away.
- stopApp
- launchApp
- extendedWaitUntil:
    visible:
      id: "screen-auth-pin"
    timeout: 20000
- tapOn:
    id: "btn-pin-1"
- tapOn:
    id: "btn-pin-2"
- tapOn:
    id: "btn-pin-3"
- tapOn:
    id: "btn-pin-4"
    waitToSettleTimeoutMs: 0
- assertVisible:
    id: "pin-busy"
- takeScreenshot: auth-06-pin-unlocking
- extendedWaitUntil:
    visible:
      id: "tab-groups"
    timeout: 30000
