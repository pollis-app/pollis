appId: ${MAESTRO_APP_ID}
tags:
  - parity
  - fresh-account
# Back online whatever happened: a failure while offline must not leave the
# device in airplane mode for the flows after this one (#2029).
onFlowComplete:
  - runFlow:
      when:
        platform: Android
      commands:
        - setAirplaneMode: disabled
---
# VAULT SAVE (#1497) — a big entry saves, and a save that cannot is honest
# about it and retryable. Against the dev DS on a Release build.
#
# Part 1 (both platforms) is the issue's own scenario: ONE entry carrying
# twelve images. It failed every time with "Couldn't save to your vault":
# the twelve uploads decoded their images on the core's async workers, the
# HTTP requests those workers drive starved, and the presigns died on dead
# pooled connections.
#
# Part 2 (Android only — Maestro can switch airplane mode only there): a save
# made offline is queued and reads "Not saved"; back online it is saved once
# (#2100, the Vault's durable queue).
#
# Self-contained: a fresh disposable account, no peer.

- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      FRESH: "vault-retry"
- tapOn:
    id: "tab-direct"
- tapOn:
    id: "row-vault"
- extendedWaitUntil:
    visible:
      id: "vault-empty"
    timeout: 15000

# ── Part 1: twelve images in one entry ──────────────────────────────────────
# Six copies seeded into the library; the picker is opened twice and all six
# picked each time, so the entry carries twelve attachments.
- addMedia:
    - "../fixtures/media-viewer.png"
    - "../fixtures/media-viewer.png"
    - "../fixtures/media-viewer.png"
    - "../fixtures/media-viewer.png"
    - "../fixtures/media-viewer.png"
    - "../fixtures/media-viewer.png"
- repeat:
    times: 2
    commands:
      - tapOn:
          id: "btn-attach"
      - waitForAnimationToEnd:
          timeout: 5000
      - runFlow:
          when:
            platform: Android
          file: ../subflows/pick-six-photos-android.yaml
      # iPad: the picker takes only point taps (ipad-pick-photos.yaml).
      - runFlow:
          when:
            true: ${IPAD == "1"}
          file: ../subflows/ipad-pick-photos.yaml
          env:
            CELLS: "6"
            CONFIRM: "1"
      - runFlow:
          when:
            platform: iOS
            true: ${IPAD != "1"}
          file: ../subflows/pick-six-photos-ios.yaml
      - runFlow:
          when:
            true: ${IPAD != "1"}
          commands:
            - tapOn:
                text: "(?i)(add|done).*"
      - waitForAnimationToEnd:
          timeout: 3000
- extendedWaitUntil:
    visible:
      id: "strip-attachments"
    timeout: 10000
- takeScreenshot: vault-retry-01-twelve-picked
- tapOn:
    id: "btn-send"
- extendedWaitUntil:
    visible:
      id: "btn-attachment-.*"
    timeout: 120000
- assertNotVisible:
    id: "text-vault-save-failed"
- takeScreenshot: vault-retry-02-twelve-saved

# ── Part 2: offline save → queued, "Not saved" → retried, saved once (Android) ──
# #2100: a Vault save goes through the durable queue like a message. Offline, it
# is stored, tried in place, then reads "Not saved" on its row; the composer is
# NOT handed the draft back (it was sent, and a resend would save twice). Back
# online, the drain or Retry (long press → Retry) saves it, once.
- runFlow:
    when:
      platform: Android
    commands:
      - setAirplaneMode: enabled
      - tapOn:
          id: "input-composer"
      - inputText: "vault offline 1497"
      - tapOn:
          id: "btn-send"
      - extendedWaitUntil:
          visible:
            id: "vault-not-saved-.*"
          timeout: 90000
      - assertNotVisible:
          id: "text-vault-save-failed"
      - takeScreenshot: vault-retry-03-not-saved-offline
      - setAirplaneMode: disabled
      - waitForAnimationToEnd:
          timeout: 5000
      # Retry by hand unless the reconnect drain got there first.
      - runFlow:
          when:
            visible:
              id: "vault-not-saved-.*"
          commands:
            - longPressOn: ".*vault offline 1497.*"
            - extendedWaitUntil:
                visible:
                  id: "btn-vault-retry-save"
                timeout: 8000
            - takeScreenshot: vault-retry-04-retry-sheet
            - tapOn:
                id: "btn-vault-retry-save"
      - extendedWaitUntil:
          notVisible:
            id: "vault-not-saved-.*"
          timeout: 60000
      - assertVisible: ".*vault offline 1497.*"
      - takeScreenshot: vault-retry-05-saved
