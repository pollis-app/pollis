appId: com.pollis.mobile
tags:
  - parity
---
# LANGUAGE (#1074) — the mobile counterpart of e2e/i18n.spec.ts: switching
# language changes rendered copy, the choice survives a relaunch, and picking
# the RTL locale flips the layout on the next launch. Self-contained.
#
# Asserts on real translated copy (settings:language.heading in es / ar) rather
# than a synthetic locale: mobile has no test-locale injection, and the shipped
# catalogues carry this key in every language, so the assertion is stable.
# Headings are sentence case since the 2026-10 redesign ("Language" / "Idioma",
# no uppercasing), and Maestro's text match is a full, case-sensitive regex, so
# the strings below must match the catalogue exactly. Each assertion pins the
# heading element itself (pref-language-heading) AND its text, so it cannot be
# satisfied by the chip row's accessibility label (settings:language.ariaLabel,
# which is the same word) or by the Self hub's Language row.

- runFlow: ../subflows/sign-in.yaml

- tapOn:
    id: "tab-self"
- tapOn:
    id: "row-self-preferences"
- assertVisible:
    id: "screen-self-preferences"
- scrollUntilVisible:
    element:
      id: "pref-language"
    direction: DOWN
- assertVisible:
    id: "pref-language-heading"
    text: "Language"
- takeScreenshot: i18n-01-english

# Switch to Spanish: the heading re-renders in Spanish without a restart.
- tapOn:
    id: "chip-language-es"
- assertVisible:
    id: "pref-language-heading"
    text: "Idioma"
- takeScreenshot: i18n-02-spanish

# The choice is device-local and survives a relaunch (no clearState here).
- stopApp
- launchApp
- runFlow:
    when:
      visible:
        id: "screen-auth-pin"
    commands:
      - runFlow: ../subflows/enter-pin.yaml
- extendedWaitUntil:
    visible:
      id: "tab-self"
    timeout: 30000
- tapOn:
    id: "tab-self"
- tapOn:
    id: "row-self-preferences"
- scrollUntilVisible:
    element:
      id: "pref-language"
    direction: DOWN
- assertVisible:
    id: "pref-language-heading"
    text: "Idioma"
- takeScreenshot: i18n-03-spanish-persisted

# Arabic: copy flips immediately; the layout direction needs a relaunch, and
# the screen says so.
- tapOn:
    id: "chip-language-ar"
- assertVisible:
    id: "pref-language-restart"
- takeScreenshot: i18n-04-arabic-restart-pending
- stopApp
- launchApp
- runFlow:
    when:
      visible:
        id: "screen-auth-pin"
    commands:
      - runFlow: ../subflows/enter-pin.yaml
- extendedWaitUntil:
    visible:
      id: "tab-self"
    timeout: 30000
- tapOn:
    id: "tab-self"
- tapOn:
    id: "row-self-preferences"
- scrollUntilVisible:
    element:
      id: "pref-language"
    direction: DOWN
# Mirrored now: the restart notice is gone and the back affordance sits on the
# trailing (right) edge — the screenshot is what the visual evaluator checks.
- assertNotVisible:
    id: "pref-language-restart"
- takeScreenshot: i18n-05-arabic-rtl

# Leave the device in English for the flows that follow.
- tapOn:
    id: "chip-language-en"
- assertVisible:
    id: "pref-language-heading"
    text: "Language"
