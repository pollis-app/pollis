appId: ${MAESTRO_APP_ID}
tags:
  - parity
---
# MEDIA VIEWER (#1248) — send an image, prove it renders from R2, then tap it
# in chat → the full-screen viewer (a pushed page): double-tap zoom, Save to
# photos (add-only permission, on demand) with visible feedback, Share
# reachable, Close back to the chat. Self-contained: signs in, creates a group
# (→ #General) and sends an image from the photo library.
#
# The attach step goes through the SYSTEM photo picker (PHPicker on iOS, the
# Android photo picker), which this app does not own: its cells carry no
# testIDs. `addMedia` seeds the library with a known image, and the cell is
# picked by its accessibility label — "Photo, <date>" on iOS, "Photo taken on
# <date>" on Android 13+ — never by a screen coordinate, which lands on a
# different cell (or none) on another OS version or screen size. Every step is
# mandatory: a picker this flow cannot drive is a failure, not a skip.
#
# Right after the send the chat shows the picker's LOCAL preview, which renders
# whether or not the upload/download/decrypt path works. So the flow cold-
# restarts the app and re-opens the channel: what renders then came from R2
# through `get_media_path`. `media-image-rendered` is the image's testID once
# expo-image has drawn the decrypted file; `media-unavailable` is the "Image
# unavailable" placeholder, which must not appear.

- runFlow: ../subflows/sign-in.yaml
- tapOn:
    id: "tab-groups"
- assertVisible:
    id: "screen-groups"

# A group with #General to post into.
- tapOn:
    id: "btn-add-group"
    optional: true
- tapOn:
    id: "btn-create-group"
- tapOn:
    id: "toggle-general-channel"
- tapOn:
    id: "input-group-name"
- inputText: "E2E Media Group"
- tapOn:
    id: "btn-submit-group"
- extendedWaitUntil:
    visible:
      id: "btn-group-menu"
      text: "E2E Media Group, .*"
    timeout: 15000
- tapOn:
    text: "General"
    optional: true
- assertVisible:
    id: "screen-chat"
- takeScreenshot: media-viewer-01-empty-channel

# Seed the device library with a known image, then pick it.
- addMedia:
    - "../fixtures/media-viewer.png"
- tapOn:
    id: "btn-attach"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: media-viewer-02-picker
# Tap the seeded photo by label (see the header), then confirm: multiple
# selection is on, so both pickers need "Add" (iOS) / "Done" (Android).
- tapOn:
    text: "Photo(,| taken on) .*"
    index: 0
- tapOn:
    text: "(?i)(add|done).*"
- extendedWaitUntil:
    visible:
      id: "strip-attachments"
    timeout: 10000
- tapOn:
    id: "btn-send"
# Upload (encrypt + presigned PUT) and the first MLS send in a fresh group can
# take a while (see messaging.yaml).
- extendedWaitUntil:
    visible:
      id: "btn-attachment-.*"
    timeout: 60000
- takeScreenshot: media-viewer-03-sent
# The thumbnail above is the optimistic row; the send itself (the first MLS
# send in a fresh group) can take a minute. Restarting before it lands used to
# lose it outright; since #1335 the outbox re-sends it after the unlock
# (`flows/outbox.yaml` proves that), but this flow asserts on the R2 copy right
# after the restart, so it still waits for the stub to be replaced.
- extendedWaitUntil:
    notVisible:
      id: "row-message-pending-.*"
    timeout: 120000

# Cold restart: no local preview survives it, so what renders next was
# downloaded from R2 and decrypted to the sandbox.
- stopApp
- launchApp
- runFlow: ../subflows/enter-pin.yaml
- extendedWaitUntil:
    visible:
      id: "tab-groups"
    timeout: 20000
- tapOn:
    id: "tab-groups"
- tapOn:
    text: "E2E Media Group.*"
    index: 0
- tapOn:
    text: "General"
    optional: true
- assertVisible:
    id: "screen-chat"
- extendedWaitUntil:
    visible:
      id: "media-image-rendered"
    timeout: 60000
- assertNotVisible:
    id: "media-unavailable"
- takeScreenshot: media-viewer-04-rendered-after-restart

# The viewer over the same attachment.
- tapOn:
    id: "btn-attachment-.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "screen-media-viewer"
    timeout: 10000
- assertNotVisible:
    id: "text-media-unavailable"
- assertVisible:
    id: "btn-media-close"
- assertVisible:
    id: "btn-media-save"
- assertVisible:
    id: "btn-media-share"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: media-viewer-05-open

# Double-tap zooms in on the tapped point; a second double-tap resets.
- doubleTapOn:
    id: "media-page-.*"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: media-viewer-06-zoomed
- doubleTapOn:
    id: "media-page-.*"

# Save asks for add-only photo access on first use (iOS shows the
# system alert; Android 13+ needs no grant at all).
- tapOn:
    id: "btn-media-save"
- tapOn:
    text: "(?i)allow.*"
    optional: true
- extendedWaitUntil:
    visible:
      id: "text-media-feedback"
    timeout: 10000
- takeScreenshot: media-viewer-07-saved

# Close returns to the conversation.
- tapOn:
    id: "btn-media-close"
- assertVisible:
    id: "screen-chat"
