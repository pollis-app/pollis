appId: com.pollis.mobile
tags:
  - parity
---
# MEDIA VIEWER (#1248) — tap an image attachment in chat → the full-screen
# viewer (a pushed page): double-tap zoom, Save to photos (add-only
# permission, on demand) with visible feedback, Share reachable, Close back
# to the chat. Self-contained: signs in, creates a group (→ #General) and
# sends an image from the photo library.
#
# The attach step goes through the SYSTEM photo picker (PHPicker on iOS, the
# Android photo picker), which this app does not own: its cells carry no
# testIDs and their labels differ by OS version. `addMedia` seeds the library
# with a known image, and the picker taps below are best-effort and
# `optional`. Everything after the send runs only when an attachment row
# actually appeared (`runFlow` + `when`), so a picker that could not be
# driven skips the viewer half instead of failing the suite — read the
# screenshots: `media-viewer-03-*` onwards only exist when it ran.

- runFlow: ../subflows/sign-in.yaml
- tapOn:
    id: "tab-groups"
- assertVisible:
    id: "screen-groups"

# A group with #General to post into.
- tapOn:
    id: "btn-add-group"
    optional: true
- tapOn:
    id: "btn-create-group"
- tapOn:
    id: "toggle-general-channel"
- tapOn:
    id: "input-group-name"
- inputText: "E2E Media Group"
- tapOn:
    id: "btn-submit-group"
- extendedWaitUntil:
    visible:
      id: "btn-group-menu"
      text: "E2E Media Group, .*"
    timeout: 15000
- tapOn:
    text: "General"
    optional: true
- assertVisible:
    id: "screen-chat"
- takeScreenshot: media-viewer-01-empty-channel

# Seed the device library with a known image, then pick it.
- addMedia:
    - "../fixtures/media-viewer.png"
- tapOn:
    id: "btn-attach"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: media-viewer-02-picker
# iOS PHPicker cells read "Photo, <date>". Android's photo picker cells have
# no text a regex can pick out from its "Photos" tab, so tap the first cell.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Photo, .*"
          index: 0
          optional: true
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          point: "16%,61%"
          optional: true
# Multiple selection is on, so both pickers need an explicit confirm: "Add"
# on iOS, "Done" on Android.
- tapOn:
    text: "(?i)(add|done).*"
    optional: true
- extendedWaitUntil:
    visible:
      id: "strip-attachments"
    timeout: 10000
    optional: true

- runFlow:
    when:
      visible:
        id: "strip-attachments"
    commands:
      - tapOn:
          id: "btn-send"
      # Upload (encrypt + presigned PUT) and the first MLS send in a fresh
      # group can take a while (see messaging.yaml).
      - extendedWaitUntil:
          visible:
            id: "btn-attachment-.*"
          timeout: 60000
      - takeScreenshot: media-viewer-03-sent

- runFlow:
    when:
      visible:
        id: "btn-attachment-.*"
    commands:
      - tapOn:
          id: "btn-attachment-.*"
          index: 0
      - extendedWaitUntil:
          visible:
            id: "screen-media-viewer"
          timeout: 10000
      - assertVisible:
          id: "btn-media-close"
      - assertVisible:
          id: "btn-media-save"
      - assertVisible:
          id: "btn-media-share"
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: media-viewer-04-open

      # Double-tap zooms in on the tapped point; a second double-tap resets.
      - doubleTapOn:
          id: "media-page-.*"
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: media-viewer-05-zoomed
      - doubleTapOn:
          id: "media-page-.*"

      # Save asks for add-only photo access on first use (iOS shows the
      # system alert; Android 13+ needs no grant at all).
      - tapOn:
          id: "btn-media-save"
      - tapOn:
          text: "(?i)allow.*"
          optional: true
      - extendedWaitUntil:
          visible:
            id: "text-media-feedback"
          timeout: 10000
      - takeScreenshot: media-viewer-06-saved

      # Close returns to the conversation.
      - tapOn:
          id: "btn-media-close"
      - assertVisible:
          id: "screen-chat"
