appId: ${MAESTRO_APP_ID}
tags:
  - parity
  - peer
  - gate
---
# DMs — start a DM with a peer, send a message; this file drives the initiator.
# Tag `peer`: maestro-run.sh signs a fresh peer up on the same device first
# (setup/peer.yaml) and passes its handle as ${MAESTRO_PEER_HANDLE} (#1950,
# #2029); scripts/maestro-report.sh does the same with a second device.

- runFlow: ../subflows/home.yaml
- tapOn:
    id: "tab-direct"
- assertVisible:
    id: "screen-direct"
- takeScreenshot: dms-01-list
- tapOn:
    id: "btn-new-dm"
- assertVisible:
    id: "screen-dm-new"
- tapOn:
    id: "input-user-search"
- inputText: "${MAESTRO_PEER_HANDLE}"
# Exact-match lookup on return / Find only, never per keystroke.
- pressKey: Enter
- takeScreenshot: dms-02-search
# The result row starts the DM when tapped. Match the id as a REGEX PREFIX:
# the app emits `row-user-<userId>`, not `row-user-<handle>`, and the user id
# is not knowable ahead of time. This used to tap `row-user-${MAESTRO_PEER_HANDLE}`
# with `optional: true`, which could never match — so the flow silently walked
# past it and "sent" a message into whatever screen it was still on. A step
# that cannot fail is not a test; `optional` is deliberately gone.
#
# Tapping the handle TEXT is not an alternative: the same string is in the
# search box we just typed into, and tapping that opens iOS's text-selection
# popover instead of navigating.
- extendedWaitUntil:
    visible:
      id: "row-user-.*"
    timeout: 20000
- tapOn:
    id: "row-user-.*"
- takeScreenshot: dms-03-opened
- extendedWaitUntil:
    visible:
      id: "input-composer"
    timeout: 30000
- tapOn:
    id: "input-composer"
- inputText: "hello peer"
- tapOn:
    id: "btn-send"
- takeScreenshot: dms-04-sent
# Zero message loss (#1524).
- runFlow: ../subflows/assert-no-loss.yaml
