appId: com.pollis.mobile
tags:
  - two-client
---
# MEMBERSHIP (#1506), part 1 of 2 — driven by scripts/maestro-membership.sh.
# Sign up a fresh account. The peer (the group's creator, a dev-DS client)
# invites it by email as soon as it exists; accept from the Groups tab, open
# #General and post. The phone just joined, so its own message carries the
# "new" tag (spoken as "(new)" after the name), and no "joined" line appears.

- runFlow: ../../subflows/sign-in.yaml
- tapOn:
    id: "tab-groups"

# The invite lands within seconds of sign-up; the inbox wake-up refreshes the
# list. A relaunch catches a wake-up that was missed.
- extendedWaitUntil:
    visible:
      id: "row-invite-.*"
    timeout: 60000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "row-invite-.*"
    commands:
      - stopApp
      - launchApp
      - runFlow:
          when:
            visible:
              id: "screen-auth-pin"
          commands:
            - runFlow: ../../subflows/enter-pin.yaml
      - extendedWaitUntil:
          visible:
            id: "tab-groups"
          timeout: 30000
      - tapOn:
          id: "tab-groups"
      - extendedWaitUntil:
          visible:
            id: "row-invite-.*"
          timeout: 60000
- takeScreenshot: membership-01-invite
- tapOn:
    id: "btn-accept-invite-.*"
- extendedWaitUntil:
    visible:
      id: "btn-group-menu"
      text: "${GROUP_NAME}, .*"
    timeout: 60000

- tapOn: "General"
- extendedWaitUntil:
    visible:
      id: "input-composer"
    timeout: 30000
- tapOn:
    id: "input-composer"
- inputText: "hello from the phone"
# The keyboard can sit over the send button and take the tap (Gboard's mic).
- hideKeyboard
- tapOn:
    id: "btn-send"
- extendedWaitUntil:
    visible: '(?i).*\(new\): hello from the phone, .*'
    timeout: 20000
- assertNotVisible: "(?i).*joined the group.*"
- takeScreenshot: membership-02-new-tag
