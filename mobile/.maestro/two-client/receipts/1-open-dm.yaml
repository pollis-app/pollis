appId: ${MAESTRO_APP_ID}
tags:
  - two-client
---
# DM RECEIPTS (#1637), part 1 of 2 — driven by scripts/maestro-receipts.sh.
# Sign up a fresh account and open a DM with the peer the script just signed up
# (${MAESTRO_PEER_HANDLE}); the peer accepts it. Stays in the conversation.

- runFlow: ../../subflows/sign-in.yaml
- tapOn:
    id: "tab-direct"
- tapOn:
    id: "btn-new-dm"
- tapOn:
    id: "input-user-search"
- inputText: "${MAESTRO_PEER_HANDLE}"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "row-user-.*"
    timeout: 20000
- tapOn:
    id: "row-user-.*"
- extendedWaitUntil:
    visible:
      id: "input-composer"
    timeout: 30000
- tapOn:
    id: "input-composer"
- inputText: "receipt one"
# The keyboard can sit over the send button and take the tap (Gboard's mic).
- hideKeyboard:
    optional: true
- tapOn:
    id: "btn-send"
- extendedWaitUntil:
    visible: ".*: receipt one, .*"
    timeout: 15000
