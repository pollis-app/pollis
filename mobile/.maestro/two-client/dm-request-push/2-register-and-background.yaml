appId: ${MAESTRO_APP_ID}
tags:
  - two-client
---
# DM REQUEST PUSH (#1734), part 2 of 4. The script just granted the notification
# permission. The app registers its push token, with the `dm_request` capability
# this build embeds, on every return to the foreground (#1423), so leave and come
# back once, then go to the background for good: the request must arrive as a push.

- pressKey: Home
- launchApp:
    stopApp: false
- runFlow:
    when:
      visible:
        id: "screen-auth-pin"
    commands:
      - runFlow: ../../subflows/enter-pin.yaml
- extendedWaitUntil:
    visible:
      id: "tab-direct"
    timeout: 30000
# Registration is a DS round trip after the foreground event; there is no UI for it.
- extendedWaitUntil:
    visible:
      id: "never-shown-registration-grace"
    timeout: 8000
    optional: true
- pressKey: Home
