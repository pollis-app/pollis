appId: ${MAESTRO_APP_ID}
tags:
  - two-client
---
# DM REQUEST PUSH (#1734), part 3 of 4. The tray holds exactly one notification,
# "Message request" / "<peer> wants to message you" (the script checked), and the
# script has pulled the notification shade down. Tapping it must open the request
# list — never the chat, which the user has not accepted. Then accept it, so part 4
# finds only the second stranger's request.

- tapOn: "Message request"
- runFlow:
    when:
      visible:
        id: "screen-auth-pin"
    commands:
      - runFlow: ../../subflows/enter-pin.yaml
- extendedWaitUntil:
    visible:
      id: "screen-dm-requests"
    timeout: 30000
- assertNotVisible:
    id: "input-composer"
- extendedWaitUntil:
    visible: ".*${MAESTRO_PEER_HANDLE}.*"
    timeout: 30000
- takeScreenshot: dm-request-push-03-requests-from-tap
- tapOn:
    id: "btn-accept-request-.*"
- extendedWaitUntil:
    notVisible:
      id: "row-request-.*"
    timeout: 30000
- pressKey: Home
