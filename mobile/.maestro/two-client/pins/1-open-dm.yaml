appId: com.pollis.mobile
tags:
  - two-client
---
# PINS (#1315), part 1 of 2 — driven by scripts/maestro-pins.sh.
# Sign up a fresh account and open a DM with the peer the script just signed up
# (${MAESTRO_PEER_HANDLE}). The peer, a dev-DS client run by the script, accepts
# it, sends a message and pins it.

- runFlow: ../../subflows/sign-in.yaml
- tapOn:
    id: "tab-direct"
- tapOn:
    id: "btn-new-dm"
- tapOn:
    id: "input-user-search"
- inputText: "${MAESTRO_PEER_HANDLE}"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "row-user-.*"
    timeout: 20000
- tapOn:
    id: "row-user-.*"
- extendedWaitUntil:
    visible:
      id: "input-composer"
    timeout: 30000
- tapOn:
    id: "input-composer"
- inputText: "hello peer"
# The keyboard can sit over the send button and take the tap (Gboard's mic).
- hideKeyboard
- tapOn:
    id: "btn-send"
- extendedWaitUntil:
    visible: ".*: hello peer, .*"
    timeout: 15000
