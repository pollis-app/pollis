appId: ${MAESTRO_APP_ID}
tags:
  - two-client
---
# SAFETY-NUMBER CHANGE (#1605), part 1 of 2 — driven by
# scripts/maestro-key-change.sh. Sign up, open a DM with the peer the script
# signed up (${MAESTRO_PEER_HANDLE}), wait for its message, and verify its
# safety number. The DM header then carries the verified shield, and there is
# no key-change line yet: a first sight of a key is a pin, not a change.

- runFlow: ../../subflows/sign-in.yaml
- tapOn:
    id: "tab-direct"
- tapOn:
    id: "btn-new-dm"
- tapOn:
    id: "input-user-search"
- inputText: "${MAESTRO_PEER_HANDLE}"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "row-user-.*"
    timeout: 20000
- tapOn:
    id: "row-user-.*"
- extendedWaitUntil:
    visible:
      id: "input-composer"
    timeout: 30000
- tapOn:
    id: "input-composer"
- inputText: "hello peer"
- hideKeyboard
- tapOn:
    id: "btn-send"
- extendedWaitUntil:
    visible: ".*before the change.*"
    timeout: 120000

- tapOn:
    id: "btn-chat-menu"
- extendedWaitUntil:
    visible:
      id: "row-verify-safety-.*"
    timeout: 20000
- tapOn:
    id: "row-verify-safety-.*"
- extendedWaitUntil:
    visible:
      id: "text-safety-number"
      text: "[0-9]{5}( [0-9]{5}){11}"
    timeout: 20000
- tapOn:
    id: "btn-verify"
    text: "Mark verified"
- extendedWaitUntil:
    visible:
      id: "btn-verify"
      text: "Verified|Remove verification"
    timeout: 15000
- tapOn:
    id: "btn-back"
- tapOn:
    id: "btn-back"
- extendedWaitUntil:
    visible:
      id: "icon-dm-verified"
    timeout: 15000
- assertNotVisible:
    id: "row-key-change-.*"
- takeScreenshot: key-change-01-verified
