appId: ${MAESTRO_APP_ID}
---
# New device, already on the manual-entry field (v1-1-new-open-manual.yaml):
# enter the v1 code a signed-in desktop is showing (#1207).
- tapOn:
    id: "input-link-code"
- inputText: ${PAYLOAD}
- tapOn:
    id: "btn-link-submit"
- extendedWaitUntil:
    visible:
      id: "linked-awaiting-approval"
    timeout: 30000
- takeScreenshot: qr-link-02-new-awaiting
