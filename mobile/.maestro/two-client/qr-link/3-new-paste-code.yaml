appId: com.pollis.mobile
---
# New device, already on the manual-entry field (3a-new-open-manual.yaml):
# enter the code the existing device is showing.
- tapOn:
    id: "input-link-code"
- inputText: ${PAYLOAD}
- tapOn:
    id: "btn-link-submit"
- extendedWaitUntil:
    visible:
      id: "linked-awaiting-approval"
    timeout: 30000
- takeScreenshot: qr-link-02-new-awaiting
