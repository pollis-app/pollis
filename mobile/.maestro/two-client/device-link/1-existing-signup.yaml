appId: com.pollis.mobile
---
- runFlow: ../../subflows/sign-in.yaml
- tapOn:
    id: "tab-groups"
- tapOn:
    id: "btn-add-group"
    optional: true
- tapOn:
    id: "btn-create-group"
- tapOn:
    id: "input-group-name"
- inputText: "Link Test Group"
- tapOn:
    id: "btn-submit-group"
# Creating lands on the Groups tab with the new group selected (pill strip +
# its channel panel, tab bar visible) — not a pushed group page. Wait for
# THIS group's panel header (the account may already have other groups).
- extendedWaitUntil:
    visible:
      id: "btn-group-menu"
      text: "Link Test Group, .*"
    timeout: 15000
- assertVisible:
    id: "panel-group"
