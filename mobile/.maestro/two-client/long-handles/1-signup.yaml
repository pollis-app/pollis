appId: ${MAESTRO_APP_ID}
tags:
  - two-client
---
# LONG HANDLES (#1971), part 1 of 3 — driven by scripts/maestro-long-handles.sh.
# Sign up a fresh account. The DS starts a new account on its email's local
# part plus a four-character suffix, capped at 32, and the script's address is
# long, so the handle is already the longest the DS allows: Profile
# shows it, 32 characters. The peers, also long-handled, then send it message
# requests and a group invite.

- runFlow: ../../subflows/sign-in.yaml
- tapOn:
    id: "tab-self"
- tapOn:
    id: "row-self-user-settings"
- extendedWaitUntil:
    visible:
      id: "screen-self-user-settings"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "input-handle"
      text: "[a-z0-9_.-]{32}"
    timeout: 30000
- takeScreenshot: long-handles-01-handle
- tapOn:
    id: "btn-back"
- extendedWaitUntil:
    visible:
      id: "screen-self"
    timeout: 15000
