appId: ${MAESTRO_APP_ID}
tags:
  - two-client
---
# LONG HANDLES (#1971), part 1 of 3 — driven by scripts/maestro-long-handles.sh.
# Sign up a fresh account and give it a 32-character handle (the DS's longest),
# ${PHONE_HANDLE}. The peers, also long-handled, then send it message requests
# and a group invite.

- runFlow: ../../subflows/sign-in.yaml
- tapOn:
    id: "tab-self"
- tapOn:
    id: "row-self-user-settings"
- extendedWaitUntil:
    visible:
      id: "screen-self-user-settings"
    timeout: 15000
- tapOn:
    id: "input-handle"
- eraseText: 40
- inputText: "${PHONE_HANDLE}"
- hideKeyboard
- assertNotVisible:
    id: "text-handle-invalid"
- tapOn:
    id: "btn-save"
# Saved: nothing is dirty any more, so Save is off again.
- extendedWaitUntil:
    visible:
      id: "btn-save"
      enabled: false
    timeout: 30000
- takeScreenshot: long-handles-01-handle-saved
- tapOn:
    id: "btn-back"
- extendedWaitUntil:
    visible:
      id: "screen-self"
    timeout: 15000
