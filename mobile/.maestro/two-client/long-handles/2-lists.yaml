appId: ${MAESTRO_APP_ID}
tags:
  - two-client
---
# LONG HANDLES (#1971), part 2 of 3. Two strangers asked to message the phone:
# A with only a 32-character handle, B with the same length of handle and the
# display name "${REQ_B_NAME}". A third, long-handled too, invited it to
# "${GROUP_NAME}".
# - Message requests: B shows by its display name, A by its handle on ONE line,
#   truncated in the middle; Block / Accept sit under the name on a phone.
# - Direct: the accepted conversation's row, same rule.
# - Members: the owner's and the phone's own long handles, one line each.
# The screenshots are the evidence; the asserts pin what Maestro can read.

- launchApp:
    stopApp: false
- runFlow:
    when:
      visible:
        id: "screen-auth-pin"
    commands:
      - runFlow: ../../subflows/enter-pin.yaml
- extendedWaitUntil:
    visible:
      id: "tab-direct"
    timeout: 30000
- tapOn:
    id: "tab-direct"
- extendedWaitUntil:
    visible:
      id: "row-dm-requests"
    timeout: 90000

# --- Message requests ---
- tapOn:
    id: "row-dm-requests"
- extendedWaitUntil:
    visible:
      id: "screen-dm-requests"
    timeout: 15000
# Both requests listed, B by its display name (the row's one spoken label).
- extendedWaitUntil:
    visible: "${REQ_B_NAME}, .*"
    timeout: 30000
- extendedWaitUntil:
    visible: "@${REQ_A_HANDLE}, .*"
    timeout: 30000
- assertVisible:
    id: "btn-accept-request-.*"
    index: 1
- assertVisible:
    id: "btn-block-request-.*"
    index: 1
- takeScreenshot: long-handles-02-requests
# Accept A: its row is the one whose label starts with the handle.
- tapOn:
    id: "btn-accept-request-.*"
    below: "@${REQ_A_HANDLE}, .*"
    index: 0
- extendedWaitUntil:
    notVisible: "@${REQ_A_HANDLE}, .*"
    timeout: 30000
- takeScreenshot: long-handles-03-request-accepted

# --- Direct ---
- tapOn:
    id: "btn-back"
- extendedWaitUntil:
    visible:
      id: "screen-direct"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "row-dm-.*"
      text: "${REQ_A_HANDLE}.*"
    timeout: 30000
- takeScreenshot: long-handles-04-direct

# --- Members ---
- tapOn:
    id: "tab-groups"
- extendedWaitUntil:
    visible:
      id: "row-invite-.*"
    timeout: 90000
- tapOn:
    id: "btn-accept-invite-.*"
- extendedWaitUntil:
    visible:
      id: "btn-group-menu"
      text: "${GROUP_NAME}, .*"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "row-group-members"
    timeout: 30000
- tapOn:
    id: "row-group-members"
- extendedWaitUntil:
    visible:
      id: "screen-group-members"
    timeout: 15000
- extendedWaitUntil:
    visible: "@${OWNER_HANDLE}, .*"
    timeout: 30000
# The device's own row: its 32-character handle, then "(you)".
- assertVisible: "@[a-z0-9_.-]{32} \\(you\\), .*"
- takeScreenshot: long-handles-05-members
- tapOn:
    id: "btn-back"
    optional: true
