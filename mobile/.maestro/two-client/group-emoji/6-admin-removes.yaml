appId: com.pollis.mobile
---
# Admin: #1280 — sees the member's emoji with a remove control, and removing
# it (two taps: arm, then confirm) takes it off the list.
- stopApp
- launchApp
- runFlow:
    when:
      visible:
        id: "screen-auth-pin"
    commands:
      - runFlow: ../../subflows/enter-pin.yaml
- extendedWaitUntil:
    visible:
      id: "tab-groups"
    timeout: 30000
- tapOn:
    id: "tab-groups"
- tapOn:
    text: "(?i).*${GROUP_NAME}.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "btn-group-menu"
      text: "${GROUP_NAME}, .*"
    timeout: 15000
- tapOn:
    id: "btn-group-menu"
- tapOn:
    id: "btn-menu-group-settings"
- tapOn:
    id: "row-group-emoji"
- assertVisible:
    id: "screen-group-emoji"
- extendedWaitUntil:
    visible:
      id: "row-emoji-e2e_member"
    timeout: 30000
- assertVisible:
    id: "btn-remove-emoji-e2e_member"
- assertNotVisible:
    id: "hint-emoji-admins-remove"
- assertVisible:
    id: "btn-upload-emoji"
- takeScreenshot: group-emoji-03-admin-sees-remove
- tapOn:
    id: "btn-remove-emoji-e2e_member"
- tapOn:
    id: "btn-remove-emoji-e2e_member"
- extendedWaitUntil:
    notVisible:
      id: "row-emoji-e2e_member"
    timeout: 20000
- takeScreenshot: group-emoji-04-admin-removed
