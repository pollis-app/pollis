appId: com.pollis.mobile
---
# Peer (a plain MEMBER after join-request 1-4): #1280 — may add a custom emoji,
# and gets no remove control for it, not even on the one they just added.
#
# The image goes through the SYSTEM photo picker (as in flows/media-viewer.yaml):
# `addMedia` seeds the library, and the picker tap differs per OS. The picker is
# single-select here, so a tap on a cell returns straight to the app.
- tapOn:
    id: "tab-groups"
- tapOn:
    text: "(?i).*${GROUP_NAME}.*"
    index: 0
- extendedWaitUntil:
    visible:
      id: "btn-group-menu"
      text: "${GROUP_NAME}, .*"
    timeout: 15000
- tapOn:
    id: "btn-group-menu"
- tapOn:
    id: "btn-menu-group-settings"
- assertVisible:
    id: "screen-group-settings"
- tapOn:
    id: "row-group-emoji"
- assertVisible:
    id: "screen-group-emoji"
# A member sees the add form (it used to be admin-only on mobile).
- assertVisible:
    id: "input-emoji-shortcode"
- assertVisible:
    id: "btn-upload-emoji"
- takeScreenshot: group-emoji-01-member-add-form

- tapOn:
    id: "input-emoji-shortcode"
- inputText: "e2e_member"
- hideKeyboard
- addMedia:
    - "../../fixtures/media-viewer.png"
- tapOn:
    id: "btn-upload-emoji"
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Photo, .*"
          index: 0
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          point: "16%,61%"
- extendedWaitUntil:
    visible:
      id: "row-emoji-e2e_member"
    timeout: 60000
# The creator is a plain member, so there is no remove control on their own
# emoji, and the page says why.
- assertNotVisible:
    id: "btn-remove-emoji-e2e_member"
- assertVisible:
    id: "hint-emoji-admins-remove"
- takeScreenshot: group-emoji-02-member-added-no-remove
