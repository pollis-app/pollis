appId: com.pollis.mobile
---
# Admin: the request shows on the Groups tab (row + header badge); approve it.
- stopApp
- launchApp
- runFlow:
    when:
      visible:
        id: "screen-auth-pin"
    commands:
      - runFlow: ../../subflows/enter-pin.yaml
- extendedWaitUntil:
    visible:
      id: "tab-groups"
    timeout: 30000
- tapOn:
    id: "tab-groups"
- extendedWaitUntil:
    visible:
      id: "row-join-requests-.*"
    timeout: 30000
- assertVisible:
    id: "badge-join-requests-.*"
- takeScreenshot: join-02-requests-on-groups-tab
- tapOn:
    id: "row-join-requests-.*"
- assertVisible:
    id: "screen-group-requests"
- tapOn:
    id: "btn-approve-.*"
- extendedWaitUntil:
    notVisible:
      id: "btn-approve-.*"
    timeout: 20000
- takeScreenshot: join-03-approved
