appId: com.pollis.mobile
---
# Admin: create a group, then reach it from the Groups tab's group pill strip
# (no channel). A pill (row-group-<id>) switches the panel in place on the tab
# — it does not push group/[id] — so the anchor is panel-group, not screen-group.
# The pill id is matched as a 26-char ULID so the regex cannot also hit the
# panel's own row-group-members / -invite / -settings / -requests.
- runFlow: ../../subflows/sign-in.yaml
- tapOn:
    id: "tab-groups"
- tapOn:
    id: "btn-add-group"
    optional: true
- tapOn:
    id: "btn-create-group"
- tapOn:
    id: "input-group-name"
- inputText: "${GROUP_NAME}"
- tapOn:
    id: "btn-submit-group"
# Creating lands on the Groups tab with the new group selected (pill strip +
# its channel panel, tab bar visible) — not a pushed group page. Wait for
# THIS group's panel header (the account may already have other groups).
- extendedWaitUntil:
    visible:
      id: "btn-group-menu"
      text: "${GROUP_NAME}, .*"
    timeout: 15000
- assertVisible:
    id: "panel-group"
- tapOn:
    id: "row-group-[0-9A-Z]{26}"
- assertVisible:
    id: "panel-group"
- takeScreenshot: join-01-group-from-header
