appId: ${MAESTRO_APP_ID}
tags:
  - two-client
---
# PRESENCE (#2059), last part. The script has stopped the peer: its session
# leaves the DM's room, and the row's dot turns hollow with no reload.

- extendedWaitUntil:
    visible:
      id: "presence-offline-row-dm-.*-avatar"
    timeout: 60000
- assertNotVisible:
    id: "presence-online-row-dm-.*-avatar"
- takeScreenshot: presence-two-05-peer-offline
