appId: ${MAESTRO_APP_ID}
tags:
  - two-client
---
# HISTORY TRANSFER (#1735), part 3 — Security lists the approval among the events
# and offers "Copy message history" with both of the account's other devices.
- tapOn:
    id: "tab-self"
- tapOn:
    id: "row-self-security"
- extendedWaitUntil:
    visible:
      id: "screen-self-security"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: "Message history shared"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "row-copy-history"
    direction: UP
    timeout: 30000
- tapOn:
    id: "row-copy-history"
- extendedWaitUntil:
    visible:
      id: "screen-history-transfer"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "history-transfer-sources"
    timeout: 30000
- takeScreenshot: history-transfer-07-picker
