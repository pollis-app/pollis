appId: ${MAESTRO_APP_ID}
tags:
  - two-client
---
# HISTORY TRANSFER (#1735), part 4 — Security lists the approval among the events
# and offers "Copy message history" with both of the account's other devices.
# Back out of #General to the tabs first.
- repeat:
    times: 4
    while:
      notVisible:
        id: "tab-self"
    commands:
      - tapOn:
          id: "btn-back"
- extendedWaitUntil:
    visible:
      id: "tab-self"
    timeout: 15000
- tapOn:
    id: "tab-self"
- tapOn:
    id: "row-self-security"
- extendedWaitUntil:
    visible:
      id: "screen-self-security"
    timeout: 15000
- scrollUntilVisible:
    element:
      text: ".*Message history shared.*"
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "row-copy-history"
    direction: UP
    timeout: 30000
- tapOn:
    id: "row-copy-history"
- extendedWaitUntil:
    visible:
      id: "screen-history-transfer"
    timeout: 15000
# The page leads with the copy part 1 finished (its outcome stays until Done).
- assertVisible: "Copied [0-9]+ messages\\."
- tapOn:
    id: "btn-history-done"
- extendedWaitUntil:
    visible:
      id: "history-transfer-sources"
    timeout: 30000
- takeScreenshot: history-transfer-07-picker
