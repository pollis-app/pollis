appId: ${MAESTRO_APP_ID}
tags:
  - two-client
---
# SHARED FILE (#2109), part 2 of 3 — driven by scripts/maestro-shared-file.sh.
# Part 1 is ../pins/1-open-dm.yaml (sign up, open a DM with the peer). This
# device sends a photo; the peer opens it and sends the very same bytes back.
# No relaunch: the session from part 1 is still on screen. Re-open the DM first,
# so this device has caught up on the peer's join and its greeting.

- tapOn:
    id: "btn-back"
- tapOn:
    id: "tab-direct"
- extendedWaitUntil:
    visible:
      text: ".*${MAESTRO_PEER_HANDLE}.*"
    timeout: 30000
- tapOn:
    text: ".*${MAESTRO_PEER_HANDLE}.*"
- extendedWaitUntil:
    visible: ".*ready for your photo.*"
    timeout: 90000

- addMedia:
    - "../../fixtures/media-viewer.png"
- runFlow: ../../subflows/pick-newest-photo.yaml
- tapOn:
    id: "btn-send"
- extendedWaitUntil:
    visible:
      id: "btn-attachment-.*"
    timeout: 60000
- extendedWaitUntil:
    notVisible:
      id: "row-message-pending-.*"
    timeout: 150000
- takeScreenshot: shared-file-01-sent
