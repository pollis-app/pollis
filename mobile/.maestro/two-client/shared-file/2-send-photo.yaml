appId: ${MAESTRO_APP_ID}
tags:
  - two-client
---
# SHARED FILE (#2109), part 2 of 3 — driven by scripts/maestro-shared-file.sh.
# Part 1 is ../pins/1-open-dm.yaml (sign up, open a DM with the peer). This
# device sends a photo; the peer opens it and sends the very same bytes back.
# No relaunch: the session from part 1 is still on screen.

- addMedia:
    - "../../fixtures/media-viewer.png"
- tapOn:
    id: "btn-attach"
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      true: ${IPAD == "1"}
    file: ../../subflows/ipad-pick-photos.yaml
    env:
      CELLS: "1"
      CONFIRM: "1"
- runFlow:
    when:
      true: ${IPAD != "1"}
    commands:
      - tapOn:
          text: "Photo(,| taken on) .*"
          index: 0
      - tapOn:
          text: "(?i)(add|done).*"
- extendedWaitUntil:
    visible:
      id: "strip-attachments"
    timeout: 10000
- tapOn:
    id: "btn-send"
- extendedWaitUntil:
    visible:
      id: "btn-attachment-.*"
    timeout: 60000
- extendedWaitUntil:
    notVisible:
      id: "row-message-pending-.*"
    timeout: 150000
- takeScreenshot: shared-file-01-sent
