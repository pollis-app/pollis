appId: ${MAESTRO_APP_ID}
tags:
  - two-client
---
# PROFILE CHANGE (#2084), part 1 of 2 — driven by scripts/maestro-profile-change.sh.
# Sign up a fresh account. The peer created ${GROUP_NAME} and invites this account;
# accept, open #General and read the peer's message under its current handle. The
# app stays on this screen for part 2.

- runFlow: ../../subflows/sign-in.yaml
- tapOn:
    id: "tab-groups"
- extendedWaitUntil:
    visible:
      id: "row-invite-.*"
    timeout: 60000
    optional: true
- runFlow:
    when:
      notVisible:
        id: "row-invite-.*"
    commands:
      - stopApp
      - launchApp
      - runFlow:
          when:
            visible:
              id: "screen-auth-pin"
          commands:
            - runFlow: ../../subflows/enter-pin.yaml
      - extendedWaitUntil:
          visible:
            id: "tab-groups"
          timeout: 30000
      - tapOn:
          id: "tab-groups"
      - extendedWaitUntil:
          visible:
            id: "row-invite-.*"
          timeout: 60000
- tapOn:
    id: "btn-accept-invite-.*"
- extendedWaitUntil:
    visible: "General"
    timeout: 30000
- tapOn: "General"
- extendedWaitUntil:
    visible:
      id: "input-composer"
    timeout: 30000
- extendedWaitUntil:
    visible: "${MAESTRO_PEER_HANDLE}: hello before the rename.*"
    timeout: 120000
- takeScreenshot: profile-change-01-before
