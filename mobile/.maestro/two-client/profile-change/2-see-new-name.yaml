appId: ${MAESTRO_APP_ID}
tags:
  - two-client
---
# PROFILE CHANGE (#2084), part 2 of 2 — driven by scripts/maestro-profile-change.sh.
# The app is still on #General from part 1 (no relaunch). The peer has changed its
# handle to ${NEW_HANDLE} and its display name to ${NEW_NAME}: the old message's
# sender label follows within seconds, and so does the member list.

- extendedWaitUntil:
    visible: "${NEW_HANDLE}: hello before the rename.*"
    timeout: 30000
- assertNotVisible: "${MAESTRO_PEER_HANDLE}: hello before the rename.*"
- takeScreenshot: profile-change-02-after
- tapOn:
    id: "btn-back"
- tapOn:
    id: "row-group-members"
- extendedWaitUntil:
    visible:
      id: "row-member-${MAESTRO_PEER_ID}"
    timeout: 30000
- assertVisible:
    id: "row-member-${MAESTRO_PEER_ID}"
    text: "${NEW_NAME}, @${NEW_HANDLE} · .*"
- takeScreenshot: profile-change-03-members
