appId: ${MAESTRO_APP_ID}
tags:
  - two-client
---
# A request filed while the app was in the background: returning to the
# foreground must surface it. This one is rejected, which the peer reports.
- launchApp:
    stopApp: false
# Auto-lock may have engaged while away; unlock if so.
- runFlow:
    when:
      visible:
        id: "screen-auth-pin"
    commands:
      - runFlow: ../../subflows/enter-pin.yaml
- extendedWaitUntil:
    visible:
      id: "screen-approve-device"
    timeout: 60000
- takeScreenshot: approval-prompt-03-after-resume
- tapOn:
    id: "btn-reject-device"
- extendedWaitUntil:
    notVisible:
      id: "screen-approve-device"
    timeout: 30000
