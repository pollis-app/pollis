appId: com.apple.mobileslideshow
---
# iOS share extension (#2100), after ios-1-pin: the Vault and #General, Send. The sheet sends in
# place (busy at once, never twice) and closes once every target is stored and sent; a target it
# could not finish says the app will. No typing here: once the keyboard has been up in a share
# extension, the test driver stops seeing the extension's elements (the message field is covered
# by the Safari run, where the shared link fills it).
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "share-target-0"
- tapOn:
    id: "share-target-1"
- takeScreenshot: share-ios-03-selected-${TAG}
- tapOn:
    id: "share-send"
- takeScreenshot: share-ios-04-sending-${TAG}
- extendedWaitUntil:
    notVisible:
      id: "share-send"
    timeout: 90000
- takeScreenshot: share-ios-05-after-send-${TAG}
