appId: com.apple.mobileslideshow
---
# Open Pollis's share sheet from Photos on a photo (#2100). The script added the photo first
# (`simctl addmedia`).
- launchApp:
    appId: com.apple.mobileslideshow
    stopApp: true
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
# Photos reopens where it was left: in the grid a tap opens a photo; in a photo with its
# controls hidden a tap brings them back.
- waitForAnimationToEnd:
    timeout: 3000
- repeat:
    while:
      notVisible: "Share"
    times: 4
    commands:
      - tapOn:
          point: "50%,45%"
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible: "Share"
    timeout: 10000
- tapOn: "Share"
- extendedWaitUntil:
    visible:
      id: "shareCell"
      text: "Pollis"
    timeout: 15000
- takeScreenshot: share-ios-photos-sheet
# The share sheet's app cell, not a "pollis" on the page behind it.
- tapOn:
    id: "shareCell"
    text: "Pollis"
