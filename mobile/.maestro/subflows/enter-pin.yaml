appId: com.pollis.mobile
---
# Enter the 4-digit device PIN on the keypad. testIDs are value-keyed
# (btn-pin-<digit>), so these taps type "1234" — keep in sync with
# env.example's MAESTRO_PIN. Called twice by sign-in (create + confirm); the
# keypad auto-advances the stage once 4 digits are entered.
- tapOn:
    id: "btn-pin-1"
- tapOn:
    id: "btn-pin-2"
- tapOn:
    id: "btn-pin-3"
- tapOn:
    id: "btn-pin-4"
