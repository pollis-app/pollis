appId: ${MAESTRO_APP_ID}
---
# i18n.yaml's onFlowComplete (#1949): put the app back in English after a run
# that stopped in another language. The choice lives in the iOS keychain,
# which clearState does not wipe, so without this every later flow in
# `maestro-run.sh all ios` runs in that language. Every step is optional: a run
# that failed before sign-in has nothing to restore, and that failure is the
# one to report.
# Usually the Language page is still up: probe-shown returns at once then,
# where a `when: notVisible:` waited ~7 s for the radio to go (#2042).
- runFlow:
    file: probe-shown.yaml
    env:
      ID: "radio-language-en"
- runFlow:
    when:
      true: ${!output.shown}
    commands:
      - stopApp
      - launchApp
      - runFlow:
          when:
            visible:
              id: "screen-auth-pin"
          commands:
            - runFlow: enter-pin.yaml
      - extendedWaitUntil:
          visible:
            id: "tab-self"
          timeout: 30000
          optional: true
      - tapOn:
          id: "tab-self"
          optional: true
      - tapOn:
          id: "row-self-language"
          optional: true
      - waitForAnimationToEnd
- tapOn:
    id: "radio-language-en"
    optional: true
