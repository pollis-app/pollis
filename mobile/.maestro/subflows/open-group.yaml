appId: ${MAESTRO_APP_ID}
---
# Select the group named ${GROUP} on the Groups tab (#2029). After a relaunch
# the tab reselects the last group this account used (components/groups/
# lastGroup.ts), so usually there is nothing to tap. A text tap on the name is
# never safe there: the selected group's menu button (`btn-group-menu`, label
# "<name>, group menu…") matches it too and opens the menu sheet. So only an
# unselected pill is tapped, by its exact label, and only when needed.
- tapOn:
    id: "tab-groups"
- extendedWaitUntil:
    visible:
      id: "btn-group-menu"
    timeout: 30000
# subflows/probe-shown.yaml, inlined for the text match: it returns at once
# when the group is already selected, where a `when: notVisible:` waited ~7 s
# for its menu button to go before skipping (#2042).
- evalScript: ${output.groupSelected = false}
- runFlow:
    when:
      visible:
        id: "btn-group-menu"
        text: "${GROUP}, .*"
    commands:
      - evalScript: ${output.groupSelected = true}
- runFlow:
    when:
      true: ${!output.groupSelected}
    commands:
      - tapOn:
          id: "row-group-.*"
          text: "${GROUP}"
- extendedWaitUntil:
    visible:
      id: "btn-group-menu"
      text: "${GROUP}, .*"
    timeout: 30000
