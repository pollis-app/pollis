appId: ${MAESTRO_APP_ID}
---
# Rapid send (#1636): create the group ${GROUP} (#General on) and open General.
- tapOn:
    id: "tab-groups"
- assertVisible:
    id: "screen-groups"
- runFlow: open-create-group.yaml
- tapOn:
    id: "toggle-general-channel"
- tapOn:
    id: "input-group-name"
- inputText: "${GROUP}"
- tapOn:
    id: "btn-submit-group"
# ${GROUP} is this subflow's own argument; the wait reads the same one.
- runFlow: group-created.yaml
- tapOn:
    text: "General"
    optional: true
- assertVisible:
    id: "screen-chat"
