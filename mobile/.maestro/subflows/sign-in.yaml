appId: ${MAESTRO_APP_ID}
---
# Reusable fresh sign-in: email -> OTP -> create PIN (x2) -> land on the tabs.
# Assumes a disposable dev-DS account (first run signs it up). Reads
# ${MAESTRO_EMAIL}, ${MAESTRO_OTP}, ${MAESTRO_PIN} from the runner's -e env.
#
# NOTE (Mac operator): this box could not RUN Maestro, so timing/branch steps
# are authored best-effort against the real testIDs. On the first run, confirm
# the PIN keypad auto-advances at 4 digits and whether an emergency-kit screen
# appears; adjust the `optional` steps if needed.

# KEEP_STATE=true skips the wipe for a caller that prepared the app itself
# (locale-smoke: Android's per-app language is cleared by clearState).
- runFlow:
    when:
      true: ${typeof KEEP_STATE === 'undefined' || KEEP_STATE !== 'true'}
    commands:
      - clearState
- launchApp

# --- Email ---
- assertVisible:
    id: "screen-auth-email"
# FRESH=<name> signs up a brand-new address (fresh-email.yaml) instead of
# MAESTRO_EMAIL, which maestro-run.sh keeps for the run's shared account (#2029).
- runFlow:
    when:
      true: ${typeof FRESH !== 'undefined' && FRESH !== ''}
    file: fresh-email.yaml
- tapOn:
    id: "input-email"
- inputText: "${(typeof FRESH !== 'undefined' && FRESH !== '') ? output.freshEmail : MAESTRO_EMAIL}"
- tapOn:
    id: "btn-submit-email"

# --- OTP ---
# request-otp is a DS round trip (plus the Resend send when DEV_OTP is unset);
# with three suites in flight it can outlast assertVisible's default wait.
- extendedWaitUntil:
    visible:
      id: "screen-auth-otp"
    timeout: 20000
# input-otp is an opacity:0 proxy over the 6 visual boxes, autoFocus'd on
# mount — Maestro can't tapOn a non-hittable element, but it's already
# focused, so inputText alone reaches it.
- inputText: "${MAESTRO_OTP}"
- tapOn:
    id: "btn-submit-otp"

# --- PIN (new device): enter, then confirm. Keypad auto-advances at 4 digits.
# The taps below assume MAESTRO_PIN=1234; keep them in sync with env.example.
- extendedWaitUntil:
    visible:
      id: "screen-auth-pin"
    timeout: 15000
- runFlow: enter-pin.yaml
- runFlow: enter-pin.yaml

# --- Optional emergency-kit acknowledgement (first signup only) ---
# Mounts asynchronously after PIN confirm (key generation) — `runFlow: when:`
# checks visibility once, immediately, so it needs a real wait first or it
# skips a screen that's still one frame away.
- extendedWaitUntil:
    visible:
      id: "screen-auth-emergency-kit"
    # Key generation can outlast 15 s on a loaded machine; a late kit screen
    # then slipped past the `when` below and failed the sign-in.
    timeout: 40000
    optional: true
- runFlow:
    when:
      visible:
        id: "screen-auth-emergency-kit"
    commands:
      - tapOn:
          id: "toggle-recovery-ack"
      - tapOn:
          id: "btn-continue"

# --- Optional "initializing" continue (it usually auto-advances) ---
# The emergency kit's Continue pushes away with an animation, during which its
# own btn-continue is still on screen: without this wait the conditional below
# matches the OUTGOING button and its tap lands on the incoming tab bar (on
# iPad, bottom centre is the sign-in-device shield). Settle first.
# The settle alone stopped being enough on iPad once unlock got faster
# (#1982): wait for the kit screen to be gone, and only ever tap the
# Continue that belongs to the initializing screen.
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    notVisible:
      id: "screen-auth-emergency-kit"
    timeout: 10000
    optional: true
- runFlow:
    when:
      visible:
        id: "screen-auth-initializing"
    commands:
      # optional: initializing often auto-advances between the visibility
      # check and the tap, and a vanished button is not a failed sign-in.
      - tapOn:
          id: "btn-continue"
          childOf:
            id: "screen-auth-initializing"
          optional: true

# --- Landed on the tabs ---
# Assert the TAB BAR, not a particular tab. `initializing.tsx` replaces to
# `/(tabs)/groups`, but the app was observed landing on Self (and, on iPad
# under iOS 27, Search) after sign-in — most likely the stray Continue tap the
# waitForAnimationToEnd above now prevents — and a subflow whose job is "we are
# signed in and inside the tab navigator" should not also be the thing that
# encodes which tab wins that race. Flows that need a specific tab tap it.
- extendedWaitUntil:
    visible:
      id: "tab-groups"
    timeout: 30000
