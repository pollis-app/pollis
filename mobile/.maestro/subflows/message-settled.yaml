appId: ${MAESTRO_APP_ID}
---
# Wait until the message just sent has settled: no row still "sending", and
# none left "Not sent". A send that hit a transient DS connection error stays
# failed until something wakes the outbox (it never retries on a timer), and
# its Retry / Discard block makes the row taller, which moves the row's centre,
# where a text selector taps, off the text. So press Retry once if it shows,
# as outbox.yaml does, and require the row to settle.
#
# The 150 s is a ceiling, not a delay (the step ends when the row settles). A
# new group's first send pays for the MLS group setup, and against the dev DS,
# where each database query costs about 150 ms, that send can stay "sending"
# for more than 30 s (#1893).
- extendedWaitUntil:
    notVisible: ".*, sending"
    timeout: 150000
# Usually nothing failed: subflows/probe-absent.yaml returns at once then,
# where a `when: visible:` miss cost ~7 s (#2042).
- runFlow:
    file: probe-absent.yaml
    env:
      ID: "btn-retry-message-.*"
- runFlow:
    when:
      true: ${!output.absent}
    commands:
      - tapOn:
          id: "btn-retry-message-.*"
          optional: true
- extendedWaitUntil:
    notVisible:
      id: "btn-retry-message-.*"
    timeout: 60000
- extendedWaitUntil:
    notVisible: ".*, sending"
    timeout: 150000
