appId: ${MAESTRO_APP_ID}
---
# Open "Create group" (screen-group-new) by its route. On the run's shared
# account (#2029) the Groups tab's pill strip holds every group the earlier
# flows made, and its "+" (btn-add-group) sits at the strip's end, past the
# screen edge. groups.yaml still drives the "+" sheet itself.
- openLink: "pollis://group/new"
- extendedWaitUntil:
    visible:
      id: "screen-group-new"
    timeout: 5000
    optional: true
# iOS may ask before an app opens its own scheme from outside.
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- extendedWaitUntil:
    visible:
      id: "screen-group-new"
    timeout: 15000
