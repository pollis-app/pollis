appId: ${MAESTRO_APP_ID}
---
# Long-press a message row to open its action sheet (react/edit/delete).
# The very first long-press attempt in a flow is observed to occasionally
# not register the gesture (app is mid-layout-shift right after a message
# settles) even though the identical gesture succeeds immediately on retry
# — so try up to 3 times rather than trust a single attempt. Unrolled
# (not `repeat:`) since `repeat: times:` did not reliably iterate here.
#
# Each retry is gated on the sheet NOT being up. The check is "is btn-edit
# shown" (subflows/probe-shown.yaml), which returns at once when the first
# press worked, the usual case. A `when: notVisible: btn-edit` there waited
# ~7 s for the open sheet to go before skipping, on every use (#2042).
- runFlow:
    when:
      notVisible:
        id: "btn-edit"
    commands:
      - longPressOn:
          id: "row-message-.*"
      - extendedWaitUntil:
          visible:
            id: "btn-edit"
          timeout: 4000
          optional: true
- runFlow:
    file: probe-shown.yaml
    env:
      ID: "btn-edit"
- runFlow:
    when:
      true: ${!output.shown}
    commands:
      - longPressOn:
          id: "row-message-.*"
      - extendedWaitUntil:
          visible:
            id: "btn-edit"
          timeout: 4000
          optional: true
- runFlow:
    file: probe-shown.yaml
    env:
      ID: "btn-edit"
- runFlow:
    when:
      true: ${!output.shown}
    commands:
      - longPressOn:
          id: "row-message-.*"
      - extendedWaitUntil:
          visible:
            id: "btn-edit"
          timeout: 4000
          optional: true
