// Generated by uniffi-bindgen-react-native, then extended for #1599 (see the
// end of `dependencies`). Listed in ubrn.config.yaml `noOverwrite`.

buildscript {
  // Buildscript is evaluated before everything else so we can't use getExtOrDefault
  def kotlin_version = rootProject.ext.has("kotlinVersion") ? rootProject.ext.get("kotlinVersion") : project.properties["DummyLibForAndroid_kotlinVersion"]

  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:7.2.1"
    // noinspection DifferentKotlinGradleVersion
    classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

if (isNewArchitectureEnabled()) {
  apply plugin: "com.facebook.react"
}

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["PollisNative_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["PollisNative_" + name]).toInteger()
}

def supportsNamespace() {
  def parsed = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')
  def major = parsed[0].toInteger()
  def minor = parsed[1].toInteger()

  // Namespace support was added in 7.3.0
  return (major == 7 && minor >= 3) || major >= 8
}

android {
  if (supportsNamespace()) {
    namespace "com.pollisnative"

    sourceSets {
      main {
        manifest.srcFile "src/main/AndroidManifestNew.xml"
      }
    }
  }

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdkVersion getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdkVersion getExtOrIntegerDefault("minSdkVersion")
    targetSdkVersion getExtOrIntegerDefault("targetSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
    consumerProguardFiles 'proguard-rules.pro'

    buildFeatures {
      prefab true
    }
    externalNativeBuild {
      cmake {
        // #2189: export only the JNI entry points (exports.map), so the linker can drop what
        // nothing reaches and the loader resolves a handful of symbols, not ~74,000. Passed
        // from here, not CMakeLists.txt, because ubrn regenerates that file; the generated
        // CMakeLists.txt appends its own flags to CMAKE_SHARED_LINKER_FLAGS, keeping this one.
        arguments '-DANDROID_STL=c++_shared',
                  "-DCMAKE_SHARED_LINKER_FLAGS=-Wl,--version-script=${projectDir}/exports.map"
        abiFilters (*reactNativeArchitectures())
      }
    }
    ndk {
      abiFilters "arm64-v8a", "armeabi-v7a", "x86_64"
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  buildFeatures {
    buildConfig true
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  lintOptions {
    disable "GradleCompatible"
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_1_8
    targetCompatibility JavaVersion.VERSION_1_8
  }

  sourceSets {
    main {
      if (isNewArchitectureEnabled()) {
          java.srcDirs += [
            "generated/java",
            "generated/jni"
          ]
      }
    }
  }
}

repositories {
  mavenCentral()
  google()
}

def kotlin_version = getExtOrDefault("kotlinVersion")

dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
  implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

  // #1599 rich push (PollisMessagingService): it subclasses expo-notifications'
  // FCM service, so everything that is not ours still reaches expo unchanged.
  // Versions match what expo-notifications 57 itself declares. compileOnly: the
  // app already links expo-notifications (autolinking, as the precompiled AAR
  // from its local-maven-repo, or as a source project when built from source).
  if (rootProject.findProject(":expo-notifications") != null) {
    compileOnly project(":expo-notifications")
  } else {
    compileOnly "host.exp.exponent:expo.modules.notifications:+"
  }
  implementation "com.google.firebase:firebase-messaging:25.0.1"
  implementation "androidx.core:core:1.17.0"
  testImplementation "junit:junit:4.13.2"
  // android.jar's org.json is a stub under JVM unit tests.
  testImplementation "org.json:json:20240303"
}

if (isNewArchitectureEnabled()) {
  react {
    jsRootDir = file("../src/")
    libraryName = "PollisNative"
    codegenJavaPackageName = "com.pollisnative"
  }
}

// #2189: the built libpollis-native.so must export every JNI entry point the app and the push
// process call, and almost nothing else (exports.map). A missing JNI_OnLoad breaks PIN unlock
// (android_kek never gets the JavaVM); a missing Java_* entry point fails its `external fun`.
// Checked on the library each native build links, so a regression fails the build, CI included.
def pollisRequiredExports = [
  "JNI_OnLoad",
  "Java_com_pollisnative_PollisNativeModule_nativeInstallRustCrate",
  "Java_com_pollisnative_PollisNativeModule_nativeCleanupRustCrate",
  "Java_com_pollisnative_PollisNotify_nativeFetch",
  "Java_com_pollisnative_PollisNotify_nativeNote",
  "Java_com_pollisnative_PollisNotify_nativeSettle",
]
// The required six plus a little room; without the version script it is ~74,000.
def pollisMaxExports = 16

def pollisReadelf = {
  def prebuilt = new File(android.ndkDirectory, "toolchains/llvm/prebuilt")
  def host = prebuilt.listFiles()?.find { it.isDirectory() }
  if (host == null) {
    throw new GradleException("verifyPollisNativeExports: no NDK prebuilt toolchain under ${prebuilt}")
  }
  def exe = new File(host, "bin/llvm-readelf")
  return exe.exists() ? exe : new File(host, "bin/llvm-readelf.exe")
}

def pollisVerifyExports = { File so ->
  def proc = new ProcessBuilder(pollisReadelf().absolutePath, "--dyn-syms", "--wide", so.absolutePath)
    .redirectErrorStream(true)
    .start()
  def text = proc.inputStream.text
  if (proc.waitFor() != 0) {
    throw new GradleException("verifyPollisNativeExports: llvm-readelf failed on ${so}:\n${text}")
  }
  // `Num: Value Size Type Bind Vis Ndx Name`: a defined GLOBAL or WEAK symbol is an export.
  def exported = text.readLines()
    .collect { it.trim().split(/\s+/) }
    .findAll { it.length >= 8 && it[0].endsWith(":") && it[6] != "UND" && (it[4] == "GLOBAL" || it[4] == "WEAK") }
    .collect { it[7].replaceAll(/@.*$/, "") }
    .toSet()
  def missing = pollisRequiredExports.findAll { !exported.contains(it) }
  if (!missing.isEmpty()) {
    throw new GradleException("verifyPollisNativeExports: ${so} does not export ${missing} (see exports.map)")
  }
  if (exported.size() > pollisMaxExports) {
    throw new GradleException("verifyPollisNativeExports: ${so} exports ${exported.size()} symbols, more than ${pollisMaxExports}; is exports.map passed to the link?")
  }
  logger.lifecycle("verifyPollisNativeExports: ${so.parentFile.name}/${so.name} exports ${exported.sort()}")
}

// AGP links each ABI in `buildCMake<Config>[<abi>]`; check that ABI's library right after.
tasks.configureEach { task ->
  def m = task.name =~ /^buildCMake(\w+)\[(.+)\]$/
  if (m.matches()) {
    def config = m.group(1)
    def abi = m.group(2)
    task.doLast {
      // The newest library for the ABI: a changed CMake argument links into a new hash
      // directory and leaves the old one behind.
      def root = new File(layout.buildDirectory.get().asFile, "intermediates/cxx/${config}")
      def libs = fileTree(root) { include "*/obj/${abi}/libpollis-native.so" }.files
      if (libs.isEmpty()) {
        throw new GradleException("verifyPollisNativeExports: no ${abi} libpollis-native.so under ${root}")
      }
      pollisVerifyExports(libs.max { it.lastModified() })
    }
  }
}
