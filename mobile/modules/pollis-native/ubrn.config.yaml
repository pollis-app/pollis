rust:
  directory: ../../../pollis-core
  manifestPath: Cargo.toml

android:
  jniLibs: android/src/main/jniLibs
  # Mobile drops the desktop media stack + OS-keychain feature (uses its own
  # ios_kek/android_kek path instead — see pollis-core/Cargo.toml's `media`/
  # `os-keystore` default-feature comments). Without this, default features
  # pull in webrtc-audio-processing, which is target-gated out on
  # android/ios and fails to compile.
  cargoExtras: ["--no-default-features"]
  targets:
    - arm64-v8a
    - armeabi-v7a
    - x86_64

ios:
  # The `--config env.…` pair pins the iOS deployment target for these cargo
  # invocations only. rustc defaults `*-apple-ios` to a 10.0 min-version while
  # cc-rs builds the vendored OpenSSL + SQLCipher against the current iPhoneOS
  # SDK; linking those objects at 10.0 dies on `___chkstk_darwin` (a libSystem
  # stub that only exists from iOS 12), release-only (#1007). It must NOT move
  # to the global [env] table of .cargo/config.toml — there it retargets macOS
  # desktop builds to iPhone (see the warning in that file). This value is the
  # single checked-in source of truth: ios-check in mobile-core-check.yml reads
  # it from here and asserts it reaches the built artifact. Keep it in lockstep
  # with the Expo-generated Podfile's `platform :ios`.
  cargoExtras: ["--no-default-features", "--config", 'env.IPHONEOS_DEPLOYMENT_TARGET="15.1"']
  targets:
    - aarch64-apple-ios
    - aarch64-apple-ios-sim
    - x86_64-apple-ios

bindings:
  cpp: cpp
  ts: src/generated
