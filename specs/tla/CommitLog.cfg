\* Default (SOUND) configuration for Spec A -- CommitLog / epoch machine.
\* Small exhaustive config: 3 clients racing at a head, 2 commit appends, 3
\* epochs, and 2 suite lineages (generations 0 and 1). TLC explores the full
\* reachable state space (~72k states, ~20s) and every invariant must PASS -- a
\* definitive PR gate.
\*
\* `MaxGen = 1` is the smallest setting that exercises #454 P4 at all: one
\* conversation, one migration, and the full race between another client's
\* Submit and the migrator's compare-and-swap. `MaxGen = 0` disables migration
\* entirely and recovers the pre-P4 spec action for action -- which is how the
\* model shows P4 ADDS behaviour rather than changing it.
\*
\* WHY MaxCommits DROPPED FROM 3 TO 2 WHEN P4 LANDED. Generations multiply the
\* per-client `adopted` map (now [Gens -> [Epochs -> seq]]) and add the migrator's
\* in-flight `pending` slot, so the same 3/3/3 bounds that ran in seconds pre-P4
\* now take ~15 minutes -- past the point where a blocking PR check stays useful.
\* Two appends is still enough for every property to have real content: a fork
\* needs two commits at one epoch, and the migration race needs one racing Submit
\* plus one opening commit. The deeper sweep (MaxCommits = 3, and MaxGen = 2 for
\* consecutive migrations) belongs out-of-band, per design doc §3: "CI runs TLC
\* on the small config as a fast gate, a larger config on a schedule".
SPECIFICATION Spec

CONSTANTS
    Keys = {k1}
    Clients = {c1, c2, c3}
    MaxCommits = 2
    MaxEpoch = 3
    MaxGen = 1
    SoundSubmit = TRUE
    SoundMigrate = TRUE

INVARIANTS
    TypeOK
    OnePerEpoch
    Gapless
    OpeningClosesTheHead
    NoForeignAdopt

PROPERTIES
    LineageMonotone
