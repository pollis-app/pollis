\* NEGATIVE / TEETH configuration for Spec A -- the #454 P4 suite migration.
\* Identical to CommitLog.cfg EXCEPT `SoundMigrate = FALSE`, which DROPS the
\* compare-and-swap in the DS's second accepting branch: a migrator is allowed
\* to open generation N+1 while naming a head epoch of generation N that has
\* since moved on.
\*
\* The counterexample is short and is the exact failure the CAS exists to
\* prevent. c1 drains generation 0 and reads its head. Before c1's opening
\* commit lands, c2 submits one more commit into generation 0. c1 then opens
\* generation 1 declaring the STALE head as closed -- and c2's commit is
\* ORPHANED: it sits in a lineage every device is about to abandon, its
\* messages readable by nobody who moved on, and no other rule in the system
\* notices. Both lineages remain individually well-formed (gapless, one commit
\* per epoch, monotone key), which is precisely why "the generation must
\* increase" is NOT sufficient and OpeningClosesTheHead has to be checked
\* separately.
\*
\* The submit guard stays SOUND here so the violation is unambiguously the
\* migration CAS's; `CommitLogBroken.cfg` is the mirror-image teeth config for
\* the conditional insert.
\*
\* Expected result: TLC FAILS here ("Invariant OpeningClosesTheHead is
\* violated"). The committed default (CommitLog.cfg) passes clean.
SPECIFICATION Spec

CONSTANTS
    Keys = {k1}
    Clients = {c1, c2, c3}
    MaxCommits = 2
    MaxEpoch = 3
    MaxGen = 1
    SoundSubmit = TRUE
    SoundMigrate = FALSE

INVARIANTS
    TypeOK
    OnePerEpoch
    Gapless
    OpeningClosesTheHead
    NoForeignAdopt

PROPERTIES
    LineageMonotone
