\* Default (SOUND) configuration for Spec B -- Delivery / retention.
\* Small exhaustive config: N=2 devices, K=3 messages, 2 epochs. TLC explores
\* the full reachable state space (~130k states, well under a minute) and all
\* invariants must PASS -- a fast, definitive PR gate. A deeper N=3/K=4 sweep is
\* far larger (the per-device `delivered` set multiplies the space into the
\* millions); run that out-of-band, not as the blocking PR check (design doc §3:
\* "CI runs TLC on the small config as a fast gate, a larger config on a
\* schedule").
\*
\* `Keys` stays a SINGLETON deliberately, and #454 P4 does not change that.
\* Read k1 as one lineage -- a (conversation, generation) pair. Spec B has no
\* action or invariant that relates two keys, so a two-key config is a product
\* of two independent copies: sound, but it proves nothing this one proves,
\* at >10 minutes of TLC (measured) instead of seconds. The cross-lineage
\* safety content of P4 lives in Spec A (CommitLog.tla), which was rewritten
\* for it. See the Delivery.tla header for the full argument.
SPECIFICATION Spec

CONSTANTS
    Keys = {k1}
    Devices = {d1, d2}
    MaxMsgs = 3
    MaxEpoch = 2
    SoundGC = TRUE

INVARIANTS
    TypeOK
    CursorLeqClock
    NoLossForCurrentMember
    AcceptedLossesOnly

PROPERTIES
    CursorMonotone
