[package]
name = "verifiable-log"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Generic, tenant-agnostic verifiable append-only Merkle log (RFC 6962 style) plus an offline verification CLI."

[lib]
name = "verifiable_log"
path = "src/lib.rs"

[[bin]]
name = "monitor"
path = "src/bin/monitor.rs"

[dependencies]
sha2 = "0.10"
# STH signatures are ML-DSA-44 (#668) — the log's accountable commitment has to
# outlive a cryptographically-relevant quantum computer, since an STH is the
# anchor every inclusion/consistency proof is checked against.
ml-dsa = { version = "0.1", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "1"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
ml-dsa = { version = "0.1", default-features = false, features = ["alloc"] }
serde_json = "1"
hex = "0.4"
