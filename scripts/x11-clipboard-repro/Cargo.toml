[package]
name = "x11repro"
version = "0.1.0"
edition = "2021"

[workspace]

[lib]
path = "src/lib.rs"

[dependencies]
tauri = { path = "tauri-stub", package = "tauri-stub" }
x11rb = { version = "=0.13.2", features = ["xtest"] }
arboard = { version = "=3.6.1", features = ["wayland-data-control"] }
url = "2"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
