[package]
name = "pollis-delivery"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Pollis MLS Delivery Service: the sole writer to the MLS control-plane tables. Serializes commits per conversation (race-free, append-only by construction) and serves the contiguous commit log. Sees only opaque blobs — never plaintext or keys (RFC 9420 Delivery Service role)."

[lib]
name = "pollis_delivery"
path = "src/lib.rs"

[[bin]]
name = "pollis-delivery"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
# Sole-writer access to the MLS tables in Turso. `remote` for prod; local files
# back the tests.
libsql = { version = "0.9", features = ["remote"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ulid = "1"
# The OFFLINE device-cert primitive, shared verbatim with pollis-core so the
# publish-time re-verification checks the exact chain pollis-core mints — one
# source of truth for the wire format, no drift, no crate cycle.
pollis-device-cert = { path = "../pollis-device-cert" }
# The write API as types, shared verbatim with pollis-core: every `*Body` this
# crate parses is DECLARED there and CONSTRUCTED there, so the client cannot
# omit, misspell or invent a field without failing to compile. Like
# pollis-device-cert and pollis-schema it is a leaf crate (serde only), so
# sharing it does not breach the DS-does-not-depend-on-pollis-core rule.
pollis-api = { path = "../pollis-api" }
# #942: the group-membership predicates (`pollis_schema::authz`) that this crate
# ENFORCES and pollis-core preflights. Two hand-typed copies of one authz rule
# drift, and when they do the client is wrong by definition — so there is one
# copy, in the crate that already exists to stop exactly this between exactly
# these two crates.
#
# It moved from a dev-dependency to a real one to do that. The dev-dep comment
# below said "the DS binary carries no schema", which stays true in the way that
# matters: WITHOUT the `libsql` feature this dependency contributes only `&str`
# constants and no runner, and the migration bodies are unreferenced `pub const`s
# that the linker drops. The dev-dependency below keeps the feature so tests can
# still stamp a real connection.
pollis-schema = { path = "../pollis-schema" }
# Request-signature auth (#668): verify the client's ML-DSA-44 signature over a
# canonical message that binds sha256(body). The DS request credential is
# `user_device.mls_signature_pub_pq`. Also the device-cert signature scheme.
ml-dsa = { version = "0.1", default-features = false, features = ["alloc"] }
sha2 = "0.10"
# Constant-time equality for the #847 invite-link secret hash. Hand-rolling a
# byte fold is not equivalent — LLVM is free to turn `diff == 0` back into an
# early-exit compare. `subtle`'s optimisation barriers are the reason to depend
# on it rather than write the four-line loop.
subtle = "2.6"
hex = "0.4"
# Authorized-secrets broker (#393): mint LiveKit JWTs server-side (pure HS256,
# no native dep) and HMAC for the R2 SigV4 query-string presign. The DS is the
# SOLE minter of both now — pollis-core's `livekit_jwt` module is gone and its
# `r2` module asks `/v1/r2/presign` rather than signing locally — so these are
# the only copies of either scheme in the workspace, not a mirror of one.
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
hmac = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# CSPRNG for OTP codes and 256-bit session tokens (OsRng).
rand = "0.8"
# Send the OTP email via Resend (server-side; the key lives in DS env now, not
# the client build). rustls so we don't depend on the host's OpenSSL.
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
# Drive the real axum router in-process (tower::ServiceExt::oneshot) and mint
# ML-DSA-44 keypairs to sign test requests, mirroring pollis-core's device key.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
rand_core = { version = "0.6", features = ["getrandom"] }
# The hrana wire types, so the #777 connection-pool test can stand up a
# hrana-speaking double and exercise the REMOTE path (every other DS test uses a
# local file and never touches hrana at all). Same version libsql itself pulls.
libsql-hrana = "0.9"
# The REAL remote schema, so DS tests stamp their local DBs with exactly what
# ships instead of a hand-rolled slice per module. A dev-dependency on purpose:
# the DS binary carries no schema, and the crate is dependency-free anyway, so
# this does not breach the DS-does-not-depend-on-pollis-core rule.
pollis-schema = { path = "../pollis-schema", features = ["libsql"] }
# The endpoint table, so the route-coverage test walks the same list the client
# posts to rather than a copy of it.
pollis-api = { path = "../pollis-api" }

# Picks up `[workspace.lints]` from the root Cargo.toml, which declares the
# `kani` cfg the proof harnesses in this crate are gated on.
[lints]
workspace = true
