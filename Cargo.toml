[workspace]
resolver = "2"
members = [
    "src-tauri",
    "pollis-core",
    "pollis-tui",
    "pollis-capture-proto",
    "pollis-capture-linux",
    "pollis-capture-macos",
    "verifiable-log",
    "verifiable-log-builder",
    "verifiable-log-serve",
    "pollis-delivery",
    "pollis-relay",
    "pollis-device-cert",
    "pollis-api",
    "pollis-schema",
    "pollis-sqlcipher",
]
# Detached from this workspace on purpose: `fuzz/` is the Track-B cargo-fuzz crate
# (#481). cargo-fuzz needs nightly, but this repo pins Rust 1.96.0 STABLE for
# reproducible release builds, so the fuzz crate must never affect `cargo build`
# or the pinned-stable release path. It also carries its own `[workspace]` table.
exclude = [
    "fuzz",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
# The real floor. It said 1.77 while the tree had been using 1.82 APIs
# (`Option::is_none_or` and friends) for some time, and
# nothing caught it because clippy — the thing that checks a declared MSRV —
# was not installed (#912).
#
# NOT the pinned 1.96 from rust-toolchain.toml, even though that is the only
# rustc anything ships with: Kani builds these crates with its OWN pinned
# nightly (1.93 today), and cargo refuses outright to build a package whose
# `rust-version` is above the compiler in hand. Declaring the true API floor
# keeps `clippy::incompatible_msrv` armed AND keeps the proof harnesses
# buildable. Raise it only when the code actually starts needing a newer API.
rust-version = "1.82"

# Lints applied to every workspace crate that opts in with `lints.workspace =
# true`. `kani` is a cfg the proof harnesses are gated on and the Kani driver
# sets; declaring it here stops `unexpected_cfgs` firing on a build that has no
# Kani, WITHOUT the blanket `--cfg` escape that would also swallow a genuinely
# misspelled cfg name.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[profile.dev]
incremental = true

# The capture helpers do per-pixel work in Rust on the frame hot path
# (MJPEG decode via zune-jpeg, YUYV/RGB → BGRx packing). At opt-level 0
# that's ~220ms per 720p frame — the camera drops from 30fps to ~4.5fps
# and frames queue up seconds of latency in the V4L2 ring. Dev builds of
# everything else stay unoptimized; the helper + its decoder must not.
[profile.dev.package.pollis-capture-linux]
opt-level = 3
[profile.dev.package.pollis-capture-macos]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# OpenMLS is pinned to an upstream commit, not a crates.io release (#668).
#
# Post-quantum SIGNATURES live only on `main`, behind the
# `draft-ietf-mls-pq-ciphersuites` feature: the released 0.8.1 has no
# `SignatureScheme::MLDSA44` and no ML-DSA ciphersuite at all, so the suite this
# repo now runs — MLS_128_MLKEM768X25519_CHACHA20POLY1305_SHA384_MLDSA44
# (0x0052) — is unreachable from any published version. #454 hit the same
# upstream gate for the KEM and could wait for a release; this one cannot,
# because 0x0052 is provisional and the draft is still moving.
#
# It is a `[patch.crates-io]` rather than five git dependencies so the pin is
# recorded in ONE place and no crate in the workspace — including dev-dependency
# graphs and anything transitive — can resolve openmls back to the registry
# copy. A split graph would compile (two `openmls` crates, distinct types) and
# then fail in confusing ways at the boundary.
#
# Upgrading the rev is a protocol-visible act: the draft renumbers provisional
# code points between revisions, and a code point change is a wire-format break
# for every group already on 0x0052. Read the upstream diff for `types.rs`
# before moving this, and treat any code point change as a migration, not a
# version bump.
[patch.crates-io]
openmls = { git = "https://github.com/openmls/openmls", rev = "34222ef632c87df58baaa7614c8a72ac235c5f07" }
openmls_traits = { git = "https://github.com/openmls/openmls", rev = "34222ef632c87df58baaa7614c8a72ac235c5f07" }
openmls_rust_crypto = { git = "https://github.com/openmls/openmls", rev = "34222ef632c87df58baaa7614c8a72ac235c5f07" }
openmls_basic_credential = { git = "https://github.com/openmls/openmls", rev = "34222ef632c87df58baaa7614c8a72ac235c5f07" }
openmls_memory_storage = { git = "https://github.com/openmls/openmls", rev = "34222ef632c87df58baaa7614c8a72ac235c5f07" }
