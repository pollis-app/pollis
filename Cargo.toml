[workspace]
resolver = "2"
members = [
    "src-tauri",
    "pollis-core",
    "pollis-tui",
    "pollis-capture-proto",
    "pollis-capture-linux",
    "pollis-capture-macos",
    "verifiable-log",
    "verifiable-log-builder",
    "verifiable-log-serve",
    "pollis-delivery",
    "pollis-relay",
    "pollis-device-cert",
    "pollis-api",
    "pollis-schema",
    "pollis-sqlcipher",
    "pollis-libsql-connector",
    "patches/device-info",
]
# Detached from this workspace on purpose: `fuzz/` is the Track-B cargo-fuzz crate
# (#481). cargo-fuzz needs nightly, but this repo pins Rust 1.96.0 STABLE for
# reproducible release builds, so the fuzz crate must never affect `cargo build`
# or the pinned-stable release path. It also carries its own `[workspace]` table.
exclude = [
    "fuzz",
    # Stand-ins swapped in by the [patch] tables below. Excluded so a
    # `--workspace` build does not compile them as members: the openmls one is a
    # deliberate `compile_error!`, and sqlcipher-src is vendored upstream code
    # with its own lints and tests (as is libsql).
    "patches/openmls-sqlite-storage",
    "patches/sqlcipher-src",
    "patches/libsql",
]

[workspace.package]
version = "1.1.0"
edition = "2021"
# The real floor. It said 1.77 while the tree had been using 1.82 APIs
# (`Option::is_none_or` and friends) for some time, and
# nothing caught it because clippy — the thing that checks a declared MSRV —
# was not installed (#912).
#
# NOT the pinned 1.96 from rust-toolchain.toml, even though that is the only
# rustc anything ships with: Kani builds these crates with its OWN pinned
# nightly (1.93 today), and cargo refuses outright to build a package whose
# `rust-version` is above the compiler in hand. Declaring the true API floor
# keeps `clippy::incompatible_msrv` armed AND keeps the proof harnesses
# buildable. Raise it only when the code actually starts needing a newer API.
rust-version = "1.82"

# Lints applied to every workspace crate that opts in with `lints.workspace =
# true`. `kani` is a cfg the proof harnesses are gated on and the Kani driver
# sets; declaring it here stops `unexpected_cfgs` firing on a build that has no
# Kani, WITHOUT the blanket `--cfg` escape that would also swallow a genuinely
# misspelled cfg name.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[profile.dev]
incremental = true

# The capture helpers do per-pixel work in Rust on the frame hot path
# (MJPEG decode via zune-jpeg, YUYV/RGB → BGRx packing). At opt-level 0
# that's ~220ms per 720p frame — the camera drops from 30fps to ~4.5fps
# and frames queue up seconds of latency in the V4L2 ring. Dev builds of
# everything else stay unoptimized; the helper + its decoder must not.
[profile.dev.package.pollis-capture-linux]
opt-level = 3
[profile.dev.package.pollis-capture-macos]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3

# Third-party crates (OpenMLS, the PQ crypto, libsql…) run optimized under
# `cargo test`; our own crates stay at opt-level 0 with debug assertions. At
# opt-level 0 the crypto is so slow that real interleavings (#1220: the
# epoch-0 join race) never happen in tests, while shipped builds hit them.
[profile.test.package."*"]
opt-level = 2

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

# The capture helpers and their JPEG decoder are the per-pixel hot path (see the dev
# override above); size-optimised they run ~15% slower per frame for a few KB saved.
[profile.release.package.pollis-capture-linux]
opt-level = 3
[profile.release.package.pollis-capture-macos]
opt-level = 3
[profile.release.package.zune-jpeg]
opt-level = 3
[profile.release.package.zune-core]
opt-level = 3

# OpenMLS is pinned to an upstream commit, not a crates.io release (#668).
#
# Post-quantum SIGNATURES live only on `main`, behind the
# `draft-ietf-mls-pq-ciphersuites` feature: the released 0.8.1 has no
# `SignatureScheme::MLDSA44` and no ML-DSA ciphersuite at all, so the suite this
# repo now runs — MLS_128_MLKEM768X25519_CHACHA20POLY1305_SHA384_MLDSA44
# (0x0052) — is unreachable from any published version. #454 hit the same
# upstream gate for the KEM and could wait for a release; this one cannot,
# because 0x0052 is provisional and the draft is still moving.
#
# It is a `[patch.crates-io]` rather than five git dependencies so the pin is
# recorded in ONE place and no crate in the workspace — including dev-dependency
# graphs and anything transitive — can resolve openmls back to the registry
# copy. A split graph would compile (two `openmls` crates, distinct types) and
# then fail in confusing ways at the boundary.
#
# Upgrading the rev is a protocol-visible act: the draft renumbers provisional
# code points between revisions, and a code point change is a wire-format break
# for every group already on 0x0052. Read the upstream diff for `types.rs`
# before moving this, and treat any code point change as a migration, not a
# version bump. Upstream `main` also moved to hpke-rs 0.8 WITHOUT
# `draft-connolly-cfrg-hpke-mlkem`, which changes the X-Wing DeriveKeyPair
# (another wire break); see patches/openmls-rust-crypto/Cargo.toml and the
# `hpke_derive_keypair_matches_hpke_rs_0_7` test.
[patch.crates-io]
openmls = { git = "https://github.com/openmls/openmls", rev = "34222ef632c87df58baaa7614c8a72ac235c5f07" }
openmls_traits = { git = "https://github.com/openmls/openmls", rev = "34222ef632c87df58baaa7614c8a72ac235c5f07" }
# These two are Pollis copies of the crates at that same rev, differing only
# in dependency versions (p256/p384 0.14, hpke-rs 0.8) so elliptic-curve 0.13
# and crypto-bigint 0.5 leave the graph (#1846). Each one's Cargo.toml says
# exactly what changed and when to delete it.
openmls_rust_crypto = { path = "patches/openmls-rust-crypto" }
openmls_basic_credential = { path = "patches/openmls-basic-credential" }
openmls_memory_storage = { git = "https://github.com/openmls/openmls", rev = "34222ef632c87df58baaa7614c8a72ac235c5f07" }
# livekit 0.9's signal client reports the device hardware model (e.g. a
# motherboard model) to the SFU on every join, with no option to turn it off
# (#1320). This stand-in reports none. See patches/device-info/src/lib.rs; the
# guard is pollis-core/tests/livekit_join_sends_no_device_model.rs.
device-info = { path = "patches/device-info" }
# RUSTSEC-2026-0459 (#1797): crates.io sqlcipher-src 420.0.0 (SQLCipher 4.20.0
# on SQLite 3.54.1, which fixes it), relabelled 419.0.6 to meet libsqlite3-sys
# 0.39.1's `=419.0.6` pin. Without it every SQLCipher build (all of ours) would
# still compile SQLite 3.53.4. See patches/sqlcipher-src/Cargo.toml for the
# provenance check; delete it once a libsqlite3-sys release takes 420.
sqlcipher-src = { path = "patches/sqlcipher-src" }
# #1847: crates.io libsql 0.10.0 with `http2` removed from its hyper 0.14
# features, which takes h2 0.3 out of the graph. Every remote handle speaks
# HTTP/1.1 to Turso through pollis-libsql-connector anyway (#1303). See
# patches/libsql/Cargo.toml for the provenance check; delete it once a libsql
# release moves to hyper 1.x or drops hyper's `http2` feature.
libsql = { path = "patches/libsql" }

# openmls's own SQLite storage provider is an OPTIONAL dependency of openmls
# (`sqlite-provider`, which nothing here enables), but cargo resolves it anyway,
# and at the pinned rev it requires `rusqlite = "0.37"`. Because libsqlite3-sys
# links `sqlite3`, that unused edge pinned the whole workspace to libsqlite3-sys
# 0.35 and blocked the fix for RUSTSEC-2026-0459 (#1797). The stand-in drops the
# edge and refuses to compile if anything ever enables it; see
# patches/openmls-sqlite-storage/src/lib.rs. Remove it when the openmls rev moves
# to one whose `openmls_sqlite_storage` takes our rusqlite.
[patch."https://github.com/openmls/openmls"]
openmls_sqlite_storage = { path = "patches/openmls-sqlite-storage" }
# openmls's own crates name these two by git path (its optional test-utils
# provider), so they are redirected here as well: no build can link the
# upstream copies, which still carry elliptic-curve 0.13 (#1846).
openmls_rust_crypto = { path = "patches/openmls-rust-crypto" }
openmls_basic_credential = { path = "patches/openmls-basic-credential" }
