# Composite action: the Linux system dependencies a native pollis-core /
# src-tauri test build needs. Shared by mls-tests.yml's `tests` job and
# mls-flows.yml's `flows` and `marathon` jobs, which used to carry three copies
# of these steps. The caller checks out the repo first (this runs scripts/).
#
# Same recipe as the desktop-release Linux job: webkit/gtk for Tauri,
# alsa/pulse/pipewire + libva for the media stack, meson+ninja+clang for
# webrtc-audio-processing-sys's vendored C++ build.
name: Native build dependencies
description: Install the apt packages, clang 21 and meson that a native pollis-core / src-tauri build needs on ubuntu-24.04.

runs:
  using: composite
  steps:
    # A stalled mirror fetch once held a CI job in apt for 33 minutes (and the
    # Playwright and Kani jobs for 11 and 31). apt's defaults wait 120 s per
    # stalled connection and do not retry; these fail a stalled fetch fast and
    # retry it, for this step and install-clang.sh's apt alike.
    - name: Fail fast on a stalled apt mirror
      shell: bash
      run: bash scripts/ci-apt-retries.sh

    # ci-apt-install.sh bounds the download and moves off a trickling mirror
    # (a 2026-11-06 run spent 39 minutes here, #1803).
    - name: Install system dependencies
      shell: bash
      run: |
        bash scripts/ci-apt-install.sh \
          libwebkit2gtk-4.1-dev \
          libgtk-3-dev \
          libayatana-appindicator3-dev \
          librsvg2-dev \
          libxdo-dev \
          libssl-dev \
          libasound2-dev \
          libpulse-dev \
          libpipewire-0.3-dev \
          libva-dev \
          libdbus-1-dev \
          cmake \
          clang \
          ninja-build

    # livekit 0.9's webrtc-sys compiles against libwebrtc's hermetic libc++,
    # which rejects any clang older than 21; this runner's apt `clang` (14 on
    # 22.04, 18 on 24.04) is too old (#1303). Adds the LLVM apt repo (key
    # fingerprint-checked) and puts a clang/clang++ shim first on PATH via
    # $GITHUB_PATH — no $GITHUB_ENV export, so the build recipe is unchanged.
    - name: Install clang 21 (webrtc-sys)
      shell: bash
      run: bash scripts/install-clang.sh

    - name: Install meson (newer than apt)
      shell: bash
      run: |
        python3 -m pip install --user 'meson>=1.3'
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
