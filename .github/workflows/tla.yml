name: TLA+ specs

# Machine-checked-correctness gate — Layer 1 / TLA+
# (docs/machine-checked-correctness-design.md §3).
#
# Runs TLC exhaustively over the small configs of both specs:
#   Spec A — CommitLog (epoch/commit-log machine, invariants I1+I2)
#   Spec B — Delivery  (delivery/retention,        invariants I3+I4)
# This is a fast, JVM-only gate: no Rust build, no native deps — just a JRE +
# tla2tools.jar (the script fetches the pinned jar). The sound specs must pass
# every invariant; the teeth check confirms each broken variant still produces a
# counterexample, so the gate can't rot into a vacuous pass.

on:
  pull_request:
    # Only the spec surface + its runner matter here.
    paths:
      - 'specs/tla/**'
      - 'scripts/tlc-check.sh'
      - '.github/workflows/tla.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tla-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tlc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JRE
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Sound specs — every invariant must hold exhaustively over the small
      # config: CommitLog (OnePerEpoch ∧ Gapless ∧ LineageMonotone ∧
      # OpeningClosesTheHead ∧ NoForeignAdopt) and Delivery
      # (NoLossForCurrentMember ∧ CursorMonotone ∧ AcceptedLossesOnly).
      #
      # TLC_LOG_DIR (#877) tees each config's full output so the results can be
      # published. Without it the state counts and counterexamples existed only
      # in this job's log, which ages out — so "we model-check the epoch and
      # delivery machines" was a claim with no durable evidence behind it.
      - name: TLC — CommitLog + Delivery (sound, all invariants pass)
        env:
          TLC_LOG_DIR: ${{ runner.temp }}/tlc
        run: scripts/tlc-check.sh

      # Teeth: each broken variant MUST fail — CommitLog's dropped submit-guard
      # forking an epoch, CommitLog's dropped migration compare-and-swap
      # orphaning a commit on the retired lineage (#454 P4), and Delivery's
      # fastest-member retention guard. A clean pass here means an invariant
      # lost its teeth and is a regression.
      - name: TLC — CommitLog + Delivery (broken variants must be refuted)
        env:
          TLC_LOG_DIR: ${{ runner.temp }}/tlc
        run: scripts/tlc-check.sh --broken

      # Publish the result (#877). Two renderings of one source: the run summary
      # is what a reader lands on from pollis.com/assurance, and the JSON is the
      # durable artifact. `if: always()` because a refuted sound spec is exactly
      # the run whose numbers and counterexample someone needs to read.
      - name: Publish TLC results
        if: always()
        env:
          TLC_LOG_DIR: ${{ runner.temp }}/tlc
        run: |
          set -euo pipefail
          scripts/tlc-summary.sh "${{ runner.temp }}/tla-results.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload TLC results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tla-results
          if-no-files-found: warn
          retention-days: 90
          path: |
            ${{ runner.temp }}/tla-results.json
            ${{ runner.temp }}/tlc/*.log
