name: Status probe

# Samples the public endpoints and appends the result to
# website/status-history.json, which pollis.com/status renders (#877).
#
# WHY IT COMMITS TO main. The site is static (Cloudflare Pages) and the DS sends
# no CORS headers, so the published page CANNOT probe anything from a visitor's
# browser — a client-side fetch would fail on every load and paint a false red.
# The history therefore has to arrive as a committed file, the same reasoning
# that makes website/rebuild-ledger.json a committed file rather than a CI
# artifact. Git history is also the tamper-evident part: a sample that is later
# edited is visible in the diff.
#
# WHY IT DOES NOT COMMIT EVERY RUN. `status-probe.sh` appends only when the
# observed state CHANGES, or once every 20h as a heartbeat. Without the
# heartbeat, "no new samples" and "the prober is dead" would look identical —
# which is the exact conflation this whole page exists to remove.
#
# IF THE PUSH IS REJECTED (branch protection on main), this workflow FAILS
# LOUDLY rather than skipping: a prober that cannot publish is a prober that is
# not running, and it must not look green. website-verify.yml independently runs
# `status-probe.sh --check` daily and fails when the newest sample is over 48h
# old, so a silently stopped schedule is caught even if nobody reads this run.
#
# GITHUB DISABLES SCHEDULED WORKFLOWS on repositories with no activity for 60
# days. That is a real way for this to stop without saying so, and it is why the
# freshness check lives in a DIFFERENT workflow.

on:
  schedule:
    # Every 30 minutes, best effort. GitHub's scheduler is routinely late and
    # occasionally drops runs; the page says so rather than implying a
    # second-by-second monitor.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: status-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Probe the public endpoints
        env:
          # Read-only use: the last transparency-publish run's conclusion, which
          # is public API anyway — a third party can check the same thing.
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/status-probe.sh

      - name: Publish the sample
        run: |
          set -euo pipefail
          if git diff --quiet -- website/status-history.json; then
            echo "no new sample to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/status-history.json
          at="$(jq -r '.samples[-1].at' website/status-history.json)"
          reason="$(jq -r '.samples[-1].reason' website/status-history.json)"
          git commit -m "chore(status): record ${reason} sample ${at}"
          # Retry once against a concurrent push (a release, a merge). Anything
          # else is a real failure and must go red.
          for attempt in 1 2 3; do
            if git push; then
              echo "published (attempt ${attempt})"
              exit 0
            fi
            echo "push rejected, rebasing and retrying"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done
          echo "::error::could not push the status sample after 3 attempts."
          echo "::error::  If main rejects pushes from github-actions[bot], /status will"
          echo "::error::  freeze while looking authoritative. Allow the bot to push"
          echo "::error::  website/status-history.json, or run scripts/status-probe.sh by"
          echo "::error::  hand and commit it — but do not leave this failing."
          exit 1
