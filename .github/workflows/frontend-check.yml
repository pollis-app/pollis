name: Frontend check

# Fast typecheck gate for the renderer (frontend/, React + TS + Vite). Until
# now nothing gated frontend code on PRs — a tsc break could merge to main and
# only surface at release time (documented gap in docs/deployments.md). This
# job is deliberately minimal so it stays fast: a filtered pnpm install of the
# frontend package only, then plain `tsc` (the tsconfig sets noEmit, so it's a
# pure typecheck) — NO vite build, no artifacts.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # cache: "pnpm" caches the pnpm content-addressable store keyed on
      # pnpm-lock.yaml, so warm runs skip nearly all downloads.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      # --filter ./frontend... installs only the frontend package (+ workspace
      # deps) instead of the whole workspace — skips e2e and pollis-delivery.
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --filter ./frontend...

      # Pure typecheck: frontend/tsconfig.json has noEmit, so `tsc` emits
      # nothing and just fails on type errors (~3s).
      - name: Typecheck
        run: pnpm --filter frontend exec tsc

  # The marketing site's JS had tests (website/assistant.test.mjs) that NOTHING
  # ran — they were only ever executed by hand. #765 added the assistant's
  # Cloudflare Pages Function, the one piece of Pollis code sitting between the
  # public internet and a paid model backend, so its refusals (fail closed when
  # unconfigured, rate limiting, body and question ceilings, no upstream header
  # pass-through) need a gate rather than good intentions.
  #
  # No install step: these are plain `node --test` files with no dependencies.
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22, not 20: the Pages Function is ESM in a `.js` file (what
      # Cloudflare requires) inside a package that is not `"type": "module"`.
      # Automatic ESM syntax detection is only unflagged from 22.7, so Node 20
      # would fail to import it.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Website + assistant Function tests
        run: node --test website/assistant.test.mjs website/functions/api/assistant.test.mjs
