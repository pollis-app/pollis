name: Frontend check

# Fast typecheck gate for the renderer (frontend/, React + TS + Vite). Until
# now nothing gated frontend code on PRs — a tsc break could merge to main and
# only surface at release time (documented gap in docs/deployments.md). This
# job is deliberately minimal so it stays fast: a filtered pnpm install of the
# frontend package only, then plain `tsc` (the tsconfig sets noEmit, so it's a
# pure typecheck) — NO vite build, no artifacts.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      # cache: "pnpm" caches the pnpm content-addressable store keyed on
      # pnpm-lock.yaml, so warm runs skip nearly all downloads.
      # 22, not 20: the unit-test step below runs TypeScript directly on the
      # built-in runner, and native type stripping is a 22.18+ feature. On 20
      # `node --test` cannot parse a `.ts` file at all.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "pnpm"

      # --filter ./frontend... installs only the frontend package (+ workspace
      # deps) instead of the whole workspace — skips e2e and pollis-delivery.
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --filter ./frontend...

      # Pure typecheck: frontend/tsconfig.json has noEmit, so `tsc` emits
      # nothing and just fails on type errors (~3s).
      - name: Typecheck
        run: pnpm --filter frontend exec tsc

      # The renderer's pure-helper unit tests (`frontend/tests/`), on Node's
      # built-in runner — no framework, no browser, under a second. They were
      # gated by nothing until #911 needed one of them to actually guard
      # something: a locale that cases differently from the invariant mapping
      # is not reachable from a browser spec, so the unit tier is the only
      # tier that can hold that line.
      - name: Unit tests
        run: pnpm --filter frontend test

      # Catalogue integrity for BOTH apps (#1074): plural families, placeholders,
      # every t() call site in frontend/src and mobile/ resolving in `en`, the
      # generated mobile resource table being fresh, and the emoji ranking
      # modules mobile carries as copies matching the desktop originals. Node
      # only — no deps beyond the checkout.
      - name: i18n check
        run: pnpm i18n:check
