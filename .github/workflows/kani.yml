# Machine-checked-correctness gate (docs/machine-checked-correctness-design.md).
# Runs the Kani bounded-model-checking proofs on the load-bearing pure functions
# of pollis-core + pollis-delivery.
#   M1 — delivery-watermark no-skip (`next_watermark` in
#        commands/messages/watermark.rs): P1 no-skip / P2 monotone / P3 liveness.
#   M2 — the recovery gate, own-commit canonicalization, and gap detection
#        (`may_rejoin` / `resolve` / `classify` in commands/mls/invariants.rs),
#        plus the DS head arithmetic + accept decision (`head_epoch_of` /
#        `accepts` in pollis-delivery/src/commit.rs). Each has a should_panic
#        mutant proving the harness has teeth.
# Kani builds its own harness toolchain (CBMC backend) and is slow, so this is a
# dedicated job. The proof HARNESSES are pure, but compiling `pollis-core` (even
# `--no-default-features`) still links glib-sys and friends, so the same system
# libs the flows gate installs are required to build the crate before Kani can
# verify it.
name: Kani proofs

on:
  pull_request:
    # Only the pure proof surface matters here. Any change to pollis-core or the
    # workflow itself re-runs the proofs; unrelated surfaces are exempt.
    paths:
      - 'pollis-core/**'
      # pollis-core re-exports the schema from here now.
      - 'pollis-schema/**'
      # 21 of the 35 harnesses live in pollis-delivery/src/commit.rs (the I1 head
      # arithmetic and the I4 retention floor), and this path was missing (#877):
      # a PR touching only commit.rs skipped the gate that proves commit.rs. It
      # still ran on push-to-main, so nothing landed unproven — but the proofs
      # were being checked after review rather than during it.
      - 'pollis-delivery/**'
      - 'scripts/kani-inventory.sh'
      - '.github/workflows/kani.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kani-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kani:
    runs-on: ubuntu-24.04
    env:
      # ONE place, so the two proof invocations cannot drift apart.
      KANI_VERSION: '0.68.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Building pollis-core (even headless) pulls glib-sys / gtk / openssl via
      # transitive deps — the box hides this behind a gtk stub-sysroot, but CI
      # needs the real dev packages. Mirrors mls-tests.yml's install step.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libva-dev \
            libdbus-1-dev \
            cmake \
            clang \
            ninja-build

      # KANI VERSION IS PINNED, and must stay pinned. The action's `kani-version`
      # defaults to `latest`, which made this job depend on upstream's release
      # schedule: when 0.68.0 shipped (2026-09-16) every run failed at the
      # INSTALL step with "The version of Kani installed was different than the
      # one requested", because the cached toolchain no longer matched what
      # `latest` resolved to. Nothing in this repo had changed (#1154).
      #
      # A verifier is a merge gate, so its version is part of what "verified"
      # means: an unpinned one both breaks CI on someone else's release and
      # silently changes what the proofs were checked under. Upgrading is a
      # deliberate edit here, with the verdicts compared — not a default.
      #
      # 0.68.0 (#1155). Adopted deliberately rather than as a side effect of the
      # #1154 unbreaking, because a verifier upgrade can change proof results:
      # this release carries soundness fixes (float-to-int range checks, pointer
      # offset UB, atomic `compare_exchange` failure status). None touch these
      # harnesses — they are integer reasoning over the watermark cursor and the
      # DS head arithmetic — and the verdicts were compared across the bump:
      #
      #   0.67.0: pollis-core 14/14, pollis-delivery 21/21, 0 failures
      #   0.68.0: must match exactly, or the proof (not the pin) is the finding.
      #
      # `--package pollis-core --lib` scopes to the library target that holds the
      # proof harnesses (the crate's `uniffi-bindgen` bin target needs the `cli`
      # feature and is irrelevant here). `--no-default-features` drops the
      # desktop media stack the harnesses never touch, keeping the verified
      # surface small.
      #
      # Installed HERE rather than via `model-checking/kani-github-action`.
      #
      # That action's install script ends with:
      #
      #     installed_version=$(kani --version | awk '{print $2}')
      #     [ "$installed_version" != "$requested_version" ] && error
      #
      # 0.68.0 added git-revision and rustc info to the version output (upstream
      # #4466), so field 2 is no longer the bare version and the check rejects a
      # correct install. `cargo install --version` had already put the right
      # binary on disk; the action then failed on its own assertion about it.
      #
      # The action is also unmaintained — last commit 2025-05-13, which is the
      # SHA we were pinned to — so there is no fixed release to move to. Doing
      # the two steps ourselves is three lines, removes a hard dependency on a
      # dead action, and keeps the version assertion while making it robust to
      # the string's shape.
      - name: Install Kani
        run: |
          cargo install --version "${KANI_VERSION}" --locked kani-verifier
          cargo kani setup
          # Assert the version without assuming a field position: the point is
          # that the requested version is what is on PATH, and `cargo install
          # --version` is already exact — this catches a stale cached binary
          # shadowing it, which is the failure the action was reaching for.
          kani --version
          if ! kani --version | grep -qF "${KANI_VERSION}"; then
            echo "::error::kani on PATH is not ${KANI_VERSION}: $(kani --version)"
            exit 1
          fi

      - name: Run Kani proofs (pollis-core)
        run: cargo kani --package pollis-core --lib --no-default-features

      # The I1 DS-side head arithmetic + accept decision live in the Delivery
      # Service crate, so they need a second Kani invocation. `--lib` scopes to
      # the library target (the `pollis-delivery` bin is the axum server, which
      # holds no harnesses). No `--no-default-features` — pollis-delivery has no
      # feature-gated media stack; the harnesses are pure integer reasoning.
      - name: Run Kani proofs (pollis-delivery)
        run: cargo kani --package pollis-delivery --lib

      # Publish what the two verdicts above actually range over (#877). Before
      # this the job emitted nothing durable: a green tick said "something was
      # proven" and never what, and the word "Kani" appeared nowhere outside
      # this file. The inventory is derived from the source rather than from
      # Kani's report, because the action owns its own invocation and offers no
      # hook to capture it — see the script header. `if: always()` so a failing
      # proof run still publishes the surface it was checking.
      - name: Publish Kani harness inventory
        if: always()
        run: |
          set -euo pipefail
          scripts/kani-inventory.sh "${{ runner.temp }}/kani-harnesses.json" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Kani harness inventory
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kani-harnesses
          if-no-files-found: warn
          retention-days: 90
          path: ${{ runner.temp }}/kani-harnesses.json
