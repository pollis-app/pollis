# CI gate for MLS correctness: DS serializer, MLS crypto/state-machine, and the
# multi-client integration flows harness. These are the tests that protect the
# "invalid states unrepresentable" / bulletproof-membership invariants
# (docs/backend-core-invariants.md). Building pollis-core pulls the native media
# stack (libwebrtc / cpal / webrtc-audio-processing) and the flows harness pulls
# Tauri (webkit), so this needs the same Linux system deps as a desktop build.
#
# Merge-blocking design (#698). The heavy `tests` job is expensive and pointless
# for PRs that can't touch it (frontend, marketing site, docs/markdown). It used
# to be exempted with a job-level `paths-ignore`, but a path-filtered workflow
# does not run AT ALL on an exempt PR — so a *required* status check would sit
# pending forever and wedge every frontend-only PR. This workflow therefore
# ALWAYS triggers and ALWAYS reports, in three jobs:
#   1. `changes` — a seconds-cheap decision job (no checkout, no toolchain, no
#      apt) that asks the PR's changed-file list whether any NON-exempt file was
#      touched. Ignore-list, not allow-list: the exemptions are exactly the old
#      `paths-ignore` (frontend/website/docs/markdown), so any Rust/workspace
#      change still trips it. Non-PR triggers (dispatch/schedule) always say yes.
#   2. `tests`   — the heavy native build+test job, gated on that decision. Its
#      runner, caching, system deps, env, and steps are byte-for-byte unchanged;
#      on an exempt PR it is simply skipped.
#   3. `gate`    — `needs: tests`, `if: always()`. Green when the heavy job passed
#      OR was legitimately skipped as exempt; red when it failed, was cancelled,
#      or the decision job itself failed (fail-closed). Because it always runs it
#      always reports, so it — NOT `tests` — is the check to mark required in
#      branch protection.
name: MLS & delivery tests

on:
  # No paths filter here: the workflow must always run so `gate` always reports.
  # Exemption is decided inside the `changes` job instead (see the comment above).
  pull_request:
  workflow_dispatch:
    inputs:
      marathon_ops:
        description: "Marathon soak: number of ops in the single long sequence"
        required: false
        default: "300"
      marathon_actors:
        description: "Marathon soak: actor pool size"
        required: false
        default: "6"
  # Nightly continuous soak (M3, docs/machine-checked-correctness-design.md §5.4).
  # Runs the marathon at a meaningful size (500 ops / 8 actors — see the marathon
  # step's env fallbacks) so deep-churn divergence gets soaked every night; a
  # failure fails the job red and uploads the failing op sequence as a durable
  # artifact for one-step promotion to a deterministic regression.
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read
  # dorny/paths-filter reads the PR's changed-file list via the API (no checkout).
  pull-requests: read

concurrency:
  group: mls-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Seconds-cheap gatekeeper: decide whether the heavy Rust job needs to run.
  # No checkout, no toolchain, no apt — just an API-backed changed-file query on
  # PRs, and an unconditional "yes" on every other trigger.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.decide.outputs.run_tests }}
    steps:
      # Ignore-list matching the old `paths-ignore`: a changed file trips `rust`
      # only if it is NOT under any exempt surface. `predicate-quantifier: every`
      # ANDs the negated patterns, so a file matches `rust` iff it is neither a
      # frontend, website, docs, nor markdown file — i.e. any real Rust/workspace
      # change flips the output to `true`. Skipped on non-PR events, which the
      # decide step forces to `true` regardless.
      - name: Detect non-exempt changes (PRs only)
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: 'every'
          filters: |
            rust:
              - '!frontend/**'
              - '!website/**'
              - '!docs/**'
              - '!**/*.md'
              # Surfaces that cannot change Rust behaviour. Before these were listed,
              # a workflow-or-docs-only PR paid the full ~31-minute integration gate:
              # five such PRs in one day cost ~2.5 hours of CI for changes that could
              # not affect a single test.
              - '!.github/**'
              - '!scripts/**'
              - '!.codesight/**'
              - '!infra/**'
              - '!learn/**'
              - '!specs/**'
              - '!e2e/**'
            # ...but this workflow DEFINES the gate, so editing it must still run it.
            # Exempting `.github/**` wholesale would let a change to the harness skip
            # the very suite it configures — the one edit that most needs proving.
            harness:
              - '.github/workflows/mls-tests.yml'
      - name: Decide whether the heavy Rust gate must run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          FILTERED: ${{ steps.filter.outputs.rust }}
          HARNESS: ${{ steps.filter.outputs.harness }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # Either a real Rust change, or an edit to this workflow itself.
            if [ "$FILTERED" = "true" ] || [ "$HARNESS" = "true" ]; then
              echo "run_tests=true" >> "$GITHUB_OUTPUT"
            else
              echo "run_tests=false" >> "$GITHUB_OUTPUT"
            fi
            echo "rust=$FILTERED harness=$HARNESS"
          else
            # workflow_dispatch / schedule / any non-PR trigger: always run the
            # full gate (the marathon step keys off event_name inside the job).
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          fi

  tests:
    needs: changes
    # Run the heavy native build+test only when the decision job says a
    # Rust/workspace file changed (always true for dispatch/schedule). Exempt PRs
    # skip it; `gate` below still reports a result either way.
    if: ${{ needs.changes.outputs.run_tests == 'true' }}
    # 24.04, not 22.04: src-tauri/build.rs compiles pollis-capture-linux, whose
    # libspa 0.9 bindgen needs PipeWire >= 1.0 headers (same reason the release
    # workflow's build-capture-helper job runs on 24.04). No AppImage is built
    # here, so the 22.04 glibc-floor concern doesn't apply.
    runs-on: ubuntu-24.04
    env:
      # The flows test binary links the whole native stack (Tauri + libwebrtc +
      # livekit + cpal); with full DWARF it grew large enough to crash the runner's
      # linker (`ld ... signal 7 [Bus error]` — link-time memory/disk exhaustion).
      # Tests don't need debuginfo (assertions print their own context / op
      # sequences, not backtraces), so drop it to shrink the binary and the link.
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4

      # Reclaim ~20-30 GB of preinstalled toolchains we don't use, so linking the
      # large native test binary can't exhaust the runner's disk/tmpfs (the other
      # trigger for the `ld` bus error).
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/.ghcup || true
          sudo docker image prune --all --force || true
          df -h /

      # The PINNED toolchain, not `@stable`. The action exports
      # `RUSTUP_TOOLCHAIN`, which OVERRIDES `rust-toolchain.toml` — so this job
      # was silently testing on whatever stable happened to be that week while
      # releases build on 1.96.0, and it would ignore the pin's new `clippy`
      # component. Pinning here makes the lint gate below deterministic (a new
      # stable's new lints cannot turn an untouched PR red on their own) and
      # makes the gate test what actually ships. Bump in lockstep with
      # rust-toolchain.toml and the desktop-release refs.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            src-tauri
          # Only `main` WRITES the cache; PR branches still restore from it and
          # get the same speedup. Without this every branch stored its own ~1.8 GiB
          # copy under the same key, and this repo sat permanently over GitHub's
          # 10 GiB per-repo budget (11.34 GiB observed, of which 7.1 GiB was four
          # identical-keyed copies of THIS cache). Being over budget makes GitHub
          # evict least-recently-used entries, which silently disarmed the
          # transparency equivocation tripwire for months — see #759.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Same recipe as the desktop-release Linux job: webkit/gtk for Tauri,
      # alsa/pulse/pipewire + libva for the media stack, meson+ninja+clang for
      # webrtc-audio-processing-sys's vendored C++ build.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libva-dev \
            libdbus-1-dev \
            cmake \
            clang \
            ninja-build

      - name: Install meson (newer than apt)
        run: |
          python3 -m pip install --user 'meson>=1.3'
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # #987 removed the "Provision .env.test" step that used to sit here. The
      # flows harness has backed "remote Turso" with LOCAL libsql files since
      # #420, so the two values it wrote were literal placeholders — present
      # only because `Config::for_test` still had `turso_url` / `turso_token`
      # fields to fill. The client holds no database credential now and those
      # fields are gone, so the suite runs with every TURSO_* and LOG_DB_*
      # variable unset. That is the property #987 claims, and this job is where
      # it is exercised.

      # The remote schema itself (#924). Runs FIRST — it is seconds-cheap, it has
      # no system deps, and it is the definition every other job here stamps its
      # databases from. Its tests are the only automatic check that a migration
      # file on disk is actually LISTED (an unlisted file is applied by
      # `db-apply.sh` in production and by no harness — a test passing against a
      # schema no deploy has), that versions are unique and ascending, and that
      # `single_db_scripts()` keeps main-then-log order, which is what a single-DB
      # deploy depends on to get migrations-log/000004's `generation` column.
      # Nothing ran these before, so the constraint every deployment relies on was
      # pinned only by a test nobody executed.
      - name: Remote schema + migration ordering (pollis-schema)
        run: cargo test -p pollis-schema

      # The client/server wire contract (#875). Runs early because it is a cheap
      # signal and the most load-bearing: its `compile_fail` doctests ARE
      # the guarantee that a client body missing or misspelling a field cannot
      # compile, so a contract that CI never exercises would be worth nothing.
      - name: DS write-API contract (pollis-api)
        if: ${{ !cancelled() }}
        run: cargo test -p pollis-api

      # Cheap and media-free — fast signal that the DS serializer holds. Includes
      # the route-coverage test: every endpoint declared in `pollis-api` must be
      # served by the real router (#918).
      - name: DS serializer + route coverage (pollis-delivery)
        if: ${{ !cancelled() }}
        run: cargo test -p pollis-delivery

      # openmls-level MLS state-machine tests (mls/tests.rs, reconcile, etc.).
      #
      # `--features test-harness` (#914): the feature exists so integration tests
      # can build a real `RemoteDb` over a local file (`RemoteDb::connect_local`,
      # gated `#[cfg(any(test, feature = "test-harness"))]`). Without it every
      # pollis-core integration test that needs one silently could not exist —
      # `tests/remote_with_retry.rs` compiled to nothing here while passing
      # locally. The feature only ADDS test-only constructors; it changes no
      # production behaviour, and the flows step below already runs with it.
      - name: MLS unit tests (pollis-core)
        if: ${{ !cancelled() }}
        run: cargo test -p pollis-core --features test-harness

      # pollis-tui unit + smoke tests (the headless in-process-DS rig — no
      # webkit/ALSA). Nothing ran these before, so DS-spine changes could regress
      # the TUI's sync path unnoticed (#487). The smoke rig applies the same
      # baseline + post-baseline log migrations as production.
      - name: TUI unit + smoke tests (pollis-tui)
        if: ${{ !cancelled() }}
        run: cargo test -p pollis-tui

      # Multi-client integration harness against the real in-process Delivery
      # Service — the base for the adversarial recovery suite.
      - name: MLS integration flows harness
        if: ${{ !cancelled() }}
        working-directory: src-tauri
        run: cargo test --features test-harness --test flows

      # The Rust lint gate (#912). Until now `cargo clippy` was not even
      # installed for the pinned toolchain, so thousands of lines merged without
      # one lint pass ever running — including the work whose own audit found
      # duplication drifting into divergence, which is exactly what these lints
      # catch. `rust-toolchain.toml` now lists the component, so nothing has to
      # install it here.
      #
      # It lives in THIS job rather than its own: the toolchain, the ~10 apt
      # packages pollis-core/src-tauri need, and the warm cargo cache are already
      # here, and a separate job would duplicate all three plus a cache entry
      # (the repo has been over GitHub's 10 GiB budget before — #759). Placed
      # last so the merge-blocking test signal lands first; `-D warnings` makes a
      # new lint fail the job, which the `gate` check below already reports.
      - name: Rust lints (clippy)
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Marathon soak: ONE crazy-long generated sequence (hundreds of ops, larger
      # actor pool, messages + churn + faults) through the shadow-oracle
      # convergence check. Runs on manual dispatch AND on the nightly `schedule:`
      # above (the M3 continuous soak) — too heavy for the per-PR gate; the test is
      # `#[ignore]`d so normal runs skip it.
      #
      # Sizing: `workflow_dispatch` uses the input defaults (300/6, or whatever the
      # operator typed). Scheduled runs have no inputs, so `github.event.inputs.*`
      # is empty and the `||` fallbacks pin the nightly soak at 500 ops / 8 actors.
      #
      # `set -o pipefail` so a marathon failure survives the `tee` and the step
      # (and the job) goes RED — no silent swallow. The full stdout/stderr is teed
      # to a log so the panic's embedded failing op sequence (the repro of record —
      # MLS RNG isn't seedable, so the op sequence, not a seed, is what replays) can
      # be uploaded and promoted to a deterministic regression.
      - name: MLS marathon soak
        id: marathon
        if: ${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && !cancelled() }}
        working-directory: src-tauri
        env:
          MARATHON_OPS: ${{ github.event.inputs.marathon_ops || '500' }}
          MARATHON_ACTORS: ${{ github.event.inputs.marathon_actors || '8' }}
        run: |
          set -o pipefail
          cargo test --features test-harness --test flows -- \
            --ignored --nocapture model_marathon_convergence 2>&1 \
            | tee marathon-soak.log

      # On a marathon FAILURE, distil the failing op sequence out of the teed log
      # into its own file (the panic message embeds it as `op sequence (N ops):
      # [...]`). Both the raw log and the distilled sequence are uploaded below.
      # Promotion runbook: docs/machine-checked-correctness-design.md §5.4.
      - name: Extract failing op sequence
        if: ${{ failure() && steps.marathon.outcome == 'failure' }}
        working-directory: src-tauri
        run: |
          {
            echo "# Marathon soak failure — failing op sequence (the repro of record)."
            echo "# Promote per docs/machine-checked-correctness-design.md §5.4:"
            echo "# paste the Op vector below into a fixed-sequence regression in"
            echo "# src-tauri/tests/flows/model.rs (or adversarial.rs)."
            echo
            grep -F 'op sequence' marathon-soak.log || \
              echo "(no 'op sequence' line found — see marathon-soak.log for the raw failure)"
          } > marathon-failing-op-sequence.txt
          cat marathon-failing-op-sequence.txt

      # Durable CI artifact so the failing sequence outlives the runner and can be
      # promoted to a deterministic regression. `if: failure()` gated on the
      # marathon step specifically, so an unrelated earlier-step failure doesn't
      # upload a stale/empty log.
      - name: Upload marathon failure artifact
        if: ${{ failure() && steps.marathon.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: marathon-failing-op-sequence
          path: |
            src-tauri/marathon-failing-op-sequence.txt
            src-tauri/marathon-soak.log
          retention-days: 90
          if-no-files-found: warn

  # The always-reporting required check. Runs on every trigger regardless of what
  # `tests` did, and collapses the outcome into a single pass/fail. Fail-closed:
  # the only way to green is a genuine pass or a genuine exemption.
  gate:
    needs: [changes, tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_TESTS: ${{ needs.changes.outputs.run_tests }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          echo "changes=$CHANGES_RESULT run_tests=$RUN_TESTS tests=$TESTS_RESULT"
          # The decision must have completed cleanly; if it failed or was
          # cancelled we cannot trust the exemption verdict, so fail closed.
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Decision job did not succeed ($CHANGES_RESULT) — failing closed."
            exit 1
          fi
          if [ "$RUN_TESTS" = "true" ]; then
            # A Rust/workspace change: the heavy job MUST have run and passed.
            # Anything else (failure / cancelled / skipped) is a hard fail — this
            # is the one outcome we must never let go green.
            if [ "$TESTS_RESULT" = "success" ]; then
              echo "Heavy MLS tests passed."
              exit 0
            fi
            echo "::error::Heavy MLS tests were required but their result was '$TESTS_RESULT' — failing."
            exit 1
          fi
          # Exempt PR (frontend/website/docs/markdown only): the heavy job was
          # legitimately not run.
          if [ "$TESTS_RESULT" = "skipped" ]; then
            echo "Exempt PR — no Rust/workspace change, heavy MLS tests correctly skipped."
            exit 0
          fi
          # Defensive: exemption said skip but the job somehow ran — honour its
          # actual result rather than assuming.
          if [ "$TESTS_RESULT" = "success" ]; then
            echo "Heavy MLS tests ran and passed."
            exit 0
          fi
          echo "::error::Unexpected state (run_tests=$RUN_TESTS tests=$TESTS_RESULT) — failing closed."
          exit 1
