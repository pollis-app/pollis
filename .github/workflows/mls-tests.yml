# CI gate for MLS correctness: remote schema, DS write-API contract and
# serializer, MLS crypto/state-machine unit tests, the TUI smokes, clippy, and
# the macOS at-rest tests. These protect the "invalid states unrepresentable" /
# bulletproof-membership invariants (docs/backend-core-invariants.md). Building
# pollis-core pulls the native media stack (libwebrtc / cpal /
# webrtc-audio-processing) and clippy covers src-tauri (webkit), so this needs
# the same Linux system deps as a desktop build.
#
# Unit tests and build checks only (#2022). The multi-client integration flows
# harness (`--test flows`) and the marathon soak are integration suites: they
# live in mls-flows.yml, run on dispatch, and the author runs `flows` locally
# before merging a change it covers.
#
# Merge-blocking design (#698). The heavy `tests` job is expensive and pointless
# for PRs that can't touch it (frontend, marketing site, docs/markdown). It used
# to be exempted with a job-level `paths-ignore`, but a path-filtered workflow
# does not run AT ALL on an exempt PR — so a *required* status check would sit
# pending forever and wedge every frontend-only PR. This workflow therefore
# ALWAYS triggers and ALWAYS reports, in four jobs:
#   1. `changes` — a seconds-cheap decision job (no checkout, no toolchain, no
#      apt) that asks the PR's changed-file list whether any NON-exempt file was
#      touched. Ignore-list, not allow-list: the exemptions are exactly the old
#      `paths-ignore` (frontend/website/docs/markdown), so any Rust/workspace
#      change still trips it. Non-PR triggers (push/dispatch) always say yes.
#   2. `tests`   — the heavy native build+test job, gated on that decision. On
#      an exempt PR it is simply skipped.
#   3. `macos-at-rest` — the local-database at-rest tests on `macos-latest`,
#      gated on the same decision. macOS is the third desktop platform and the
#      only one whose SQLCipher crypto provider is CommonCrypto, and nothing
#      ran these tests there until #998.
#   4. `gate`    — `needs: [tests, macos-at-rest]`, `if: always()`.
#      Green when both heavy jobs passed OR were legitimately skipped as
#      exempt; red when either failed, was cancelled, or the decision job
#      itself failed (fail-closed). Because it always runs it always reports,
#      so it — NOT the heavy jobs — is the check to mark required in branch
#      protection.
name: MLS & delivery tests

on:
  # No paths filter here: the workflow must always run so `gate` always reports.
  # Exemption is decided inside the `changes` job instead (see the comment above).
  pull_request:
  # `main` too, path-filtered, for the same two reasons as windows-link.yml: it
  # re-checks the merge result, and it is what keeps the `tests` cache (which
  # mls-flows.yml's on-demand jobs also restore) fresh.
  push:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/config.toml'
      - 'rust-toolchain.toml'
      - 'pollis-schema/migrations/**'
      - 'pollis-sqlcipher/**'
      # The non-Rust files the PR-side `changes` job also runs on.
      - 'docs/ds-operator-endpoints.md'
      - 'scripts/emoji-shortcodes.json'
      - 'scripts/ci-free-disk.sh'
      - 'scripts/ci-apt-retries.sh'
      - 'scripts/ci-apt-install.sh'
      - 'scripts/install-clang.sh'
      - '.github/workflows/mls-tests.yml'
      - '.github/actions/native-build-deps/**'
  # By hand, for a full run on any branch. The nightly schedule and its marathon
  # soak moved to mls-flows.yml as on-demand jobs (#2022), which also retired
  # the nightly triage workflow that reported them.
  workflow_dispatch:

permissions:
  contents: read
  # dorny/paths-filter reads the PR's changed-file list via the API (no checkout).
  pull-requests: read

# Keyed on the event as well as the ref, so a dispatched run on `main` is not
# cancelled by the next push. Pushes and PR updates supersede their own earlier
# runs.
concurrency:
  group: mls-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # Seconds-cheap gatekeeper: decide whether the heavy Rust job needs to run.
  # No checkout, no toolchain, no apt — just an API-backed changed-file query on
  # PRs, and an unconditional "yes" on every other trigger.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_tests: ${{ steps.decide.outputs.run_tests }}
    steps:
      # Ignore-list matching the old `paths-ignore`: a changed file trips `rust`
      # only if it is NOT under any exempt surface. `predicate-quantifier: every`
      # ANDs the negated patterns, so a file matches `rust` iff it is neither a
      # frontend, website, docs, nor markdown file — i.e. any real Rust/workspace
      # change flips the output to `true`. Skipped on non-PR events, which the
      # decide step forces to `true` regardless.
      - name: Detect non-exempt changes (PRs only)
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          predicate-quantifier: 'every'
          filters: |
            rust:
              - '!frontend/**'
              - '!website/**'
              - '!docs/**'
              - '!**/*.md'
              # Surfaces that cannot change Rust behaviour. Before these were listed,
              # a workflow-or-docs-only PR paid the full ~31-minute integration gate:
              # five such PRs in one day cost ~2.5 hours of CI for changes that could
              # not affect a single test.
              - '!.github/**'
              - '!scripts/**'
              - '!.codesight/**'
              - '!infra/**'
              - '!learn/**'
              - '!specs/**'
              - '!e2e/**'
              # The mobile app and the root JS manifests. No crate builds or reads
              # anything under mobile/ (pollis-core is the Rust side of mobile, and
              # it is not exempt), and the root package.json / pnpm lockfile are
              # node-only: a vite Dependabot bump paid the full ~30-minute gate for
              # a lockfile no Rust test can see. mobile-core-check.yml gates mobile.
              - '!mobile/**'
              - '!package.json'
              - '!pnpm-lock.yaml'
              - '!pnpm-workspace.yaml'
            # ...but this workflow DEFINES the gate, so editing it must still run it.
            # Exempting `.github/**` wholesale would let a change to the harness skip
            # the very suite it configures — the one edit that most needs proving.
            harness:
              - '.github/workflows/mls-tests.yml'
            # The composite action `tests` installs its system deps with.
            nativedeps:
              - '.github/actions/native-build-deps/**'
            # Two files under exempt directories that Rust DOES compile in, via
            # `include_str!`: the DS operator runbook pollis-api's tests check
            # against the endpoint list, and the TUI's emoji shortcode table. One
            # pattern per filter (see windows-link.yml): `every` applies to all.
            runbook:
              - 'docs/ds-operator-endpoints.md'
            shortcodes:
              - 'scripts/emoji-shortcodes.json'
            # The CI helpers the heavy jobs run (disk, apt, clang). They sit under
            # the exempt scripts/**, so without this a PR that broke one would go
            # green here and turn `main` red on the next Rust merge. One pattern
            # per filter, as above.
            freedisk:
              - 'scripts/ci-free-disk.sh'
            aptretries:
              - 'scripts/ci-apt-retries.sh'
            aptinstall:
              - 'scripts/ci-apt-install.sh'
            clang:
              - 'scripts/install-clang.sh'
      - name: Decide whether the heavy Rust gate must run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          FILTERED: ${{ steps.filter.outputs.rust }}
          HARNESS: ${{ steps.filter.outputs.harness }}
          NATIVEDEPS: ${{ steps.filter.outputs.nativedeps }}
          RUNBOOK: ${{ steps.filter.outputs.runbook }}
          SHORTCODES: ${{ steps.filter.outputs.shortcodes }}
          FREEDISK: ${{ steps.filter.outputs.freedisk }}
          APTRETRIES: ${{ steps.filter.outputs.aptretries }}
          APTINSTALL: ${{ steps.filter.outputs.aptinstall }}
          CLANG: ${{ steps.filter.outputs.clang }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # A real Rust change, an edit to this workflow itself, or a file
            # Rust compiles in from an otherwise-exempt directory.
            if [ "$FILTERED" = "true" ] || [ "$HARNESS" = "true" ] || [ "$NATIVEDEPS" = "true" ] || [ "$RUNBOOK" = "true" ] || [ "$SHORTCODES" = "true" ] \
              || [ "$FREEDISK" = "true" ] || [ "$APTRETRIES" = "true" ] || [ "$APTINSTALL" = "true" ] || [ "$CLANG" = "true" ]; then
              echo "run_tests=true" >> "$GITHUB_OUTPUT"
            else
              echo "run_tests=false" >> "$GITHUB_OUTPUT"
            fi
            echo "rust=$FILTERED harness=$HARNESS nativedeps=$NATIVEDEPS runbook=$RUNBOOK shortcodes=$SHORTCODES ci-scripts=$FREEDISK/$APTRETRIES/$APTINSTALL/$CLANG"
          else
            # push / workflow_dispatch / any non-PR trigger: always run the
            # full gate.
            echo "run_tests=true" >> "$GITHUB_OUTPUT"
          fi

  tests:
    needs: changes
    # Run the heavy native build+test only when the decision job says a
    # Rust/workspace file changed (always true for push/dispatch). Exempt PRs
    # skip it; `gate` below still reports a result either way.
    if: ${{ needs.changes.outputs.run_tests == 'true' }}
    # 24.04, not 22.04: src-tauri/build.rs compiles pollis-capture-linux, whose
    # libspa 0.9 bindgen needs PipeWire >= 1.0 headers (same reason the release
    # workflow's build-capture-helper job runs on 24.04). No AppImage is built
    # here, so the 22.04 glibc-floor concern doesn't apply.
    runs-on: ubuntu-24.04
    # A cold build is ~28 min; nothing legitimate needs the default six hours.
    timeout-minutes: 50
    env:
      # The flows test binary links the whole native stack (Tauri + libwebrtc +
      # livekit + cpal); with full DWARF it grew large enough to crash the runner's
      # linker (`ld ... signal 7 [Bus error]` — link-time memory/disk exhaustion).
      # Tests don't need debuginfo (assertions print their own context / op
      # sequences, not backtraces), so drop it to shrink the binary and the link.
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reclaim ~20-30 GB of preinstalled toolchains we don't use, so linking the
      # large native test binary can't exhaust the runner's disk/tmpfs (the other
      # trigger for the `ld` bus error) — but only when the disk is actually
      # short. The ubuntu-24.04 runners now have a 145 GB root with ~90 GB free
      # before any cleanup, and the unconditional cleanup cost 2-6 minutes of
      # every one of this workflow's five Linux jobs (median 1.9, max 7.7).
      - name: Free disk space (only if short)
        run: bash scripts/ci-free-disk.sh

      # The PINNED toolchain, not `@stable`. The action exports
      # `RUSTUP_TOOLCHAIN`, which OVERRIDES `rust-toolchain.toml` — so this job
      # was silently testing on whatever stable happened to be that week while
      # releases build on 1.96.0, and it would ignore the pin's new `clippy`
      # component. Pinning here makes the lint gate below deterministic (a new
      # stable's new lints cannot turn an untouched PR red on their own) and
      # makes the gate test what actually ships. Bump in lockstep with
      # rust-toolchain.toml and the desktop-release refs.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.96.0
        with:
          # Explicit, so the toolchain does not depend on which branch the pinned SHA is (#1353).
          toolchain: 1.96.0
          components: clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            src-tauri
          # No rustc-environment hash in the key. rust-cache hashes EVERY
          # installed toolchain into it, including the runner image's own
          # `stable` (1.99.x), which differs between images mid-rollout — so a
          # PR landing on a different image than the one `main` saved on missed
          # the cache outright ("No cache found"): 22 of 27 PR runs of this job
          # in Oct 2026 built cold (~28 min) instead of warm (~8-14 min). The
          # toolchain that matters is pinned above and rust-toolchain.toml is
          # already part of the lockfile hash, so the env hash bought nothing.
          add-rust-environment-hash-key: false
          # Only `main` WRITES the cache; PR branches still restore from it and
          # get the same speedup. Without this every branch stored its own ~1.8 GiB
          # copy under the same key, and this repo sat permanently over GitHub's
          # 10 GiB per-repo budget (11.34 GiB observed, of which 7.1 GiB was four
          # identical-keyed copies of THIS cache). Being over budget makes GitHub
          # evict least-recently-used entries, which silently disarmed the
          # transparency equivocation tripwire for months — see #759.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # apt packages, clang 21 and meson (see the action for the why of each).
      - name: Native build dependencies
        uses: ./.github/actions/native-build-deps

      # #987 removed the "Provision .env.test" step that used to sit here. The
      # flows harness has backed "remote Turso" with LOCAL libsql files since
      # #420, so the two values it wrote were literal placeholders — present
      # only because `Config::for_test` still had `turso_url` / `turso_token`
      # fields to fill. The client holds no database credential now and those
      # fields are gone, so the suite runs with every TURSO_* and LOG_DB_*
      # variable unset. That is the property #987 claims, and this job is where
      # it is exercised.

      # The remote schema itself (#924). Runs FIRST — it is seconds-cheap, it has
      # no system deps, and it is the definition every other job here stamps its
      # databases from. Its tests are the only automatic check that a migration
      # file on disk is actually LISTED (an unlisted file is applied by
      # `db-apply.sh` in production and by no harness — a test passing against a
      # schema no deploy has), that versions are unique and ascending, and that
      # `single_db_scripts()` keeps main-then-log order, which is what a single-DB
      # deploy depends on to get migrations-log/000004's `generation` column.
      # Nothing ran these before, so the constraint every deployment relies on was
      # pinned only by a test nobody executed.
      - name: Remote schema + migration ordering (pollis-schema)
        run: cargo test -p pollis-schema

      # The client/server wire contract (#875). Runs early because it is a cheap
      # signal and the most load-bearing: its `compile_fail` doctests ARE
      # the guarantee that a client body missing or misspelling a field cannot
      # compile, so a contract that CI never exercises would be worth nothing.
      - name: DS write-API contract (pollis-api)
        if: ${{ !cancelled() }}
        run: cargo test -p pollis-api

      # Cheap and media-free — fast signal that the DS serializer holds. Includes
      # the route-coverage test: every endpoint declared in `pollis-api` must be
      # served by the real router (#918).
      - name: DS serializer + route coverage (pollis-delivery)
        if: ${{ !cancelled() }}
        run: cargo test -p pollis-delivery

      # openmls-level MLS state-machine tests (mls/tests.rs, reconcile, etc.).
      #
      # `--features test-harness` (#914): the feature exists so integration
      # tests can reach constructors and overrides that are `#[cfg(any(test,
      # feature = "test-harness"))]` — the in-memory MLS storage
      # (`signal/mls_storage.rs`), the config overrides (`config.rs`), the R2
      # stubs (`commands/r2.rs`) and the message test helpers. Without it those
      # tests do not fail, they silently compile to nothing here while passing
      # locally, which is the failure mode worth guarding against. The feature
      # only ADDS test-only items; it changes no production behaviour, and the
      # flows harness (mls-flows.yml) already runs with it.
      #
      # It used to be justified here by `RemoteDb::connect_local` and
      # `tests/remote_with_retry.rs`. #987/#988 deleted `RemoteDb` and the
      # client's database handle outright, so both are gone — the feature is
      # still load-bearing for the reasons above.
      #
      # `import` compiles the shelved structure importer (#1180/#1179), which no
      # shipped build enables, so it keeps building here.
      - name: MLS unit tests (pollis-core)
        if: ${{ !cancelled() }}
        run: cargo test -p pollis-core --features test-harness,import

      # The Windows crypto provider (#992), exercised on Linux. `pollis-sqlcipher`
      # only SHIPS on Windows, but it compiles its SQLCipher amalgamation on
      # every target precisely so this step exists: the known-answer vectors for
      # AES-256-CBC / HMAC / PBKDF2, and a real encrypted database whose bytes
      # are read back off the disk. A provider mistake therefore fails here in
      # seconds instead of surviving until the Windows job runs.
      - name: SQLCipher crypto provider (pollis-sqlcipher)
        if: ${{ !cancelled() }}
        run: cargo test -p pollis-sqlcipher

      # pollis-tui unit + smoke tests (the headless in-process-DS rig — no
      # webkit/ALSA). Nothing ran these before, so DS-spine changes could regress
      # the TUI's sync path unnoticed (#487). The smoke rig applies the same
      # baseline + post-baseline log migrations as production.
      - name: TUI unit + smoke tests (pollis-tui)
        if: ${{ !cancelled() }}
        run: cargo test -p pollis-tui

      # #1182: the bot runtime's job loop, webhook and subcommands, plus its
      # in-process-DS flows test (two hosts, one post). Headless like the TUI.
      - name: Bot runtime tests (pollis-bot)
        if: ${{ !cancelled() }}
        run: cargo test -p pollis-bot

      # The multi-client flows harness RUNS on demand in mls-flows.yml (#2022).
      # It is still BUILT (not run) here on `main`, because this job is the only
      # writer of the `tests` cache those jobs restore (`shared-key: tests`),
      # and rust-cache saves only the dependencies a job actually compiled —
      # without this step the cache would stop carrying the Tauri/test-harness
      # half of the graph and every dispatched run would rebuild it cold. PR
      # runs never save the cache, so they skip it.
      - name: Build the flows harness (cache warm-up for mls-flows.yml)
        if: ${{ github.ref == 'refs/heads/main' && !cancelled() }}
        working-directory: src-tauri
        run: cargo test --features test-harness --test flows --no-run

      # The Rust lint gate (#912). Until now `cargo clippy` was not even
      # installed for the pinned toolchain, so thousands of lines merged without
      # one lint pass ever running — including the work whose own audit found
      # duplication drifting into divergence, which is exactly what these lints
      # catch. `rust-toolchain.toml` now lists the component, so nothing has to
      # install it here.
      #
      # It lives in THIS job rather than its own: the toolchain, the ~10 apt
      # packages pollis-core/src-tauri need, and the warm cargo cache are already
      # here, and a separate job would duplicate all three plus a cache entry
      # (the repo has been over GitHub's 10 GiB budget before — #759). Placed
      # last so the merge-blocking test signal lands first; `-D warnings` makes a
      # new lint fail the job, which the `gate` check below already reports.
      - name: Rust lints (clippy)
        if: ${{ !cancelled() }}
        # The two features lint the shelved importer (#1180/#1179), which no
        # shipped build enables: the desktop shims and the TUI's dev-DS peer.
        run: cargo clippy --workspace --all-targets --features pollis/import,pollis-tui/import-peer -- -D warnings

  # The local database's at-rest guarantee, on the third desktop platform (#998).
  #
  # Until now these tests ran on Linux (the `tests` job above) and natively on
  # `windows-latest` (`windows-link.yml`), and on no macOS runner anywhere — the
  # only macOS jobs in the repo are `mobile-core-check`'s iOS *cross-compile*
  # check and the tag-triggered release builds (desktop, CLI, verifier), none of
  # which executes a test.
  # So the platform whose crypto provider is the odd one out was also the
  # platform with no evidence.
  #
  # macOS is worth its own job precisely because of that provider. Linux and
  # mobile take SQLCipher's primitives from OpenSSL and Windows from the
  # RustCrypto provider in `pollis-sqlcipher`; macOS is the only one on
  # CommonCrypto, and it is selected by `libsqlite3-sys`'s build script at build
  # time, not by anything in this repository — an `OPENSSL_DIR` (or
  # `OPENSSL_LIB_DIR` + `OPENSSL_INCLUDE_DIR`) on the machine flips it to
  # OpenSSL silently. `the_crypto_provider_is_the_one_this_platform_documents`
  # is what turns that into a red job instead of a quiet divergence from
  # docs/security-whitepaper.md §7.0.
  #
  # `--no-default-features` on purpose: it drops `media` (libwebrtc, cpal,
  # rodio, the vendored webrtc-audio-processing C++ build) and `os-keystore`,
  # none of which the at-rest path touches — `LocalDb::open_for_user` takes the
  # 32-byte key as an argument. It does NOT weaken what the tests prove:
  # `cargo tree -i libsqlite3-sys` is identical with and without `media`
  # (rusqlite is the only path to it either way), so the "which sqlite3 won the
  # symbols" question the tests answer is the same question the shipping build
  # asks. What it buys is the job finishing in minutes on a runner billed at 10x
  # instead of pulling the whole native media stack onto it.
  macos-at-rest:
    needs: changes
    if: ${{ needs.changes.outputs.run_tests == 'true' }}
    runs-on: macos-latest
    # Measured from the job's START, so queueing for a runner does not count
    # (an unacquired job is dropped by GitHub after 15 minutes either way).
    # A warm run takes ~3.5 min.
    timeout-minutes: 25
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      # cargo's default is 3 quick retries per download.
      CARGO_NET_RETRY: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The PINNED toolchain, like every other Rust job here: a gate that tests
      # on a different rustc than the release builds with is not a gate.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.96.0
        with:
          # Explicit, so the toolchain does not depend on which branch the pinned SHA is (#1353).
          toolchain: 1.96.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: macos-at-rest
          # See the `tests` job: the runner's own toolchain must not split the key.
          add-rust-environment-hash-key: false
          # Only `main` WRITES the cache; PR branches restore from it. The repo
          # has been over GitHub's 10 GiB cache budget before (#759).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Downloads in their own step, so a network failure cannot read as a test
      # failure. On #1799 this job restored no cache (the repo is routinely over
      # its 10 GiB cache budget) and the test step exited 101 six seconds in,
      # far too soon to have compiled anything, and with no Cargo change between
      # that push and the green one after it (#1803). A cold job downloads every
      # crate and the openmls git dependency; this retries that as a unit.
      - name: Fetch crates
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cargo fetch; then
              exit 0
            fi
            echo "::warning::cargo fetch attempt $attempt failed"
            sleep $((attempt * 20))
          done
          echo "::error::cargo fetch failed three times; this is the network, not the at-rest tests."
          exit 1

      # Deliberately NO OpenSSL provisioning, and nothing here may add any: on
      # Apple targets `libsqlite3-sys` picks CommonCrypto only when it finds no
      # OpenSSL. See the provider test named below.
      - name: Assert the local database is encrypted at rest
        shell: bash
        run: |
          set -uo pipefail
          # Captured rather than streamed so the assertions below can read it —
          # and printed before the exit check, so a failure still leaves the log
          # in the job output instead of an empty red step. `|| rc=$?`, not a
          # bare assignment: Actions runs `bash -e`, which exits on a failing
          # `out="$(...)"` before the echo, and the log came out empty (#1797).
          rc=0
          out="$(cargo test -p pollis-core --lib --no-default-features -- db::local::tests:: 2>&1)" || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ]; then
            echo "::error::db::local tests failed on macOS"
            exit "$rc"
          fi
          # libtest EXITS 0 when a filter matches nothing, so renaming or
          # deleting these would silently turn this step into a no-op. Demand
          # that each of the four load-bearing ones appears in the run; with
          # rc == 0 already established, appearing means it passed.
          for t in sqlcipher_is_the_sqlite_we_actually_linked \
                   the_local_database_file_is_encrypted_at_rest \
                   the_crypto_provider_is_the_one_this_platform_documents \
                   a_plaintext_database_is_destroyed_not_opened; do
            if ! printf '%s\n' "$out" | grep -q "db::local::tests::$t"; then
              echo "::error::$t did not run on macOS"
              exit 1
            fi
          done

  # The always-reporting required check. Runs on every trigger regardless of what
  # the heavy jobs did, and collapses the outcome into a single pass/fail.
  # Fail-closed: the only way to green is a genuine pass or a genuine exemption.
  # The flows harness is not in it: it is on demand in mls-flows.yml (#2022).
  gate:
    needs: [changes, tests, macos-at-rest]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_TESTS: ${{ needs.changes.outputs.run_tests }}
          TESTS_RESULT: ${{ needs.tests.result }}
          MACOS_RESULT: ${{ needs.macos-at-rest.result }}
        run: |
          echo "changes=$CHANGES_RESULT run_tests=$RUN_TESTS tests=$TESTS_RESULT macos=$MACOS_RESULT"
          # The decision must have completed cleanly; if it failed or was
          # cancelled we cannot trust the exemption verdict, so fail closed.
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Decision job did not succeed ($CHANGES_RESULT) — failing closed."
            exit 1
          fi
          if [ "$RUN_TESTS" = "true" ]; then
            # A Rust/workspace change: BOTH heavy jobs MUST have run and passed.
            # Anything else (failure / cancelled / skipped) is a hard fail — this
            # is the one outcome we must never let go green.
            if [ "$TESTS_RESULT" != "success" ]; then
              echo "::error::Heavy MLS tests were required but their result was '$TESTS_RESULT' — failing."
              exit 1
            fi
            if [ "$MACOS_RESULT" != "success" ]; then
              echo "::error::macOS at-rest tests were required but their result was '$MACOS_RESULT' — failing."
              exit 1
            fi
            echo "Heavy MLS tests and macOS at-rest tests passed."
            exit 0
          fi
          # Exempt PR (frontend/website/docs/markdown only): the heavy jobs were
          # legitimately not run.
          if [ "$TESTS_RESULT" = "skipped" ] && [ "$MACOS_RESULT" = "skipped" ]; then
            echo "Exempt PR — no Rust/workspace change, heavy jobs correctly skipped."
            exit 0
          fi
          # Defensive: exemption said skip but the jobs somehow ran — honour
          # their actual results rather than assuming.
          if [ "$TESTS_RESULT" = "success" ] && [ "$MACOS_RESULT" = "success" ]; then
            echo "Heavy jobs ran and passed."
            exit 0
          fi
          echo "::error::Unexpected state (run_tests=$RUN_TESTS tests=$TESTS_RESULT macos=$MACOS_RESULT) — failing closed."
          exit 1
