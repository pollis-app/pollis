# Manual deploy of the LiveKit + nginx ingress stack to the VPS.
#
# Unlike the Delivery Service (built in CI, rolled by Watchtower — see
# delivery-deploy-*.yml / #407), LiveKit and nginx run UPSTREAM images with
# mounted config. Their deployable is config files, which Watchtower can't carry
# and can't bootstrap a fresh box — so this uses Option B: SSH + `docker compose`
# (#410). One-click from the Actions tab; the workflow SSHes to the box, syncs
# the canonical `livekit/` config, renders the LiveKit keys from secrets, and
# brings the stack up.
#
# Manual only — no push/tag trigger. See #406 (deploy-button pattern), #410.
name: Deploy LiveKit + nginx

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [prod, dev]
        default: prod
      ref:
        description: Git ref to deploy (branch, tag, or SHA)
        required: false
        default: main

permissions:
  contents: read

# One deploy per environment at a time; never cancel an in-flight deploy.
concurrency:
  group: livekit-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # GitHub Environment: optional manual-approval gate + audit trail, matching
    # the delivery deploys. Create `livekit-prod` (and `livekit-dev` if used).
    environment: livekit-${{ inputs.environment }}
    env:
      VPS_HOST: ${{ vars.VPS_HOST }}
      VPS_USER: ${{ vars.VPS_USER }}
      # Path to the canonical config dir on the box (bind-mount source).
      REMOTE_DIR: /root/livekit
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Preflight — required secrets/vars present
        run: |
          set -euo pipefail
          missing=()
          [ -n "${VPS_HOST}" ] || missing+=("vars.VPS_HOST")
          [ -n "${VPS_USER}" ] || missing+=("vars.VPS_USER")
          [ -n "${{ secrets.VPS_SSH_KEY }}" ] || missing+=("secrets.VPS_SSH_KEY")
          [ -n "${{ secrets.LIVEKIT_API_KEY }}" ] || missing+=("secrets.LIVEKIT_API_KEY")
          [ -n "${{ secrets.LIVEKIT_API_SECRET }}" ] || missing+=("secrets.LIVEKIT_API_SECRET")
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '::error::Missing required config: %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Render LiveKit keys into livekit.yml
        env:
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          set -euo pipefail
          # The committed livekit.yml has no `keys:` block by design; append it
          # here so the secret only ever lives on the runner + the box, never git.
          {
            printf '\nkeys:\n'
            printf '  %s: %s\n' "${LIVEKIT_API_KEY}" "${LIVEKIT_API_SECRET}"
          } >> livekit/livekit.yml

      - name: Preflight — TURN hostname resolves straight to this box
        run: |
          set -euo pipefail
          # LiveKit hands clients `turns:turn.pollis.com:443` (the port is
          # hardcoded — see livekit.yml). If that name does not resolve, or
          # resolves to anything other than this VPS, TURN is dead on arrival and
          # the failure is invisible: ICE just never finds a working candidate.
          # In particular a Cloudflare-PROXIED record (orange cloud) resolves to
          # Cloudflare, which does not speak TURN — it must be DNS-only.
          got="$(getent ahostsv4 turn.pollis.com | awk '{print $1}' | sort -u | tr '\n' ' ' | sed 's/ $//')" || true
          if [ -z "${got}" ]; then
            echo "::error::turn.pollis.com does not resolve. Create a DNS-only (grey-cloud) A record -> ${VPS_HOST} before deploying."
            exit 1
          fi
          if [ "${got}" != "${VPS_HOST}" ]; then
            echo "::error::turn.pollis.com resolves to '${got}', expected '${VPS_HOST}'. A proxied/CDN record cannot carry TURN."
            exit 1
          fi
          echo "turn.pollis.com -> ${got}"

      - name: Set up SSH
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Preflight — host is ready for the widened relay range
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy "${VPS_USER}@${VPS_HOST}" 'bash -seuo pipefail' <<'REMOTE'
            fail=0

            # 1. Userland proxy MUST be off. Docker forks two docker-proxy
            #    processes per published port; at 1000 relay ports that is 2000
            #    processes and ~22s of container start (measured), which this
            #    7 GB box will not survive. Disabled, the contiguous range is a
            #    single iptables DNAT rule and costs nothing. Checked BEFORE
            #    `compose up` so a missing setting aborts instead of OOMing.
            if ! grep -Eq '"userland-proxy"[[:space:]]*:[[:space:]]*false' /etc/docker/daemon.json 2>/dev/null; then
              echo "::error::/etc/docker/daemon.json is missing '\"userland-proxy\": false'. See livekit/DEPLOY.md — set it and 'systemctl restart docker' before deploying."
              fail=1
            fi

            # 2. The TURNS certificate must cover turn.pollis.com. nginx serves
            #    the rtc.pollis.com lineage on both hostnames, so turn must be a
            #    SAN on it or every client's TLS verification fails silently.
            CERT=/etc/letsencrypt/live/rtc.pollis.com/fullchain.pem
            if [ ! -f "${CERT}" ]; then
              echo "::error::${CERT} is missing."
              fail=1
            elif ! openssl x509 -in "${CERT}" -noout -text | grep -q 'DNS:turn.pollis.com'; then
              echo "::error::${CERT} has no turn.pollis.com SAN. Expand it (see livekit/DEPLOY.md) before deploying."
              fail=1
            fi

            # 3. Firewall must pass the whole relay range. Ports LiveKit
            #    allocates but the firewall drops are the silent-relay-failure
            #    bug this deploy is fixing. Only enforced when ufw is the active
            #    firewall — a control-panel firewall can't be checked from here.
            if command -v ufw >/dev/null && ufw status 2>/dev/null | grep -q '^Status: active'; then
              if ! ufw status | grep -q '30000:30999/udp'; then
                echo "::error::ufw does not allow 30000:30999/udp. Run 'ufw allow 30000:30999/udp' (see livekit/DEPLOY.md)."
                fail=1
              fi
            else
              echo "::warning::ufw inactive or absent — verify the relay range 30000-30999/udp is open in the host control-panel firewall."
            fi

            exit "${fail}"
          REMOTE

      - name: Sync config to the box (staging dir)
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/id_deploy"
          $SSH "${VPS_USER}@${VPS_HOST}" "mkdir -p ${REMOTE_DIR}/.staging"
          scp -i ~/.ssh/id_deploy \
            livekit/nginx.conf livekit/livekit.yml livekit/docker-compose.yml \
            "${VPS_USER}@${VPS_HOST}:${REMOTE_DIR}/.staging/"

      - name: Apply config + bring the stack up
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy "${VPS_USER}@${VPS_HOST}" REMOTE_DIR="${REMOTE_DIR}" 'bash -seuo pipefail' <<'REMOTE'
            cd "${REMOTE_DIR}"
            # Apply bind-mounted files IN PLACE (cat >, not mv): nginx.conf and
            # livekit.yml are bind-mounted by inode into the running containers
            # (#405), so a rename would leave the container reading the old inode.
            cat .staging/nginx.conf      > nginx.conf
            cat .staging/livekit.yml     > livekit.yml
            # The compose file is read by the CLI, not bind-mounted — plain copy.
            cp .staging/docker-compose.yml docker-compose.yml
            rm -rf .staging

            # Pull pinned images + (re)create only what changed.
            docker compose -f docker-compose.yml up -d

            # nginx.conf may have changed without the service def changing (bind
            # mount, content-only) — validate then reload to pick it up gracefully.
            #
            # `< /dev/null` ON EVERY `exec -T` IS LOAD-BEARING, NOT TIDINESS.
            # This script is fed to ssh on stdin via the heredoc below, and
            # `docker compose exec -T` forwards ITS stdin to the container — so
            # without the redirect it consumes the rest of this script. Every line
            # after the first `exec -T` was silently skipped, and because the
            # swallowed lines never ran, the step still exited 0 and the deploy
            # reported success. Symptom: nginx.conf and livekit.yml changes appeared
            # to deploy but never took effect (verified 2026-08-11 — the containers'
            # StartedAt was 8h older than a "successful" deploy).
            docker compose exec -T nginx nginx -t < /dev/null

            # `nginx -s reload` is the graceful path, but in the official image nginx
            # runs as PID 1 with `daemon off`; SIGHUP via the container is the
            # reliable equivalent and needs no pidfile lookup. Workers respawn with
            # the new worker_processes / worker_connections; existing connections drain.
            docker kill -s HUP livekit-nginx-1

            # livekit reads its config only at start — restart to apply livekit.yml.
            docker compose restart livekit < /dev/null

            # Prove the reload actually happened: fresh workers, and the effective
            # connection ceiling. A deploy that cannot show this has not applied.
            echo "--- nginx workers after reload ---"
            docker compose exec -T nginx ps -o pid,etime,args < /dev/null 2>/dev/null | grep -E "master|worker" || true
            docker compose exec -T nginx nginx -T < /dev/null 2>/dev/null | grep -E "worker_processes|worker_connections" || true

            docker compose ps < /dev/null
          REMOTE

      - name: Validate — LiveKit up
        run: |
          set -euo pipefail
          # LiveKit answers GET / with "OK", but takes a couple seconds after a
          # restart to discover its external IP (STUN) and bind :7880 — until
          # then nginx returns 502. Retry transient errors instead of racing the
          # boot, rather than failing the deploy on a not-yet-ready upstream.
          echo "rtc.pollis.com:"
          curl -fsS --retry 10 --retry-delay 3 --retry-all-errors --retry-connrefused --max-time 20 https://rtc.pollis.com ; echo
          # (The Delivery Service moved to Cloudflare Containers in #515 and is no
          # longer proxied by this nginx, so there's nothing DS-related to assert here.)

      - name: Validate — TURNS answers on 443 with a hostname-valid cert
        run: |
          set -euo pipefail
          # The whole point of this stack: a client on a network that only allows
          # 443 must be able to complete TLS to turn.pollis.com:443 and have the
          # certificate verify against that name. `-verify_return_error` +
          # `-verify_hostname` make a bad SAN a hard failure rather than a warning
          # buried in output, because the client-side symptom is silence.
          echo | openssl s_client -connect turn.pollis.com:443 \
            -servername turn.pollis.com \
            -verify_hostname turn.pollis.com \
            -verify_return_error -brief 2>&1 | sed 's/^/  /'
          # And prove the SNI actually routed to TURN, not back to the web vhost:
          # the web vhost speaks HTTP, so an HTTP request over this TLS session
          # would answer 200/301. TURN does not, so an empty/non-HTTP reply is the
          # pass condition.
          resp="$(printf 'GET / HTTP/1.1\r\nHost: turn.pollis.com\r\nConnection: close\r\n\r\n' \
            | timeout 20 openssl s_client -connect turn.pollis.com:443 -servername turn.pollis.com -quiet 2>/dev/null \
            | head -c 64 || true)"
          if printf '%s' "${resp}" | grep -q '^HTTP/1'; then
            printf '::error::turn.pollis.com:443 answered HTTP (%s) — SNI demux fell through to the web vhost, TURN is NOT reachable.\n' "${resp}"
            exit 1
          fi
          echo "turn.pollis.com:443 did not answer HTTP — routed to the TURN listener."
