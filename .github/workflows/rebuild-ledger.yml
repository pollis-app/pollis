name: Rebuild ledger

# Keeps `website/rebuild-ledger.json` — the durable public record of every
# release's independent-rebuild verdict (#877) — in step with
# `rebuild-verify.yml`, without a human remembering to (#1041).
#
# Why this is its OWN workflow and not a step in rebuild-verify.yml: that
# workflow is a separate trust domain by construction — it references no
# `secrets.*` and never writes anything, which is what lets a third party fork
# and run the identical check. Giving it a token to publish its own verdict
# would destroy the one property that makes the verdict worth reading. So the
# verdict is collected here, out-of-band, from the PUBLIC Actions API, by the
# same `scripts/rebuild-ledger.sh` a human would run — this workflow merely
# runs it at the right moment and opens the pull request.
#
# A pull request rather than a push: `main` is ruleset-protected (PRs only).
#
# THE PR AUTO-MERGES WHEN THE VERDICT IS GREEN, and waits for a human only when
# it is not. The original design asked for "one human glance" at every verdict,
# and that was wrong in the green case: a green entry carries `classification:
# null` and `evidence: null`, the whole file is regenerated mechanically by
# `scripts/rebuild-ledger.sh`, and `website-verify.yml` re-runs that same script
# with `--check` every day. There is nothing for a person to look at, so asking
# for a glance only created a queue.
#
# It did not stay theoretical. The v1.13.0 ledger PR sat unmerged for four days
# — its own checks were stuck on `action_required`, because a GitHub App opened
# it — and `website-verify.yml` went red every one of those days pointing at it,
# while the public assurance page advertised a stale verdict. Nobody noticed
# until someone asked what the open PR was for.
#
# A NON-green verdict still waits, and should: that is exactly when a `CLASSIFIED`
# entry has to be written by hand, and publishing an unexplained red is worse
# than publishing nothing. `website-verify.yml` keeps its daily `--check` as the
# backstop for that case.
#
# The branch is fixed and force-pushed: the ledger is regenerated whole from
# the run history every time, so the branch is always "main + one commit" and
# a second rebuild-verify run before the first PR merges simply updates it.

run-name: >-
  Rebuild ledger after ${{ github.event.workflow_run.display_title || 'manual dispatch' }}

on:
  workflow_run:
    workflows: ["Rebuild & Verify (independent reproducer)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # `read` for the public run history of rebuild-verify.yml (through the Actions
  # API); `write` because a landed green verdict dispatches website-deploy.yml,
  # without which pollis.com keeps serving the previous one.
  actions: write

concurrency:
  group: rebuild-ledger
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      # Fetch depth matters: the ledger resolves a run's tag from `headSha`
      # for runs with no log (a skipped run — a release that was never checked
      # at all), which needs the tags present.
      - name: Regenerate the ledger
        id: regen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet --depth=1 origin '+refs/tags/*:refs/tags/*' || true
          ./scripts/rebuild-ledger.sh
          # Compare on content only, like `--check` does: `generated_at` moves
          # on every run and must not produce an empty PR.
          before="$(git show HEAD:website/rebuild-ledger.json | jq -S 'del(.generated_at)')"
          after="$(jq -S 'del(.generated_at)' website/rebuild-ledger.json)"
          if [ "$before" = "$after" ]; then
            echo "rebuild ledger is already up to date — nothing to publish."
            git checkout -- website/rebuild-ledger.json
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the ledger pull request
        if: steps.regen.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_TITLE: ${{ github.event.workflow_run.display_title }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          branch="bot/rebuild-ledger"
          tag="$(printf '%s' "$RUN_TITLE" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
          if [ -n "$tag" ]; then
            subject="chore: refresh the rebuild ledger through ${tag}"
          else
            subject="chore: refresh the rebuild ledger"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add website/rebuild-ledger.json
          git commit -m "$subject"
          git push --force origin "$branch"

          if [ -n "$RUN_ID" ]; then
            body="Regenerated by \`scripts/rebuild-ledger.sh\` after [rebuild-verify run ${RUN_ID}](${RUN_URL}) finished (\`${RUN_CONCLUSION}\`)."
          else
            body="Regenerated by \`scripts/rebuild-ledger.sh\` (manual dispatch)."
          fi
          if [ "$RUN_CONCLUSION" != "success" ] && [ -n "$RUN_ID" ]; then
            body="${body}

          The run was not green: before merging, classify it in \`CLASSIFIED\` in \`scripts/rebuild-ledger.sh\` (\`false_red\` / \`environment_drift\` / \`real\`) with the evidence, or the assurance page publishes an unexplained red."
          fi

          existing="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$subject" --body "$body"
            echo "updated PR #${existing}"
            exit 0
          fi

          # `gh pr create` fails with a bare GraphQL error when the repository
          # has "Allow GitHub Actions to create and approve pull requests"
          # switched off. That is a REPOSITORY SETTING, invisible from the
          # workflow file, and the failure is one red run in a workflow nobody
          # watches — while website-verify.yml goes red every single day
          # afterwards pointing at a PR that was never opened. It burned a week
          # exactly that way. So name the setting in the error.
          if ! err="$(gh pr create --base main --head "$branch" \
            --title "$subject" --body "$body" 2>&1)"; then
            echo "$err" >&2
            case "$err" in
              *"not permitted to create or approve pull requests"*)
                echo "::error::GitHub Actions cannot open pull requests in this repository."
                echo "::error::  The ledger commit is pushed to \`${branch}\` and is not lost —"
                echo "::error::  only the PR is missing, and website-verify.yml will go red"
                echo "::error::  daily until it is merged."
                echo "::error::  Fix: Settings -> Actions -> General -> Workflow permissions"
                echo "::error::  -> tick 'Allow GitHub Actions to create and approve pull"
                echo "::error::  requests'. Then re-run this workflow."
                echo "::error::  Meanwhile, open the PR by hand from \`${branch}\`."
                ;;
            esac
            exit 1
          fi
          echo "$err"

      # A green verdict lands without waiting for anybody. See the header for
      # why this is not a rubber stamp: the file is script-generated, a green
      # entry holds no hand-written judgement, and website-verify re-derives it
      # daily. The failure this removes is a stale PUBLIC page, which is the
      # thing the ledger exists to prevent.
      #
      # `|| true` throughout: a ledger that cannot land must never fail the run
      # red and leave the impression the verdict itself was bad. The commit is
      # already pushed to the branch, website-verify still catches the lag, and
      # the step says plainly what a human has to do instead.
      - name: Land a green verdict, and refresh the public page
        if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          branch="bot/rebuild-ledger"
          pr="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$pr" ]; then
            echo "no open ledger PR — nothing to land (the ledger was already current)."
            exit 0
          fi

          # Keep the branch: this workflow force-pushes to the SAME fixed branch
          # every time, so deleting it on merge would break the next run.
          if gh pr merge "$pr" --squash; then
            echo "landed ledger PR #${pr}"
          else
            echo "::warning::could not auto-merge ledger PR #${pr} — merge it by hand."
            echo "::warning::  website-verify.yml will go red daily until you do."
            exit 0
          fi

          # The ledger is SERVED: website/rebuild-ledger.json is what
          # assurance.html renders. Merging alone leaves pollis.com advertising
          # the previous verdict, because website-deploy.yml is manual — which
          # is the second half of the same stale-page problem.
          if gh workflow run website-deploy.yml --ref main; then
            echo "dispatched website-deploy so the public page reflects the new verdict"
          else
            echo "::warning::ledger merged but website-deploy could not be dispatched;"
            echo "::warning::  pollis.com will show the previous verdict until it is run."
          fi
