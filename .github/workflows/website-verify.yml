name: Verify deployed website

# Asserts that pollis.com is serving what `main` says it should — specifically the
# claims a visitor is expected to TRUST (#761).
#
# Why this exists. Cloudflare Pages auto-deploy is off and `website-deploy.yml` is
# manual (#406, deliberate: `main` stays always-deployable and publishing is an
# explicit act). The cost is that the site can silently lag `main`, and the pages
# that lag are the ones making cryptographic claims. It has bitten twice:
#
#   * #732 — production served a pre-#668 `artifacts.js` with the retired Ed25519
#     constant compiled in, comparing a 64-char key against the 2624-char one the
#     server now serves. It could only ever render "✗ served key DIFFERS": a red
#     tamper alarm shown to every visitor, caused purely by a stale deploy.
#   * #720/#753/#757 — the Learn page told users there were two accepted message
#     losses while a second paragraph on the SAME page said three. The page
#     contradicted itself in public until someone grepped it.
#
# Neither is "the site is down". Both are "the site is confidently wrong", which
# no uptime check catches. So this asserts CONTENT, not availability.
#
# A NOTE ON REDIRECTS, because it already burned an hour: `/learn.html`
# 308-redirects to `/learn`. `curl` without `-L` returns an EMPTY body, so a naive
# grep reports "text not found" for the old AND the new wording — indistinguishable
# from "not deployed yet". Every fetch here uses `-fsSL`.

on:
  # After a deploy, and on a schedule so a site that drifts (or a deploy nobody
  # ran) is caught rather than waiting for a human to notice.
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: read
  # `actions: read` is for the rebuild-ledger check below, which reads the
  # public run history of rebuild-verify.yml through the Actions API.
  actions: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # `[[ ... == *glob* ]]` below is bash, and it replaces a `printf | grep -q`
    # pattern that was a SIGPIPE trap under `pipefail`: grep exits on the first
    # match, printf dies with 141, and the pipeline reports FAILURE because the
    # text was found. It failed on this workflow's very first real run.
    defaults:
      run:
        shell: bash
    env:
      SITE: https://pollis.com
    steps:
      - uses: actions/checkout@v4

      # 1. The pinned transparency key on /artifacts must equal the constant in
      #    pollis-core. These are the same claim made to two audiences, and a
      #    disagreement is indistinguishable to a visitor from a compromised log.
      #
      #    #945 split this in two. The IN-REPO half — do all nine hard-coded
      #    copies agree — now lives in `check-pinned-log-key.py` and runs on
      #    every PR via scripts-check.yml, because a check that only ever runs
      #    against production finds the problem after it has shipped. What is
      #    left here is the half only this workflow can do: is the DEPLOYED site
      #    serving what `main` says.
      - name: Pinned log key agrees across the repo (#945)
        run: python3 ./scripts/check-pinned-log-key.py

      - name: Deployed artifacts.js pins the key pollis-core compiles in
        run: |
          set -euo pipefail
          # Asked for by const NAME, not by "the first 2624-hex literal in the
          # file". That grep was correct only by accident: `PINNED_LOG_ROOT_KEYS`
          # holds a literal of the identical shape, so declaring it above the
          # signer would have silently made this step assert the root key while
          # still reporting success (#945).
          repo_key="$(python3 ./scripts/check-pinned-log-key.py --print signer)"
          if [ -z "$repo_key" ]; then
            echo "::error::could not read PINNED_LOG_PUBLIC_KEYS from pollis-core — has the shape changed?"
            exit 1
          fi
          live_js="$(curl -fsSL -m 30 "$SITE/artifacts.js")"
          if [[ "$live_js" == *"$repo_key"* ]]; then
            echo "✓ deployed artifacts.js pins the same key as pollis-core (${repo_key:0:16}…)"
          else
            echo "::error::pollis.com/artifacts.js does NOT pin the key pollis-core compiles in."
            echo "::error::  repo: ${repo_key:0:16}…  — the site is stale or the two have diverged."
            echo "::error::  A visitor sees a key comparison that cannot be trusted either way (#732)."
            exit 1
          fi

      # 2. The served key must also match what the log actually serves. Catches the
      #    #732 shape directly: a deployed page comparing against a retired key.
      - name: Deployed pin matches the live transparency log
        run: |
          set -euo pipefail
          served="$(curl -fsSL -m 30 https://verify.pollis.com/v1/public_key.json | jq -r '.public_key')"
          live_js="$(curl -fsSL -m 30 "$SITE/artifacts.js")"
          if [[ "$live_js" == *"$served"* ]]; then
            echo "✓ deployed pin matches the served log key (${served:0:16}…)"
          else
            echo "::error::the deployed artifacts.js pin does not match the key verify.pollis.com serves."
            echo "::error::  This is the #732 failure: the page renders a red tamper alarm at every visitor."
            exit 1
          fi

      # 3. The public accepted-loss count must match CLAUDE.md. #720 added a third
      #    and the page said two — a promise that had quietly stopped being true.
      - name: Accepted-loss count on /learn matches CLAUDE.md
        run: |
          set -euo pipefail
          if grep -q "Exactly three acceptable losses" CLAUDE.md; then
            want="Three"; wrong="Two"
          elif grep -q "Exactly two acceptable losses" CLAUDE.md; then
            want="Two"; wrong="Three"
          else
            echo "::error::could not read the accepted-loss count from CLAUDE.md"
            exit 1
          fi
          page="$(curl -fsSL -m 30 "$SITE/learn")"
          if [ -z "$page" ]; then
            echo "::error::/learn returned an empty body — check the redirect (curl needs -L)."
            exit 1
          fi
          if [[ "$page" == *"$wrong kinds of loss are expected"* ]]; then
            echo "::error::/learn still says '$wrong kinds of loss are expected' but CLAUDE.md says $want."
            echo "::error::  A user-facing promise that stopped being true is worse than an awkward"
            echo "::error::  paragraph. Deploy the site, or fix the page."
            exit 1
          fi
          if [[ "$page" != *"$want kinds of loss are expected"* ]]; then
            echo "::error::/learn does not state the accepted-loss count at all — the section moved or broke."
            exit 1
          fi
          echo "✓ /learn states $want accepted losses, matching CLAUDE.md"

      # 4. security.txt stays RFC 9116 valid (#877).
      #
      # `Expires` is the one MANDATORY field, and the file shipped without it for
      # its whole life — so every conforming parser treated the file as invalid
      # and a researcher's tooling reported "no security.txt" for a host that had
      # one. Adding the field fixes it exactly once; an expiry date is a claim
      # with a built-in decay, so it needs a check or it becomes the same defect
      # again on a date nobody has in their calendar. Fails inside 30 days, which
      # is enough warning to bump it deliberately.
      #
      # Checked against the DEPLOYED file, not the repo copy: an un-deployed fix
      # is not a fix, and this workflow exists precisely because the site can lag
      # main (#406).
      - name: Deployed security.txt is RFC 9116 valid and not expiring
        run: |
          set -euo pipefail
          txt="$(curl -fsSL -m 30 "$SITE/.well-known/security.txt")"
          expires="$(printf '%s' "$txt" | grep -i '^Expires:' | head -1 | sed 's/^[Ee]xpires:[[:space:]]*//' | tr -d '\r')"
          if [ -z "$expires" ]; then
            echo "::error::the deployed security.txt has no Expires field. RFC 9116 §2.5.5"
            echo "::error::  makes it mandatory, so conforming parsers reject the entire file"
            echo "::error::  and report that pollis.com publishes no security policy at all."
            exit 1
          fi
          # Exactly one, per §2.5.5 — a second one makes the file invalid again.
          n="$(printf '%s\n' "$txt" | grep -ci '^Expires:' || true)"
          if [ "$n" -ne 1 ]; then
            echo "::error::security.txt has ${n} Expires fields; RFC 9116 allows exactly one."
            exit 1
          fi
          if ! printf '%s' "$txt" | grep -qi '^Contact:'; then
            echo "::error::security.txt has no Contact field (RFC 9116 §2.5.3, mandatory)."
            exit 1
          fi
          exp_epoch="$(date -u -d "$expires" +%s 2>/dev/null || true)"
          if [ -z "$exp_epoch" ]; then
            echo "::error::could not parse the Expires value '${expires}' as a date."
            echo "::error::  RFC 9116 requires an ISO 8601 / RFC 3339 timestamp."
            exit 1
          fi
          now="$(date -u +%s)"
          days=$(( (exp_epoch - now) / 86400 ))
          if [ "$days" -lt 0 ]; then
            echo "::error::the deployed security.txt EXPIRED ${days#-} days ago — conforming"
            echo "::error::  parsers now reject it. Bump Expires in website/.well-known/security.txt"
            echo "::error::  and deploy the site."
            exit 1
          fi
          if [ "$days" -lt 30 ]; then
            echo "::error::the deployed security.txt expires in ${days} days. Bump Expires in"
            echo "::error::  website/.well-known/security.txt and deploy, before it goes invalid."
            exit 1
          fi
          echo "✓ security.txt is valid and expires in ${days} days (${expires})"

      # 5. The published rebuild-verdict ledger still matches reality (#877).
      #
      # /assurance publishes a per-release "did this reproduce from source"
      # record, generated from the Actions API into website/rebuild-ledger.json
      # and committed. That file is the durable home for a verdict that
      # otherwise expires with a 90-day CI artifact — but a static file about a
      # moving history rots the moment a release ships and nobody regenerates
      # it, and a page that silently under-reports its own failures is worse
      # than one that never claimed to report them.
      #
      # Fails when rebuild-verify has run since the ledger was last published.
      # Fetch depth matters: the ledger resolves a run's tag from `headSha` for
      # runs with no log (a skipped run — i.e. a release that was never checked
      # at all), which needs the tags present.
      - name: Rebuild-verdict ledger is up to date
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --quiet --depth=1 origin '+refs/tags/*:refs/tags/*' || true
          ./scripts/rebuild-ledger.sh --check

      # 6. The status record must still be being written (#877).
      #
      # /status renders a committed file appended by status-probe.yml. That
      # workflow can stop for reasons that say nothing on their own: GitHub
      # disables scheduled workflows on repositories inactive for 60 days, and a
      # push to main can start being rejected. Either way the page keeps
      # rendering its last sample and keeps LOOKING authoritative, which is
      # precisely the "silence reads as compromise" failure the page exists to
      # remove. So the freshness check deliberately lives in a DIFFERENT
      # workflow from the prober — a monitor that goes quiet cannot be the thing
      # that reports it went quiet.
      #
      # Offline and repo-local: it reads the committed record, not the site, so
      # it fails on a dead prober even when the site is perfectly deployed.
      - name: Status record is still being written (#877)
        run: ./scripts/status-probe.sh --check

      # 7. The transparency log is still being PUBLISHED (#877).
      #
      # This is the failure mode specific to Pollis's own design, written up in
      # docs/operational-continuity.md §4. An STH's timestamp is FROZEN per tree
      # size — transparency-publish.yml republishes an unchanged tree with the
      # head it already had — so a healthy idle log, an abandoned publisher and a
      # deliberately withheld publication all serve byte-identical files. No
      # amount of polling verify.pollis.com can separate them.
      #
      # What separates them is the publisher's own run history, which is public.
      # So it is checked here, in a workflow that is NOT the publisher, and a
      # gap goes red rather than merely rendering as an "overdue" badge nobody
      # is looking at. Warn-then-fail is deliberately not the shape: a log that
      # has silently stopped anchoring new account keys is a correctness matter
      # (docs/incidents/README.md §2), not a cosmetic one.
      - name: Transparency log is still being published (#877)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh run list --workflow=transparency-publish.yml --limit 20 \
            --json conclusion,createdAt,url 2>/dev/null || echo '[]')"
          last_ok="$(jq -r '[.[] | select(.conclusion == "success")] | .[0].createdAt // ""' <<<"$runs")"
          if [ -z "$last_ok" ]; then
            echo "::error::transparency-publish.yml has no successful run in its last 20."
            echo "::error::  The log is not being published. From outside, that is"
            echo "::error::  indistinguishable from publication being WITHHELD — see"
            echo "::error::  docs/operational-continuity.md §4 — so it is treated as a"
            echo "::error::  correctness incident, not an availability blip."
            exit 1
          fi
          age_h=$(( ( $(date -u +%s) - $(date -u -d "$last_ok" +%s) ) / 3600 ))
          if [ "$age_h" -gt 48 ]; then
            echo "::error::the transparency log was last published ${age_h}h ago (limit 48h)."
            echo "::error::  It is scheduled daily. New account keys and commits are not"
            echo "::error::  being anchored, and the served heads look IDENTICAL to a"
            echo "::error::  healthy idle log, so nothing external will notice."
            echo "::error::  Re-dispatch transparency-publish.yml and file an incident"
            echo "::error::  (docs/incidents/README.md §2)."
            exit 1
          fi
          echo "✓ transparency log last published ${age_h}h ago"

      # 8. And the incident record still parses. It is rendered client-side, so
      #    a malformed file publishes "no incidents" over incidents that were
      #    written down — a silent, flattering failure.
      - name: Public incident record parses (#877)
        run: python3 ./scripts/check-incidents.py

      # 9. Staleness. Not a claim being wrong, but the condition that produces it.
      #    Warn rather than fail: a deliberate hold on publishing is legitimate
      #    (#406), a *forgotten* one is what we are surfacing.
      - name: Warn if the deployed site lags main
        run: |
          set -uo pipefail
          # artifacts.js is versioned in-repo; a cheap content fingerprint is enough
          # to tell "same bytes as main" from "something older".
          repo_hash="$(sha256sum website/artifacts.js | cut -c1-16)"
          live_hash="$(curl -fsSL -m 30 "$SITE/artifacts.js" | sha256sum | cut -c1-16)"
          if [ "$repo_hash" = "$live_hash" ]; then
            echo "✓ deployed artifacts.js is byte-identical to main"
          else
            echo "::warning::pollis.com is serving an artifacts.js that differs from main"
            echo "::warning::  (main ${repo_hash}, live ${live_hash}). If that is not deliberate,"
            echo "::warning::  run website-deploy.yml. Checks 1-3 above still passed, so nothing"
            echo "::warning::  currently reads as false — this is drift, not a wrong claim."
          fi
