name: Browser UI specs

# The Playwright UI tier (`e2e/*.spec.{js,ts}`, `e2e/playwright.config.js`)
# drives the BROWSER build of the renderer with the Tauri IPC mocked, so it
# needs no backend, no secrets and no native shell — and for a year nothing
# ran it in CI. #990 turned the bookmarks copy-link paint assertion red on
# main and it stayed red, unnoticed, until #1059. This job is the always-on
# gate that closes that hole: the whole suite, every PR — split across four
# runners, one Chromium and one worker each (see `playwright-shard`).
#
# It is NOT the WebDriver tier: `e2e-*.yml` drive the real Tauri binary and
# stay dispatch-only by design (docs/deployments.md → "On-demand E2E").
#
# Path-gated the way mls-tests.yml is (#698 pattern): a seconds-cheap `changes`
# job decides, the shards run only when it says so, and the `playwright` check
# ALWAYS reports. The suite runs the browser build against mocked IPC, so only
# the renderer, the specs and the JS dependency graph can change its outcome —
# a Rust, mobile, website, docs or workflow-only PR cannot. Before this, every
# such PR (about half of them) paid four runners for ~4 min each, and up to
# ~15 when the Chromium apt step stalled.
#
# `main` runs the whole suite on every push that touches the same allow-list
# (a workflow-level `paths:` here is safe: nothing requires a check on a push).
# A merge outside it leaves the suite's inputs byte-identical to the previous
# `main` run, so re-running it re-proves nothing; before this every Rust,
# mobile or docs merge paid four more runners.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # Same list as the `ui` filter below; keep the two in step.
    paths:
      - 'frontend/**'
      - 'e2e/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/e2e-browser.yml'
      - 'scripts/ci-apt-retries.sh'

permissions:
  contents: read
  # dorny/paths-filter reads the PR's changed-file list via the API (no checkout).
  pull-requests: read

concurrency:
  group: e2e-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Allow-list, not ignore-list (the opposite of mls-tests.yml): the suite's
  # whole input is small and closed — the renderer it serves, the specs it runs,
  # the lockfile/workspace that resolve both, and this workflow.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_ui: ${{ steps.decide.outputs.run_ui }}
    steps:
      - name: Detect renderer / spec changes (PRs only)
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            ui:
              - 'frontend/**'
              - 'e2e/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/e2e-browser.yml'
              - 'scripts/ci-apt-retries.sh'
      - name: Decide whether the browser suite must run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          UI: ${{ steps.filter.outputs.ui }}
        run: |
          if [ "$EVENT" = "pull_request" ] && [ "$UI" != "true" ]; then
            echo "run_ui=false" >> "$GITHUB_OUTPUT"
          else
            echo "run_ui=true" >> "$GITHUB_OUTPUT"
          fi
          echo "event=$EVENT ui=$UI"

  # Sharded across runners, NOT across workers. The config stays `workers: 1`
  # (the composer specs are keystroke-driven and must not share a CPU with a
  # second browser), so the only way to cut the ~11 min serial run is more
  # machines: each shard is its own runner with its own vite server and its own
  # Chromium, running a disjoint slice of the spec files (`--shard`), exactly
  # as the unsharded job did. Playwright's shard split is by file and is
  # complete by construction — every spec lands in exactly one shard.
  playwright-shard:
    needs: changes
    if: ${{ needs.changes.outputs.run_ui == 'true' }}
    name: playwright (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      # Every shard reports, so one red spec doesn't hide another.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # The whole suite took ~11 min serially on a runner; a shard is a quarter
    # of that. A hung dev server must not hold a runner for the default six
    # hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      # Filtered to the two packages the suite touches: `frontend` (vite
      # serves it) and `e2e` (the Playwright runner). Skips pollis-delivery's
      # worker toolchain.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter ./frontend... --filter ./e2e...

      # `--with-deps` below runs apt, whose mirror stalled one shard's Chromium
      # install for 11 minutes; fail a stalled fetch fast and retry it instead.
      - name: Fail fast on a stalled apt mirror
        run: bash scripts/ci-apt-retries.sh

      # One browser only; the config's single project is Desktop Chrome.
      # `--with-deps` pulls the runner's shared-library set (fonts, GTK bits)
      # that headless Chromium still needs on a stock ubuntu image.
      - name: Install Chromium
        run: pnpm --filter @pollis/e2e exec playwright install --with-deps chromium

      # `CI=1` flips the config's `reuseExistingServer` off, so the run can
      # only ever talk to the vite server it started itself (the config
      # derives the port from the checkout path for the same reason).
      - name: Run the browser suite (shard ${{ matrix.shard }}/4)
        run: pnpm --filter @pollis/e2e e2e:ui --shard=${{ matrix.shard }}/4
        env:
          CI: "1"

      # Screenshots + traces are only written for failures (`only-on-failure`
      # / `retain-on-failure`), so a green run uploads nothing.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-artifacts-${{ matrix.shard }}
          path: e2e/artifacts/playwright
          if-no-files-found: ignore
          retention-days: 7

  # One stable check name for the whole suite, whatever the shard count: green
  # only when every shard passed or the PR was legitimately exempt; red on any
  # failure or cancel, or a skip the decision did not ask for. Fail-closed.
  # Keeps the check called `playwright`, as it was before sharding.
  playwright:
    needs: [changes, playwright-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate shards
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_UI: ${{ needs.changes.outputs.run_ui }}
          RESULT: ${{ needs.playwright-shard.result }}
        run: |
          echo "changes=$CHANGES_RESULT run_ui=$RUN_UI playwright shards: $RESULT"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Decision job did not succeed ($CHANGES_RESULT) — failing closed."
            exit 1
          fi
          if [ "$RESULT" = "success" ]; then
            exit 0
          fi
          if [ "$RUN_UI" = "false" ] && [ "$RESULT" = "skipped" ]; then
            echo "Exempt PR — no renderer/spec/dependency change, browser suite correctly skipped."
            exit 0
          fi
          echo "::error::Playwright shards did not all pass ($RESULT)."
          exit 1
