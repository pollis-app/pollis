# Manual deploy of the static marketing site (website/) to Cloudflare Pages.
#
# Moves the website off auto-on-merge onto the deploy-button pattern (#406):
# `main` stays always-deployable, publishing is a deliberate manual act.
#
# The Pages project (`pollis`, root `website/`, no build step) is still
# git-connected, but bound to the repo's PRE-TRANSFER owner (actuallydan), and
# Cloudflare silently ignores an API change of a project's git owner. After the
# move to pollis-app (#1265) its deploy hook answers 400 ("unable to find a
# branch"). So this uploads `website/` directly with wrangler — byte-for-byte
# what the git build served, since there is no build command — which also drops
# the dependency on Cloudflare's GitHub App, and then checks the live site
# serves the uploaded bytes instead of trusting "deploy triggered".
#
# Manual only — no push/tag trigger. See #406.
name: Deploy Website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Optional manual-approval gate + audit trail, matching the other deploys.
    environment: website-prod
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Preflight — Cloudflare credentials configured
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Missing required config: secrets.CF_API_TOKEN / secrets.CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Upload website/ to the production branch
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4.107.1 pages deploy website \
            --project-name pollis \
            --branch main \
            --commit-hash "$GITHUB_SHA" \
            --commit-message "website-deploy ${GITHUB_SHA::8}" \
            --commit-dirty=false

      # "Deploy complete" is not "live". Production is whatever deployment the
      # project's canonical pointer names; it must be this commit, or the run
      # fails rather than looking green.
      - name: Confirm production serves this commit
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/pollis"
          for _ in $(seq 1 30); do
            live="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api" \
              | jq -r '.result.canonical_deployment.deployment_trigger.metadata.commit_hash' || true)"
            if [ "$live" = "$GITHUB_SHA" ]; then
              echo "pollis.com production deployment is ${GITHUB_SHA}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::production deployment is ${live:-unknown}, not ${GITHUB_SHA}, after 5 minutes"
          exit 1
