# Two-client LINK PREVIEWS E2E (#1987): two isolated real Tauri app instances
# against ONE shared backend. A's core builds a preview of a link (a real fetch
# from the runner) and B's window draws the card from the message alone; an edit
# to another link shows the new card in both windows, and delete-for-everyone
# takes the card in both; then the same from B to A.
#
# Backend-only (no media) — same fixtures + composite action as
# e2e-two-client-dm-reply.yml. Manual trigger (workflow_dispatch): heavy
# (two WebKitGTK windows + a two-binary cargo build + a libsql container); it
# also runs on a pull request that changes the scenario itself.
name: E2E two-client link previews

on:
  workflow_dispatch:
  pull_request:
    paths:
      - e2e/two-client-link-preview.js
      - .github/workflows/e2e-two-client-link-preview.yml

permissions:
  contents: read

jobs:
  two-client-link-preview:
    # ubuntu-24.04: src-tauri/build.rs compiles pollis-capture-linux, whose
    # libspa 0.9 bindgen needs PipeWire >= 1.0 headers (24.04 ships them).
    runs-on: ubuntu-24.04
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          cache: "pnpm"

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            .
            src-tauri

      - name: Install system dependencies
        run: bash e2e/scripts/install-system-deps.sh

      - name: Install meson (newer than apt)
        run: |
          python3 -m pip install --user 'meson>=1.3'
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install tauri-driver
        run: cargo install tauri-driver --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Clean env (no TURSO_* / POLLIS_DELIVERY_URL yet — start-backend runs
      # LATER) so config.rs's option_env! bakes nothing in and the binaries read
      # the runtime env the e2e scripts inject.
      - name: Build pollis + pollis-delivery (debug)
        run: cargo build -p pollis -p pollis-delivery

      - name: Start backend fixtures
        run: bash e2e/scripts/start-backend.sh

      - name: Run two-client link-preview e2e (two-client-link-preview.js)
        uses: ./.github/actions/desktop-e2e
        with:
          command: pnpm e2e two-client-link-preview
          working-directory: e2e
          artifact-name: e2e-two-client-link-preview-failure
          artifacts-path: |
            e2e/artifacts/*.png
            e2e/artifacts/*.html

      # The two windows' screenshots, pass or fail, for review.
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-two-client-link-preview-shots
          path: e2e/artifacts/lp-*.png
          if-no-files-found: ignore

      - name: Stop backend fixtures
        if: always()
        run: bash e2e/scripts/stop-backend.sh
