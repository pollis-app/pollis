name: Dead code

# Dead-code gate. The backlog the first run found was cleared in #1763, so Knip,
# dead-commands.mjs --strict and cargo-machete now fail the PR on a new finding.
# Each step still writes its output to the job summary. A false positive is
# recorded where docs/dead-code.md says, never silenced here. cargo-udeps stays
# advisory: it runs on demand and has known false positives without `media`.
#
# The steps pipe into `tee`, so they run under bash with pipefail: without it the
# pipeline's status would be tee's, and a finding would pass.
#
# Why these tools and not rustc/tsc alone:
#   - rustc's dead_code lint never flags an unused `pub` item, and never flags a
#     Tauri command, because listing it in generate_handler! counts as a use.
#   - Knip reads the module graph, so it finds unused files, exports and npm
#     dependencies that tsc is happy to leave in.
#   - scripts/dead-commands.mjs closes the string-call gap: a command registered
#     for a client that nothing in that client ever invokes.
#   - cargo-machete finds unused dependencies, fast, on text. cargo-udeps finds
#     them exactly but needs nightly and a build, so it runs on demand.

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "mobile/**"
      - "src-tauri/src/lib.rs"
      - "pollis-core/**"
      - "pollis-tui/**"
      - "**/Cargo.toml"
      - "scripts/dead-commands.*"
      - "scripts/knip-mobile.jsonc"
      - ".github/workflows/dead-code.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dead-code-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript and commands
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --filter ./frontend...

      # mobile/ is its own pnpm project outside the root workspace.
      - name: Install mobile dependencies
        run: pnpm install --frozen-lockfile --ignore-workspace
        working-directory: mobile

      # Registered commands that nothing calls. Pure Node, reads the repo.
      # Fails on any command that is registered and uncalled and not exempt.
      - name: Dead commands
        shell: bash
        run: |
          {
            echo '### Dead commands'
            echo '```'
            rc=0
            node scripts/dead-commands.mjs --strict || rc=$?
            echo '```'
            exit $rc
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # The version is pinned: an unpinned `dlx` would run whatever was published
      # last, in a job that has the repo checked out.
      - name: Knip (desktop renderer)
        working-directory: frontend
        shell: bash
        run: |
          {
            echo '### Knip: frontend'
            echo '```'
            rc=0
            pnpm dlx knip@6.44.1 || rc=$?
            echo '```'
            exit $rc
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Knip (mobile)
        working-directory: mobile
        shell: bash
        run: |
          {
            echo '### Knip: mobile'
            echo '```'
            rc=0
            pnpm dlx knip@6.44.1 --config ../scripts/knip-mobile.jsonc || rc=$?
            echo '```'
            exit $rc
          } | tee -a "$GITHUB_STEP_SUMMARY"

  rust:
    name: Rust dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.96.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # --locked --version: the tool is a build input of this job, so it is pinned.
      # Ignores belong in [package.metadata.cargo-machete] in the crate's Cargo.toml,
      # each with the reason above it.
      - name: Install cargo-machete
        run: cargo install cargo-machete --locked --version 0.9.2

      - name: cargo-machete
        shell: bash
        run: |
          {
            echo '### cargo-machete'
            echo '```'
            rc=0
            cargo machete || rc=$?
            echo '```'
            exit $rc
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # Exact dependency check. On demand only: it needs nightly and compiles the workspace
  # (several minutes cold). Headless crates and --no-default-features, because the CI
  # runner has no media toolchain. That drops the `media` feature, so udeps reports
  # everything only media uses (nnnoiseless, livekit-protocol, prost) as unused. Those
  # are false positives; cross-check anything it names against cargo-machete.
  udeps:
    name: cargo-udeps (on demand)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.96.0

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # udeps drives rustc internals, so it needs a nightly. The advisory job tolerates
      # the floating toolchain; nothing it builds is shipped.
      - name: Install nightly and cargo-udeps
        run: |
          rustup toolchain install nightly --profile minimal
          cargo +nightly install cargo-udeps --locked --version 0.1.61

      - name: cargo-udeps
        continue-on-error: true
        run: |
          {
            echo '### cargo-udeps'
            echo '```'
            cargo +nightly udeps --all-targets --no-default-features \
              -p pollis-core -p pollis-api -p pollis-delivery -p pollis-relay \
              -p pollis-schema -p pollis-device-cert -p pollis-libsql-connector 2>&1 \
              | sed -n '/^unused dependencies:/,$p' || true
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
