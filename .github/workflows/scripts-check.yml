name: Scripts check

# Gate for the release-attestation shell layer (`scripts/attest-binaries.sh` and
# the helpers it sources). This layer had NO test coverage of any kind, and its
# only exercise was a real release — which is how three consecutive releases
# (#588, #602, #604) were broken by it: a guessed package member path, missing
# tooling in a duplicated workflow, and an opaque two-process pipeline. Each cost
# a release cycle to find, and every one is the sort of thing a five-second test
# catches.
#
# Deliberately minimal and fast: no toolchain, no build, no network. Runs on
# ubuntu so GNU tar and sha256sum are present and the payload-hash contract
# (which the independent rebuilder recomputes) is actually asserted rather than
# skipped the way it is on a developer's macOS machine.

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/scripts-check.yml"
      - "pollis-delivery/worker/**"
      - "pollis-delivery/wrangler.dev.jsonc"
      - "pollis-delivery/wrangler.prod.jsonc"
      - "pollis-delivery/ds-config-manifest.json"
      - "pollis-delivery/src/**"
      - ".github/scripts/sync-ds-secrets.sh"
      # Any workflow change: an invalid one is invisible until something silently
      # stops running.
      - ".github/workflows/**"
      # Reproducibility recipe inputs: the release build, the rebuilder, and the
      # client's option_env! surface must stay in agreement.
      - ".github/workflows/desktop-release.yml"
      - ".github/workflows/rebuild-verify.yml"
      - "pollis-core/src/config.rs"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "pollis-delivery/worker/**"
      - "pollis-delivery/wrangler.dev.jsonc"
      - "pollis-delivery/wrangler.prod.jsonc"
      - "pollis-delivery/ds-config-manifest.json"
      - "pollis-delivery/src/**"
      - ".github/scripts/sync-ds-secrets.sh"
      # Any workflow change: an invalid one is invisible until something silently
      # stops running.
      - ".github/workflows/**"
      # Reproducibility recipe inputs: the release build, the rebuilder, and the
      # client's option_env! surface must stay in agreement.
      - ".github/workflows/desktop-release.yml"
      - ".github/workflows/rebuild-verify.yml"
      - "pollis-core/src/config.rs"

permissions:
  contents: read

concurrency:
  group: scripts-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Named distinctly: a job called `test` here collides with another
  # workflow's check of the same name in the PR checks list, making it
  # impossible to tell at a glance whether this gate actually ran.
  shell-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # #760: prove every DS config value actually traverses all five links to the
      # running container. Three of five were silently missing for
      # POLLIS_DS_METRICS_TOKEN and it took three PRs to notice — a deploy goes
      # green and the value simply has no effect. Cheap, so it gates every change
      # to any link, not just to scripts/.
      - name: DS config chain (#760)
        run: python3 ./scripts/check-ds-config-chain.py

      # The reproducibility counterpart to the DS config-chain gate above. A value
      # baked into the release but missing from the rebuilder's recipe makes
      # independent Linux reproduction impossible, and the only symptom is a hash
      # mismatch that reads like tampering. That is not hypothetical: it is why
      # both of rebuild-verify.yml's runs failed while the docs described
      # independent reproduction as a working, shipped property.
      # An unparseable workflow fails SILENTLY — GitHub makes a run with zero jobs,
      # lists the workflow under its file path, and every trigger it declares stops
      # working with nothing saying so. A duplicate top-level `env:` did exactly that
      # to rebuild-verify.yml, and `yaml.safe_load` missed it because PyYAML allows
      # duplicate keys under last-one-wins while GitHub rejects the document.
      - name: Workflow files parse the way GitHub parses them
        run: python3 ./scripts/check-workflows.py

      - name: Build recipe drift (reproducibility)
        run: python3 ./scripts/check-build-recipe.py

      - name: Attest helper + payload-hash tests
        run: ./scripts/test-attest-helpers.sh

      # Syntax-check every shell script in scripts/, so a typo in a release-path
      # script is caught on the PR rather than mid-release.
      - name: Shell syntax check
        run: |
          set -euo pipefail
          rc=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error::bash -n failed: $f"; rc=1; }
          done < <(find scripts -type f -name '*.sh')
          exit $rc

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # Advisory for now: the existing scripts predate this gate and carry
      # warnings that are not worth churning in the same PR that adds the gate.
      # Errors fail; style/info do not.
      - name: shellcheck (errors only)
        run: |
          set -euo pipefail
          shellcheck --severity=error $(find scripts -type f -name '*.sh')
