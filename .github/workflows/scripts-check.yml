name: Scripts check

# Gate for the release-attestation shell layer (`scripts/attest-binaries.sh` and
# the helpers it sources). This layer had NO test coverage of any kind, and its
# only exercise was a real release — which is how three consecutive releases
# (#588, #602, #604) were broken by it: a guessed package member path, missing
# tooling in a duplicated workflow, and an opaque two-process pipeline. Each cost
# a release cycle to find, and every one is the sort of thing a five-second test
# catches.
#
# Deliberately minimal and fast: no toolchain, no build, no network. Runs on
# ubuntu so GNU tar and sha256sum are present and the payload-hash contract
# (which the independent rebuilder recomputes) is actually asserted rather than
# skipped the way it is on a developer's macOS machine.

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      # #945: every surface that hard-codes the transparency log's pinned
      # ML-DSA-44 key. A rotation touching one and missing another makes an
      # honest log look tampered to whoever reads the stale copy.
      - "pollis-core/src/commands/transparency.rs"
      - "website/artifacts.js"
      - "website/learn.html"
      - "website/assurance.html"
      - "key-set.json"
      - "SECURITY.md"
      - "README.md"
      - ".github/workflows/scripts-check.yml"
      # #877: the public incident record and the status prober behind
      # pollis.com/status. A malformed record renders as "no incidents".
      - "website/incidents.json"
      - "website/status-history.json"
      - "docs/incidents/**"
      - "pollis-delivery/worker/**"
      - "pollis-delivery/wrangler.dev.jsonc"
      - "pollis-delivery/wrangler.prod.jsonc"
      - "pollis-delivery/ds-config-manifest.json"
      - "pollis-delivery/src/**"
      - ".github/scripts/sync-ds-secrets.sh"
      # Any workflow change: an invalid one is invisible until something silently
      # stops running.
      - ".github/workflows/**"
      # Reproducibility recipe inputs: the release build, the rebuilder, and the
      # client's option_env! surface must stay in agreement.
      - ".github/workflows/desktop-release.yml"
      - ".github/workflows/rebuild-verify.yml"
      - "pollis-core/src/config.rs"
  push:
    branches: [main]
    paths:
      - "scripts/**"
      # #945: every surface that hard-codes the transparency log's pinned
      # ML-DSA-44 key. A rotation touching one and missing another makes an
      # honest log look tampered to whoever reads the stale copy.
      - "pollis-core/src/commands/transparency.rs"
      - "website/artifacts.js"
      - "website/learn.html"
      - "website/assurance.html"
      - "key-set.json"
      - "SECURITY.md"
      - "README.md"
      # #877: the public incident record and the status prober behind
      # pollis.com/status. A malformed record renders as "no incidents".
      - "website/incidents.json"
      - "website/status-history.json"
      - "docs/incidents/**"
      - "pollis-delivery/worker/**"
      - "pollis-delivery/wrangler.dev.jsonc"
      - "pollis-delivery/wrangler.prod.jsonc"
      - "pollis-delivery/ds-config-manifest.json"
      - "pollis-delivery/src/**"
      - ".github/scripts/sync-ds-secrets.sh"
      # Any workflow change: an invalid one is invisible until something silently
      # stops running.
      - ".github/workflows/**"
      # Reproducibility recipe inputs: the release build, the rebuilder, and the
      # client's option_env! surface must stay in agreement.
      - ".github/workflows/desktop-release.yml"
      - ".github/workflows/rebuild-verify.yml"
      - "pollis-core/src/config.rs"

permissions:
  contents: read

concurrency:
  group: scripts-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Named distinctly: a job called `test` here collides with another
  # workflow's check of the same name in the PR checks list, making it
  # impossible to tell at a glance whether this gate actually ran.
  shell-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # #760: prove every DS config value actually traverses all five links to the
      # running container. Three of five were silently missing for
      # POLLIS_DS_METRICS_TOKEN and it took three PRs to notice — a deploy goes
      # green and the value simply has no effect. Cheap, so it gates every change
      # to any link, not just to scripts/.
      - name: DS config chain (#760)
        run: python3 ./scripts/check-ds-config-chain.py

      # The reproducibility counterpart to the DS config-chain gate above. A value
      # baked into the release but missing from the rebuilder's recipe makes
      # independent Linux reproduction impossible, and the only symptom is a hash
      # mismatch that reads like tampering. That is not hypothetical: it is why
      # both of rebuild-verify.yml's runs failed while the docs described
      # independent reproduction as a working, shipped property.
      # An unparseable workflow fails SILENTLY — GitHub makes a run with zero jobs,
      # lists the workflow under its file path, and every trigger it declares stops
      # working with nothing saying so. A duplicate top-level `env:` did exactly that
      # to rebuild-verify.yml, and `yaml.safe_load` missed it because PyYAML allows
      # duplicate keys under last-one-wins while GitHub rejects the document.
      - name: Workflow files parse the way GitHub parses them
        run: python3 ./scripts/check-workflows.py

      - name: Build recipe drift (reproducibility)
        run: python3 ./scripts/check-build-recipe.py

      # #945: the transparency log's pinned ML-DSA-44 key is hard-coded in nine
      # places across Rust, JS, JSON, Markdown and two workflows. Nothing checked
      # they agreed, and the failure is nastier than it sounds: the surface that
      # keeps a retired key reports an HONEST log as tampered (#732 shipped
      # exactly that to pollis.com/artifacts). Offline and dependency-free so it
      # gates the PR rather than only observing a deployed site.
      - name: Pinned transparency key agrees everywhere (#945)
        run: python3 ./scripts/check-pinned-log-key.py

      # And the gate's own ability to go red, one broken copy at a time. A
      # consistency check nobody has watched fail is a check nobody should cite.
      - name: Pinned-key check catches divergence (#945)
        run: ./scripts/test-pinned-log-key.sh

      # The e2e commit-log migration applier. Two silent failures shipped in it:
      # a stale migrations path that made it apply ZERO statements and exit 0,
      # and a naive `;` split that shredded every `CREATE TRIGGER` body. Both
      # broke cross-client MLS delivery in the voice e2e without saying so. The
      # self-test pins a trigger whose body carries its own semicolons, so the
      # next trigger added to migrations-log/ cannot reintroduce either.
      - name: e2e commit-log migration splitter
        run: |
          python3 ./e2e/scripts/apply-log-migrations.py --self-test
          # And the real files: every statement the splitter emits must be a
          # complete SQL statement.
          python3 - <<'EOF'
          import glob, importlib.util, os, sqlite3, sys
          spec = importlib.util.spec_from_file_location("m", "e2e/scripts/apply-log-migrations.py")
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          paths = sorted(glob.glob(os.path.join(m.MIG_DIR, "*.sql")))
          assert paths, f"no migrations found under {m.MIG_DIR} — the path is stale again"
          stmts = [st for p in paths for st in m.statements(open(p).read())]
          bad = [st for st in stmts if not sqlite3.complete_statement(st + ";")]
          assert not bad, f"{len(bad)} incomplete statement(s); first: {bad[0][:120]!r}"
          print(f"ok: {len(paths)} file(s), {len(stmts)} complete statement(s)")
          EOF

      # #877: the public incident record. It fails two ways that both publish a
      # falsehood — malformed (the page renders "no incidents" over incidents
      # that were written down) and overdue (a postmortem comes due and never
      # appears, so a status page quietly becomes a marketing page). Offline.
      - name: Public incident record is publishable (#877)
        run: python3 ./scripts/check-incidents.py

      - name: Incident-record check catches a missed postmortem (#877)
        run: ./scripts/test-incidents-check.sh

      - name: Attest helper + payload-hash tests
        run: ./scripts/test-attest-helpers.sh

      # #944: the rebuilder's verdict logic. v1.9.3 was published as an
      # unexplained "did not reproduce" when the actual cause was that the
      # rebuild landed on a different runner image than the release, and the
      # AppImage vendors system libraries off that image. The classifier that
      # tells those apart is only worth having if the case it must still catch —
      # same image, differing bytes — provably still fails, so both directions
      # are asserted here.
      - name: Rebuild verdict classification (#944)
        run: ./scripts/test-rebuild-verdict.sh

      # Syntax-check every shell script in scripts/, so a typo in a release-path
      # script is caught on the PR rather than mid-release.
      - name: Shell syntax check
        run: |
          set -euo pipefail
          rc=0
          while IFS= read -r f; do
            bash -n "$f" || { echo "::error::bash -n failed: $f"; rc=1; }
          done < <(find scripts -type f -name '*.sh')
          exit $rc

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      # Advisory for now: the existing scripts predate this gate and carry
      # warnings that are not worth churning in the same PR that adds the gate.
      # Errors fail; style/info do not.
      - name: shellcheck (errors only)
        run: |
          set -euo pipefail
          shellcheck --severity=error $(find scripts -type f -name '*.sh')
