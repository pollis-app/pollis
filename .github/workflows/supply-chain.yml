name: Supply Chain

# Dependency-supply-chain gate for the machine-checked-correctness program
# (#452, M0). cargo-deny enforces advisories / licenses / bans / sources;
# cargo-vet enforces per-crate review provenance; since #1832 the npm trees the
# products ship are licence-gated too, and supply-chain/vex.json must agree with
# deny.toml's ignores. Both are metadata-only — no
# crate compilation, so this job needs no native build deps and stays fast.
# A new/bumped crate that trips an advisory, an unlisted license, an untrusted
# source, or an unvetted review now fails the PR.

# Only what the gates read: manifests, the lockfiles, their config
# and the vet store. A new advisory against an unchanged lockfile is caught by
# the weekly run instead of by whichever unrelated PR happened to run next.
on:
  pull_request:
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'supply-chain/**'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/supply-chain.yml'
      # #1832: the JS licence gate's inputs.
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'frontend/package.json'
      - 'pollis-delivery/package.json'
      - 'mobile/package.json'
      - 'mobile/pnpm-lock.yaml'
      - 'scripts/oss-inventory.mjs'
  push:
    branches: [main]
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'supply-chain/**'
      - '.cargo/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/supply-chain.yml'
      # #1832: the JS licence gate's inputs.
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'frontend/package.json'
      - 'pollis-delivery/package.json'
      - 'mobile/package.json'
      - 'mobile/pnpm-lock.yaml'
      - 'scripts/oss-inventory.mjs'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      # Prebuilt binaries — no compile step, keeps the gate fast. Versions are
      # PINNED: cargo-vet's imports.lock format is version-specific, so CI must
      # run the same version that generated the committed supply-chain/ files
      # (else --locked fails to parse). Bump these deliberately, regenerating
      # supply-chain/ in the same commit.
      - name: Install cargo-deny + cargo-vet
        uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-deny@0.19.9,cargo-vet@0.10.2

      # Advisories need the RustSec DB (fetched over the network on CI).
      - name: cargo deny check
        run: cargo deny check

      # --locked: verify against the committed lockfile + pinned import audits.
      - name: cargo vet
        run: cargo vet --locked

      # #1832: every vulnerability deny.toml ignores has a VEX statement in
      # supply-chain/vex.json (what customers' scanners read), and every
      # statement is still ignored, against the advisory DB cargo deny just
      # fetched.
      - name: VEX agrees with deny.toml
        run: node scripts/oss-inventory.mjs check-vex

  # #1832: cargo-deny gates Rust licences; this gates the npm packages each
  # product ships (desktop renderer, mobile app, DS Worker) against the same
  # allow-list plus supply-chain/js-licenses.json.
  js-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.25.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # No install scripts: the gate reads package.json and licence files only.
      - name: Install the shipped npm trees
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile --ignore-scripts --filter ./frontend... --filter ./pollis-delivery...
          (cd mobile && pnpm install --ignore-workspace --frozen-lockfile --ignore-scripts)

      - name: JS licence gate
        run: node scripts/oss-inventory.mjs check-licenses
