name: Transparency Verifier CLI

# Builds the standalone `pollis-verify` auditor CLI (`remote` / `group` /
# `account` / `release` subcommands) so security analysts can verify
# https://verify.pollis.com themselves, from their own machine.
#
# Trigger:
#   * Tag push `pollis-verify-v*` (e.g. `git tag pollis-verify-v0.1.0 && git push
#     origin pollis-verify-v0.1.0`) — builds every target AND publishes a GitHub
#     Release with the binaries + SHA256SUMS attached.
#   * workflow_dispatch — builds every target and uploads them as run artifacts
#     (no Release), for testing the pipeline without cutting a tag.
#
# The tag prefix MUST NOT start with `v`: electron-release.yml triggers on the
# tag glob `v*` (any tag starting with `v`), so an earlier `verifier-v*` prefix
# matched it and fired the desktop release by mistake. `pollis-verify-*` can't.

on:
  push:
    tags:
      - "pollis-verify-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: pollis-verify-linux-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            asset: pollis-verify-macos-arm64
          # macos-13 (the last free x86_64 runner image) is deprecated and its
          # pool drains for hours; cross-compile the x86_64 slice from an
          # Apple-Silicon runner instead — the toolchain step installs the
          # matrix target, so only the host image changes.
          - os: macos-15
            target: x86_64-apple-darwin
            asset: pollis-verify-macos-x86_64
    steps:
      - uses: actions/checkout@v4

      # Must match the rust-toolchain.toml pin: cargo resolves the toolchain
      # from that file, so a floating @stable here installs the cross target
      # (x86_64-apple-darwin) into the WRONG toolchain and the build dies with
      # E0463 "can't find crate for `core`".
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: verifier-${{ matrix.target }}

      # The tag is the only thing an auditor holding a binary can correlate
      # against, so it must be the thing the binary reports (#670). Nothing
      # writes the tag into the manifest — so assert they agree and fail the
      # release if they don't, rather than shipping a binary that misreports
      # its own version. Skipped on workflow_dispatch, which has no tag.
      - name: Assert the crate version matches the release tag
        if: startsWith(github.ref, 'refs/tags/pollis-verify-v')
        shell: bash
        run: |
          set -euo pipefail
          manifest="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="verifiable-log-serve"))')"
          tag="${GITHUB_REF_NAME#pollis-verify-v}"
          if [ "$manifest" != "$tag" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match verifiable-log-serve version ${manifest} — bump the version in verifiable-log-serve/Cargo.toml (see #670)"
            exit 1
          fi
          echo "version ${manifest} matches tag ${GITHUB_REF_NAME}"

      - name: Build verifier
        # POLLIS_VERIFY_GIT_SHA annotates `--version` with the commit the recipe
        # in the binaries tree pins. Absent (a plain `cargo build`), the binary
        # reports "source build" instead of naming a commit it can't vouch for.
        env:
          POLLIS_VERIFY_GIT_SHA: ${{ github.sha }}
        run: cargo build --release --locked -p verifiable-log-serve --bin pollis-verify --target ${{ matrix.target }}

      - name: Package binary + checksum
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/pollis-verify" "dist/${{ matrix.asset }}"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi

      - name: Upload run artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*

      - name: Publish to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/pollis-verify-v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body: |
            ## Pollis transparency-log verifier

            Independently verify the public transparency log at
            **https://verify.pollis.com** — no trust in Pollis required beyond
            the published log public key.

            **Pinned public key** (**ML-DSA-44**, 1312 bytes) so that a signed
            statement about history stays checkable long-term:

            ```
            
            ```

            This build trusts only that key. A served key that differs is a hard
            alarm, not an accepted rotation.

            ### Usage
            ```bash
            # verify the entire log (signatures, inclusion proofs, consistency)
            ./pollis-verify-<platform> remote https://verify.pollis.com

            # verify one conversation's commit chain (use a conversation id, not a name)
            ./pollis-verify-<platform> group https://verify.pollis.com <CONVERSATION_ID>

            # verify a user's account-key history chain (identity-key versions)
            ./pollis-verify-<platform> account https://verify.pollis.com <USER_ID>

            # verify a released version's binaries against the transparency log
            ./pollis-verify-<platform> release https://verify.pollis.com v1.3.0
            ```
            Exit code is non-zero if any check fails. Add `--json` to
            `group`, `account`, or `release` for machine-readable output.

            Verify the download against the matching `*.sha256` file.
