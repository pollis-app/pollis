name: CLI Release (pollis-tui)

# Distribution pipeline for the `pollis` terminal client (the pollis-tui
# crate, binary name `pollis` — issue #451). SEPARATE from
# desktop-release.yml: it builds the headless CLI, uploads under a distinct
# `cli/` prefix in R2, and never touches the desktop's install.sh /
# latest.json / updater manifests.
#
# v1 is `workflow_dispatch` only — trigger it by hand to validate and
# deploy without cutting a git tag or riding a full desktop release. A
# `v*` tag trigger is intentionally NOT wired up yet (that would couple
# CLI publishing to every desktop release before this pipeline is proven).
#
# Secret discipline mirrors desktop-release.yml exactly: since #987 the shipped
# client holds NO database credential of any kind. It talks only to the Delivery
# Service, on one signed transport for reads and writes alike, and `pollis-core`
# does not link libsql — so there is no token to leak out of a binary and no
# connection for a future read to open.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build & publish (defaults to the workspace version in Cargo.toml)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # Resolve the version once so every build/publish job agrees. Uses the
  # dispatch input when given, else the [workspace.package] version in the
  # root Cargo.toml (the binary does not embed CARGO_PKG_VERSION today, so
  # this drives artifact naming and the R2 paths, not the binary itself).
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: resolve
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -m1 '^version = ' Cargo.toml | sed -E 's/version = "([^"]+)"/\1/')
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

  build-cli-linux:
    needs: resolve-version
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      # Build-time deps for compiling SQLCipher + the vendored openssl-sys
      # (libsqlite3-sys pulls openssl-src) from source. The resulting binary
      # links only glibc — no runtime libssl/libcrypto/libsqlite (verified by
      # ldd), so the installer needs no libcrypto check.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libssl-dev \
            pkg-config \
            build-essential \
            perl \
            libdbus-1-dev

      - name: Load production secrets
        run: |
          # #987: the client bakes NO database credential. TURSO_URL /
          # TURSO_RO_TOKEN / LOG_DB_URL / LOG_DB_TOKEN used to be injected here
          # and read by `option_env!` in pollis-core's config.rs; every remote
          # read now goes through the Delivery Service on the same signed
          # transport as the writes, and `pollis-core` no longer links libsql at
          # all. The secrets themselves stay in Doppler — the DS and the
          # migration runner still need them (see the migration steps below).
          echo "R2_S3_ENDPOINT=${{ secrets.R2_S3_ENDPOINT }}" >> $GITHUB_ENV
          echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "R2_SECRET_KEY=${{ secrets.R2_SECRET_KEY }}" >> $GITHUB_ENV
          echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}" >> $GITHUB_ENV
          echo "R2_REGION=${{ secrets.R2_REGION }}" >> $GITHUB_ENV
          echo "LIVEKIT_URL=${{ secrets.LIVEKIT_URL }}" >> $GITHUB_ENV
          echo "LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }}" >> $GITHUB_ENV
          echo "LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }}" >> $GITHUB_ENV
          echo "POLLIS_DELIVERY_URL=${{ secrets.POLLIS_DELIVERY_URL }}" >> $GITHUB_ENV
          echo "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" >> $GITHUB_ENV

      - name: Build CLI (Linux)
        run: cargo build -p pollis-tui --release

      - name: Upload Linux CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: pollis-cli-linux
          if-no-files-found: error
          path: target/release/pollis

  build-cli-macos:
    needs: resolve-version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Load production secrets
        run: |
          # #987: the client bakes NO database credential. TURSO_URL /
          # TURSO_RO_TOKEN / LOG_DB_URL / LOG_DB_TOKEN used to be injected here
          # and read by `option_env!` in pollis-core's config.rs; every remote
          # read now goes through the Delivery Service on the same signed
          # transport as the writes, and `pollis-core` no longer links libsql at
          # all. The secrets themselves stay in Doppler — the DS and the
          # migration runner still need them (see the migration steps below).
          echo "R2_S3_ENDPOINT=${{ secrets.R2_S3_ENDPOINT }}" >> $GITHUB_ENV
          echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "R2_SECRET_KEY=${{ secrets.R2_SECRET_KEY }}" >> $GITHUB_ENV
          echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}" >> $GITHUB_ENV
          echo "R2_REGION=${{ secrets.R2_REGION }}" >> $GITHUB_ENV
          echo "LIVEKIT_URL=${{ secrets.LIVEKIT_URL }}" >> $GITHUB_ENV
          echo "LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }}" >> $GITHUB_ENV
          echo "LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }}" >> $GITHUB_ENV
          echo "POLLIS_DELIVERY_URL=${{ secrets.POLLIS_DELIVERY_URL }}" >> $GITHUB_ENV
          echo "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" >> $GITHUB_ENV

      - name: Build CLI (macOS aarch64)
        run: cargo build -p pollis-tui --release --target aarch64-apple-darwin

      - name: Upload macOS CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: pollis-cli-macos
          if-no-files-found: error
          path: target/aarch64-apple-darwin/release/pollis

  build-cli-windows:
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Load production secrets
        shell: bash
        run: |
          # #987: the client bakes NO database credential. TURSO_URL /
          # TURSO_RO_TOKEN / LOG_DB_URL / LOG_DB_TOKEN used to be injected here
          # and read by `option_env!` in pollis-core's config.rs; every remote
          # read now goes through the Delivery Service on the same signed
          # transport as the writes, and `pollis-core` no longer links libsql at
          # all. The secrets themselves stay in Doppler — the DS and the
          # migration runner still need them (see the migration steps below).
          echo "R2_S3_ENDPOINT=${{ secrets.R2_S3_ENDPOINT }}" >> $GITHUB_ENV
          echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "R2_SECRET_KEY=${{ secrets.R2_SECRET_KEY }}" >> $GITHUB_ENV
          echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}" >> $GITHUB_ENV
          echo "R2_REGION=${{ secrets.R2_REGION }}" >> $GITHUB_ENV
          echo "LIVEKIT_URL=${{ secrets.LIVEKIT_URL }}" >> $GITHUB_ENV
          echo "LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }}" >> $GITHUB_ENV
          echo "LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }}" >> $GITHUB_ENV
          echo "POLLIS_DELIVERY_URL=${{ secrets.POLLIS_DELIVERY_URL }}" >> $GITHUB_ENV
          echo "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" >> $GITHUB_ENV

      # #991 deleted the "Install OpenSSL via vcpkg" step that used to sit here,
      # for the same reason as the desktop release: the Windows target links
      # plain `bundled` SQLite now, so no OpenSSL is in its graph. The step was
      # also actively broken — the `x64-windows-static-md` OpenSSL it installed
      # is built against the DYNAMIC UCRT, while `.cargo/config.toml` links
      # Windows with `+crt-static`, so any build that genuinely pulled libcrypto
      # failed on `__imp__strdup` / `__imp__stat64i32`. Nothing pulled it until
      # #988, which is why it went unnoticed here too.

      - name: Build CLI (Windows)
        run: cargo build -p pollis-tui --release

      - name: Upload Windows CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: pollis-cli-windows
          if-no-files-found: error
          path: target/release/pollis.exe

  # Publish to R2 under a dedicated `cli/` prefix. Mirrors the desktop
  # release job's aws-s3-to-R2 mechanics (same ENDPOINT, credentials env,
  # bucket) but never touches releases/install.sh, releases/latest.json, or
  # the updater manifests.
  publish-cli:
    needs: [resolve-version, build-cli-linux, build-cli-macos, build-cli-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load production secrets
        run: |
          echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "R2_SECRET_KEY=${{ secrets.R2_SECRET_KEY }}" >> $GITHUB_ENV
          echo "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Debug artifact structure
        run: |
          echo "Listing artifact structure:"
          find artifacts -type f

      - name: Upload CLI binaries to R2
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp artifacts/pollis-cli-linux/pollis   "s3://pollis/releases/cli/${VERSION}/pollis-linux"       --endpoint-url "${ENDPOINT}"
          aws s3 cp artifacts/pollis-cli-macos/pollis   "s3://pollis/releases/cli/${VERSION}/pollis-macos"       --endpoint-url "${ENDPOINT}"
          aws s3 cp artifacts/pollis-cli-windows/pollis.exe "s3://pollis/releases/cli/${VERSION}/pollis-windows.exe" --endpoint-url "${ENDPOINT}"
        env:
          AWS_ACCESS_KEY_ID: ${{ env.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto

      - name: Publish cli latest.json to R2
        run: |
          VERSION="${{ needs.resolve-version.outputs.version }}"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          BASE="https://cdn.pollis.com/releases/cli/${VERSION}"
          echo "{\"version\":\"${VERSION}\",\"linux\":\"${BASE}/pollis-linux\",\"macos\":\"${BASE}/pollis-macos\",\"windows\":\"${BASE}/pollis-windows.exe\"}" > latest.json
          aws s3 cp latest.json "s3://pollis/releases/cli/latest.json" \
            --endpoint-url "${ENDPOINT}" \
            --content-type "application/json" \
            --cache-control "no-cache"
        env:
          AWS_ACCESS_KEY_ID: ${{ env.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto

      - name: Upload cli install script to R2
        run: |
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp website/cli-install.sh "s3://pollis/releases/cli-install.sh" \
            --endpoint-url "${ENDPOINT}" \
            --content-type "text/plain" \
            --cache-control "no-cache"
        env:
          AWS_ACCESS_KEY_ID: ${{ env.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto

  # Keyless build provenance for the CLI (#877).
  #
  # Until now the CLI release published three bare binaries and a latest.json,
  # with nothing anyone could check them against — so `cli-install.sh` could not
  # verify its download even in principle, and a "verify what you install" fix
  # to the script alone would have been theatre. This mirrors the desktop
  # `provenance` job: a SLSA v1 in-toto attestation plus a cosign keyless
  # signature and certificate for each binary, published NEXT TO it on
  # cdn.pollis.com, anchored in Sigstore's public Rekor log.
  #
  # Rekor is the point. The CLI binaries live on the same CDN as the install
  # script that fetches them, so anything Pollis publishes there is only as
  # trustworthy as that origin. Sigstore is not operated by Pollis, and the
  # signing identity is this workflow's GitHub Actions OIDC identity, so a
  # binary swapped on the CDN cannot be given a valid signature.
  #
  # `needs: [publish-cli]`, so the release is already out when this runs: a
  # failure here delays provenance, it never corrupts a shipped CLI.
  provenance-cli:
    needs: [resolve-version, publish-cli]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Load production secrets
        run: |
          echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "R2_SECRET_KEY=${{ secrets.R2_SECRET_KEY }}" >> $GITHUB_ENV
          echo "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Staged under the EXACT names publish-cli uploaded to R2, so a verifier
      # resolves signature and binary by the same path.
      - name: Stage CLI binaries under their published names
        run: |
          set -euo pipefail
          mkdir -p prov
          cp artifacts/pollis-cli-linux/pollis       prov/pollis-linux
          cp artifacts/pollis-cli-macos/pollis       prov/pollis-macos
          cp artifacts/pollis-cli-windows/pollis.exe prov/pollis-windows.exe
          ls -1 prov

      - name: Generate SLSA build provenance (keyless, Fulcio/Rekor)
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: prov/*

      # Pinned exactly, and to the cosign 2.x CLI the sign-blob flags below are
      # written for — same reasoning as the desktop provenance job.
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v2.6.5'

      - name: cosign sign-blob each CLI binary
        run: |
          set -euo pipefail
          for f in prov/*; do
            base="$(basename "$f")"
            cosign sign-blob --yes \
              --output-signature "prov/${base}.sig" \
              --output-certificate "prov/${base}.pem" \
              "$f"
          done

      - name: Publish provenance + cosign signatures to R2
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-version.outputs.version }}"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          BUNDLE="${{ steps.attest.outputs.bundle-path }}"
          for f in prov/*; do
            base="$(basename "$f")"
            case "$base" in
              *.sig|*.pem|*.intoto.jsonl) continue ;;
            esac
            aws s3 cp "$BUNDLE" "s3://pollis/releases/cli/${VERSION}/${base}.intoto.jsonl" \
              --endpoint-url "${ENDPOINT}" --content-type "application/json"
            aws s3 cp "prov/${base}.sig" "s3://pollis/releases/cli/${VERSION}/${base}.sig" \
              --endpoint-url "${ENDPOINT}" --content-type "text/plain"
            aws s3 cp "prov/${base}.pem" "s3://pollis/releases/cli/${VERSION}/${base}.pem" \
              --endpoint-url "${ENDPOINT}" --content-type "application/x-pem-file"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ env.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
