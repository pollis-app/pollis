name: Desktop Release (Tauri)

# Tauri pipeline — the active desktop release path again as of the
# Electron→Tauri re-migration (#386). A tag push (`git tag v1.2.0 &&
# git push --tags`) runs the full ceremony: signed macOS DMG/ZIP, Azure
# Trusted-Signed Windows NSIS, Linux AppImage/.deb/.rpm, R2 upload, GitHub
# release, AUR push, install.sh + latest.json refresh, and the Tauri-format
# `cdn.pollis.com/releases/update-*.json` updater manifests (minisign-signed).
#
# This is the ONLY workflow in the repo that triggers on a `v*` tag — the
# Electron pipeline was removed along with the rest of the Electron shell, so a
# tag fires this pipeline alone: no double db-apply / latest.json / AUR races.
# (verifier-release.yml deliberately uses a `pollis-verify-v*` prefix so it can
# never match the `v*` glob below.)
#
# Historical cutover note (#386/#389): there was never an in-place auto-update
# from an installed Electron build to a Tauri build — electron-updater installs
# electron-builder artifacts and Tauri verifies a minisign signature the
# Electron build did not carry. Any surviving Electron install has to
# re-download once; every release after that auto-updates through the Tauri
# updater normally.
on:
  workflow_dispatch:
  # Tag-driven release: `git tag v1.2.0 && git push --tags` is the entire
  # ceremony. CI extracts the version from the tag and stamps every file
  # before building.
  push:
    tags:
      - "v*"

# Least-privilege default. Jobs that need more declare it themselves:
# `release` has contents: write (GitHub release), `provenance` has
# id-token/attestations. Everything else only reads the repo.
permissions:
  contents: read

jobs:
  # This workflow builds + publishes a FULL versioned release (installers, prod DB
  # migrations, SLSA/cosign provenance, binary-transparency log) — all keyed on the
  # tag name (`github.ref_name`). So it must be triggered by pushing a `v*` tag, not
  # by a bare workflow_dispatch (where the ref is a branch and the version stamp
  # would be a non-semver branch name). This guard fails such a run in seconds with
  # the exact command, instead of a cryptic "not strict semver" error deep in a build.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Require a version tag
        run: |
          if [ "${{ github.ref_type }}" != "tag" ] || [[ "${{ github.ref_name }}" != v* ]]; then
            echo "::error title=Desktop Release is tag-driven::Push a version tag to release — do not use workflow_dispatch."
            echo "This job publishes a full versioned release keyed on the tag name, so it needs a v* tag." >&2
            echo "To release:  git tag vX.Y.Z <sha> && git push origin vX.Y.Z" >&2
            exit 1
          fi
          echo "Releasing ${{ github.ref_name }}"

  build-macos:
    needs: preflight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      # Pinned to the EXACT version in rust-toolchain.toml (1.96.0), not `@stable`,
      # which floats: the recorded build recipe has to name one compiler, or the
      # recipe does not describe what actually built the release. Bump both in
      # lockstep. (Since #750 this job builds ONCE, so the pin is no longer load
      # bearing for a same-commit self-comparison — it is about the recipe being
      # true. macOS rebuild-from-source remains best-effort; see
      # docs/reproducible-builds-residuals.md.)
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stamp version from git tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/bump-version.sh "$VERSION"

      - name: Load production secrets
        run: |
          # #987: the client bakes NO database credential. TURSO_URL /
          # TURSO_RO_TOKEN / LOG_DB_URL / LOG_DB_TOKEN used to be injected here
          # and read by `option_env!` in pollis-core's config.rs; every remote
          # read now goes through the Delivery Service on the same signed
          # transport as the writes, and `pollis-core` no longer links libsql at
          # all. The secrets themselves stay in Doppler — the DS and the
          # migration runner still need them (see the migration steps below).
          echo "R2_S3_ENDPOINT=${{ secrets.R2_S3_ENDPOINT }}" >> $GITHUB_ENV
          echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "R2_SECRET_KEY=${{ secrets.R2_SECRET_KEY }}" >> $GITHUB_ENV
          echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}" >> $GITHUB_ENV
          echo "R2_REGION=${{ secrets.R2_REGION }}" >> $GITHUB_ENV
          echo "LIVEKIT_URL=${{ secrets.LIVEKIT_URL }}" >> $GITHUB_ENV
          echo "LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }}" >> $GITHUB_ENV
          echo "LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }}" >> $GITHUB_ENV
          echo "POLLIS_DELIVERY_URL=${{ secrets.POLLIS_DELIVERY_URL }}" >> $GITHUB_ENV
          echo "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" >> $GITHUB_ENV
          # Relay overlay (#616/#455): the signed-directory URL + pinned Ed25519
          # public key. option_env! bakes them into the client so the pool is
          # reachable; the overlay stays OFF until a user opts in via Settings.
          # Rotating the signing key requires a coordinated client rebuild (clients
          # pin this key). Absent → the app builds fine and the overlay is inert.
          echo "POLLIS_OVERLAY_DIRECTORY_URL=${{ secrets.POLLIS_OVERLAY_DIRECTORY_URL }}" >> $GITHUB_ENV
          echo "POLLIS_OVERLAY_DIRECTORY_KEY=${{ secrets.POLLIS_OVERLAY_DIRECTORY_KEY }}" >> $GITHUB_ENV

      # webrtc-audio-processing-sys (vendored): meson + ninja drive the C++
      # build, clang/cmake are already on macOS GitHub runners.
      - name: Install audio-processing build deps
        run: brew install meson ninja

      - name: Install dependencies
        run: pnpm install

      # The macOS screen-capture helper (pollis-capture-macos) owns
      # ScreenCaptureKit in its own process — issue #283 Phase 2 — so an
      # uncatchable ObjC throw from SCK can no longer kill the app.
      # Tauri bundles it as a sidecar (externalBin in
      # tauri.macos.conf.json). `src-tauri/build.rs` builds + stages the
      # binary at the target-triple-suffixed path automatically during
      # tauri-action's cargo build, so no explicit pre-stage step is
      # needed here.

      # WS3 (#603/#704): the macOS signing config now lives ENTIRELY in secrets —
      # the hardcoded signingIdentity was removed from tauri.{conf,macos.conf}.json
      # in #704. If APPLE_SIGNING_IDENTITY is empty, tauri resolves no identity and
      # SILENTLY skips codesign + notarization while the job still goes green,
      # shipping a Gatekeeper-blocked .dmg under a valid-looking payload leaf.
      # GitHub sets an env var to the empty string for every unset secret, so this
      # preflight fails loudly on empty BEFORE the ~20-minute signed build, making
      # the bundler's own "empty identity" handling irrelevant. Verified after the
      # fact by the "Verify macOS artifact is signed and notarized" step below.
      - name: Preflight macOS signing secrets (WS3)
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          scripts/verify-signed-artifact.sh preflight "macOS" \
            APPLE_SIGNING_IDENTITY APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD \
            APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID

      - name: Build and sign macOS (ARM)
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target aarch64-apple-darwin

      # WS3 (#603/#704): "the artifact we ship is signed" is a load-bearing claim —
      # our payload leaf + attestation are meaningless wrapped around a .dmg
      # Gatekeeper blocks. Assert it the same way we assert the binary fingerprint,
      # rather than trusting the build went green: an empty APPLE_SIGNING_IDENTITY
      # skips signing silently, so this proves the shipped .app is Developer ID
      # signed AND notarization-stapled (spctl) before any upload/publish.
      - name: Verify macOS artifact is signed and notarized (WS3)
        run: |
          app="$(find target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -type d | head -1)"
          if [ -z "${app:-}" ]; then
            echo "::error::WS3: no signed .app found to verify under the macOS bundle dir"
            exit 1
          fi
          scripts/verify-signed-artifact.sh macos "$app"

      # #750: the macOS payload digest is derived FROM THE BUNDLE WE SHIP, with
      # Apple's signature and notarization ticket normalized back out (see the long
      # note above sha_macos_payload in scripts/lib/payload-hash.sh).
      #
      # This replaces a two-build scheme: build once unsigned to hash, once signed
      # to ship, then assert the two shared a compiled binary. That made the release
      # gate depend on rustc emitting byte-identical output across two compiles of
      # one source tree — which it does not reliably do (#750) — and it hashed a
      # bundle that existed only inside the CI job, so no outside party could ever
      # check the leaf against anything. Hashing the shipped bundle is both the
      # thing we can actually guarantee and the thing a stranger can falsify.
      #
      # Ordered AFTER the signed/notarized assertion (so the input is known-good)
      # and BEFORE the upload (so a normalization failure stops the release rather
      # than publishing a leaf nobody can recompute).
      #
      # gtar: sha_tree's `--sort=name` is a GNU extension macOS's BSD tar lacks, and
      # the digest has to match an outside verifier's byte-for-byte.
      - name: Compute macOS payload digest (#750)
        run: |
          set -euo pipefail
          brew install gnu-tar
          export TAR=gtar
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          app="$(find target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name '*.app' -type d | head -1)"
          if [ -z "${app:-}" ]; then
            echo "::error::#750: no signed .app found to hash for the macOS payload digest"
            exit 1
          fi
          . scripts/lib/payload-hash.sh
          sha_macos_payload "$app" > "pollis-${GITHUB_REF_NAME}-macos.payload-sha256"
          echo "macOS payload_sha256: $(cat "pollis-${GITHUB_REF_NAME}-macos.payload-sha256")"

      # #877: record the toolchain that ACTUALLY built this payload, in the only
      # job that knows it. Until now every binary-transparency leaf carried
      # `rustc/node/pnpm: "unknown"` and a floating runner label — 258 permanent,
      # signed leaves across v1.3.4 → v1.9.7 — because the attest job (a different
      # runner with none of these tools installed) filled the field with defaults.
      # Emitted as a sidecar next to the payload digest, and hard-required by
      # scripts/attest-binaries.sh, so a release can no longer log a false recipe.
      - name: Record the build toolchain (#877)
        run: |
          set -euo pipefail
          . scripts/lib/attest-helpers.sh
          write_toolchain_manifest "pollis-${GITHUB_REF_NAME}-macos.toolchain.json"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: pollis-macos
          if-no-files-found: error
          path: |
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            target/aarch64-apple-darwin/release/bundle/macos/*.tar.gz
            target/aarch64-apple-darwin/release/bundle/macos/*.sig
            pollis-*-macos.payload-sha256
            pollis-*-macos.toolchain.json

  build-windows:
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      # Pinned to rust-toolchain.toml's 1.96.0 (see the macOS job note) — never
      # float on @stable, or the same commit can produce different bytes.
      - uses: dtolnay/rust-toolchain@1.96.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Stamp version from git tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/bump-version.sh "$VERSION"

      - name: Load production secrets
        shell: bash
        run: |
          # #987: the client bakes NO database credential. TURSO_URL /
          # TURSO_RO_TOKEN / LOG_DB_URL / LOG_DB_TOKEN used to be injected here
          # and read by `option_env!` in pollis-core's config.rs; every remote
          # read now goes through the Delivery Service on the same signed
          # transport as the writes, and `pollis-core` no longer links libsql at
          # all. The secrets themselves stay in Doppler — the DS and the
          # migration runner still need them (see the migration steps below).
          echo "R2_S3_ENDPOINT=${{ secrets.R2_S3_ENDPOINT }}" >> $GITHUB_ENV
          echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "R2_SECRET_KEY=${{ secrets.R2_SECRET_KEY }}" >> $GITHUB_ENV
          echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}" >> $GITHUB_ENV
          echo "R2_REGION=${{ secrets.R2_REGION }}" >> $GITHUB_ENV
          echo "LIVEKIT_URL=${{ secrets.LIVEKIT_URL }}" >> $GITHUB_ENV
          echo "LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }}" >> $GITHUB_ENV
          echo "LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }}" >> $GITHUB_ENV
          echo "POLLIS_DELIVERY_URL=${{ secrets.POLLIS_DELIVERY_URL }}" >> $GITHUB_ENV
          echo "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" >> $GITHUB_ENV
          # Relay overlay (#616/#455): the signed-directory URL + pinned Ed25519
          # public key. option_env! bakes them into the client so the pool is
          # reachable; the overlay stays OFF until a user opts in via Settings.
          # Rotating the signing key requires a coordinated client rebuild (clients
          # pin this key). Absent → the app builds fine and the overlay is inert.
          echo "POLLIS_OVERLAY_DIRECTORY_URL=${{ secrets.POLLIS_OVERLAY_DIRECTORY_URL }}" >> $GITHUB_ENV
          echo "POLLIS_OVERLAY_DIRECTORY_KEY=${{ secrets.POLLIS_OVERLAY_DIRECTORY_KEY }}" >> $GITHUB_ENV

      - name: Install dependencies
        run: pnpm install

      # #991 deleted the "Install OpenSSL via vcpkg" step that used to sit here
      # (a ~7-minute from-source build of openssl:x64-windows-static-md). Its
      # only consumer was libsqlite3-sys's `bundled-sqlcipher` feature, and the
      # Windows target does not enable it: SQLCipher's OpenSSL cannot be linked
      # next to libwebrtc's BoringSSL under MSVC. Since #992 Windows DOES ship
      # SQLCipher — from the `pollis-sqlcipher` crate, whose crypto provider is
      # RustCrypto — so there is still no OpenSSL anywhere in the Windows
      # dependency graph (`cargo tree -p pollis --target x86_64-pc-windows-msvc
      # -i openssl-sys` prints nothing) and nothing here wants OPENSSL_DIR.
      # Adding it back would not help and would not be used.
      # See the rusqlite note in pollis-core/Cargo.toml.

      - name: Install Artifact Signing client + SignTool
        shell: pwsh
        run: |
          $toolsDir = Join-Path $env:RUNNER_TEMP "artifact-signing"
          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null

          nuget install Microsoft.Windows.SDK.BuildTools -OutputDirectory $toolsDir -ExcludeVersion
          nuget install Microsoft.ArtifactSigning.Client -OutputDirectory $toolsDir -ExcludeVersion

          $signtool = Get-ChildItem -Path $toolsDir -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Select-Object -First 1
          $dlib = Get-ChildItem -Path $toolsDir -Recurse -Filter Azure.CodeSigning.Dlib.dll |
            Where-Object { $_.FullName -match '\\x64\\' } |
            Select-Object -First 1

          if (-not $signtool) { throw "signtool.exe not found under $toolsDir" }
          if (-not $dlib)     { throw "Azure.CodeSigning.Dlib.dll not found under $toolsDir" }

          "SIGNTOOL_PATH=$($signtool.FullName)"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "SIGNING_DLIB_PATH=$($dlib.FullName)"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Write Artifact Signing metadata
        shell: pwsh
        env:
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
        run: |
          $metadataPath = Join-Path $env:RUNNER_TEMP "sign-metadata.json"
          [ordered]@{
            Endpoint               = $env:AZURE_SIGNING_ENDPOINT
            CodeSigningAccountName = $env:AZURE_SIGNING_ACCOUNT
            CertificateProfileName = $env:AZURE_CERT_PROFILE
          } | ConvertTo-Json | Out-File -FilePath $metadataPath -Encoding utf8
          "SIGN_METADATA_PATH=$metadataPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # WS3 (#603/#704): the Windows Authenticode path signs via Azure Trusted
      # Signing (the dlib authenticates with these secrets and the signtool /dmdf
      # metadata is built from them). Unlike macOS, an empty Azure secret makes
      # signtool FAIL rather than silently skip — so the build would break anyway —
      # but we still preflight to fail in seconds with a named secret instead of
      # deep inside a signed build, and to keep the "assert, don't assume signing"
      # posture symmetric with macOS. GitHub sets each unset secret to the empty
      # string, so this catches Some("") too. Verified after the fact by the
      # "Verify Windows artifact is Authenticode-signed" step below.
      - name: Preflight Windows signing secrets (WS3)
        shell: bash
        env:
          AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          scripts/verify-signed-artifact.sh preflight "Windows" \
            AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_CERT_PROFILE \
            AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET

      # Fail here, in seconds, rather than after a ~30-minute signed build: the
      # payload digest step at the end of this job shells out to Python for the PE
      # signature strip, and Git-for-Windows bash does not reliably expose
      # `python3` (stock Windows even ships a `python3.exe` Store alias that runs
      # nothing). payload_hash_python resolves and PROVES an interpreter works.
      - name: Verify the payload-digest toolchain is present (#750)
        shell: bash
        run: |
          set -euo pipefail
          . scripts/lib/payload-hash.sh
          py="$(payload_hash_python)"
          echo "payload digest will use: $py ($("$py" --version 2>&1))"
          command -v 7z >/dev/null || { echo "::error::#750: 7z is required to extract the NSIS payload"; exit 1; }

      - name: Inject Windows signCommand into tauri.conf.json
        shell: bash
        run: |
          # Object form avoids Tauri's naive whitespace-split on the string form,
          # which would otherwise pass literal quotes through to CreateProcessW
          # and trip ERROR_INVALID_NAME (os error 123) on Windows paths.
          jq \
            --arg cmd "$SIGNTOOL_PATH" \
            --arg dlib "$SIGNING_DLIB_PATH" \
            --arg meta "$SIGN_METADATA_PATH" \
            '.bundle.windows = ((.bundle.windows // {}) + {
              signCommand: {
                cmd: $cmd,
                args: ["sign","/v","/fd","SHA256","/tr","http://timestamp.acs.microsoft.com","/td","SHA256","/dlib",$dlib,"/dmdf",$meta,"%1"]
              }
            })' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          echo "signCommand injected:"
          jq '.bundle.windows.signCommand' src-tauri/tauri.conf.json

      - name: Build Windows
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: pnpm build:tauri:windows

      # WS3 (#603/#704): prove the SHIPPED installer is Authenticode-signed before
      # any upload/publish — the payload leaf + attestation are meaningless around
      # an unsigned .exe. SIGNTOOL_PATH is already resolved earlier in this job, so
      # signtool verify /pa (does it chain to a trusted root under the default
      # policy) is nearly free. It runs BEFORE the payload digest below so that
      # digest is always taken over a tree we have proven is the signed one.
      - name: Verify Windows artifact is Authenticode-signed (WS3)
        shell: bash
        run: |
          exe="$(find target/x86_64-pc-windows-msvc/release/bundle/nsis -maxdepth 1 -name '*.exe' | head -1)"
          if [ -z "${exe:-}" ]; then
            echo "::error::WS3: no signed NSIS .exe found to verify under the Windows bundle dir"
            exit 1
          fi
          scripts/verify-signed-artifact.sh windows "$exe"

      # #750: the payload digest, derived FROM THE INSTALLER WE SHIP.
      #
      # Windows used to build twice — once unsigned to hash, once signed to ship —
      # and gate the release on the two compiles being byte-identical. That made
      # the release depend on rustc emitting identical output across two compiles
      # of one source tree, which it does not reliably do; it failed on v1.8.3
      # twice in a row with a different hash each time. #750 removed that
      # dependence on macOS and this removes the last of it: build ONCE, then
      # normalize the unreproducible Authenticode material back out of the
      # extracted tree before hashing (sha_windows_payload -> strip-pe-signature.py).
      #
      # The digest is now recomputable by anyone holding the public .exe, which
      # the old one — describing an unsigned installer that only ever existed
      # inside this job — never was. Git-for-Windows bash ships GNU tar +
      # sha256sum, and the toolchain check above has already proven 7-Zip and a
      # working Python 3 are present, so the shared helper runs unchanged.
      - name: Compute Windows payload digest (#750)
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          exe="$(find target/x86_64-pc-windows-msvc/release/bundle/nsis -maxdepth 1 -name '*.exe' | head -1)"
          if [ -z "${exe:-}" ]; then
            echo "::error::#750: no signed NSIS .exe found to hash for the Windows payload digest"
            exit 1
          fi
          . scripts/lib/payload-hash.sh
          sha_windows_payload "$exe" > "pollis-${GITHUB_REF_NAME}-windows.payload-sha256"
          echo "Windows payload_sha256: $(cat "pollis-${GITHUB_REF_NAME}-windows.payload-sha256")"

      # #877 — see the note on the macOS job. Runs under Git-for-Windows bash,
      # where `rustc`/`node`/`pnpm --version` behave identically.
      - name: Record the build toolchain (#877)
        shell: bash
        run: |
          set -euo pipefail
          . scripts/lib/attest-helpers.sh
          write_toolchain_manifest "pollis-${GITHUB_REF_NAME}-windows.toolchain.json"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: pollis-windows
          if-no-files-found: error
          path: |
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.zip
            target/x86_64-pc-windows-msvc/release/bundle/nsis/*.sig
            pollis-*-windows.payload-sha256
            pollis-*-windows.toolchain.json

  build-capture-helper:
    needs: preflight
    # The Linux screen-capture helper (pollis-capture-linux) links the
    # `pipewire` 0.9 crate, whose libspa-sys bindgen step generates
    # `spa_video_info_raw` from the build host's *system* PipeWire headers
    # (libpipewire is never bundled — it must match the user's running
    # pipewire daemon at runtime). ubuntu-22.04 ships PipeWire 0.3.48,
    # whose struct lacks `flags` and types `modifier` as i64, so libspa
    # 0.9 fails to compile. ubuntu-24.04 ships PipeWire 1.0.5, which
    # matches what the crate expects. Built in isolation here so the main
    # app job can stay on ubuntu-22.04 for a low AppImage glibc floor
    # (messaging must run on old distros) — only this small helper needs
    # modern PipeWire, which screen share requires at runtime anyway.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Pinned to rust-toolchain.toml's 1.96.0 (see the macOS job note) — never
      # float on @stable, or the same commit can produce different bytes.
      - uses: dtolnay/rust-toolchain@1.96.0

      # NO build cache on the Linux path, deliberately (#795).
      #
      # A restored `target/` lets cargo reuse artifacts compiled under earlier
      # conditions, so the linked output stops being a pure function of the source.
      # That is exactly what made v1.8.3 unreproducible: a warm-cache release and a
      # cold-cache rebuild produced `.text` sections differing by 64 bytes, with every
      # other input identical — same pinned rustc, same runner image, same RUSTFLAGS,
      # codegen-units=1, lto=true.
      #
      # The asymmetry is not fixable by caching the reproducer too: a third party
      # starts cold BY DEFINITION, so a build that only reproduces from our cache
      # reproduces for nobody. Reproducible builds start from a clean tree — the same
      # choice Debian, Tails and F-Droid make. The cost is a full cold compile per
      # release, which is the price of the claim.
      #
      # macOS/Windows keep their caches: they are not bit-reproducible (no rebuilder
      # asserts them), so paying cold-compile time there would buy nothing.

      - name: Install PipeWire build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpipewire-0.3-dev \
            libxcb1-dev \
            libxcb-shm0-dev \
            libxcb-randr0-dev \
            clang \
            pkg-config

      # Built on this 24.04 runner so libspa-sys's bindgen sees PipeWire
      # 1.0 headers; the app job runs on ubuntu-22.04 (PipeWire 0.3) and
      # would fail to compile the helper there. We hand the finished
      # binary to the app job via an artifact; the app job's build.rs
      # detects the pre-staged file and skips rebuilding.
      # The SAME determinism inputs the app job applies (#795). This helper is
      # embedded in the AppImage, so it is part of the reproducible payload — but it
      # was being built with none of them, baking absolute runner paths (/home/runner,
      # the cargo registry) into the binary. The rebuilder DOES apply them, so the two
      # helpers could never match and no Linux rebuild could ever reproduce, whatever
      # else was fixed. Confirmed by diffing a real rebuild against v1.8.3: exactly two
      # files differed, and this was one of them.
      - name: Configure reproducible build flags (capture helper)
        run: |
          set -euo pipefail
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          CARGO_HOME_DIR="${CARGO_HOME:-$HOME/.cargo}"
          echo "RUSTFLAGS=--remap-path-prefix=${HOME}=/pollis-home --remap-path-prefix=${CARGO_HOME_DIR}=/pollis-cargo --remap-path-prefix=${GITHUB_WORKSPACE}=/pollis-src" >> "$GITHUB_ENV"
          # The SAME remapping for C/C++ (#795). `--remap-path-prefix` is a RUSTC flag:
          # it does not reach the C and C++ that build scripts compile through `cc-rs`,
          # so those objects embed the absolute build path. The shipped v1.8.4 binary
          # carried `/home/runner/.cargo/.../cxx-1.0.194/src/cxx.cc` for exactly this
          # reason. Our release and our reproducer both happen to run at /home/runner,
          # so it did not break the CI-to-CI result — but a third party building
          # anywhere else embeds THEIR path and cannot reproduce, which is the entire
          # point of the exercise. `-ffile-prefix-map` is the C/C++ equivalent and
          # cc-rs honours CFLAGS/CXXFLAGS.
          MAP="-ffile-prefix-map=${HOME}=/pollis-home -ffile-prefix-map=${CARGO_HOME_DIR}=/pollis-cargo -ffile-prefix-map=${GITHUB_WORKSPACE}=/pollis-src"
          echo "CFLAGS=${CFLAGS:-} ${MAP}" >> "$GITHUB_ENV"
          echo "CXXFLAGS=${CXXFLAGS:-} ${MAP}" >> "$GITHUB_ENV"

      - name: Build and stage screen-capture helper
        run: |
          # --locked matches the rebuilder and the app job: a drifted Cargo.lock fails
          # rather than silently resolving different crate versions into the payload.
          cargo build --release --locked --target x86_64-unknown-linux-gnu -p pollis-capture-linux
          mkdir -p src-tauri/binaries
          cp target/x86_64-unknown-linux-gnu/release/pollis-capture-linux \
             src-tauri/binaries/pollis-capture-linux-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/pollis-capture-linux-x86_64-unknown-linux-gnu

      - name: Upload screen-capture helper
        uses: actions/upload-artifact@v4
        with:
          name: pollis-capture-linux
          if-no-files-found: error
          path: src-tauri/binaries/pollis-capture-linux-x86_64-unknown-linux-gnu

      # #877: this job's runner image is part of the Linux payload's build recipe
      # — the helper it compiles is embedded in the AppImage, and it deliberately
      # runs on a DIFFERENT image (ubuntu-24.04, PipeWire 1.0) from the app job.
      # A recipe naming only the app runner would send a rebuilder to the wrong
      # image for part of the payload, so build-linux folds this id into its
      # manifest. Carried in its own artifact rather than alongside the binary:
      # src-tauri/binaries is an externalBin staging directory the bundler reads,
      # and a release path is the wrong place to find out what it does with a
      # stray file.
      - name: Record the capture-helper runner image (#877)
        run: |
          set -euo pipefail
          . scripts/lib/attest-helpers.sh
          mkdir -p helper-recipe
          runner_image_id > helper-recipe/capture-helper-runner.txt
          echo "capture helper built on $(cat helper-recipe/capture-helper-runner.txt)"

      - name: Upload capture-helper runner image
        uses: actions/upload-artifact@v4
        with:
          name: pollis-capture-linux-recipe
          if-no-files-found: error
          path: helper-recipe/capture-helper-runner.txt

  build-linux:
    needs: build-capture-helper
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      # Pinned to rust-toolchain.toml's 1.96.0 (see the macOS job note) — never
      # float on @stable, or the same commit can produce different bytes.
      - uses: dtolnay/rust-toolchain@1.96.0

      # NO build cache here, deliberately (#795). A restored `target/` lets cargo
      # reuse artifacts compiled under earlier conditions, so the output stops being
      # a pure function of the source — that is what made v1.8.3 unreproducible
      # (`.text` differing by 64 bytes with every other input identical). It cannot
      # be fixed by caching the reproducer too: a third party starts cold BY
      # DEFINITION, so a build that reproduces only from our cache reproduces for
      # nobody. macOS/Windows keep their caches — they are not bit-reproducible, so
      # cold-compiling them would buy nothing.

      - name: Stamp version from git tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./scripts/bump-version.sh "$VERSION"

      # libva-dev: header-only build dep for webrtc-sys's VAAPI H.264
      # encoder wrapper. `libva.so.2` / `libva-drm.so.2` are dlopened at
      # runtime via lazy-load shims — the binary doesn't link them — so
      # missing libva at the user's machine just makes the VAAPI factory
      # report unsupported and falls back to OpenH264 software. With
      # libva headers present at build time we get the VAAPI factory
      # compiled in; Intel/AMD iGPU users then get HW H.264. See #293.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libva-dev \
            libdbus-1-dev \
            rpm \
            cmake \
            clang \
            ninja-build

      # Ubuntu 22.04 ships meson 0.61, but webrtc-audio-processing-sys passes
      # `--reconfigure` to meson on its first run, which requires meson >= 1.1.
      # Install a current meson via pip instead of apt.
      - name: Install meson (newer than apt)
        run: |
          python3 -m pip install --user 'meson>=1.3'
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Load production secrets
        run: |
          # #987: the client bakes NO database credential. TURSO_URL /
          # TURSO_RO_TOKEN / LOG_DB_URL / LOG_DB_TOKEN used to be injected here
          # and read by `option_env!` in pollis-core's config.rs; every remote
          # read now goes through the Delivery Service on the same signed
          # transport as the writes, and `pollis-core` no longer links libsql at
          # all. The secrets themselves stay in Doppler — the DS and the
          # migration runner still need them (see the migration steps below).
          echo "R2_S3_ENDPOINT=${{ secrets.R2_S3_ENDPOINT }}" >> $GITHUB_ENV
          echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "R2_SECRET_KEY=${{ secrets.R2_SECRET_KEY }}" >> $GITHUB_ENV
          echo "R2_PUBLIC_URL=${{ secrets.R2_PUBLIC_URL }}" >> $GITHUB_ENV
          echo "R2_REGION=${{ secrets.R2_REGION }}" >> $GITHUB_ENV
          echo "LIVEKIT_URL=${{ secrets.LIVEKIT_URL }}" >> $GITHUB_ENV
          echo "LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }}" >> $GITHUB_ENV
          echo "LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }}" >> $GITHUB_ENV
          echo "POLLIS_DELIVERY_URL=${{ secrets.POLLIS_DELIVERY_URL }}" >> $GITHUB_ENV
          echo "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" >> $GITHUB_ENV
          # Relay overlay (#616/#455): the signed-directory URL + pinned Ed25519
          # public key. option_env! bakes them into the client so the pool is
          # reachable; the overlay stays OFF until a user opts in via Settings.
          # Rotating the signing key requires a coordinated client rebuild (clients
          # pin this key). Absent → the app builds fine and the overlay is inert.
          echo "POLLIS_OVERLAY_DIRECTORY_URL=${{ secrets.POLLIS_OVERLAY_DIRECTORY_URL }}" >> $GITHUB_ENV
          echo "POLLIS_OVERLAY_DIRECTORY_KEY=${{ secrets.POLLIS_OVERLAY_DIRECTORY_KEY }}" >> $GITHUB_ENV

      # --frozen-lockfile: fail (don't silently re-resolve) if pnpm-lock.yaml
      # drifted — the Linux payload is the reproducible unit, so its JS inputs
      # must be pinned, not floated (docs/verifiable-builds-design.md §1.2/§1.4).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The screen-capture helper is a separate workspace binary that Tauri
      # bundles as a sidecar (externalBin in tauri.linux.conf.json). It is
      # compiled in the build-capture-helper job on ubuntu-24.04 (modern
      # PipeWire headers) and pulled in here as an artifact, staged at the
      # target-triple-suffixed externalBin path BEFORE `tauri build` — or
      # the Linux release ships without it and screen sharing fails at
      # runtime.
      - name: Download screen-capture helper
        uses: actions/download-artifact@v4
        with:
          name: pollis-capture-linux
          path: src-tauri/binaries

      - name: Mark screen-capture helper executable
        run: chmod +x src-tauri/binaries/pollis-capture-linux-x86_64-unknown-linux-gnu

      # #877: the helper job's runner image, folded into this job's recipe below.
      - name: Download capture-helper runner image
        uses: actions/download-artifact@v4
        with:
          name: pollis-capture-linux-recipe
          path: helper-recipe

      # Determinism inputs for the reproducible Linux payload (P5, #484):
      #   * SOURCE_DATE_EPOCH — the tag commit's unix seconds. Deterministic and
      #     independently recoverable from `git` by any rebuilder (NOT `now`), so
      #     anything that would otherwise embed wall-clock time (archive mtimes,
      #     resource stamps) resolves to a stable value. This is the SAME epoch
      #     the attest leaf and the rebuild-verify workflow derive.
      #   * RUSTFLAGS --remap-path-prefix — strips absolute build paths (home,
      #     cargo home, workspace root) out of the binary's debug info / panic
      #     strings so two different hosts building this commit emit the same
      #     bytes. Linux has NO per-target rustflags in .cargo/config.toml
      #     (only macOS/Windows do), so exporting RUSTFLAGS here is purely
      #     additive — it does not clobber any configured flags. Order matters:
      #     the most general prefix ($HOME) is listed first and the more specific
      #     ones after it, because rustc applies the LAST matching remap.
      - name: Configure reproducible build flags (Linux payload)
        run: |
          set -euo pipefail
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          CARGO_HOME_DIR="${CARGO_HOME:-$HOME/.cargo}"
          echo "RUSTFLAGS=--remap-path-prefix=${HOME}=/pollis-home --remap-path-prefix=${CARGO_HOME_DIR}=/pollis-cargo --remap-path-prefix=${GITHUB_WORKSPACE}=/pollis-src" >> "$GITHUB_ENV"
          # The SAME remapping for C/C++ (#795). `--remap-path-prefix` is a RUSTC flag:
          # it does not reach the C and C++ that build scripts compile through `cc-rs`,
          # so those objects embed the absolute build path. The shipped v1.8.4 binary
          # carried `/home/runner/.cargo/.../cxx-1.0.194/src/cxx.cc` for exactly this
          # reason. Our release and our reproducer both happen to run at /home/runner,
          # so it did not break the CI-to-CI result — but a third party building
          # anywhere else embeds THEIR path and cannot reproduce, which is the entire
          # point of the exercise. `-ffile-prefix-map` is the C/C++ equivalent and
          # cc-rs honours CFLAGS/CXXFLAGS.
          MAP="-ffile-prefix-map=${HOME}=/pollis-home -ffile-prefix-map=${CARGO_HOME_DIR}=/pollis-cargo -ffile-prefix-map=${GITHUB_WORKSPACE}=/pollis-src"
          echo "CFLAGS=${CFLAGS:-} ${MAP}" >> "$GITHUB_ENV"
          echo "CXXFLAGS=${CXXFLAGS:-} ${MAP}" >> "$GITHUB_ENV"

      # `-- --locked` forwards to the underlying `cargo build`: a drifted
      # Cargo.lock FAILS the build instead of silently resolving new crate
      # versions (the transparency build already builds --locked; the desktop
      # build must too — §1.2). SOURCE_DATE_EPOCH + RUSTFLAGS come from the step
      # above via $GITHUB_ENV.
      - name: Build Linux
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target x86_64-unknown-linux-gnu -- --locked

      # A reproducible payload must not embed the machine that built it (#795).
      #
      # This is the assertion behind the RUSTFLAGS/CFLAGS remapping above: if any
      # absolute build path survives into the binary, a third party building at a
      # different path CANNOT reproduce it, and the claim quietly becomes false for
      # everyone but us. v1.8.4 shipped with `/home/runner/.cargo/.../cxx.cc`
      # embedded because the C/C++ half was never remapped, and nothing caught it —
      # so it is checked here rather than assumed.
      - name: Assert the binary embeds no build paths
        run: |
          set -euo pipefail
          bin="target/x86_64-unknown-linux-gnu/release/pollis"
          leaked="$(strings -a "$bin" | grep -oE '(/home/[a-z]+|/root)/[A-Za-z0-9._/-]+' | sort -u | head -20 || true)"
          if [ -n "$leaked" ]; then
            echo "::error::this build embeds absolute build paths, so nobody building"
            echo "::error::elsewhere can reproduce it. Offending strings:"
            printf '%s\n' "$leaked" | sed 's/^/::error::  /'
            exit 1
          fi
          # Prove the remapping actually ran, rather than paths merely being absent.
          if ! strings -a "$bin" | grep -q '/pollis-cargo'; then
            echo "::error::no /pollis-cargo prefix found — the path remapping did not take effect"
            exit 1
          fi
          echo "no build paths embedded; remapped prefixes present"

      # #877: the Linux payload is the reproducible unit, so its recipe is the one
      # that most needs to be true. It names BOTH images — this job's and the
      # capture-helper job's — because the AppImage embeds a binary compiled on
      # the other one, exactly as rebuild-verify.yml already mirrors.
      - name: Record the build toolchain (#877)
        run: |
          set -euo pipefail
          . scripts/lib/attest-helpers.sh
          helper="$(cat helper-recipe/capture-helper-runner.txt)"
          write_toolchain_manifest "pollis-${GITHUB_REF_NAME}-linux.toolchain.json" "$helper"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: pollis-linux
          if-no-files-found: error
          path: |
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.tar.gz
            target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.sig
            target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            pollis-*-linux.toolchain.json

  # Software Bill of Materials, one per release (#877).
  #
  # Nothing in the repo produced an SBOM before this: a reader asking "what is
  # actually inside the binary I just installed" had no answer, and neither did we
  # when a CVE lands in a transitive crate. Syft catalogues BOTH ecosystems in one
  # pass — `Cargo.lock` for the Rust half, `pnpm-lock.yaml` for the renderer — and
  # emits CycloneDX 1.6 JSON.
  #
  # It reads the LOCKFILES at the tag commit, not a built artifact, and that is
  # the honest scope: every release job builds `--locked` / `--frozen-lockfile`,
  # so the lockfiles at this commit ARE the dependency set that got compiled. What
  # it does not capture is the vendored C/C++ inside build scripts (webrtc-sys,
  # webrtc-audio-processing-sys) — that is stated in docs/verifiable-builds-design.md
  # rather than silently implied away.
  #
  # This job deliberately has no `needs:` on the build jobs — it depends only on
  # the source tree, so it runs in parallel and cannot delay a release.
  sbom:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to an exact version, not a floating major: an SBOM is a claim about
      # what shipped, so the tool that generates it is part of the recipe. (The
      # v1.9.1 provenance loss came from assuming a floating tag existed.)
      - name: Generate CycloneDX SBOM (Rust + JS)
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: pollis-${{ github.ref_name }}.cdx.json
          # This job publishes the SBOM itself (release asset + R2 + provenance
          # subject); the action's own release-upload path would race the
          # `release` job for the same asset name.
          upload-artifact: false
          upload-release-assets: false

      # An empty or component-less SBOM is worse than none — it looks like a
      # published dependency graph and asserts nothing. Fail rather than ship it.
      - name: Assert the SBOM has real contents
        run: |
          set -euo pipefail
          f="pollis-${GITHUB_REF_NAME}.cdx.json"
          n="$(jq '.components | length' "$f")"
          echo "SBOM components: ${n}"
          if [ "${n:-0}" -lt 100 ]; then
            echo "::error::SBOM lists only ${n} components — the Rust and JS lockfiles"
            echo "::error::  together resolve to far more than that, so the catalogers"
            echo "::error::  did not run over the tree. Publishing it would be a false claim."
            exit 1
          fi
          jq -e '.bomFormat == "CycloneDX"' "$f" >/dev/null

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: pollis-sbom
          if-no-files-found: error
          path: pollis-*.cdx.json

  apply-migrations:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply pending DB migrations to production (main DB)
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_ADMIN_TOKEN }}
        run: ./scripts/db-apply.sh

      # Second apply, against the SEPARATE commit-log DB (issue #420, Goal A).
      # Runs only if the main-DB apply above succeeded (steps are sequential and
      # fail-fast). Uses the READ-WRITE admin token — migrations need writes.
      #
      # HAZARD — db-apply.sh applies EVERY *.sql in MIGRATIONS_DIR that the
      # target DB hasn't recorded yet, then records each into that DB's own
      # schema_migrations. The default dir (pollis-schema/migrations) holds
      # the whole MAIN schema (000000_baseline + 000001..000007). Pointing the
      # *empty* log DB at that default dir would apply the ENTIRE main schema to
      # the log DB — baseline would create users/groups/channels AND an
      # FK-bearing mls_commit_log, after which 000007's `CREATE TABLE IF NOT
      # EXISTS` is a no-op, so the log DB would end up with the FK-bearing tables
      # the split is meant to avoid. Conversely, the main-DB apply above ALSO
      # sees 000007 (it's in the default dir): the CREATE TABLE IF NOT EXISTS is
      # a harmless no-op on main, but it still records v7 in main's
      # schema_migrations — misleading, since 000007 is a log-DB-only schema.
      #
      # FIX (owned by the migrations stream, S2 — not changed here): MOVE
      # 000007_commit_log_db.sql out of the shared dir into a dedicated log-DB
      # migrations dir, renumbered as its own fresh sequence
      # (e.g. pollis-schema/migrations-log/000001_commit_log_db.sql). That
      # keeps the main schema out of the log DB AND keeps the log schema out of
      # the main DB's pending set. This step points MIGRATIONS_DIR at that
      # dedicated dir; until S2 creates it the step safely no-ops
      # ("No pending migrations"). See docs/goal-a-deploy-runbook.md §"000007 hazard".
      - name: Apply pending DB migrations to production (commit-log DB)
        env:
          TURSO_URL: ${{ secrets.LOG_DB_URL }}
          TURSO_TOKEN: ${{ secrets.LOG_DB_ADMIN_TOKEN }}
          MIGRATIONS_DIR: pollis-schema/migrations-log
        run: ./scripts/db-apply.sh

  release:
    needs: [build-macos, build-windows, build-linux, apply-migrations, sbom]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Load production secrets
        run: |
          echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "R2_SECRET_KEY=${{ secrets.R2_SECRET_KEY }}" >> $GITHUB_ENV
          echo "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" >> $GITHUB_ENV
          # Relay overlay (#616/#455): the signed-directory URL + pinned Ed25519
          # public key. option_env! bakes them into the client so the pool is
          # reachable; the overlay stays OFF until a user opts in via Settings.
          # Rotating the signing key requires a coordinated client rebuild (clients
          # pin this key). Absent → the app builds fine and the overlay is inert.
          echo "POLLIS_OVERLAY_DIRECTORY_URL=${{ secrets.POLLIS_OVERLAY_DIRECTORY_URL }}" >> $GITHUB_ENV
          echo "POLLIS_OVERLAY_DIRECTORY_KEY=${{ secrets.POLLIS_OVERLAY_DIRECTORY_KEY }}" >> $GITHUB_ENV

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Debug artifact structure
        run: |
          echo "Listing artifact structure:"
          find artifacts -type f

      - name: Upload install script to R2
        run: |
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp website/install.sh "s3://pollis/releases/install.sh" \
            --endpoint-url "${ENDPOINT}" \
            --content-type "text/plain" \
            --cache-control "no-cache"
        env:
          AWS_ACCESS_KEY_ID: ${{ env.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto

      - name: Upload installers to R2
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          DMG=$(find artifacts/pollis-macos -name "*.dmg" | head -1)
          EXE=$(find artifacts/pollis-windows -name "*.exe" | head -1)
          APPIMAGE=$(find artifacts/pollis-linux -name "*.AppImage" | head -1)
          DEB=$(find artifacts/pollis-linux -name "*.deb" | head -1)
          RPM=$(find artifacts/pollis-linux -name "*.rpm" | head -1)
          # Version-pinned, immutable copies — the canonical per-release artifacts.
          aws s3 cp "$DMG"      "s3://pollis/releases/${VERSION}/pollis-${VERSION}-macos.dmg"      --endpoint-url "${ENDPOINT}"
          aws s3 cp "$EXE"      "s3://pollis/releases/${VERSION}/pollis-${VERSION}-windows.exe"    --endpoint-url "${ENDPOINT}"
          aws s3 cp "$APPIMAGE" "s3://pollis/releases/${VERSION}/pollis-${VERSION}-linux.AppImage" --endpoint-url "${ENDPOINT}"
          aws s3 cp "$DEB"      "s3://pollis/releases/${VERSION}/pollis-${VERSION}-linux.deb"       --endpoint-url "${ENDPOINT}"
          aws s3 cp "$RPM"      "s3://pollis/releases/${VERSION}/pollis-${VERSION}-linux.rpm"       --endpoint-url "${ENDPOINT}"
          # Stable "latest" aliases (overwritten every release, NEVER pruned) so the
          # website's no-JS download links resolve to the current release forever,
          # instead of a hard-coded version that the retention prune below would 404.
          aws s3 cp "$DMG"      "s3://pollis/releases/latest/pollis-latest-macos.dmg"      --endpoint-url "${ENDPOINT}" --cache-control "no-cache"
          aws s3 cp "$EXE"      "s3://pollis/releases/latest/pollis-latest-windows.exe"    --endpoint-url "${ENDPOINT}" --cache-control "no-cache"
          aws s3 cp "$APPIMAGE" "s3://pollis/releases/latest/pollis-latest-linux.AppImage" --endpoint-url "${ENDPOINT}" --cache-control "no-cache"
          aws s3 cp "$DEB"      "s3://pollis/releases/latest/pollis-latest-linux.deb"       --endpoint-url "${ENDPOINT}" --cache-control "no-cache"
          aws s3 cp "$RPM"      "s3://pollis/releases/latest/pollis-latest-linux.rpm"       --endpoint-url "${ENDPOINT}" --cache-control "no-cache"
          # #877: the SBOM and the per-platform build-recipe sidecars, published
          # next to the installers they describe. install.sh and any auditor
          # resolve them by the same version-pinned path as the installer.
          SBOM=$(find artifacts/pollis-sbom -name "*.cdx.json" | head -1)
          aws s3 cp "$SBOM" "s3://pollis/releases/${VERSION}/pollis-${VERSION}.cdx.json" --endpoint-url "${ENDPOINT}" --content-type "application/json"
          for tc in $(find artifacts -name "*.toolchain.json"); do
            aws s3 cp "$tc" "s3://pollis/releases/${VERSION}/$(basename "$tc")" --endpoint-url "${ENDPOINT}" --content-type "application/json"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ env.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto

      - name: Upload updater bundles to R2
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # macOS updater bundle (.tar.gz + .sig)
          find artifacts/pollis-macos -name "*.tar.gz" -exec bash -c 'aws s3 cp "$0" "s3://pollis/releases/'"${VERSION}"'/$(basename "$0")" --endpoint-url "'"${ENDPOINT}"'"' {} \;
          find artifacts/pollis-macos -name "*.sig" -exec bash -c 'aws s3 cp "$0" "s3://pollis/releases/'"${VERSION}"'/$(basename "$0")" --endpoint-url "'"${ENDPOINT}"'"' {} \;
          # Windows updater bundle (.exe + .sig) — Tauri v2 uses the exe directly
          find artifacts/pollis-windows -name "*.exe" -exec bash -c 'aws s3 cp "$0" "s3://pollis/releases/'"${VERSION}"'/$(basename "$0")" --endpoint-url "'"${ENDPOINT}"'"' {} \;
          find artifacts/pollis-windows -name "*.sig" -exec bash -c 'aws s3 cp "$0" "s3://pollis/releases/'"${VERSION}"'/$(basename "$0")" --endpoint-url "'"${ENDPOINT}"'"' {} \;
          # Linux updater bundle (.AppImage + .sig) — Tauri v2 uses the AppImage directly
          find artifacts/pollis-linux -name "*.AppImage" -exec bash -c 'aws s3 cp "$0" "s3://pollis/releases/'"${VERSION}"'/$(basename "$0")" --endpoint-url "'"${ENDPOINT}"'"' {} \;
          find artifacts/pollis-linux -name "*.sig" -exec bash -c 'aws s3 cp "$0" "s3://pollis/releases/'"${VERSION}"'/$(basename "$0")" --endpoint-url "'"${ENDPOINT}"'"' {} \;
        env:
          AWS_ACCESS_KEY_ID: ${{ env.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto

      # Tauri's updater resolves the configured endpoint URL with the
      # current binary's bundle_type before fetching, so each bundle type
      # gets its own manifest (URL + signature must match the bytes the
      # client will actually try to install). The legacy `update.json` is
      # kept as a fallback for clients shipped before the templated
      # endpoint was added (it points to the AppImage).
      - name: Publish per-bundle update manifests to R2
        run: |
          VERSION="${GITHUB_REF_NAME}"
          VERSION_NUM="${VERSION#v}"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          CDN="https://cdn.pollis.com/releases/${VERSION}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Read signatures from artifact files
          MAC_SIG=$(find artifacts/pollis-macos -name "*.tar.gz.sig" -exec cat {} \; | head -1)
          WIN_SIG=$(find artifacts/pollis-windows -name "*.exe.sig" -exec cat {} \; | head -1)
          LINUX_SIG=$(find artifacts/pollis-linux -name "*.AppImage.sig" -exec cat {} \; | head -1)

          # Find the actual filenames for the updater bundles
          MAC_TAR=$(find artifacts/pollis-macos -name "*.tar.gz" -exec basename {} \; | head -1)
          WIN_EXE=$(find artifacts/pollis-windows -name "*.exe" -exec basename {} \; | head -1)
          LINUX_APPIMAGE=$(find artifacts/pollis-linux -name "*.AppImage" -exec basename {} \; | head -1)

          # Helper: emit a single-platform manifest. Tauri only reads the
          # platform key matching the client's target/arch; the others are
          # ignored, but we keep them so the file can also be read by
          # tooling that's looking for cross-platform info.
          emit_manifest() {
            local out="$1"
            jq -n \
              --arg version "$VERSION_NUM" \
              --arg pub_date "$PUB_DATE" \
              --arg mac_url "${CDN}/${MAC_TAR}" \
              --arg mac_sig "$MAC_SIG" \
              --arg win_url "${CDN}/${WIN_EXE}" \
              --arg win_sig "$WIN_SIG" \
              --arg linux_url "${CDN}/${LINUX_APPIMAGE}" \
              --arg linux_sig "$LINUX_SIG" \
              '{
                version: $version,
                pub_date: $pub_date,
                platforms: {
                  "darwin-aarch64": { url: $mac_url, signature: $mac_sig },
                  "windows-x86_64": { url: $win_url, signature: $win_sig },
                  "linux-x86_64": { url: $linux_url, signature: $linux_sig }
                }
              }' > "$out"
          }

          # Per-bundle manifests. Today the Linux entry in every Linux
          # variant points to the AppImage — we don't yet sign .deb/.rpm
          # bundles, so deb/rpm clients get the same payload (which fails
          # in the updater for non-AppImage bundles, but that's caught
          # client-side by the install-kind guard for known package
          # managers like AUR). Once we sign deb/rpm we can swap their
          # URLs to the right artifact here.
          emit_manifest update-appimage.json
          emit_manifest update-deb.json
          emit_manifest update-rpm.json
          emit_manifest update-app.json
          emit_manifest update-nsis.json
          # Legacy single-manifest endpoint, still hit by clients shipped
          # before the templated `update-{{bundle_type}}.json` endpoint.
          emit_manifest update.json

          for f in update-appimage.json update-deb.json update-rpm.json update-app.json update-nsis.json update.json; do
            aws s3 cp "$f" "s3://pollis/releases/$f" \
              --endpoint-url "${ENDPOINT}" \
              --content-type "application/json" \
              --cache-control "no-cache"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ env.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto

      - name: Publish latest.json to R2
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          echo "{\"version\":\"${VERSION}\",\"macos\":\"https://cdn.pollis.com/releases/${VERSION}/pollis-${VERSION}-macos.dmg\",\"windows\":\"https://cdn.pollis.com/releases/${VERSION}/pollis-${VERSION}-windows.exe\",\"linux\":\"https://cdn.pollis.com/releases/${VERSION}/pollis-${VERSION}-linux.AppImage\",\"linux_deb\":\"https://cdn.pollis.com/releases/${VERSION}/pollis-${VERSION}-linux.deb\",\"linux_rpm\":\"https://cdn.pollis.com/releases/${VERSION}/pollis-${VERSION}-linux.rpm\"}" > latest.json
          aws s3 cp latest.json "s3://pollis/releases/latest.json" --endpoint-url "${ENDPOINT}" --content-type "application/json" --cache-control "no-cache"
        env:
          AWS_ACCESS_KEY_ID: ${{ env.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto

      # Retention: keep only the newest KEEP version directories under
      # `releases/`. This is COUNT-based and runs only when a release ships — a
      # deliberate choice over an R2 lifecycle (age) rule, which would delete the
      # CURRENT release if the project went a while between releases. GitHub
      # Releases remain the permanent archive of every version's installers; R2
      # keeps a small rolling window because the auto-updater / install.sh / AUR /
      # website only ever reference the latest (plus a couple for rollback
      # headroom). Best-effort: a prune failure must never fail an otherwise-good
      # release, so errors are warnings, not fatal. Only `releases/v<semver>/`
      # prefixes are candidates — top-level files (install.sh, latest.json,
      # update-*.json), the `latest/` alias, and `cli/` never match.
      - name: Prune old release versions from R2 (keep latest 3)
        continue-on-error: true
        run: |
          set -uo pipefail
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          KEEP=3
          CURRENT="${GITHUB_REF_NAME}"

          # Version "directories" directly under releases/. `aws s3 ls` prints
          # `  PRE v1.5.1/` for each common prefix; keep only version-tag-shaped
          # ones (v + digit) so nothing else is ever a deletion candidate.
          VERSIONS=()
          while IFS= read -r v; do
            [ -n "$v" ] && VERSIONS+=("$v")
          done < <(
            aws s3 ls "s3://pollis/releases/" --endpoint-url "${ENDPOINT}" \
              | awk '/ PRE v[0-9]/ { print $2 }' \
              | sed 's#/$##' \
              | sort -Vr
          )

          echo "Found ${#VERSIONS[@]} version prefix(es): ${VERSIONS[*]:-<none>}"
          if [ "${#VERSIONS[@]}" -le "$KEEP" ]; then
            echo "At or below keep threshold ($KEEP) — nothing to prune."
            exit 0
          fi

          # Keep the newest $KEEP, and ALWAYS keep the version we just published
          # (latest.json / update-*.json point at it; also guards any version-sort
          # edge case around prerelease tags).
          KEEP_SET=$(printf '%s\n' "${VERSIONS[@]:0:$KEEP}" "$CURRENT" | sort -u)
          echo "Keeping:"; echo "$KEEP_SET" | sed 's/^/  /'

          # Prune the INSTALLERS, keep the EVIDENCE (#877).
          #
          # Every binary-transparency leaf is permanent and records a
          # `provenance_uri` under `releases/<tag>/`. A blanket `rm --recursive`
          # therefore guaranteed that each leaf's provenance link would 404 three
          # releases after it was written — a permanent record pointing at
          # something the pipeline was scheduled to delete. Same for the cosign
          # signature and certificate that make `cosign verify-blob` possible, the
          # SBOM, and the build-recipe sidecars: those are the artifacts an
          # auditor needs LONGEST, and they were the ones with the shortest life.
          #
          # The size argument that motivates pruning does not apply to them: the
          # installers are 100MB+ each, while an attestation, signature,
          # certificate, SBOM and recipe together are a few hundred KB per
          # release. Keeping them forever is free; deleting them silently
          # falsified a claim already written into an append-only log.
          KEEP_SUFFIXES='\.intoto\.jsonl$|\.sig$|\.pem$|\.cdx\.json$|\.toolchain\.json$|\.payload-sha256$'
          for v in "${VERSIONS[@]}"; do
            if ! grep -qxF "$v" <<< "$KEEP_SET"; then
              echo "Pruning installers from s3://pollis/releases/$v/ (evidence retained)"
              # Delete per key rather than --recursive, so the evidence files can
              # be excluded. `aws s3 ls --recursive` prints `date time size key`.
              aws s3 ls "s3://pollis/releases/$v/" --recursive --endpoint-url "${ENDPOINT}" \
                | awk '{ $1=""; $2=""; $3=""; sub(/^ +/, ""); print }' \
                | grep -Ev "$KEEP_SUFFIXES" \
                | while IFS= read -r key; do
                    [ -n "$key" ] || continue
                    aws s3 rm "s3://pollis/${key}" --endpoint-url "${ENDPOINT}" >/dev/null \
                      || echo "::warning::failed to prune ${key} — leaving it in place"
                  done
            fi
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ env.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto

      # The pre-signature payload sidecars (WS3, #603/#704) ship as release assets
      # too, so the attest-release.yml backfill can fetch the pre-signature
      # payload_sha256 for a tag it re-attests WITHOUT a rebuild (it only ever has
      # the signed installers otherwise, from which the pre-signature payload is
      # unrecoverable). They also make each build's claimed pre-signature payload
      # hash publicly downloadable next to the installer it corresponds to.
      #
      # The `*.toolchain.json` recipe sidecars ship for the same two reasons
      # (#877): the backfill path needs them to re-attest a tag without a rebuild,
      # and publishing them puts the exact rustc/node/pnpm/runner-image claim next
      # to the installer, where anyone can check it against the logged leaf. The
      # `*.cdx.json` SBOM ships here so the dependency graph of the build you
      # installed is a downloadable release asset, not a CI-only artifact.
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/pollis-macos/**/*.dmg
            artifacts/pollis-windows/**/*.exe
            artifacts/pollis-linux/**/*.AppImage
            artifacts/pollis-linux/**/*.deb
            artifacts/pollis-linux/**/*.rpm
            artifacts/pollis-macos/**/*.payload-sha256
            artifacts/pollis-windows/**/*.payload-sha256
            artifacts/pollis-*/**/*.toolchain.json
            artifacts/pollis-sbom/*.cdx.json
          # #877: the release body was GitHub's auto-generated PR-title list and
          # nothing else — the ONE unattested link in a chain where every other
          # step carries a signature, a provenance attestation and a
          # transparency-log entry. A reader had no human-written statement of
          # what changed and no pointer to any of the verification they could do.
          #
          # `generate_release_notes: true` is kept: the machine list is a
          # genuinely useful index of merged work. This prepends the part a
          # person needs first. The header is static rather than sliced out of
          # CHANGELOG.md, because a release must never fail on a text-extraction
          # step, and a stale-but-correct pointer beats a clever one that breaks
          # the release when a heading is renamed.
          body: |
            ## What changed

            See [CHANGELOG.md](https://github.com/actuallydan/pollis/blob/${{ github.ref_name }}/CHANGELOG.md)
            for this release's entry, written for the person installing it.

            ## Verify what you downloaded

            Every artifact below is published with its SHA-256 in a public,
            append-only transparency log, a keyless `cosign` signature, a SLSA
            build-provenance attestation, and a CycloneDX SBOM.

            - Commands to check all of it: <https://pollis.com/artifacts>
            - Whether this release rebuilt bit-for-bit from source:
              <https://pollis.com/assurance>

            The installers verify automatically — `install.sh` requires the hash
            it downloaded to appear in the transparency log at a *different*
            origin from the CDN, and runs `cosign` when it is available.

            ---
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

      # Publish stable releases to the AUR (skip prereleases like v1.0.43-beta.1).
      #
      # continue-on-error stays ON deliberately: by this point the installers are
      # already on R2 and attached to the GitHub release, so an unreachable AUR
      # must not fail an otherwise-complete release. What it must NOT do is pass
      # silently — v1.8.3, v1.8.4 and v1.8.5 each hit "The AUR is down due to
      # maintenance" on clone and still reported a green checkmark, leaving the
      # AUR on v1.8.2 for eleven days with nothing in the run to show for it.
      # publish-aur.sh annotates every failure path with ::error::, which surfaces
      # on the run page even though the step is allowed to fail. To recover a
      # release the AUR missed, run aur-republish.yml — no rebuild required.
      - name: Publish to AUR
        if: "!contains(github.ref_name, '-')"
        continue-on-error: true
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -euo pipefail
          DEB_PATH=$(find artifacts/pollis-linux -name "*.deb" | head -1)
          ./scripts/publish-aur.sh "${GITHUB_REF_NAME#v}" "$DEB_PATH"

  # Keyless build provenance (issue #484, Phase 3). A SECOND, independent
  # transparency anchor — sigstore Fulcio/Rekor — that Pollis does NOT control,
  # cryptographically bound to the GitHub Actions OIDC identity of THIS workflow,
  # as defense in depth against a compromised or compelled Pollis signing key.
  # For every released installer + updater bundle it publishes, NEXT TO the
  # artifact on cdn.pollis.com:
  #   * a SLSA v1 in-toto build-provenance attestation (.intoto.jsonl) at the
  #     EXACT path scripts/attest-binaries.sh records in each BinaryRecord leaf's
  #     `provenance_uri` (${PROVENANCE_BASE}/${artifact_name}.intoto.jsonl), and
  #   * a cosign keyless signature (.sig) + signing certificate (.pem),
  # so `cosign verify-blob` / a SLSA verifier confirm the bytes were built by the
  # Pollis GitHub Actions identity and recorded in the PUBLIC Rekor log, with NO
  # Pollis-held key on the verification path.
  #
  # This is an ADDITIONAL, OPTIONAL layer: it NEVER gates install or auto-update.
  # The minisign updater flow (update-*.json + .sig, Tauri updater) and OS
  # code-signing are untouched — provenance only adds a non-Pollis anchor. Like
  # `attest-and-log` it `needs: [release]`, so the installers, updater manifests,
  # latest.json and GitHub release are already out by the time it runs; a failure
  # here therefore CANNOT corrupt a shipped release — provenance just lags a
  # release until the next successful run.
  provenance:
    needs: [release]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      # Minimum scopes for keyless attestation: an OIDC token for Fulcio
      # (id-token), permission to write the attestation to the GH attestations
      # store (attestations), and repo read for checkout (contents). Deliberately
      # NOT contents: write — this job never creates a release or pushes; the
      # `release` job (which does) keeps its own contents: write.
      id-token: write
      attestations: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Load production secrets
        run: |
          echo "R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "R2_SECRET_KEY=${{ secrets.R2_SECRET_KEY }}" >> $GITHUB_ENV
          echo "CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" >> $GITHUB_ENV
          # Relay overlay (#616/#455): the signed-directory URL + pinned Ed25519
          # public key. option_env! bakes them into the client so the pool is
          # reachable; the overlay stays OFF until a user opts in via Settings.
          # Rotating the signing key requires a coordinated client rebuild (clients
          # pin this key). Absent → the app builds fine and the overlay is inert.
          echo "POLLIS_OVERLAY_DIRECTORY_URL=${{ secrets.POLLIS_OVERLAY_DIRECTORY_URL }}" >> $GITHUB_ENV
          echo "POLLIS_OVERLAY_DIRECTORY_KEY=${{ secrets.POLLIS_OVERLAY_DIRECTORY_KEY }}" >> $GITHUB_ENV

      # Same all-artifacts download the release / attest jobs use — the built +
      # signed installers and updater bundles under artifacts/pollis-{macos,
      # windows,linux}/. Provenance runs over the SHIPPED bytes.
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Stage each shipped file under the EXACT canonical name the release job
      # uploads to R2 and scripts/attest-binaries.sh records — so the provenance
      # subject digest is bound to the name auditors resolve, and the published
      # .intoto.jsonl path equals each leaf's `provenance_uri` character-for-
      # character. The macOS updater bundle (.tar.gz) keeps its real basename
      # (the updater manifest references it by that name).
      - name: Stage artifacts under canonical names
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p prov
          cp "$(find artifacts/pollis-macos   -name '*.dmg'      | head -1)" "prov/pollis-${VERSION}-macos.dmg"
          cp "$(find artifacts/pollis-windows -name '*.exe'      | head -1)" "prov/pollis-${VERSION}-windows.exe"
          cp "$(find artifacts/pollis-linux   -name '*.AppImage' | head -1)" "prov/pollis-${VERSION}-linux.AppImage"
          cp "$(find artifacts/pollis-linux   -name '*.deb'      | head -1)" "prov/pollis-${VERSION}-linux.deb"
          cp "$(find artifacts/pollis-linux   -name '*.rpm'      | head -1)" "prov/pollis-${VERSION}-linux.rpm"
          # macOS updater bundle — provenance + cosign cover it under its own name.
          MAC_TAR="$(find artifacts/pollis-macos -name '*.tar.gz' | head -1 || true)"
          if [ -n "${MAC_TAR:-}" ]; then
            cp "$MAC_TAR" "prov/$(basename "$MAC_TAR")"
          fi
          # #877: the SBOM is a provenance subject too, which is what makes the
          # dependency graph PERMANENTLY auditable rather than merely published:
          # its digest goes into the SLSA attestation and is recorded in the
          # public Rekor log, an append-only anchor Pollis does not control. So a
          # later, quieter SBOM cannot replace this one without the substitution
          # being provable. (Hashing it into a binary-transparency leaf as well
          # would need a new `Layer::Sbom` in the frozen BinaryRecord contract and
          # a `pollis-verify` release ahead of it — see the follow-up note in
          # docs/verifiable-builds-design.md.)
          cp "$(find artifacts/pollis-sbom -name '*.cdx.json' | head -1)" "prov/pollis-${VERSION}.cdx.json"
          echo "staged provenance subjects:"
          ls -1 prov

      # SLSA v1 in-toto build provenance for every staged artifact, signed
      # keylessly via Fulcio (OIDC identity == this workflow) and recorded in the
      # public Rekor log. A single release-wide attestation carries each artifact
      # as a subject; it is published below at each artifact's recorded
      # provenance_uri and verifies that specific artifact by its digest.
      - name: Generate SLSA build provenance (keyless, Fulcio/Rekor)
        id: attest
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: prov/*

      # Pinned installer action — never an unpinned curl. Puts the `cosign` CLI
      # on the runner for the sign-blob pass below.
      #
      # Pinned to an EXACT version, not `@v4`: sigstore/cosign-installer
      # publishes no moving `v4` tag (v3 has one, v4 does not), so `@v4` is
      # unresolvable and the job dies in "Set up job" before a single step runs
      # — which is exactly how v1.9.1 lost its provenance. Bumping a major by
      # convention is not safe here; check the tag exists.
      #
      # v4.x, not v3: the v3 line stopped at v3.10.1 (2025-10) and its hardcoded
      # digest for cosign's release signing key went stale, so every run now dies
      # with "Fetched public key does not match expected digest" (curl exit 22).
      # That is what silently cost v1.9.0 its provenance — the SLSA attestations
      # were generated, then the publish step was skipped, leaving each
      # transparency-log leaf's `provenance_uri` pointing at a 404.
      #
      # cosign itself is pinned to the 2.x line deliberately. The sign-blob loop
      # below is written to the v2 CLI (`--output-signature`/`--output-certificate`);
      # v4's default is cosign 3.x, which changes bundle defaults. Bumping the
      # installer and the CLI generation in one step would make a failure
      # ambiguous, so the CLI contract stays fixed here and moves on its own.
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v2.6.5'

      # cosign sign-blob each staged artifact keylessly (Fulcio/Rekor, ambient
      # GitHub Actions OIDC — no Pollis key). Emits a detached .sig + the signing
      # .pem certificate per artifact, published next to the artifact so `cosign
      # verify-blob` confirms the bytes against Rekor with no Pollis key on the
      # verification path. The `prov/*` glob expands once, so the .sig/.pem this
      # loop writes are not themselves re-signed.
      - name: cosign sign-blob each artifact
        run: |
          set -euo pipefail
          for f in prov/*; do
            base="$(basename "$f")"
            cosign sign-blob --yes \
              --output-signature "prov/${base}.sig" \
              --output-certificate "prov/${base}.pem" \
              "$f"
          done

      # Publish the attestation + cosign sig/cert NEXT TO each artifact on R2
      # (cdn.pollis.com/releases/<tag>/...). The .intoto.jsonl object key is
      # EXACTLY ${PROVENANCE_BASE}/${artifact_name}.intoto.jsonl — the same string
      # scripts/attest-binaries.sh stamps into each BinaryRecord leaf, so a leaf's
      # provenance_uri resolves. PROVENANCE_BASE defaults to
      # cdn.pollis.com/releases/${RELEASE_TAG}; RELEASE_TAG == github.ref_name ==
      # this VERSION, so producer and consumer agree character-for-character.
      - name: Publish provenance + cosign signatures to R2
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          BUNDLE="${{ steps.attest.outputs.bundle-path }}"
          for f in prov/*; do
            base="$(basename "$f")"
            # Skip the cosign outputs; only iterate the artifacts themselves.
            case "$base" in
              *.sig|*.pem|*.intoto.jsonl) continue ;;
            esac
            # SLSA build-provenance attestation for this artifact.
            aws s3 cp "$BUNDLE" "s3://pollis/releases/${VERSION}/${base}.intoto.jsonl" \
              --endpoint-url "${ENDPOINT}" --content-type "application/json"
            # cosign detached signature + signing certificate.
            aws s3 cp "prov/${base}.sig" "s3://pollis/releases/${VERSION}/${base}.sig" \
              --endpoint-url "${ENDPOINT}" --content-type "text/plain"
            aws s3 cp "prov/${base}.pem" "s3://pollis/releases/${VERSION}/${base}.pem" \
              --endpoint-url "${ENDPOINT}" --content-type "application/x-pem-file"
          done
        env:
          AWS_ACCESS_KEY_ID: ${{ env.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ env.R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto

  # Binary transparency (issue #453, Phase 2). Compute payload+artifact hashes
  # for every shipped installer (scripts/attest-binaries.sh) and MERGE the
  # per-tag BinaryRecord leaves into the accumulating records JSON on R2, which
  # transparency-publish.yml (daily cron / "rebuild now" dispatch) consumes to
  # build and publish the /v1/binaries tree.
  #
  # Ordering & failure isolation: this `needs: [release]`, so by the time it
  # runs the installers, updater manifests, latest.json and GitHub release are
  # already out. A failure here therefore CANNOT corrupt a shipped release — it
  # only means the binaries tree lags one release until the next successful run.
  # It is logged loudly, never silently swallowed, and the release stands.
  #
  # It ALSO `needs: [provenance]` (#877). Every leaf this job writes stamps a
  # `provenance_uri` pointing at the artifact's SLSA attestation on the CDN, and
  # that leaf is permanent and append-only. When the provenance job failed —
  # v1.9.0 (a stale cosign-installer key digest) and v1.9.1 (an unresolvable
  # action tag) — this job ran anyway and baked a URI that 404s forever into the
  # public log. Two releases' worth of leaves now point at nothing, and no
  # amount of later repair changes them.
  #
  # Gating here costs nothing a release cares about: `release` has already
  # published everything users install, so the only consequence of provenance
  # failing is that the tag is not attested YET. That is fully recoverable —
  # re-run provenance, then attest-release.yml backfills the tag without a
  # rebuild. A lagging leaf is repairable; a wrong one is not. This deliberately
  # does NOT make provenance a gate on the release itself, which would be a
  # policy change about shipping and is not what this fixes.
  attest-and-log:
    needs: [release, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Needed only to dispatch transparency-publish at the end of this job.
      actions: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      # The tag commit is HEAD after checkout; its unix timestamp is the
      # deterministic SOURCE_DATE_EPOCH the attest script stamps into each leaf
      # and uses for the reproducible payload-tree hash (not `now`).
      - name: Resolve tag commit timestamp
        id: srcdate
        run: echo "epoch=$(git log -1 --format=%ct)" >> "$GITHUB_OUTPUT"

      # Same all-artifacts download the release job uses — pollis-macos/,
      # pollis-windows/, pollis-linux/ under artifacts/; the script finds each
      # installer recursively.
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # 7z reads the HFS payload inside the .dmg and the NSIS installer's file
      # tree on this Linux runner; jq builds and merges the records JSON.
      # bsdtar (libarchive-tools) unpacks the .rpm to reach `usr/bin/pollis` for
      # its `exe` leaf (the .deb uses dpkg-deb, already present on the runner).
      - name: Install extraction tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full jq libarchive-tools

      - name: Compute BinaryRecord leaves for this tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
          SOURCE_DATE_EPOCH: ${{ steps.srcdate.outputs.epoch }}
          ARTIFACTS_DIR: artifacts
          OUT: tag-records.json
        run: |
          set -euo pipefail
          ./scripts/attest-binaries.sh
          echo "per-tag BinaryRecord leaves:"
          jq '.' tag-records.json

      # Prove every provenance_uri actually resolves BEFORE the leaves are
      # merged (#877).
      #
      # The job dependency above orders provenance ahead of attestation, but
      # ordering is not the invariant — the invariant is "no leaf names a URI
      # that does not exist". A provenance job that goes green while publishing
      # to a different key, or an R2 write that silently no-ops, would satisfy
      # the ordering and still bake a dead link into an append-only log. So the
      # actual claim is checked at the chokepoint, on the real URLs, with the
      # leaves still discardable.
      #
      # Failing here leaves the tag unattested and fully recoverable via
      # attest-release.yml once provenance is republished — the same trade as
      # the `needs:` above, and the right one: a lagging leaf can be fixed, a
      # permanently wrong one cannot.
      - name: Assert every provenance_uri resolves
        run: |
          set -euo pipefail
          rc=0
          while IFS= read -r uri; do
            if curl -fsIL --max-time 20 "https://${uri}" >/dev/null 2>&1; then
              echo "  ok   ${uri}"
            else
              echo "::error::provenance_uri does not resolve: https://${uri}"
              rc=1
            fi
          done < <(jq -r '[.[].provenance_uri] | unique | .[]' tag-records.json)
          if [ "$rc" -ne 0 ]; then
            echo "::error::"
            echo "::error::Refusing to append leaves whose provenance_uri is a 404. Each leaf is"
            echo "::error::permanent and append-only — v1.9.0 and v1.9.1 shipped leaves pointing"
            echo "::error::at attestations that were never published, and those cannot be repaired."
            echo "::error::Fix the provenance job, re-run it for this tag, then run"
            echo "::error::attest-release.yml to attest ${GITHUB_REF_NAME} without a rebuild."
            exit 1
          fi
          echo "every provenance_uri in ${GITHUB_REF_NAME}'s leaves resolves."

      # Merge into the accumulating records JSON transparency-publish.yml reads.
      # Producer (here) and consumer (transparency-publish.yml) reference the
      # SAME object: s3://${R2_TRANSPARENCY_BUCKET}/internal/binary-records.json
      # at ${R2_TRANSPARENCY_ENDPOINT}. Creds are the release workflow's
      # account-wide R2_* keys — per transparency-publish.yml's header note the
      # bare R2_* names are account-wide and owned by the release workflows, so
      # they can write the transparency bucket's internal/ prefix (the
      # namespaced R2_TRANSPARENCY_* creds are the daily publisher's).
      - name: Merge per-tag records into the R2 accumulator
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          # The accumulator lives in the TRANSPARENCY bucket (R2_TRANSPARENCY_*
          # endpoint/bucket below), so it must be written with the transparency
          # bucket's own credentials — the release-bucket R2_ACCESS_KEY_ID keys
          # get AccessDenied here. These are the same creds transparency-publish.yml
          # uses to write this bucket.
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_TRANSPARENCY_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_TRANSPARENCY_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # Cloudflare R2 rejects the integrity checksums newer aws-cli v2 adds
          # by default; only send/verify them when the operation requires it.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: ${{ secrets.R2_TRANSPARENCY_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_TRANSPARENCY_BUCKET }}
        run: |
          set -euo pipefail
          KEY="internal/binary-records.json"

          # Pull the current accumulator; a missing object (first-ever attest)
          # starts from an empty array.
          if aws s3 cp "s3://${R2_BUCKET}/${KEY}" ./accumulator.json \
               --endpoint-url "${R2_ENDPOINT}" 2>/dev/null; then
            [ -s ./accumulator.json ] || echo "[]" > ./accumulator.json
          else
            echo "no existing accumulator at ${KEY} — starting from []"
            echo "[]" > ./accumulator.json
          fi

          # Idempotent on re-run: if this tag's leaves are already accumulated,
          # do nothing (re-appending would double the tag's leaves in the tree).
          existing="$(jq --arg t "$RELEASE_TAG" \
            'map(select(.release_tag == $t)) | length' ./accumulator.json)"
          if [ "${existing}" -gt 0 ]; then
            echo "${RELEASE_TAG} already present in accumulator (${existing} leaves) — nothing to merge."
            exit 0
          fi

          # Append this tag's leaves in publish order (existing first, new last).
          jq -s 'add' ./accumulator.json tag-records.json > ./merged.json
          echo "accumulator: $(jq 'length' ./accumulator.json) + $(jq 'length' tag-records.json) = $(jq 'length' ./merged.json) records"

          # Write back to the EXACT key the consumer reads. no-cache: it is a
          # build input for the publisher, never a served/immutable artifact.
          aws s3 cp ./merged.json "s3://${R2_BUCKET}/${KEY}" \
            --endpoint-url "${R2_ENDPOINT}" \
            --content-type "application/json" \
            --cache-control "no-cache"
          echo "merged records uploaded to s3://${R2_BUCKET}/${KEY}"

      # Publish the tree NOW rather than waiting for the daily cron (#795).
      #
      # The leaves above only become publicly verifiable once transparency-publish
      # rebuilds and signs the tree. Left to the 06:47 cron that is up to 24h, during
      # which `pollis-verify release <tag>` finds nothing and the in-app build check
      # sits in Pending — and the independent rebuilder, which now runs automatically
      # after each release, reports "not the logged payload" for a release that is
      # simply not logged yet. verifiable-builds-design.md §2.4 recommends exactly
      # this and marked it shipped; it was not.
      - name: Publish the transparency tree with the new leaves
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run transparency-publish.yml --repo "$GITHUB_REPOSITORY"
          echo "dispatched transparency-publish; the binaries tree will carry ${GITHUB_REF_NAME} shortly"
