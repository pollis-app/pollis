name: Rebuild & Verify (independent reproducer)

# ─────────────────────────────────────────────────────────────────────────────
# The THIRD-PARTY VERIFICATION ANCHOR for Pollis's binary-transparency program
# (issue #484, docs/verifiable-builds-design.md §6 Phase 5).
#
# What it is: a rebuilder that a completely SEPARATE trust domain can run — from
# a fork, on their own GitHub account — to independently rebuild the Linux
# AppImage payload for a released tag and confirm that the payload hash it
# reproduces is the one Pollis published into the public, append-only, ML-DSA-44
# transparency log. It closes the loop that code-signing alone cannot: signing
# proves "the holder of Pollis's key produced these bytes"; this proves "those
# bytes are the honest build of this public source, and everyone can see it."
#
# Separate trust domain — by construction:
#   * It uses NO Pollis `secrets`. Nothing here references `secrets.*`. A forker
#     needs no credentials from Pollis to run it.
#   * It only READS the public log at https://verify.pollis.com and rebuilds
#     PUBLIC source at the tag. It never writes anything, anywhere.
#   * It trusts ONLY the pinned log key `PINNED_LOG_KEY` below — not Pollis,
#     not Turso, not the host serving verify.pollis.com. The key is asserted
#     against the served public_key.json before any verdict is trusted, so a
#     substituted key is caught, not silently believed. `PINNED_LOG_KEY` may
#     list SEVERAL keys (whitespace- or comma-separated) so a rotation overlap
#     does not break the rebuilder; matching any listed key passes, matching
#     none is a hard refusal. Empty means no anchor at all, and the assert step
#     fails loudly rather than proceeding on an unpinned log.
#
# HONEST LIMIT — the "reproducible modulo a documented list" caveat is real and
# lives in docs/reproducible-builds-residuals.md. The client bakes its build
# recipe via `option_env!` at compile time (pollis-core/src/config.rs). Since
# the #506 secrets-broker cutover that recipe is: TURSO_URL, the READ-ONLY
# TURSO_TOKEN, LOG_DB_URL, LOG_DB_TOKEN, R2_S3_ENDPOINT, R2_PUBLIC_URL,
# LIVEKIT_URL, POLLIS_DELIVERY_URL — no R2 or LiveKit
# credentials are read by the client at all anymore. Every entry is publishable
# except the one remaining secret-shaped residual: the OPTIONAL observability
# LOG_DB_TOKEN (see the residuals doc, item 4). Until that token is scoped out
# of the client build, a truly zero-recipe third party cannot bit-reproduce the
# shipped payload — the baked bytes differ. So this workflow:
#   (a) ALWAYS proves LOG INCLUSION for everyone — the `verify-log-inclusion`
#       job needs no build inputs at all, and it is a SEPARATE job precisely so
#       it passes or fails on its own even when the rebuild half fails; and
#   (b) proves bit-for-bit REPRODUCTION for a party who supplies the published
#       build recipe as repository/environment `vars` (non-secret) — Pollis, or
#       an auditor Pollis has handed the recipe. Supply them under
#       Settings → Secrets and variables → Actions → Variables. Any left unset
#       stay truly unset (see the recipe step), bake as absent, and
#       (legitimately) diverge the hash; the final assert then fails loudly,
#       which is the correct, non-lying behaviour.
# ─────────────────────────────────────────────────────────────────────────────

# Put the tag in the run title (#877). A `workflow_run`-triggered run reports
# `headBranch: main` and a `headSha` that is main's tip, so the GitHub API alone
# cannot say WHICH release a run judged — the tag lives only inside
# `github.event.workflow_run.head_branch`. That made the public run list
# unreadable ("Rebuild & Verify" x30, no tags) and forced `scripts/rebuild-ledger.sh`
# to grep job logs, which expire. Naming the run fixes both, permanently.
run-name: >-
  Rebuild & Verify ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}

on:
  # Runs itself after every successful release (#795). Reproducibility that only
  # gets checked when someone remembers to check it is reproducibility nobody
  # knows the state of — this workflow existed for months, ran twice, failed both
  # times, and three documents went on describing it as a working property. An
  # automatic run after each release means the claim is either continuously
  # demonstrated or continuously, visibly broken.
  workflow_run:
    workflows: ["Desktop Release (Tauri)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Released git tag to rebuild & verify (e.g. v1.3.0)"
        required: true
        type: string

permissions:
  contents: read

# Pinned so the reproduced key can never silently change under us: the log's
# ML-DSA-44 public key (2624 hex chars each). During a rotation overlap, list
# both the outgoing and incoming keys separated by a comma or whitespace.
env:
  # The tag under verification. `github.event.inputs` rather than `inputs` so the
  # expression is valid for BOTH triggers — a release runs on a tag ref, so the
  # triggering run's head_branch IS the tag.
  TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
  VERIFY_BASE_URL: "https://verify.pollis.com"
  PINNED_LOG_KEY: ""

jobs:
  # Log-inclusion proof — deliberately its OWN job with NO build inputs and no
  # dependence on the rebuild: checkout at the tag, build pollis-verify from the
  # tag's own source, assert the pinned key, verify the release. Keeping it
  # separate means a broken rebuild can never hide the log verdict (guarantee
  # (a) in the header): this job passes or fails on its own. It produces no
  # shipped bytes, so its runner image doesn't need to match the release.
  verify-log-inclusion:
    # Only when the release actually succeeded and was a real tag build — a failed
    # or branch-triggered release has nothing published to reproduce.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@1.96.0

      # Build pollis-verify FROM THE TAG'S OWN SOURCE (no prebuilt binary to
      # trust) so the verifier code is itself part of what is being verified.
      - name: Build pollis-verify from source
        # Stamp the commit actually checked out — this job builds at the resolved tag,
        # not at the workflow's own ref, so `github.sha` would name the wrong
        # tree. The rebuild log is auditor-facing evidence, so the verifier it
        # used should be identifiable too (#670).
        run: |
          set -euo pipefail
          POLLIS_VERIFY_GIT_SHA="$(git rev-parse HEAD)" \
            cargo build --release --locked -p verifiable-log-serve --bin pollis-verify
          ./target/release/pollis-verify --version

      # Trust anchor: assert the log key the server serves is the pinned key
      # BEFORE trusting any verdict computed against it. A host that substituted
      # its own key is caught here, not silently believed.
      - name: Assert the served log key is the pinned key
        run: |
          set -euo pipefail
          served="$(curl -fsSL "${VERIFY_BASE_URL}/v1/binaries/public_key.json" | jq -r '.public_key')"
          echo "served binaries log key: ${served}"
          if [ -z "${PINNED_LOG_KEY}" ]; then
            echo "::error::no pinned log key is set. Without an anchor obtained independently of"
            echo "::error::the host, nothing this workflow computes would mean anything — a hostile"
            echo "::error::host can serve its own key alongside a self-consistent forged tree."
            echo "::error::Set PINNED_LOG_KEY to the published ML-DSA-44 key."
            exit 1
          fi
          # PINNED_LOG_KEY may list several keys separated by whitespace or
          # commas: during a rotation overlap the outgoing and incoming keys are
          # both legitimate, and a rebuilder that accepted only one would fail
          # the moment the log moved between them. Matching ANY listed key is a
          # pass; matching none is still a hard refusal.
          matched=""
          for pinned in $(echo "${PINNED_LOG_KEY}" | tr ',' ' '); do
            if [ "${served}" = "${pinned}" ]; then
              matched="${pinned}"
              break
            fi
          done
          if [ -z "${matched}" ]; then
            echo "::error::served log key ${served} matches none of the pinned keys — refusing to trust this log"
            exit 1
          fi
          echo "served key matches a pinned log key."

      # Log-inclusion proof for the tag: pollis-verify checks every artifact for
      # the tag is included under the binaries-domain STH, the tree satisfies the
      # binary invariant, and the recorded hashes are internally consistent.
      # Exits non-zero (fails the job) if the log itself doesn't verify.
      - name: Verify the tag is included in the transparency log
        run: |
          set -euo pipefail
          # Wait for the tag to appear before asserting anything about it.
          #
          # When this runs automatically after a release, the release has just
          # dispatched transparency-publish and the tree takes a few minutes to
          # rebuild and sign. Asserting immediately would report "not the logged
          # payload" for a release that is merely not logged YET — the single most
          # misleading thing a verifiability tool can say. Bounded, so a genuinely
          # absent tag still fails rather than hanging.
          #
          # THE EXIT CODE IS NOT THE SIGNAL. `pollis-verify release` exits 0 for a
          # tag that is not in the tree at all: chain_valid is computed as
          # `sth_sig_ok && all_included && invariant_ok`, and over an EMPTY artifact
          # set the last two are vacuously true, so an unpublished tag verifies
          # perfectly and reports `found: false`. The old loop tested only the exit
          # status, so it "succeeded" on attempt 1 every time and never waited at
          # all — then the rebuild ran for ~40 minutes and failed against an empty
          # report. Three of the last six runs went red exactly this way, including
          # v1.9.5, which reproduced BYTE-IDENTICALLY (0 differing bytes) and still
          # reported failure. A verification signal that cries wolf is worse than no
          # signal: nobody can act on a genuine red once they have learned to expect
          # false ones. So the loop gates on `.found`, and the exit code is checked
          # separately below for what it does mean.
          #
          # 40 × 30s = 20 minutes. The old bound (10) was never reached because the
          # loop never looped; this is sized for a real tree rebuild-and-sign after
          # a release dispatch, and the job is idle while it waits.
          published=0
          for attempt in $(seq 1 40); do
            rc=0
            ./target/release/pollis-verify release "${VERIFY_BASE_URL}" "${{ env.TAG }}" --json \
              > release-report.json 2>/dev/null || rc=$?
            if [ "${rc}" -eq 0 ] && jq -e '.found == true' release-report.json >/dev/null 2>&1; then
              echo "tag ${{ env.TAG }} is in the log (attempt ${attempt})"
              published=1
              break
            fi
            echo "waiting for ${{ env.TAG }} to appear in the binaries tree (attempt ${attempt}/40)…"
            sleep 30
          done

          # Three outcomes, each of which has to READ differently — the whole point
          # of this rewrite. Conflating them is what made a red run meaningless.
          if [ "${published}" -ne 1 ]; then
            # (a) NOT A REPRODUCIBILITY RESULT. The tree simply never picked the tag
            #     up, so nothing has been said about whether the build reproduces.
            echo "::error title=Release not published to the transparency log::${{ env.TAG }} never appeared in the binaries tree"
            echo "::error::${{ env.TAG }} is still not in the binaries tree after 20 minutes."
            echo "::error::"
            echo "::error::THIS IS NOT A REPRODUCIBILITY FAILURE. Nothing here says the build"
            echo "::error::did not reproduce — the rebuild was not even attempted, because there"
            echo "::error::is no logged payload to compare against. This is a PUBLISHING problem:"
            echo "::error::check the release's attest-and-log job and the transparency-publish run"
            echo "::error::it dispatches. Re-run this workflow once the tag is in the tree."
            jq '.' release-report.json || true
            exit 1
          fi

          # (b) The tag IS logged, but the log itself does not verify — a bad STH
          #     signature, a missing inclusion proof, or an invariant violation.
          #     This IS an alarm, and it is about the LOG, not about the rebuild.
          if ! jq -e '.chain_valid == true' release-report.json >/dev/null 2>&1; then
            echo "::error title=Transparency log does not verify::${{ env.TAG }} is present but the tree failed verification"
            echo "::error::${{ env.TAG }} is in the binaries tree, but the tree does not verify"
            echo "::error::against the pinned key. This is a LOG integrity finding, not a"
            echo "::error::reproducibility one, and it is the serious kind. Violations:"
            jq -r '.violations[]? | "::error::  - \(.)"' release-report.json || true
            jq '.' release-report.json
            exit 1
          fi

          # (c) Published and valid — the only state in which a later hash mismatch
          #     genuinely means "did not reproduce".
          echo "── transparency log report for ${{ env.TAG }} ──"
          jq '.' release-report.json

      # Hand the VERIFIED report to rebuild-linux (and keep it as a run
      # artifact for auditors) so the reproduction verdict is asserted against
      # exactly the report that passed inclusion verification above.
      - name: Upload transparency-log report
        uses: actions/upload-artifact@v4
        with:
          name: release-report
          if-no-files-found: error
          path: release-report.json

  # Mirror the release's build-capture-helper job EXACTLY: the Linux
  # screen-capture sidecar is compiled on ubuntu-24.04 (PipeWire 1.0 headers)
  # and staged into the app build, because the app build runs on ubuntu-22.04
  # (PipeWire 0.3) and cannot compile the helper there. To reproduce the same
  # AppImage bytes the rebuilder must stage the same sidecar the same way.
  # (The helper's bindgen output is itself a documented residual — see
  # docs/reproducible-builds-residuals.md.) NOTE: like the release's
  # build-capture-helper job, this deliberately does NOT stamp the tag version —
  # the helper is built from the committed placeholder versions in both.
  rebuild-capture-helper:
    # Only when the release actually succeeded and was a real tag build — a failed
    # or branch-triggered release has nothing published to reproduce.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-24.04
    outputs:
      # Half of the environment this rebuild actually ran in (#944). The release
      # records `<app image>+helper:<helper image>` in its leaf precisely because
      # the AppImage embeds this job's output, so the rebuilder has to report the
      # same pair or it cannot tell whether it met the precondition for
      # bit-identity.
      runner_image: ${{ steps.helper_image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@1.96.0

      - name: Install PipeWire build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libpipewire-0.3-dev \
            libxcb1-dev \
            libxcb-shm0-dev \
            libxcb-randr0-dev \
            clang \
            pkg-config

      # Same determinism inputs as the release (SOURCE_DATE_EPOCH from the tag
      # commit; path remapping so absolute build paths don't leak).
      - name: Configure reproducible build flags
        run: |
          set -euo pipefail
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          CARGO_HOME_DIR="${CARGO_HOME:-$HOME/.cargo}"
          echo "RUSTFLAGS=--remap-path-prefix=${HOME}=/pollis-home --remap-path-prefix=${CARGO_HOME_DIR}=/pollis-cargo --remap-path-prefix=${GITHUB_WORKSPACE}=/pollis-src" >> "$GITHUB_ENV"
          # The SAME remapping for C/C++ (#795). `--remap-path-prefix` is a RUSTC flag:
          # it does not reach the C and C++ that build scripts compile through `cc-rs`,
          # so those objects embed the absolute build path. The shipped v1.8.4 binary
          # carried `/home/runner/.cargo/.../cxx-1.0.194/src/cxx.cc` for exactly this
          # reason. Our release and our reproducer both happen to run at /home/runner,
          # so it did not break the CI-to-CI result — but a third party building
          # anywhere else embeds THEIR path and cannot reproduce, which is the entire
          # point of the exercise. `-ffile-prefix-map` is the C/C++ equivalent and
          # cc-rs honours CFLAGS/CXXFLAGS.
          MAP="-ffile-prefix-map=${HOME}=/pollis-home -ffile-prefix-map=${CARGO_HOME_DIR}=/pollis-cargo -ffile-prefix-map=${GITHUB_WORKSPACE}=/pollis-src"
          echo "CFLAGS=${CFLAGS:-} ${MAP}" >> "$GITHUB_ENV"
          echo "CXXFLAGS=${CXXFLAGS:-} ${MAP}" >> "$GITHUB_ENV"

      - name: Rebuild and stage screen-capture helper
        run: |
          cargo build --release --locked --target x86_64-unknown-linux-gnu -p pollis-capture-linux
          mkdir -p src-tauri/binaries
          cp target/x86_64-unknown-linux-gnu/release/pollis-capture-linux \
             src-tauri/binaries/pollis-capture-linux-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/pollis-capture-linux-x86_64-unknown-linux-gnu

      # Mirrors the release's "Record the capture-helper runner image" step, with
      # the SAME helper, so the two strings are comparable by construction rather
      # than by two hand-written formats that agree until one of them is edited.
      - name: Record this job's runner image (#944)
        id: helper_image
        run: |
          set -euo pipefail
          . scripts/lib/attest-helpers.sh
          echo "image=$(runner_image_id)" >> "$GITHUB_OUTPUT"
          echo "capture helper rebuilt on $(runner_image_id)"

      - name: Upload screen-capture helper
        uses: actions/upload-artifact@v4
        with:
          name: pollis-capture-linux
          if-no-files-found: error
          path: src-tauri/binaries/pollis-capture-linux-x86_64-unknown-linux-gnu

  # The rebuild half (guarantee (b) in the header). Needs verify-log-inclusion
  # only to consume its VERIFIED release-report.json for the final assert — if
  # the log itself doesn't verify, a reproduction verdict against it would be
  # meaningless, so being skipped in that case is correct (the inclusion job's
  # own failure is the loud signal).
  rebuild-linux:
    # Only when the release actually succeeded and was a real tag build — a failed
    # or branch-triggered release has nothing published to reproduce.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    needs: [rebuild-capture-helper, verify-log-inclusion]
    # ubuntu-22.04 to match the release build-linux runner (low glibc floor).
    # Reproducibility is per-target: the reproducer must match the OS image.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - uses: dtolnay/rust-toolchain@1.96.0

      # Mirror the release's "Stamp version from git tag" (desktop-release.yml,
      # scripts/bump-version.sh): the committed Cargo.toml / package.json /
      # tauri.conf.json versions are PLACEHOLDERS that CI overwrites before the
      # build sees them. Without this the rebuild produces
      # Pollis_<placeholder>_amd64.AppImage — different bytes, wrong verdict.
      # Same script; the version derives from the resolved tag because
      # workflow_dispatch runs on a branch ref, not the tag ref
      # ($GITHUB_REF_NAME here is the branch, not the tag).
      - name: Stamp version from git tag
        env:
          TAG: ${{ env.TAG }}
        run: |
          VERSION="${TAG#v}"
          ./scripts/bump-version.sh "$VERSION"

      # Same system deps as the release build-linux job.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libasound2-dev \
            libpulse-dev \
            libpipewire-0.3-dev \
            libva-dev \
            libdbus-1-dev \
            rpm \
            cmake \
            clang \
            ninja-build

      - name: Install meson (newer than apt)
        run: |
          python3 -m pip install --user 'meson>=1.3'
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download screen-capture helper
        uses: actions/download-artifact@v4
        with:
          name: pollis-capture-linux
          path: src-tauri/binaries

      - name: Mark screen-capture helper executable
        run: chmod +x src-tauri/binaries/pollis-capture-linux-x86_64-unknown-linux-gnu

      # Determinism inputs — byte-identical to the release build-linux job:
      # SOURCE_DATE_EPOCH from the tag commit + --remap-path-prefix (home, cargo
      # home, workspace root, most-general-first because rustc applies the LAST
      # matching remap).
      - name: Configure reproducible build flags
        run: |
          set -euo pipefail
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          CARGO_HOME_DIR="${CARGO_HOME:-$HOME/.cargo}"
          echo "RUSTFLAGS=--remap-path-prefix=${HOME}=/pollis-home --remap-path-prefix=${CARGO_HOME_DIR}=/pollis-cargo --remap-path-prefix=${GITHUB_WORKSPACE}=/pollis-src" >> "$GITHUB_ENV"
          # The SAME remapping for C/C++ (#795). `--remap-path-prefix` is a RUSTC flag:
          # it does not reach the C and C++ that build scripts compile through `cc-rs`,
          # so those objects embed the absolute build path. The shipped v1.8.4 binary
          # carried `/home/runner/.cargo/.../cxx-1.0.194/src/cxx.cc` for exactly this
          # reason. Our release and our reproducer both happen to run at /home/runner,
          # so it did not break the CI-to-CI result — but a third party building
          # anywhere else embeds THEIR path and cannot reproduce, which is the entire
          # point of the exercise. `-ffile-prefix-map` is the C/C++ equivalent and
          # cc-rs honours CFLAGS/CXXFLAGS.
          MAP="-ffile-prefix-map=${HOME}=/pollis-home -ffile-prefix-map=${CARGO_HOME_DIR}=/pollis-cargo -ffile-prefix-map=${GITHUB_WORKSPACE}=/pollis-src"
          echo "CFLAGS=${CFLAGS:-} ${MAP}" >> "$GITHUB_ENV"
          echo "CXXFLAGS=${CXXFLAGS:-} ${MAP}" >> "$GITHUB_ENV"

      # The published, NON-SECRET build recipe (see the header). Read from
      # repository/environment `vars` — never `secrets` — so this file stays
      # fork-runnable. `option_env!` bakes each into the binary at compile time,
      # and this list is EXACTLY pollis-core/src/config.rs's recipe as of #506
      # (the client no longer reads any R2 or LiveKit credential, so none is
      # passed). Exported via $GITHUB_ENV behind an is-set guard because an
      # unset var must stay truly UNSET: a plain `env:` mapping of an undefined
      # var exports an EMPTY string, which option_env! bakes as Some("") —
      # different bytes from a release that left the var unset (None), e.g. an
      # unset LOG_DB_URL. Tags older than v1.3.5 predate both the
      # determinism flags (#504) and the #506 recipe and are not
      # bit-reproducible here regardless — for those, only log inclusion
      # applies.
      - name: Load build recipe (non-secret vars)
        env:
          TURSO_URL: ${{ vars.TURSO_URL }}
          TURSO_TOKEN: ${{ vars.TURSO_RO_TOKEN }}
          LOG_DB_URL: ${{ vars.LOG_DB_URL }}
          LOG_DB_TOKEN: ${{ vars.LOG_DB_TOKEN }}
          R2_S3_ENDPOINT: ${{ vars.R2_S3_ENDPOINT }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          LIVEKIT_URL: ${{ vars.LIVEKIT_URL }}
          POLLIS_DELIVERY_URL: ${{ vars.POLLIS_DELIVERY_URL }}
          # The signed relay directory's URL and its VERIFICATION key. Both are
          # public by construction — the key is the public half, and the private
          # half never leaves the minting script — so they belong in a published
          # recipe rather than in secrets. They were baked into the release and
          # omitted here, which is why no rebuild could match while the directory
          # was live; scripts/check-build-recipe.py now fails CI on that drift.
          POLLIS_OVERLAY_DIRECTORY_URL: ${{ vars.POLLIS_OVERLAY_DIRECTORY_URL }}
          POLLIS_OVERLAY_DIRECTORY_KEY: ${{ vars.POLLIS_OVERLAY_DIRECTORY_KEY }}
        run: |
          set -euo pipefail
          for key in TURSO_URL TURSO_TOKEN LOG_DB_URL LOG_DB_TOKEN \
                     R2_S3_ENDPOINT R2_PUBLIC_URL LIVEKIT_URL \
                     POLLIS_DELIVERY_URL \
                     POLLIS_OVERLAY_DIRECTORY_URL POLLIS_OVERLAY_DIRECTORY_KEY; do
            if [ -n "${!key}" ]; then
              echo "${key}=${!key}" >> "$GITHUB_ENV"
            fi
          done

      # --locked: a drifted Cargo.lock fails the build rather than silently
      # resolving new versions — same as the release desktop build.
      # --config (inline JSON, merged over tauri.conf.json): the release signs
      # updater artifacts with TAURI_SIGNING_PRIVATE_KEY — a Pollis SECRET a
      # secretless reproducer can never hold — and with the config's
      # createUpdaterArtifacts:true tauri build refuses to run without it.
      # Disabling it here only skips generating the updater .AppImage.tar.gz +
      # .sig companions, which are OUTSIDE the reproducible unit (the minisign
      # signature is detached — docs/reproducible-builds-residuals.md §1). It
      # cannot alter the AppImage payload bytes: the flag is not even embedded
      # in the binary (tauri-utils codegen tokenizes create_updater_artifacts
      # as Default::default() unconditionally), and the AppImage itself is
      # bundled identically either way.
      # Build with the SAME tauri config the release used, rather than asserting a
      # config override is harmless (#795).
      #
      # The release sets createUpdaterArtifacts:true and signs the updater bundle with
      # a Pollis secret a reproducer can never hold, so this used to pass
      # `--config '{"bundle":{"createUpdaterArtifacts":false}}'` and rely on a comment
      # claiming that cannot change the compiled bytes. That claim was never tested,
      # and a real rebuild of v1.8.3 showed `usr/bin/pollis` differing — so it is
      # exactly the kind of assumption worth deleting instead of defending.
      #
      # A throwaway minisign key removes the difference entirely: the config now
      # matches the release, and the only thing the ephemeral key touches is the
      # detached updater `.sig`, which is outside the reproducible unit
      # (docs/reproducible-builds-residuals.md §1).
      - name: Mint a throwaway updater signing key
        run: |
          set -euo pipefail
          pnpm tauri signer generate -p "" -w /tmp/rebuild-updater.key
          # `echo "$key"`, not `cat`: the key file has no trailing newline, so cat runs
          # the value straight into the heredoc delimiter and the env write fails with
          # "Matching delimiter not found".
          key="$(cat /tmp/rebuild-updater.key)"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<__EOF__"
            echo "$key"
            echo "__EOF__"
          } >> "$GITHUB_ENV"
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> "$GITHUB_ENV"

      - name: Rebuild Linux AppImage payload
        run: |
          pnpm tauri build --target x86_64-unknown-linux-gnu -- --locked

      # Recompute payload_sha256 with the IDENTICAL method the release attest job
      # uses — scripts/lib/payload-hash.sh, sourced by both, so the reproducer
      # and the logger can never disagree by an incidental formatting difference.
      # The Linux AppImage's minisign signature is DETACHED (.AppImage.sig), so
      # the shipped .AppImage file IS the reproducible payload: sha_file over it.
      - name: Recompute reproduced payload hash
        id: rehash
        run: |
          set -euo pipefail
          . scripts/lib/payload-hash.sh
          appimage="$(find target/x86_64-unknown-linux-gnu/release/bundle/appimage -name '*.AppImage' | head -1)"
          if [ -z "${appimage:-}" ]; then
            echo "::error::rebuild produced no .AppImage under the expected bundle path"
            exit 1
          fi
          hash="$(sha_file "$appimage")"
          echo "reproduced payload_sha256: ${hash}  ($(basename "$appimage"))"
          echo "hash=${hash}" >> "$GITHUB_OUTPUT"

      # The log report comes from the verify-log-inclusion job, which asserted
      # the pinned key and ran `pollis-verify release` BEFORE uploading it — so
      # the verdict below is computed against a report that already passed
      # inclusion verification.
      - name: Download verified transparency-log report
        uses: actions/download-artifact@v4
        with:
          name: release-report

      # The verdict that makes this a REBUILDER, not just a log reader: assert
      # the hash we independently reproduced is present in the log as the Linux
      # AppImage payload for this tag. Absent/mismatched → loud failure.
      - name: Assert reproduced hash is the logged Linux payload
        env:
          # `gh release download` in the failure diagnostic needs a token; contents:read suffices.
          GH_TOKEN: ${{ github.token }}
          HELPER_RUNNER_IMAGE: ${{ needs.rebuild-capture-helper.outputs.runner_image }}
        run: |
          set -euo pipefail
          . scripts/lib/attest-helpers.sh
          . scripts/lib/rebuild-verdict.sh
          HASH="${{ steps.rehash.outputs.hash }}"

          # The environment this rebuild actually ran in, composed exactly as
          # write_toolchain_manifest composes the value the release recorded.
          OWN_IMAGE=""
          if app_image="$(runner_image_id 2>/dev/null)" && [ -n "${HELPER_RUNNER_IMAGE:-}" ]; then
            OWN_IMAGE="${app_image}+helper:${HELPER_RUNNER_IMAGE}"
          fi
          LOGGED="$(rebuild_logged_linux_payload release-report.json)"
          LOGGED_IMAGE="$(rebuild_logged_runner_image release-report.json)"
          VERDICT="$(rebuild_classify "$HASH" "$LOGGED" "$LOGGED_IMAGE" "$OWN_IMAGE")"

          echo "reproduced payload : ${HASH}"
          echo "logged payload     : ${LOGGED:-<none>}"
          echo "release ran on     : ${LOGGED_IMAGE:-<not recorded in the leaf>}"
          echo "this rebuild ran on: ${OWN_IMAGE:-<unidentifiable>}"
          echo "verdict            : ${VERDICT}"

          if [ "${VERDICT}" = "reproduced" ]; then
            echo "✅ REPRODUCED: ${HASH}"
            echo "   is present in the public transparency log as the Linux"
            echo "   AppImage payload for ${{ env.TAG }}, verified against the"
            echo "   pinned key ${PINNED_LOG_KEY}."
            # #877: write the verdict to the run summary, not only to a log line
            # that scrolls past. The summary renders on the run page itself, so
            # the ledger at pollis.com/assurance can link straight to a legible
            # verdict instead of asking a reader to scrub 20 minutes of build
            # output. This writes nothing outside the run — the workflow's
            # no-secrets, no-external-writes trust-domain property is intact.
            {
              echo "### ✅ Reproduced — \`${{ env.TAG }}\`"
              echo
              echo "The Linux AppImage payload rebuilt from public source at this tag is"
              echo "byte-identical to the payload recorded in the public transparency log."
              echo
              echo "| | |"
              echo "|---|---|"
              echo "| Tag | \`${{ env.TAG }}\` |"
              echo "| Reproduced payload SHA-256 | \`${HASH}\` |"
              echo "| Verified against | \`${VERIFY_BASE_URL}\` (binaries tree) |"
              echo "| Trusting | one pinned ML-DSA-44 key, no Pollis secrets |"
              if [ -n "${LOGGED_IMAGE}" ] && [ "${LOGGED_IMAGE}" != "${OWN_IMAGE}" ]; then
                echo "| Runner image | reproduced **despite** drift: released on \`${LOGGED_IMAGE}\`, rebuilt on \`${OWN_IMAGE}\` |"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          else
            # Three distinguishable reds (#944). All of them fail the run — an
            # inconclusive rebuild is not a passing rebuild, and greening the
            # environment cases would open a window for a real divergence every
            # time GitHub re-images a runner. What differs is what the run is
            # entitled to SAY, because only one of the three is an accusation.
            case "${VERDICT}" in
              did_not_reproduce)
                echo "::error title=Did not reproduce::rebuilt Linux payload does not match the logged one"
                echo "::error::reproduced Linux AppImage payload hash ${HASH} is NOT the"
                echo "::error::logged payload for ${{ env.TAG }}, and BOTH builds ran on the"
                echo "::error::same recorded runner image (${OWN_IMAGE})."
                echo "::error::"
                echo "::error::Nothing in the documented residual list explains this. Either the"
                echo "::error::build did not reproduce for a recipe reason (see"
                echo "::error::docs/reproducible-builds-residuals.md — e.g. a build-recipe var"
                echo "::error::left unset) or the shipped payload diverges from this source."
                echo "::error::That second possibility is why this workflow exists. Treat it as"
                echo "::error::a security finding until the diff below says otherwise."
                ;;
              environment_drift)
                echo "::error title=Inconclusive — build environment drifted::rebuilt on a different runner image than the release"
                echo "::error::reproduced Linux AppImage payload hash ${HASH} is NOT the logged"
                echo "::error::payload for ${{ env.TAG }} — but this rebuild did not run in the"
                echo "::error::environment the release recorded:"
                echo "::error::  release recorded: ${LOGGED_IMAGE}"
                echo "::error::  this rebuild ran: ${OWN_IMAGE}"
                echo "::error::"
                echo "::error::THIS IS NOT AN ACCUSATION ABOUT THE SHIPPED BINARY. The AppImage is"
                echo "::error::not purely a function of Pollis source: linuxdeploy copies system"
                echo "::error::shared libraries (libkrb5, libsqlite3, libsystemd, libudev, …) off"
                echo "::error::the build runner into the bundle, so a different runner image"
                echo "::error::vendors different bytes for identical source. Bit-identity is"
                echo "::error::claimed only on a matching image — docs/reproducible-builds-residuals.md §6."
                echo "::error::"
                echo "::error::GitHub re-images the ubuntu-22.04 label every few weeks and rolls it"
                echo "::error::out gradually, so two jobs half an hour apart can land on different"
                echo "::error::images. That is exactly what happened to v1.9.3 (#944)."
                echo "::error::"
                echo "::error::Check the diff below: if the ONLY differing paths are vendored"
                echo "::error::system libraries, this is drift and nothing more. Any difference in"
                echo "::error::usr/bin/pollis beyond the documented residuals is a real finding and"
                echo "::error::must be escalated regardless of the image mismatch."
                ;;
              recipe_unrecorded)
                echo "::error title=Inconclusive — the release recorded no build recipe::cannot evaluate the reproduction precondition"
                echo "::error::reproduced Linux AppImage payload hash ${HASH} is NOT the logged"
                echo "::error::payload for ${{ env.TAG }}, and the leaf for this tag records no"
                echo "::error::usable runner image (${LOGGED_IMAGE:-absent or \"unknown\"})."
                echo "::error::"
                echo "::error::Every leaf through v1.9.7 published runner_image \"unknown\" —"
                echo "::error::#939 fixed that going forward only, and the tree is append-only, so"
                echo "::error::those tags cannot be re-attested with a true recipe. Without it the"
                echo "::error::precondition for bit-identity (a matching runner image) cannot be"
                echo "::error::checked, so this run CANNOT distinguish a real divergence from the"
                echo "::error::runner-image drift documented in"
                echo "::error::docs/reproducible-builds-residuals.md §6. Read the diff below and"
                echo "::error::classify it by hand; do not read this as a reproducibility failure"
                echo "::error::and do not read it as a pass."
                ;;
            esac
            echo "::error::Logged Linux payload hashes for the tag:"
            jq -r '.artifacts[] | select(.platform=="linux" and .layer=="payload")
                   | "  \(.bundle): \(.payload_sha256)"' release-report.json || true
            echo "::error::"
            echo "::error::The verify-log-inclusion job will not reach this point unless the tag"
            echo "::error::is genuinely published in the tree AND the tree verifies, so an"
            echo "::error::unpublished release can no longer surface here as a byte divergence —"
            echo "::error::it fails earlier with its own message."

            # Name the differing files rather than leaving a bare hash mismatch.
            #
            # "the hashes differ" is the least actionable possible output for the one
            # tool whose entire job is telling a stranger whether our binary matches our
            # source. Without this, every investigation starts by rebuilding locally and
            # guessing. With it, the job says which paths diverged and by how much, which
            # is usually enough to name the cause on sight (an embedded timestamp, a
            # differing sidecar helper, a non-deterministic asset bundle).
            echo "::group::What actually differs"
            set +e
            gh release download "${{ env.TAG }}" --repo "$GITHUB_REPOSITORY" \
               --pattern '*.AppImage' --dir /tmp/shipped 2>/dev/null
            shipped="$(find /tmp/shipped -name '*.AppImage' | head -1)"
            rebuilt="$(find "$GITHUB_WORKSPACE/target/x86_64-unknown-linux-gnu/release/bundle/appimage" -name '*.AppImage' | head -1)"
            if [ -n "$shipped" ] && [ -n "$rebuilt" ]; then
              echo "shipped: $(stat -c%s "$shipped") bytes  $shipped"
              echo "rebuilt: $(stat -c%s "$rebuilt") bytes  $rebuilt"

              # Byte-level first: identical sizes with a handful of differing bytes is a
              # completely different diagnosis (an embedded stamp or build id) from a
              # wholesale content change, and it costs one command to tell them apart.
              ndiff="$(cmp -l "$shipped" "$rebuilt" 2>/dev/null | wc -l)"
              echo "differing bytes: ${ndiff}"
              echo "first differing offsets (byte, shipped-octal, rebuilt-octal):"
              cmp -l "$shipped" "$rebuilt" 2>/dev/null | head -20

              # Then the file-level view, so a differing byte can be attributed to a path.
              mkdir -p /tmp/xa /tmp/xb
              cp "$shipped" /tmp/xa/app.AppImage; cp "$rebuilt" /tmp/xb/app.AppImage
              chmod +x /tmp/xa/app.AppImage /tmp/xb/app.AppImage
              ( cd /tmp/xa && ./app.AppImage --appimage-extract >/dev/null 2>&1 )
              ( cd /tmp/xb && ./app.AppImage --appimage-extract >/dev/null 2>&1 )
              if [ -d /tmp/xa/squashfs-root ] && [ -d /tmp/xb/squashfs-root ]; then
                echo "--- differing files ---"
                diff -rq /tmp/xa/squashfs-root /tmp/xb/squashfs-root 2>&1 | head -30

                # Split the differing paths into the two categories that mean
                # completely different things (#944), because the previous output
                # left that entirely to the reader — and the reader concluded
                # "several bundled libraries differ, still unexplained" and
                # published it.
                #
                # usr/lib/* in an AppImage is NOT ours. linuxdeploy copies those
                # off the build runner, so they track the runner image, not the
                # source. usr/bin/pollis IS ours, and a difference there is the
                # thing worth looking at.
                echo "--- differing files, by origin ---"
                diff -rq /tmp/xa/squashfs-root /tmp/xb/squashfs-root 2>/dev/null \
                  | sed -n 's|^Files /tmp/xa/squashfs-root/\(.*\) and .* differ$|\1|p' \
                  > /tmp/differing-paths.txt || true
                vendored="$(grep -cE '^usr/lib/' /tmp/differing-paths.txt || true)"
                ours="$(grep -vE '^usr/lib/' /tmp/differing-paths.txt | grep -c . || true)"
                echo "vendored host libraries (usr/lib/, copied off the runner by linuxdeploy): ${vendored:-0}"
                echo "everything else (built from Pollis source):                              ${ours:-0}"
                if [ "${ours:-0}" -eq 0 ] && [ "${vendored:-0}" -gt 0 ]; then
                  echo
                  echo "ONLY vendored host libraries differ. Nothing built from Pollis source"
                  echo "changed. This is runner-image drift (residuals §6), not a divergence"
                  echo "between the shipped binary and the tagged source."
                fi
                grep -vE '^usr/lib/' /tmp/differing-paths.txt | sed 's/^/  ours: /' || true

                # diffoscope is the standard tool for exactly this question and names the
                # cause where a hash comparison only says "different" — an embedded path,
                # a build id, a differing debug section, reordered symbols. Installed only
                # on the failure path so a passing run stays fast.
                echo "--- diffoscope on the differing binaries ---"
                sudo apt-get update -qq >/dev/null 2>&1
                sudo apt-get install -y -qq diffoscope >/dev/null 2>&1
                diff -rq /tmp/xa/squashfs-root /tmp/xb/squashfs-root 2>/dev/null \
                  | sed -n 's/^Files \(.*\) and \(.*\) differ$/\1|\2/p' \
                  | while IFS='|' read -r f1 f2; do
                      echo "### $(basename "$f1")"
                      diffoscope --max-report-size 40000 --text - "$f1" "$f2" 2>/dev/null | head -60
                    done
              else
                echo "extraction unavailable (no FUSE / not self-extracting here);"
                echo "the byte offsets above are still the actionable signal."
              fi
            else
              echo "shipped=${shipped:-<none>} rebuilt=${rebuilt:-<none>} — nothing to diff"
            fi
            set -e
            echo "::endgroup::"

            # #877: a red verdict gets a summary too. A failure that is only a
            # log line is exactly how v1.9.3's real non-reproduction sat
            # unexplained — and a page that publishes verdicts has to be able to
            # link a reader to the finding, not just to the word "failure".
            {
              case "${VERDICT}" in
                did_not_reproduce)
                  echo "### ❌ Did not reproduce — \`${{ env.TAG }}\`"
                  echo
                  echo "The Linux AppImage payload rebuilt from public source at this tag does"
                  echo "**not** match the payload recorded in the transparency log, and both"
                  echo "builds ran on the **same** recorded runner image. The tag is published"
                  echo "and the log verifies, so this is a genuine reproducibility finding —"
                  echo "not a publishing delay and not environment drift."
                  ;;
                environment_drift)
                  echo "### ⚠️ Inconclusive — build environment drifted — \`${{ env.TAG }}\`"
                  echo
                  echo "The rebuilt payload differs from the logged one, but this rebuild did"
                  echo "**not** run on the runner image the release recorded. The AppImage"
                  echo "vendors system libraries copied off the build runner, so a different"
                  echo "image legitimately yields different bytes from identical source."
                  echo "Bit-identity is claimed only on a matching image"
                  echo "(\`docs/reproducible-builds-residuals.md\` §6)."
                  echo
                  echo "**This says nothing against the shipped binary.** It says the check"
                  echo "could not be performed under the conditions it requires."
                  ;;
                recipe_unrecorded)
                  echo "### ⚠️ Inconclusive — no recorded build recipe — \`${{ env.TAG }}\`"
                  echo
                  echo "The rebuilt payload differs from the logged one, and the leaf for this"
                  echo "tag records no usable runner image, so the precondition for"
                  echo "bit-identity cannot be checked at all. Every leaf through \`v1.9.7\`"
                  echo "published \`runner_image: \"unknown\"\`; #939 fixed that going forward"
                  echo "only, and the tree is append-only."
                  echo
                  echo "**This is neither a pass nor a reproducibility failure.** Classify the"
                  echo "diff by hand."
                  ;;
              esac
              echo
              echo "| | |"
              echo "|---|---|"
              echo "| Tag | \`${{ env.TAG }}\` |"
              echo "| Verdict | \`${VERDICT}\` |"
              echo "| Reproduced payload SHA-256 | \`${HASH}\` |"
              echo "| Logged payload SHA-256 | \`${LOGGED:-none}\` |"
              echo "| Release runner image | \`${LOGGED_IMAGE:-not recorded}\` |"
              echo "| Rebuild runner image | \`${OWN_IMAGE:-unidentifiable}\` |"
              echo
              echo "See the **What actually differs** group in the job log for the"
              echo "byte offsets, the differing paths split by origin, and the diffoscope"
              echo "output."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
