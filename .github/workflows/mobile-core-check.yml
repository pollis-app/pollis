# Mobile cross-compile gate: does `pollis-core` still build for Android + iOS?
#
# The mobile app consumes pollis-core via uniffi. Everything desktop-only
# (terminal, host audio/voice, the Rust LiveKit/libwebrtc engine) is gated out
# on mobile with `cfg(not(any(target_os = "ios", target_os = "android")))` and
# `#[path]`-swapped stubs. A desktop-only `cargo check` cannot catch a broken
# gate — the mobile build only fails on a real cross-compile. These jobs run
# that cross-compile so mobile `#[cfg]` rot becomes red CI, not a latent defect
# discovered on the next `ubrn build` (issue #185 cross-cutting).
#
# Mobile builds with `--no-default-features` (drops `media` -> no webrtc-sys, and
# `os-keystore` -> the keystore-encrypted file path), matching the ubrn build.
# One aarch64 target per OS covers every `target_os = "android"` / `"ios"` gate
# (gating is per-OS, not per-ABI). The iOS job needs a macOS runner for the
# Apple SDK; it gates the `ios_kek` Keychain path the same way the android job
# gates the JNI path.
#
# On top of those two cross-compile gates, `android-build` assembles a REAL
# installable Android APK end to end on a stock ubuntu-latest runner — uniffi
# binding generation, a 3-ABI cargo-ndk cross-compile of pollis-core, the Expo
# prebuild, and a Gradle release assembly — and uploads it as an artifact. This
# is the first CI job that ever exercises the full mobile build (prebuild +
# Gradle + uniffi C++ template alignment), where the first-real-build breakage
# lives (#706 / PL-18). It uses `expo prebuild` + Gradle directly, NOT
# `eas build` (that needs an EAS account this repo has none of). No signing
# secret is consumed: the artifact is signed with the throwaway Android debug
# keystore that the Expo template generates — Play/App Store upload signing is
# the deliberately-blocked half of PL-18 (needs the Play console + an Apple
# account, #723). `expo-doctor` runs as its own cheap job.
#
# Scoped per job (#698 pattern, as in mls-tests.yml / windows-link.yml): a
# seconds-cheap `changes` job decides which jobs this PR can affect, and the
# always-reporting `mobile-gate` collapses the outcome — mark `mobile-gate`, not
# a heavy job, as the required check. The three surfaces:
#
#   native  pollis-core and every crate it reaches by `path =` (the same closure
#           mobile/fingerprint.config.js hashes; tests/ci-paths.test.ts fails if
#           the two drift), the workspace manifests, the toolchain pin, the
#           ubrn module, and this workflow. Runs everything.
#   app     the JS app and the catalogues Metro bundles from frontend/. Runs
#           android-build + expo-doctor; the Rust cross-compiles (one of them on
#           a 10x macOS runner) cannot see a JS change.
#   tests   files outside mobile/ that mobile/tests or the OTA worker tests read
#           (desktop mirrors in frontend/src, the DS Worker's update routes, the
#           release workflows the OTA tests pin). Runs expo-doctor only.
#
# A mobile-JS-only PR used to pay for both Rust cross-compiles, ios-check alone
# ~1.6 min on macOS (~20 billed minutes at the 10x multiplier) for code that
# cannot reach it.
name: Mobile core (cross-compile + Android build)

on:
  # No paths filter on PRs: the workflow must always run so `mobile-gate`
  # always reports. Exemption is decided in the `changes` job instead.
  pull_request:
  # Path-filtered on `main`, for ONE reason: to write the Rust caches PR runs
  # restore. Caches are ref-scoped — a cache saved by a PR is visible only to
  # later pushes on that same PR, never to another PR — so while this workflow
  # ran on PRs alone every new PR started cold, and every PR's ~2.2 GiB of
  # saved caches was pure duplication that pushed the repo over GitHub's
  # 10 GiB budget (#759) and evicted the caches other gates depend on. Now only
  # `main` saves (`save-if` below) and every PR restores from it. The list is
  # the union of the `changes` filters below; keep the two in step.
  push:
    branches: [main]
    paths:
      - 'pollis-core/**'
      - 'pollis-api/**'
      - 'pollis-capture-proto/**'
      - 'pollis-device-cert/**'
      - 'pollis-libsql-connector/**'
      - 'pollis-relay/**'
      - 'pollis-schema/**'
      - 'pollis-sqlcipher/**'
      - 'verifiable-log/**'
      - 'verifiable-log-builder/**'
      - 'verifiable-log-serve/**'
      - 'patches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - 'mobile/**'
      - 'frontend/src/**'
      - 'website/android.html'
      - 'scripts/mobile-i18n-resources.mjs'
      - 'scripts/i18n-check.mjs'
      - 'pollis-delivery/worker/**'
      - 'pollis-delivery/worker-tests/**'
      - 'pollis-delivery/wrangler.*.jsonc'
      - '.github/workflows/mobile-ota-release.yml'
      - '.github/workflows/mobile-apk-release.yml'
      - '.github/workflows/mobile-core-check.yml'
  workflow_dispatch:

permissions:
  contents: read
  # dorny/paths-filter reads the PR's changed-file list via the API (no checkout).
  pull-requests: read

concurrency:
  group: mobile-core-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Allow-lists (default `some` quantifier): a PR runs a job when ANY changed
  # file is on a surface that job can see. Non-PR events run everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      run_native: ${{ steps.decide.outputs.run_native }}
      run_build: ${{ steps.decide.outputs.run_build }}
      run_doctor: ${{ steps.decide.outputs.run_doctor }}
    steps:
      - name: Detect mobile-relevant changes (PRs only)
        id: filter
        if: ${{ github.event_name == 'pull_request' }}
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            native:
              - 'pollis-core/**'
              - 'pollis-api/**'
              - 'pollis-capture-proto/**'
              - 'pollis-device-cert/**'
              - 'pollis-libsql-connector/**'
              - 'pollis-relay/**'
              - 'pollis-schema/**'
              - 'pollis-sqlcipher/**'
              - 'verifiable-log/**'
              - 'verifiable-log-builder/**'
              - 'verifiable-log-serve/**'
              # The workspace's [patch] crates apply to every build in it.
              - 'patches/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              # ubrn.config.yaml carries the iOS deployment-target pin ios-check
              # reads, and the module is what android-build generates into.
              - 'mobile/modules/pollis-native/**'
              - '.github/workflows/mobile-core-check.yml'
            app:
              - 'mobile/**'
              # Metro bundles these straight from frontend/ (metro.config.js
              # watchFolders, #1074).
              - 'frontend/src/i18n/locales/**'
            tests:
              # Desktop originals the mobile tests hold their mirrors to
              # (identityFields, username, securityEvents, enrollmentSas, ...).
              - 'frontend/src/**'
              - 'website/android.html'
              - 'scripts/mobile-i18n-resources.mjs'
              - 'scripts/i18n-check.mjs'
              # OTA updates (#1250): the update routes in the DS front-door
              # Worker and the release workflows the mobile tests pin.
              - 'pollis-delivery/worker/**'
              - 'pollis-delivery/worker-tests/**'
              - 'pollis-delivery/wrangler.*.jsonc'
              - '.github/workflows/mobile-ota-release.yml'
              - '.github/workflows/mobile-apk-release.yml'
      - name: Decide which mobile jobs must run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          NATIVE: ${{ steps.filter.outputs.native }}
          APP: ${{ steps.filter.outputs.app }}
          TESTS: ${{ steps.filter.outputs.tests }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            NATIVE=true
            APP=true
            TESTS=true
          fi
          native=false
          build=false
          doctor=false
          if [ "$NATIVE" = "true" ]; then
            native=true
          fi
          if [ "$NATIVE" = "true" ] || [ "$APP" = "true" ]; then
            build=true
          fi
          if [ "$build" = "true" ] || [ "$TESTS" = "true" ]; then
            doctor=true
          fi
          {
            echo "run_native=$native"
            echo "run_build=$build"
            echo "run_doctor=$doctor"
          } >> "$GITHUB_OUTPUT"
          echo "event=$EVENT native=$NATIVE app=$APP tests=$TESTS -> cross-compiles=$native android-build=$build expo-doctor=$doctor"

  android-check:
    needs: changes
    if: ${{ needs.changes.outputs.run_native == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add android rust target
        run: rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android-aarch64
          # No rustc-environment hash: the runner image's own `stable` is hashed
          # into it and differs between images mid-rollout, which split the key
          # and made PRs miss `main`'s cache (see mls-tests.yml).
          add-rust-environment-hash-key: false
          # Only `main` writes; PRs restore (see the `push:` trigger above).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Point cargo + cc-rs at the NDK's clang for the android target. The
      # runner ships an Android NDK at $ANDROID_NDK_LATEST_HOME; the API-24
      # clang wrappers exist in all modern NDKs. Mirrors the env the ubrn build
      # sets under the hood.
      - name: Cross-compile pollis-core for android
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "using NDK: $NDK"
          TC="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$TC/aarch64-linux-android24-clang"
          export CC_aarch64_linux_android="$TC/aarch64-linux-android24-clang"
          export CXX_aarch64_linux_android="$TC/aarch64-linux-android24-clang++"
          export AR_aarch64_linux_android="$TC/llvm-ar"
          export RANLIB_aarch64_linux_android="$TC/llvm-ranlib"
          cargo check -p pollis-core --no-default-features --target aarch64-linux-android

  ios-check:
    needs: changes
    if: ${{ needs.changes.outputs.run_native == 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add ios rust target
        run: rustup target add aarch64-apple-ios

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ios-aarch64
          # No rustc-environment hash: the runner image's own `stable` is hashed
          # into it and differs between images mid-rollout, which split the key
          # and made PRs miss `main`'s cache (see mls-tests.yml).
          add-rust-environment-hash-key: false
          # Only `main` writes; PRs restore (see the `push:` trigger above).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The macOS runner ships Xcode + the iPhoneOS SDK; cargo/cc pick them up
      # via xcrun with no extra env. Gates the `target_os = "ios"` branches
      # (ios_kek Keychain seal, mobile stubs) exactly like the android job.
      #
      # `build`, NOT `check`: mobile links a vendored OpenSSL + SQLCipher
      # (rusqlite's `bundled-sqlcipher-vendored-openssl`), and a whole class of
      # iOS breakage lives in the LINK, which `cargo check` never reaches.
      # Building emits the cdylib and staticlib the xcframework is cut from, so
      # the link is exercised. Android gets this coverage from the android-build
      # job below; iOS has no artifact job, so it has to come from here.
      # The deployment-target pin is read from ubrn.config.yaml — the single
      # checked-in source of truth — and applied the same way ubrn's own cargo
      # invocations get it (it must not live in .cargo/config.toml's global
      # [env], where it retargets macOS desktop builds to iPhone; that is what
      # broke the v1.10.2 release).
      - name: Cross-compile pollis-core for ios
        run: |
          want=$(grep -oE 'IPHONEOS_DEPLOYMENT_TARGET="[0-9.]+"' \
            mobile/modules/pollis-native/ubrn.config.yaml | sed -E 's/.*"([0-9.]+)"/\1/')
          if [ -z "$want" ]; then
            echo "::error::No IPHONEOS_DEPLOYMENT_TARGET pin in ubrn.config.yaml (ios cargoExtras)."
            exit 1
          fi
          export IPHONEOS_DEPLOYMENT_TARGET="$want"
          cargo build -p pollis-core --no-default-features --target aarch64-apple-ios

      # The deployment target has to survive into the artifact, not merely sit
      # in ubrn.config.yaml looking correct. Both halves of that have failed:
      # the value was once written to a `[target.<triple>.env]` table of
      # .cargo/config.toml, which cargo silently ignores (it parses as a
      # build-script `links` override for a library named "env"), leaving the
      # real target at rustc's 10.0 default while the file claimed otherwise.
      #
      # It matters because cc-rs builds the vendored OpenSSL 3.5 + SQLCipher
      # against the current iPhoneOS SDK. Link those objects at 10.0 and the
      # release build dies on `___chkstk_darwin`, a libSystem stub that only
      # exists from iOS 12. Note the failure is RELEASE-ONLY — the debug link
      # above survives 10.0 quite happily — so the build step alone would not
      # have caught it, and a release build is too heavy for a path-filtered
      # gate. Reading the min-version straight off the artifact costs
      # milliseconds and catches it in either profile.
      - name: Assert the iOS deployment target reached the artifact
        run: |
          want=$(grep -oE 'IPHONEOS_DEPLOYMENT_TARGET="[0-9.]+"' \
            mobile/modules/pollis-native/ubrn.config.yaml | sed -E 's/.*"([0-9.]+)"/\1/')
          otool -l target/aarch64-apple-ios/debug/libpollis_core.dylib > /tmp/otool.txt
          got=$(awk '
            /LC_BUILD_VERSION/        { mode="build"; next }
            /LC_VERSION_MIN_IPHONEOS/ { mode="min";   next }
            mode=="build" && $1=="minos"   { print $2; found=1; exit }
            mode=="min"   && $1=="version" { print $2; found=1; exit }
            END { if (!found) print "UNKNOWN" }' /tmp/otool.txt)
          echo "expected=$want actual=$got"
          if [ "$want" != "$got" ]; then
            echo "::error::iOS deployment target did not reach the artifact." \
              "The pin lives in ubrn.config.yaml's ios cargoExtras (cargo" \
              "--config env.…) and this job must export it for its own cargo" \
              "build; it must NOT be moved to .cargo/config.toml's global" \
              "[env] (breaks macOS desktop builds), and cargo silently" \
              "ignores [target.<triple>.env]."
            exit 1
          fi

  # Config/dependency health of the Expo project. Cheap (no Rust, no NDK, no
  # Gradle) so it gives fast independent signal and never holds up the APK
  # artifact. If it flags anything, the first-run output is the enumeration.
  expo-doctor:
    needs: changes
    if: ${{ needs.changes.outputs.run_doctor == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.25.0

      # mobile/ is a standalone Expo project, NOT a workspace member (see
      # mobile/CLAUDE.md) — every pnpm command runs with --ignore-workspace.
      - name: Install JS dependencies
        working-directory: mobile
        run: pnpm install --ignore-workspace --frozen-lockfile

      - name: expo-doctor
        working-directory: mobile
        run: pnpm dlx expo-doctor

      # Node's own runner over the pure modules under mobile/hooks — no Expo,
      # no device, no RN renderer, so it belongs in the cheap job rather than
      # behind a 3-ABI cargo-ndk build. Node 22 (above) strips the TS types, so
      # there is no compile step to add.
      - name: Unit tests
        working-directory: mobile
        run: pnpm test

      # The OTA update routes in the DS front-door Worker (api.pollis.com/updates/,
      # #1250): protocol responses and the no-client-IP config. Pure node, no
      # install needed.
      - name: OTA update-route tests (DS Worker)
        run: node --test pollis-delivery/worker-tests/*.test.ts

  # The first end-to-end mobile build in CI: uniffi bindings + a 3-ABI
  # cargo-ndk cross-compile of pollis-core, Expo prebuild, Gradle release
  # assembly, and an uploaded APK. Everything runs on a stock ubuntu-latest
  # runner with no EAS account and no signing secret.
  android-build:
    needs: changes
    if: ${{ needs.changes.outputs.run_build == 'true' }}
    runs-on: ubuntu-latest
    # ~28 min cold before the single-ABI change; nothing needs six hours.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.25.0

      # The three Android ABIs the app ships (arm64-v8a, armeabi-v7a, x86_64),
      # matching modules/pollis-native/ubrn.config.yaml.
      - name: Add android rust targets
        run: rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: android-apk
          # No rustc-environment hash: the runner image's own `stable` is hashed
          # into it and differs between images mid-rollout, which split the key
          # and made PRs miss `main`'s cache (see mls-tests.yml).
          add-rust-environment-hash-key: false
          # Only `main` writes; PRs restore (see the `push:` trigger above).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # RN 0.83.6 pins NDK 27.1.12297006 and CMake 3.22.1 (mobile/CLAUDE.md);
      # the runner's default NDK is a different revision, so Gradle's
      # externalNativeBuild would fail to find the pinned one. Install the exact
      # versions and point cargo-ndk at the same NDK the Gradle CMake build uses.
      - name: Install the RN-pinned Android NDK + CMake
        run: |
          set -euo pipefail
          # Resolve the SDK root and sdkmanager the way the current ubuntu-latest
          # image lays them out, and fail loudly (not silently) if neither is
          # where we expect — a missing tool must surface here, not three steps
          # later as a confusing "NDK not found".
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK" ]; then
            echo "ANDROID_HOME / ANDROID_SDK_ROOT not set on this runner" >&2
            exit 1
          fi
          SDKMGR="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(command -v sdkmanager)"
          fi
          # `sdkmanager --licenses` stops reading stdin once every licence is
          # accepted and exits 0; a bare `yes | sdkmanager` then dies with EPIPE
          # on the *successful* path and `pipefail` promotes that to a step
          # failure. Wrapping only `yes` in `{ ... || true; }` discards yes's
          # exit status while leaving sdkmanager's as the pipe's status, so a
          # genuine licence failure still fails the step.
          { yes || true; } | "$SDKMGR" --licenses >/dev/null
          # compileSdk/targetSdk 36 + build-tools 36.0.0 are the Expo SDK 55 /
          # RN 0.83 defaults (expo-modules-core ProjectConfiguration.kt); NDK
          # 27.1.12297006 + CMake 3.22.1 are the RN-pinned native toolchain
          # (mobile/CLAUDE.md). Gradle's externalNativeBuild resolves the NDK by
          # exact version, so this must match or the CMake link fails.
          "$SDKMGR" "ndk;27.1.12297006" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_NDK_HOME=$SDK/ndk/27.1.12297006" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/27.1.12297006" >> "$GITHUB_ENV"

      # cargo-ndk drives the per-ABI cross-compile; the ubrn CLI must be the
      # exact tag pinned in mobile/CLAUDE.md — its generated C++ template has to
      # match the npm `uniffi-bindgen-react-native` (0.31.0-6) or CMake fails
      # with `no member named 'string_to_buffer'`.
      - name: Install cargo-ndk + uniffi-bindgen-react-native (pinned)
        run: |
          set -euo pipefail
          cargo install cargo-ndk --locked
          cargo install --git https://github.com/jhugman/uniffi-bindgen-react-native \
            --tag 0.31.0-6 uniffi-bindgen-react-native --locked

      - name: Install JS dependencies
        working-directory: mobile
        run: pnpm install --ignore-workspace --frozen-lockfile

      # Cross-compiles pollis-core for the 3 ABIs (--no-default-features, via
      # cargo-ndk) into jniLibs AND generates the TS bindings + C++ JSI glue +
      # android/CMakeLists.txt. Must precede prebuild/Gradle: the Metro JS
      # bundle imports the generated module TS, and Gradle links the generated
      # CMake + jniLibs.
      - name: Generate uniffi bindings + cross-compile pollis-core (3 ABIs)
        working-directory: mobile/modules/pollis-native
        run: uniffi-bindgen-react-native build android --config ubrn.config.yaml --and-generate

      # Generates the android/ project from app.json (deps already installed).
      - name: Expo prebuild (android)
        working-directory: mobile
        run: pnpm expo prebuild --platform android --no-install

      # assembleRelease is self-contained: it bundles the JS and, per the RN
      # template, signs the release variant with the auto-generated debug
      # keystore (no signing secret needed). The output is installable but NOT
      # distribution-signed — Play upload signing is the blocked half of PL-18.
      # 4g heap, not the Expo template's 2g default (android/ is prebuild
      # output, so its gradle.properties cannot be edited in-repo):
      # `:app:packageRelease` packages three ABIs of pollis-core native libs
      # in one IncrementalSplitterRunnable worker, and at 2g that
      # intermittently dies of OutOfMemoryError — usually surfaced as the
      # task failing with a NULL message, because the OOM eats it. The
      # runners have 16g.
      #
      # ONE ABI (arm64-v8a), not three. This step was the slowest in all of PR
      # CI (~24 min median), most of it the per-ABI CMake builds of the RN
      # native modules — the same C++ compiled three times. One ABI exercises
      # every source, the prebuild, the uniffi JSI glue and the Gradle
      # packaging; the 3-ABI Rust cross-compile above still runs, and
      # mobile-apk-release.yml builds all three ABIs for every shipped APK.
      # Same choice as scripts/build-release-sims.sh. The PR artifact is
      # therefore an arm64 APK, which is what nearly every phone takes.
      - name: Assemble release APK
        working-directory: mobile/android
        env:
          # Deliberately one token (no spaces): gradlew word-splits
          # GRADLE_OPTS, and a quoted multi-flag jvmargs is fragile across
          # wrapper versions. Metaspace reverts to the JVM's unbounded
          # default, which is fine here.
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4096m
        run: ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      # The runtime version Gradle baked must be the one a Gradle-free recompute
      # (the OTA job's) gives, or OTAs miss every binary built this way. Gradle
      # bakes it mid-build, so anything a build leaves in a fingerprinted dir
      # only while it runs breaks this (#1429: Kotlin's `.kotlin/sessions/`);
      # mobile-apk-release.yml runs the same check on every shipped APK.
      - name: Baked runtime version equals the OTA job's
        working-directory: mobile
        run: |
          set -euo pipefail
          baked="$(unzip -p android/app/build/outputs/apk/release/app-release.apk assets/fingerprint)"
          computed="$(node_modules/.bin/fingerprint fingerprint:generate --platform android | jq -r .hash)"
          echo "android runtime version: baked ${baked}, recomputed ${computed}"
          if [ "$baked" != "$computed" ]; then
            echo "::error::the APK's runtime version ${baked} is not what the OTA job computes (${computed}); compare the createReleaseUpdatesResources line in the Gradle log with \`fingerprint:generate --platform android --debug\`"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pollis-android-apk
          path: mobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # One stable check for the whole workflow: green only when every job passed
  # or was skipped because the decision said so; red on any failure or cancel,
  # a failed decision, or a skip the decision did not ask for. Fail-closed.
  mobile-gate:
    needs: [changes, android-check, ios-check, expo-doctor, android-build]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate mobile jobs
        env:
          CHANGES: ${{ needs.changes.result }}
          RUN_NATIVE: ${{ needs.changes.outputs.run_native }}
          RUN_BUILD: ${{ needs.changes.outputs.run_build }}
          RUN_DOCTOR: ${{ needs.changes.outputs.run_doctor }}
          ANDROID_CHECK: ${{ needs.android-check.result }}
          IOS_CHECK: ${{ needs.ios-check.result }}
          EXPO_DOCTOR: ${{ needs.expo-doctor.result }}
          ANDROID_BUILD: ${{ needs.android-build.result }}
        run: |
          echo "changes=$CHANGES native=$RUN_NATIVE build=$RUN_BUILD doctor=$RUN_DOCTOR"
          echo "android-check=$ANDROID_CHECK ios-check=$IOS_CHECK expo-doctor=$EXPO_DOCTOR android-build=$ANDROID_BUILD"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::Decision job did not succeed ($CHANGES) — failing closed."
            exit 1
          fi
          fail=0
          check() {
            if [ "$2" = "success" ]; then
              return 0
            fi
            if [ "$3" = "false" ] && [ "$2" = "skipped" ]; then
              echo "$1: correctly skipped (no change on its surface)."
              return 0
            fi
            echo "::error::$1 did not pass ($2)."
            fail=1
          }
          check android-check "$ANDROID_CHECK" "$RUN_NATIVE"
          check ios-check "$IOS_CHECK" "$RUN_NATIVE"
          check android-build "$ANDROID_BUILD" "$RUN_BUILD"
          check expo-doctor "$EXPO_DOCTOR" "$RUN_DOCTOR"
          exit "$fail"
