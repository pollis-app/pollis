[package]
name = "pollis-import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Parse chat-platform exports (Discord, Slack) into a normalised model and a dry-run import plan. Pure: no network, no crypto, no Pollis state, so pollis-core (which applies a plan) and the pollis-import CLI (which only reports one) share one parser."

[lib]
name = "pollis_import"
path = "src/lib.rs"

[[bin]]
name = "pollis-import"
path = "src/main.rs"

[dependencies]
pollis-api = { path = "../pollis-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A Slack export arrives as a ZIP. Same version and features as pollis-core's,
# so nothing new enters the tree.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2"] }
# Not called directly: it selects zip's deflate backend (miniz_oxide).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[package.metadata.cargo-udeps.ignore]
normal = ["flate2"]

[package.metadata.cargo-machete]
ignored = ["flate2"]

[lints]
workspace = true
