[build]
rustflags = []

[target.aarch64-apple-darwin]
# -ObjC: ensure Objective-C categories are loaded from static libs (fixes WebRTC crash)
# -rpath /usr/lib/swift: where macOS 12+ ships the Swift runtime (incl. libswift_Concurrency)
#   in the dyld cache. screencapturekit's Swift bridge links those libs by name but
#   doesn't embed the standard Swift rpath, so dyld can't find them at launch.
rustflags = [
    "-C", "link-arg=-ObjC",
    "-C", "link-arg=-Wl,-rpath,/usr/lib/swift",
]

[target.aarch64-apple-darwin.env]
# Screen-share uses SCContentSharingPicker (macOS 14+) so the user can pick
# display / window / app — matches xdg-desktop-portal on Linux. Bumped from
# 12.3 for that. Swift Concurrency from /usr/lib/swift/ is still resolved via
# the -rpath above.
MACOSX_DEPLOYMENT_TARGET = "14.0"

[target.x86_64-apple-darwin]
rustflags = [
    "-C", "link-arg=-ObjC",
    "-C", "link-arg=-Wl,-rpath,/usr/lib/swift",
]

[target.x86_64-apple-darwin.env]
MACOSX_DEPLOYMENT_TARGET = "14.0"

[target.x86_64-pc-windows-msvc]
# Use static CRT to match LiveKit WebRTC libraries (which use /MT)
#
# This binds every native library we link on Windows: it must also be built
# against the STATIC CRT. A prebuilt that is not — vcpkg's `x64-windows-static-md`
# flavour is the classic trap, "static libs, dynamic CRT" — links its C-runtime
# calls as `__declspec(dllimport)`, and `libucrt.lib` cannot satisfy the `__imp_`
# form of all of them. #991 hit exactly that (`__imp__strdup`,
# `__imp__stat64i32`) with a vcpkg `-static-md` OpenSSL. Use the plain
# `x64-windows-static` triplet, or drop `+crt-static` here and rebuild WebRTC —
# never mix the two.
rustflags = ["-C", "target-feature=+crt-static"]

[env]
# Force C++17 and suppress warnings to work around WebRTC header issues
# -std=c++17: Avoids C++20 iterator concepts issues with rust::Slice
# -w: Suppress all warnings (prevents warning-as-error issues across GCC versions)
# -fpermissive: Allows method names that shadow class names (Network() returning Network*)
CXXFLAGS = "-std=c++17 -w -fpermissive"

# Do NOT put IPHONEOS_DEPLOYMENT_TARGET (or any *_DEPLOYMENT_TARGET) in this
# global table. Apple clang infers the target PLATFORM from whichever
# deployment-target variable is set whenever a compile has no explicit
# `-target` — webrtc-audio-processing-sys's meson compiler probe is exactly
# such a compile — so a global iOS pin retargets the macOS DESKTOP build to
# iPhone and kills it at link ("building for 'iOS', but linking in dylib
# built for 'macOS'"). That is what broke the v1.10.2 release.
#
# The iOS pin lives in mobile/modules/pollis-native/ubrn.config.yaml
# (ios cargoExtras, via `cargo --config env.…`), which scopes it to iOS cargo
# invocations; the ios-check job in mobile-core-check.yml reads it from there
# and asserts it reaches the built artifact. It cannot be scoped here: cargo
# has no `[target.<triple>.env]` (that spelling parses as a build-script
# `links` override for a native library named "env" and is silently ignored).

[target.x86_64-pc-windows-msvc.env]
# Windows: Use /MT (static runtime) to match LiveKit WebRTC libraries
# The prebuilt WebRTC libs from LiveKit use MT_StaticRelease
CXXFLAGS = "/std:c++17 /MT /W0"
