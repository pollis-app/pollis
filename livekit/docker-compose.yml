# LiveKit + nginx ingress stack for the Pollis VPS.
#
# Scope: this compose manages `livekit` and the `nginx` ingress in front of it.
# nginx serves ONLY LiveKit, and owns port 443 for BOTH of its hostnames: it
# demultiplexes by TLS SNI, sending rtc.pollis.com -> livekit:7880 (HTTPS/WSS)
# and turn.pollis.com -> livekit:5349 (TURN over TLS, terminated by nginx).
# (downpage.xyz was a legacy alias for the same upstream and is retired.) The Delivery Service moved to Cloudflare Containers (#515), so the
# old `delivery` / `delivery-dev` / `watchtower` containers no longer run on this
# VPS and were removed from nginx.conf — a dangling upstream fails `nginx -t` and
# blocks the whole deploy. api(-dev).pollis.com now resolve to Cloudflare directly.
#
# Images are pinned by digest (no `:latest`) so a deploy is reproducible; the
# human-readable tag is cosmetic when an @sha256 digest is present. Bump these
# deliberately when upgrading.
#
# Self-healing: both services carry a healthcheck and `restart: always`, nginx
# starts only once livekit is healthy, and nginx.conf resolves `livekit` at
# request time rather than at boot — so a reboot that brings the containers up
# in the wrong order (2026-10-17: nginx exited 255 with "host not found in
# upstream" and stayed down six days) no longer takes the ingress down. The
# restart workflow refuses to report success until both healthchecks are green,
# and livekit/probe/ watches from outside.
#
# Deploys go through .github/workflows/livekit-deploy.yml (manual button). Do not
# hand-edit on the box — `main` carries the canonical config.
services:
  livekit:
    image: livekit/livekit-server:v1.13.9@sha256:d0c04791bf63ca8dcea123571827d56ba9504bd57c8d5de60ee03b5408cc3154
    ports:
      - "7881:7881"             # ICE TCP candidates
      - "7882-7883:7882-7883/udp"   # ICE UDP mux range (rtc.udp_port; ≥ vCPU count)
      # TURN over UDP (turn.udp_port in livekit.yml). Also the STUN server
      # clients are handed — without it LiveKit hands out Google's public STUN.
      - "3478:3478/udp"
      # Prometheus metrics (prometheus.port in livekit.yml): host LOOPBACK only,
      # for a scraper running on the box. Never a public bind — the metrics
      # name rooms and counts, and nothing else on this stack is unauthenticated.
      - "127.0.0.1:6789:6789"
      # 5349 is NOT published. TURNS now arrives on 443, is terminated by nginx
      # and forwarded over the compose network to livekit:5349 as plaintext —
      # so the TURN listener must not be reachable from the internet at all.
      #
      # TURN relay media ports. Widened 30000-30100 (101 ports) -> 30000-30999:
      # one UDP port per TURN allocation and two allocations per participant
      # (publisher + subscriber peer connection) capped relayed concurrency at
      # roughly FIFTY participants, independent of CPU. This range must stay in
      # lockstep with relay_range_* in livekit.yml and the host firewall.
      #
      # REQUIRES `"userland-proxy": false` in /etc/docker/daemon.json — see
      # DEPLOY.md. With the userland proxy on, Docker forks TWO docker-proxy
      # processes PER PUBLISHED PORT: measured 1000 ports -> 2000 processes and
      # 22s of container start, which this 7 GB box will not survive. Disabled,
      # the whole contiguous range collapses into iptables DNAT and costs
      # nothing. The deploy workflow refuses to run if it is still enabled.
      - "30000-30999:30000-30999/udp"
    volumes:
      # livekit.yml is rendered on the box with the `keys:` block appended from
      # secrets by the deploy workflow — see livekit.yml's trailing note.
      - ./livekit.yml:/etc/livekit.yml
      # NOTE: /etc/letsencrypt is deliberately no longer mounted here. With
      # `turn.external_tls: true` nginx terminates TURNS, so LiveKit never reads
      # a TLS keypair — one fewer process holding the private key.
    command: --config /etc/livekit.yml
    # LiveKit answers GET / with "OK" on 7880 once it is serving. busybox wget
    # is in the image (Alpine); the check talks to the container's own loopback
    # so it never leaves the box.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:7880/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    # `always`, not `unless-stopped`: after a host reboot a container that was
    # stopped by the daemon shutdown must come back regardless of how it ended.
    restart: always
    # No container log. LiveKit logs participant connections and ICE candidates,
    # which carry client IPs, and no client IP may be readable on this box —
    # operators included. livekit.yml also drops the level to warn. Changing a
    # service's `logging` makes `docker compose up -d` RECREATE the container,
    # which deletes its old json-file log with it (see DEPLOY.md).
    logging:
      driver: none

  nginx:
    image: nginx:1.30-alpine@sha256:0985e772fb9f729e6fa0980da05fca5d9c468e870eed43071545afa9d2e27d94
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Let's Encrypt — rtc.pollis.com (the only LiveKit endpoint).
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Cloudflare Origin cert — api / api-dev / deploy .pollis.com (delivery + watchtower).
      - /etc/ssl/cloudflare:/etc/ssl/cloudflare:ro
    # Ordering at `compose up`: nginx waits for livekit's healthcheck. This is
    # belt-and-braces with the runtime resolver in nginx.conf — the daemon's
    # own restart-on-boot ignores depends_on, which is why the resolver is the
    # real fix and this only keeps a fresh `up` from serving 502s for a moment.
    depends_on:
      livekit:
        condition: service_healthy
    # /healthz is a 200 served by nginx itself on the port-80 vhost (nginx.conf):
    # green means the master and its workers are up and serving the config.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: always
    # No container log: nginx's would carry client IPs. nginx.conf also turns
    # off its access and error logs; this covers anything written to stdout.
    logging:
      driver: none
