port: 7880

# Quiet by policy: LiveKit's info/debug lines name participants' IPs (ICE
# candidates, connection events), and no client IP may be readable on this box.
# docker-compose.yml also discards the container's output (`logging: driver:
# none`); this keeps the process from producing it in the first place.
logging:
  level: warn
  pion_level: error

rtc:
  tcp_port: 7881
  # A UDP mux range, not a single port: LiveKit recommends at least as many
  # mux ports as vCPUs (the KVM 2 has two). Published 1:1 in docker-compose.yml
  # and opened in the host firewall — the three must stay in lockstep.
  udp_port: 7882-7883
  # The node IP is pinned rather than STUN-discovered: `use_external_ip: true`
  # asked Google's STUN servers for it at every boot (a seconds-long start and
  # an outbound dependency on a third party), and the VPS address is static.
  # node_ip is also what the TURN/UDP URL is built from
  # (`turn:<node_ip>:3478?transport=udp`). Changing the box means changing this.
  use_external_ip: false
  node_ip: 31.97.140.76
  use_ice_lite: true
  # When UDP fails, a client whose signalling RTT is under 100 ms tries ICE/TCP
  # (7881) first; a farther client goes straight to TURN/TLS, which is the
  # fallback that actually works through the restrictive networks they are on.
  allow_tcp_fallback: true
  tcp_fallback_rtt_threshold: 100

# Node-level ceilings. bytes_per_sec is the node's egress budget for admitting
# new rooms: 60 MB/s ≈ 480 Mbit/s, chosen so that a burst cannot pin the shared
# 1 Gbit NIC; the binding monthly bound is the plan's 8 TB transfer cap, which
# is ~25 Mbit/s averaged over a month (see DEPLOY.md → "Capacity").
limit:
  bytes_per_sec: 60_000_000

# Metrics. LiveKit serves Prometheus metrics on a SEPARATE listener at
# :6789/metrics (never on the signalling port 7880), so nothing reaches the
# internet through nginx; docker-compose.yml publishes it to the host loopback
# only, for a local scraper (DEPLOY.md → "Metrics"). Node-level counters only —
# no participant identities and no client addresses.
prometheus:
  port: 6789

# TURN — the relay fallback for clients that cannot get a direct UDP route
# (corporate/hotel/carrier NAT, UDP-blocking VPNs). Two listeners:
#
#   turn:<node ip>:3478?transport=udp      (udp_port, straight to LiveKit)
#   turns:turn.pollis.com:443?transport=tcp (tls_port, terminated by nginx)
#
# udp_port is what gives clients a UDP relay AND a STUN server. With it unset,
# LiveKit hands every participant Google's public STUN servers instead
# (pkg/service/roommanager.go `iceServersForParticipant`: no TURN/UDP and no
# `rtc.stun_servers` → `DefaultStunServers`), so every client disclosed its IP
# to a third party on every join — against docs/metadata-retention-policy.md
# §3. With udp_port set, LiveKit's own TURN listener doubles as the STUN
# server and no Google server is handed out. Published in docker-compose.yml
# and open in the host firewall (3478/udp), in lockstep with this.
#
# THE TLS PORT IS NOT CONFIGURABLE. LiveKit hardcodes the URL it hands to clients as
# `turns:<domain>:443?transport=tcp` (pkg/service/roommanager.go; unchanged through v1.13.9) — it
# does NOT interpolate tls_port. `tls_port` below only decides which port the
# server LISTENS on. So while this said `tls_port: 5349`, every client was told
# to reach TURNS at rtc.pollis.com:443, where nginx answered with HTTP and the
# TURN handshake died. TURNS has never worked in production, and it fails
# silently: ICE just falls back to candidates that don't work either.
#
# The fix: nginx owns :443 and demultiplexes by TLS SNI (see nginx.conf) —
# rtc.pollis.com stays the web/WSS vhost, turn.pollis.com is terminated and
# forwarded here as plaintext TURN. Hence `external_tls: true` and the
# `domain` being turn.pollis.com rather than rtc.pollis.com: the domain field
# IS the hostname clients dial, so it must be the one nginx routes to TURN.
#
# external_tls also means LiveKit no longer reads the TLS keypair (cert_file /
# key_file are ignored on this path). That is deliberate: nginx already reloads
# on the certbot renewal cron, whereas LiveKit only loads certs at process
# start, so a LiveKit-terminated TURNS listener would quietly serve an expired
# certificate ~60 days after every renewal.
turn:
  enabled: true
  domain: turn.pollis.com
  udp_port: 3478
  tls_port: 5349
  external_tls: true
  # UDP ports LiveKit allocates to relay media: one port per TURN allocation,
  # one allocation per relayed peer connection, and LiveKit 1.13 SDKs
  # negotiate a single peer connection per participant — so 1000 ports ≈
  # 1000 relayed peer connections (with slack for allocations still
  # draining). What eats them is not voice but the per-conversation realtime
  # rooms (~12 peer connections per signed-in user), so a fully relayed user
  # costs ~12 — see DEPLOY.md → "Capacity". Widening these REQUIRES widening
  # the docker publish range and the host firewall to match (see DEPLOY.md);
  # ports LiveKit allocates but the firewall drops produce silent relay
  # failures, which is the exact failure mode this block already had.
  relay_range_start: 30000
  relay_range_end: 30999

# NOTE: the `keys:` block is intentionally NOT committed. The deploy workflow
# (.github/workflows/livekit-deploy.yml) appends it on the box from four GitHub
# secrets — TWO pairs, because this one server serves both environments:
#
#   keys:
#     <LIVEKIT_API_KEY>: <LIVEKIT_API_SECRET>              # prod DS (api.pollis.com)
#     <LIVEKIT_DEV_API_KEY>: <LIVEKIT_DEV_API_SECRET>      # dev DS  (api-dev.pollis.com)
#
# Both DS deployments point at wss://rtc.pollis.com, and LiveKit rejects a token
# signed by any key not listed here. While this block carried only the prod pair,
# dev voice was dead on arrival — the dev DS minted perfectly valid tokens that
# the server refused.
#
# The pairs must stay DISTINCT. The DS derives room names and participant
# identities by HMAC over LIVEKIT_API_SECRET (pollis-delivery/src/room_id.rs and
# participant_id.rs), so one shared secret across both environments would map the
# same conversation to the same room pseudonym in both — a dev client would join
# the production room. The deploy workflow refuses to render two identical keys.
#
# A bare checkout of this file therefore carries no credentials by design.
