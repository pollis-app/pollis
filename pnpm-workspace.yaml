packages:
  - frontend
  - e2e
  - pollis-delivery

ignoredBuiltDependencies:
  - esbuild
  - sharp
  - workerd

# Security floors for transitive deps (vulnerability scan, 2026-10). Every
# override stays inside the major the parent already asked for, so no parent
# gets an API it did not request. Advisories whose only fix is a new major
# (fast-xml-parser 4, deepmerge-ts 5, basic-ftp 5, extract-zip, glob 10,
# minimatch, all via e2e → webdriverio 8) are test tooling only and are left
# for their parent's next release; see
# docs/security/dependency-scan-2026-10.md.
overrides:
  undici@>=7.0.0 <7.30.1: ^7.30.1
  ws@>=8.0.0 <8.21.0: ^8.21.0
  tar-fs@>=3.0.0 <3.1.1: ^3.1.1
  brace-expansion@<1.1.21: ^1.1.21
  brace-expansion@>=2.0.0 <2.1.7: ^2.1.7
  brace-expansion@>=5.0.0 <5.0.12: ^5.0.12
  ip-address@>=10.0.0 <10.7.1: ^10.7.1
  nanoid@>=3.0.0 <3.3.18: ^3.3.18
  browserslist@<4.28.7: ^4.28.7
  baseline-browser-mapping@>=2.0.0 <2.11.0: ^2.11.0
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
  postcss-selector-parser@>=6.0.0 <6.1.5: ^6.1.5
  '@babel/core@>=7.0.0 <7.29.6': ^7.29.6
  seroval@>=1.0.0 <1.6.11: ~1.6.12
  seroval-plugins@>=1.0.0 <1.6.11: ~1.6.12
