[package]
name = "verifiable-log-serve"
# Deliberately NOT `version.workspace = true` (#670). This crate ships
# `pollis-verify`, whose whole value is that an auditor can say which bytes they
# are running — so `--version` has to name the `pollis-verify-v*` release tag,
# not the workspace's frozen `1.1.0` placeholder (that field has never tracked
# anything; the desktop app's real version is a git tag). Bump this in the PR
# that cuts a release: `verifier-release.yml` fails the release if the tag and
# this number ever disagree.
#
# 0.6.0 (#701): a BREAKING served-wire change — the commit-log `index.json` drops
# its `conversations` list, the precomputed `/verify/group/<id>` artifacts are
# gone, and the commit leaf is now windowed pseudonyms. The served bundle carries
# a `format_version` (bundle::FORMAT_VERSION) a verifier checks first, so a stale
# binary reports "upgrade your verifier" (exit 2) instead of a verification
# failure. Cut `pollis-verify-v0.6.0`. (The builder's output format also changed,
# but it inherits the workspace `1.1.0` placeholder that tracks nothing — the
# on-the-wire break is signalled by `format_version`, not the builder's version.)
version = "0.6.0"
edition.workspace = true
rust-version.workspace = true
description = "Serve layer for the verifiable log (Key Transparency #330): turns a signed monitor bundle into an immutable static artifact tree, a dev HTTP server, and a fetch-over-HTTP remote verifier. Slice 3."

[lib]
name = "verifiable_log_serve"
path = "src/lib.rs"

[[bin]]
name = "serve"
path = "src/bin/serve.rs"
required-features = ["live"]

# Verification-only CLI shipped to auditors (operator commands live in `serve`).
[[bin]]
name = "pollis-verify"
path = "src/bin/pollis-verify.rs"

# `live` gates the ONE thing here that touches a database: the lazily-refreshed
# server that reads `mls_commit_log` out of Turso, plus the `serve` binary that
# drives it. The VERIFIER half — release verification, account verification, the
# bundle/layout readers — is pure and is all `pollis-core` uses.
#
# The gate is #987's second libsql edge. `pollis-core` depends on this crate, so
# without it a `libsql` link came back into the shipped client through
# `verifiable-log-builder`'s database reader, silently undoing the point of
# removing the client's own dependency. `pollis-core` therefore takes this crate
# with `default-features = false`, and `no_client_side_remote_reads.rs` asserts
# no `libsql` reaches the client's graph by ANY path.
[features]
default = ["live"]
live = ["verifiable-log-builder/db-source"]

[dependencies]
# Slice 1: Merkle/STH/proof core and its verifiers — depended on, never reimplemented.
verifiable-log = { path = "../verifiable-log" }
# Slice 2: the mls-commit-log tenant — reuse its CommitLeaf decoding and the
# CommitLogInvariant (fork + epoch-regression) for per-group verification.
# Never reimplement either here. `default-features = false` so the pure half
# (leaf encodings, invariants, bundle assembly) links without `libsql`; the
# `live` feature above turns its database reader back on.
verifiable-log-builder = { path = "../verifiable-log-builder", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
# Tiny blocking HTTP server for the local dev/demo host.
tiny_http = "0.12"
# Blocking HTTP client for the remote verifier. The "tls" feature pulls in
# rustls + webpki-roots so auditors can verify a live https:// URL (e.g.
# https://verify.pollis.com), not just loopback http://. "socks-proxy" lets the
# agent dial through the closed-overlay SOCKS5 shim so the transparency VERIFY
# path hides the client IP from the first-party host (design §14.4).
ureq = { version = "2", default-features = false, features = ["tls", "socks-proxy"] }
# Live mode: hold the ML-DSA-44 STH signing key and drive the async libSQL read.
ml-dsa = { version = "0.1", default-features = false, features = ["alloc"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"
hex = "0.4"
verifiable-log = { path = "../verifiable-log" }
# Seed local libSQL fixture DBs for the live-mode tests (no network).
libsql = { version = "0.9", features = ["remote"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# Spin an in-process relay + SOCKS5 shim to prove the overlay proxy plumbing:
# that `build_agent(Some(shim))` really dials the origin THROUGH the relay.
pollis-relay = { path = "../pollis-relay" }
