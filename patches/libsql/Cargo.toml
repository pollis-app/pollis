# POLLIS: crates.io `libsql` 0.10.0 with the edits listed below. Swapped in by
# the `[patch.crates-io]` entry in the workspace Cargo.toml (#1847). Every
# remote libsql handle in the workspace links it: `pollis-delivery`,
# `verifiable-log-builder` (`db-source`) and `verifiable-log-serve`; `src-tauri`
# only under its dev-only `test-harness` feature. `pollis-core`, and so mobile,
# does not link libsql at all.
#
# Edit 1 (#1847), this Cargo.toml: `http2` removed from the `hyper` 0.14
# features under `[dependencies.hyper]`.
#   Why: libsql 0.10.0 (the newest release; upstream main still declares the
#   same features) hard-codes hyper 0.14's `http2` feature, which links h2 0.3.
#   Cargo features are additive, so no dependent can turn it off. Nothing here
#   needs it: every remote handle dials Turso through `pollis-libsql-connector`,
#   which offers ALPN `http/1.1` only (#1303), and libsql's own source never
#   calls an HTTP/2 API. Without the feature, h2 leaves the workspace graph.
#   When deleting the patch: check `cargo tree -i h2` stays empty.
#
# Edit 2 (#2178), src/hrana/mod.rs `Statement::new`: no `describe` request.
#   Why: upstream sends a `/v3/pipeline` describe before every remote
#   statement's `/v3/cursor`, so every DS read cost two sequential round trips
#   to Turso. The describe answer only fed remote `Statement::columns()` /
#   `column_count()`, which nothing in the workspace calls (rows take their
#   column names from the cursor's `step_begin`). SQL errors now surface at the
#   cursor step instead of at describe; stream expiry and transport faults come
#   back through the same `HttpSender::send`, so `pollis-delivery`'s transient
#   classification (#1500) is unchanged. `execute()` never described.
#   Guarded by `pollis-delivery/tests/remote_round_trips.rs` (one SELECT = one
#   `/v3/cursor`).
#   When deleting the patch: that test must still pass, i.e. the upstream
#   release must not describe before a query either; and grep the workspace
#   for remote `columns()`/`column_count()` callers.
#
# Edit 3 (#2179), src/hrana/hyper.rs, src/database.rs, src/database/builder.rs,
# src/lib.rs, and `time` added to `[dependencies.tokio]` features below: one
# keep-alive socket pool per remote `Database`.
#   Why: upstream builds a hyper client per `HttpSender`, i.e. per
#   `Connection`, so a socket lived exactly as long as its connection, and the
#   DS (which drops a connection whose stream may have expired after 3 s) paid
#   fresh TCP + TLS handshakes to both databases after every lull.
#   - `SharedHttpClient`: one client per `Database`, never process-global, so
#     main, log and the transparency-log builder never share sockets.
#     `pool_idle_timeout` = `REMOTE_POOL_IDLE_TIMEOUT` (20 s), under Turso's
#     measured 30.0 s idle close; hyper's retry of a request that never reached
#     the wire is left at its default.
#   - A failed exchange or a 5xx answer drops the whole pool, so no request
#     reuses a socket a fault came on (a wedged node stays wedged);
#     `Database::reset_remote_http_pool` does the same on demand (the DS calls
#     it after any transient fault, #1500).
#   - `DrainOnDrop`: a streamed `/v3/cursor` body is read to its end in the
#     background when its reader stops early (bounded: 1 MiB, 5 s), because
#     hyper re-pools a socket only after its answer was read to the end.
#     Without it every remote read dialed a new socket, shared pool or not.
#   Guarded by `pollis-delivery/tests/conn_pool.rs` (socket counts against the
#   hrana double) and `tests/remote_sqld.rs` (a real sqld).
#   When deleting the patch: the upstream release must pool sockets per
#   `Database` (or the DS must stop dropping connections), keep reads from
#   leaking sockets, and still never reuse a socket after a fault; run both.
#
# Provenance: every file here except this Cargo.toml and the files named above
# is byte-identical to the published crate `libsql-0.10.0.crate` (sha256
# d6bca1704194048f0f0bbc8a8e05ba85c0c67628b03bd59346dd2fdd946a1588, the
# checksum in the crates.io index). Each edit in a source file is marked with a
# `POLLIS (#NNNN)` comment. To verify:
#   curl -sL https://static.crates.io/crates/libsql/libsql-0.10.0.crate | tar xz
#   diff -r libsql-0.10.0/ patches/libsql/   # only the files named above
#                                            # differ, and Cargo.lock is
#                                            # absent here
# The crate's own Cargo.lock is left out: cargo ignores a path dependency's
# lockfile (the workspace Cargo.lock decides every version), and keeping it only
# made dependency scanners report versions that are never built.
#
# Delete this directory and its patch entry only when a libsql release covers
# every edit above (each one's "When deleting" check).

