# POLLIS: crates.io `sqlcipher-src` 420.0.0 (SQLCipher 4.20.0 on SQLite 3.54.1),
# relabelled 419.0.6 so it satisfies `libsqlite3-sys` 0.39.1's `=419.0.6` pin.
# Swapped in by the `[patch.crates-io]` entry in the workspace Cargo.toml (#1797).
#
# Why: RUSTSEC-2026-0459 / CVE-2026-119375 is fixed in SQLite 3.54.0. The newest
# libsqlite3-sys (0.39.1) bundles a patched plain SQLite but builds
# `bundled-sqlcipher` from sqlcipher-src 419.0.6 (SQLite 3.53.4, still affected).
# Upstream's bump to 420 (rusqlite/rusqlite#1932) is waiting on an unrelated wasm
# crate. Every Pollis build is SQLCipher, so without this crate every shipped app
# would still carry the bug while cargo-deny reported it fixed.
#
# Provenance: every file here except this Cargo.toml is byte-identical to the
# published crate `sqlcipher-src-420.0.0+sqlcipher-4.20.0-sqlite-3.54.1-libtomcrypt-1.18.2.crate`
# (sha256 fd6b5280ed2593d07b2816ec531821c15c306903bcca224716f1fbcc2bbfedfe, the
# checksum in the crates.io index). The only edit below is `version`; the build
# metadata after `+` still names the real contents, and `SQLCIPHER_VERSION` /
# `SQLITE_VERSION` in src/lib.rs are upstream's (4.20.0 / 3.54.1). To verify:
#   curl -sL https://static.crates.io/crates/sqlcipher-src/sqlcipher-src-420.0.0%2Bsqlcipher-4.20.0-sqlite-3.54.1-libtomcrypt-1.18.2.crate | tar xz
#   diff -r sqlcipher-src-420.0.0+*/ patches/sqlcipher-src/   # only Cargo.toml differs
#
# The 3.53.4 Rust bindings libsqlite3-sys 0.39.1 ships stay correct against
# 3.54.1: SQLite only ever adds to its C API. `pollis-core`'s
# `the_linked_sqlite_has_the_wal_page_size_fix` test fails if this patch ever stops
# applying while libsqlite3-sys still pins 419.
#
# Delete this directory and its patch entry when a libsqlite3-sys release
# depends on sqlcipher-src >= 420 (cargo then warns that the patch is unused).

